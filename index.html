<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nona Costex Staff Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
:root{
  --green:#9fb873;
  --green-dark:#7f9a58;
  --green-light:#edf3e4;
  --green-soft:#f6f8f1;
  --border:#e2e8e4;
  --text:#172019;
  --muted:#718078;
  --bg:#f7f9f7;
  --white:#fff;
  --danger:#c0392b;
}
body{
  margin:0;
  font-family:Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text)
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
input,select,textarea{
  width:100%;
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 12px;
  background:#fff;
  outline:none
}
input:focus,select:focus,textarea:focus{
  border-color:var(--green)
}
textarea{min-height:90px;resize:vertical}

.app{display:flex;min-height:100vh}
.side{
  width:240px;
  position:fixed;
  inset:0 auto 0 0;
  background:#fff;
  border-right:1px solid var(--border);
  padding:18px 12px;
  z-index:20
}
.main{
  margin-left:240px;
  flex:1;
  min-width:0
}
.top{
  height:64px;
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  position:sticky;
  top:0;
  z-index:10
}
.content{
  padding:24px;
  max-width:1300px;
  margin:auto
}
.brand{
  font-weight:700;
  font-size:19px;
  padding:5px 10px 20px
}
.brand small{
  display:block;
  font-size:11px;
  color:var(--muted);
  font-weight:400;
  margin-top:4px
}
.nav-title{
  font-size:10px;
  color:#a0aaa3;
  text-transform:uppercase;
  padding:14px 10px 6px
}
.nav button{
  width:100%;
  background:transparent;
  border:0;
  text-align:left;
  padding:10px;
  border-radius:9px;
  color:#68736c;
  margin-bottom:2px
}
.nav button:hover,
.nav button.active{
  background:var(--green-light);
  color:#5f7541
}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:15px;
  padding:18px
}
.grid{display:grid;gap:14px}
.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}

.title{
  font-size:25px;
  font-weight:700;
  margin:0
}
.sub{
  font-size:13px;
  color:var(--muted);
  margin:5px 0 0
}
.btn{
  border:0;
  background:var(--green);
  color:#fff;
  padding:9px 14px;
  border-radius:9px
}
.btn:hover{background:var(--green-dark)}
.btn.secondary{
  background:var(--green-light);
  color:#5f7541
}
.btn.danger{
  background:#fff0ef;
  color:var(--danger)
}
.btn.small{
  padding:7px 10px;
  font-size:12px
}

.stat{padding:17px}
.stat b{
  display:block;
  font-size:25px
}
.stat span{
  font-size:12px;
  color:var(--muted)
}

.pill{
  display:inline-block;
  border-radius:999px;
  padding:5px 9px;
  font-size:11px;
  font-weight:600
}
.high{background:#fee2e2;color:#991b1b}
.medium{background:#fef3c7;color:#92400e}
.low{background:#edf3e4;color:#5f7541}
.green{background:#edf3e4;color:#5f7541}
.blue{background:#e8f0fb;color:#42658e}
.red{background:#fee2e2;color:#991b1b}

.progress{
  height:8px;
  background:#e8eee5;
  border-radius:99px;
  overflow:hidden
}
.progress i{
  display:block;
  height:100%;
  background:var(--green);
  border-radius:99px
}

.small{font-size:12px}
.muted{color:var(--muted)}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  object-fit:cover;
  background:var(--green-light)
}

.avatar.large{
  width:70px;
  height:70px
}

.empty{
  text-align:center;
  color:#9aa39e;
  padding:40px 10px
}

table{
  width:100%;
  border-collapse:collapse
}
th,td{
  padding:11px;
  border-bottom:1px solid #edf0ed;
  text-align:left;
  font-size:13px
}
th{
  font-size:11px;
  color:var(--muted);
  font-weight:600
}

.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  background:var(--bg);
  padding:20px
}
.loginbox{
  width:min(410px,100%);
  background:#fff;
  padding:30px;
  border:1px solid var(--border);
  border-radius:18px
}
.error{
  background:#fff0ef;
  color:#b42318;
  padding:10px;
  border-radius:9px;
  font-size:13px;
  margin:10px 0
}

.modalbg{
  position:fixed;
  inset:0;
  background:#17201955;
  display:grid;
  place-items:center;
  z-index:100;
  padding:18px
}
.modal{
  background:#fff;
  border-radius:18px;
  width:min(760px,100%);
  max-height:90vh;
  overflow:auto;
  padding:24px
}

.toast{
  position:fixed;
  right:18px;
  top:78px;
  z-index:200;
  background:#172019;
  color:#fff;
  padding:11px 14px;
  border-radius:9px;
  font-size:13px
}

/* DASHBOARD */
.welcome-card{
  background:linear-gradient(135deg,#fff,#f3f7ed);
  border:1px solid #dfe8d6;
  border-radius:18px;
  padding:22px
}

.dashboard-card-title{
  font-size:14px;
  font-weight:700;
  margin-bottom:14px
}

/* ATTENDANCE */
.attendance-main{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:22px
}
.attendance-status{
  background:var(--green-soft);
  border:1px solid #dce6ca;
  border-radius:14px;
  padding:15px
}
.clock-time{
  color:var(--green-dark);
  font-size:25px;
  font-weight:700
}
.attendance-actions{
  display:flex;
  gap:9px
}

/* NOTIFICATIONS */
.notification-card{
  display:flex;
  gap:13px;
  padding:13px;
  border:1px solid var(--border);
  border-radius:13px;
  margin-bottom:9px;
  background:#fff
}
.notification-thumb{
  width:46px;
  height:46px;
  border-radius:11px;
  background:linear-gradient(145deg,#edf3e4,#dfe9cf);
  display:grid;
  place-items:center;
  flex-shrink:0;
  overflow:hidden
}
.notification-thumb img{
  width:100%;
  height:100%;
  object-fit:cover
}
.thumb-letter{
  font-size:14px;
  font-weight:700;
  color:#607641
}
.unread-dot{
  width:7px;
  height:7px;
  background:var(--green);
  border-radius:50%;
  display:inline-block;
  margin-left:5px
}

/* COMMUNICATION */
.communication-card{
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px;
  background:#fff;
  display:flex;
  gap:12px;
  cursor:pointer;
  margin-bottom:8px
}
.communication-card:hover{background:var(--green-soft)}
.communication-thumb{
  width:45px;
  height:45px;
  border-radius:12px;
  background:#f0f4ea;
  display:grid;
  place-items:center;
  color:#657b47;
  font-weight:700;
  flex-shrink:0
}

/* CHAT */
.chat{
  display:grid;
  grid-template-columns:280px 1fr;
  height:calc(100vh - 110px);
  min-height:550px;
  padding:0;
  overflow:hidden
}
.chatlist{
  border-right:1px solid #eee;
  overflow:auto
}
.chatitem{
  padding:12px;
  border-bottom:1px solid #eee;
  cursor:pointer
}
.chatitem:hover,
.chatitem.active{
  background:var(--green-soft)
}
.chatwindow{
  display:flex;
  flex-direction:column;
  min-width:0
}
.messages{
  flex:1;
  overflow:auto;
  padding:16px;
  background:#fafbf9
}
.bubble{
  max-width:75%;
  padding:9px 11px;
  border:1px solid #e4e9e3;
  background:#fff;
  border-radius:12px;
  margin-bottom:9px
}
.bubble.mine{
  margin-left:auto;
  background:#758d50;
  color:#fff;
  border-color:#758d50
}
.meta{
  font-size:10px;
  opacity:.6;
  margin-top:4px
}

/* WORK */
.work-progress-card{
  padding:15px;
  border:1px solid var(--border);
  border-radius:13px;
  margin-bottom:10px
}

/* CALENDAR */
.calendar-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px
}
.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  background:#fff
}
.calendar-weekday{
  padding:10px;
  background:#f5f7f3;
  font-size:11px;
  color:var(--muted);
  font-weight:700
}
.calendar-day{
  min-height:105px;
  border-top:1px solid #edf0ed;
  border-right:1px solid #edf0ed;
  padding:8px;
  cursor:pointer
}
.calendar-day:hover{background:#fafcf8}
.calendar-day.other{background:#fafafa;color:#aaa}
.calendar-day.today{
  background:#f0f5e9
}
.day-number{
  font-size:12px;
  font-weight:700
}
.event{
  font-size:10px;
  padding:4px 5px;
  border-radius:5px;
  margin-top:5px;
  background:#edf3e4;
  color:#5f7541;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis
}
.event.holiday{
  background:#f5eede;
  color:#8b7040
}

/* STAFF */
.staff-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:14px;
  border:1px solid var(--border);
  border-radius:13px;
  background:#fff
}
.staff-card:hover{background:var(--green-soft)}

.leave-box{
  padding:12px;
  border-radius:11px;
  background:var(--green-soft);
  border:1px solid #e0e8d6
}

.mobile{display:none}

@media(max-width:800px){
  .side{
    transform:translateX(-100%);
    transition:.2s
  }
  .side.open{transform:none}
  .main{margin-left:0}
  .mobile{display:block}
  .content{padding:14px}
  .four{grid-template-columns:1fr 1fr}
  .two{grid-template-columns:1fr}
  .chat{
    grid-template-columns:1fr;
    height:auto
  }
  .chatlist{
    max-height:240px;
    border-right:0;
    border-bottom:1px solid #eee
  }
  .attendance-main{
    flex-direction:column;
    align-items:stretch
  }
  .calendar-day{min-height:75px}
}
</style>
</head>

<body>
<div id="app"></div>
<div id="toast"></div>

<script>
const SUPABASE_URL = 'https://jccryyxdxykomwsivtjy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XgF6_KZZxFzxrAqM0E3bEA_Qs2f-HxM';

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const S={
  page:'dashboard',
  user:null,
  profile:null,
  profiles:[],
  channels:[],
  channel:null,
  conversation:null,
  messages:[],
  notifications:[],
  docs:[],
  events:[],
  sidebar:false,
  modal:null,
  chatSearch:'',
  taskSearch:'',
  taskFilter:'',
  pendingFile:null,
  conversations:[],
  conversationMembers:[],
  calendarDate:new Date()
};

let tasks=JSON.parse(localStorage.getItem('nona_v21_tasks')||'null')||[
 {
  id:'t1',
  name:'Flite Product Shoot',
  category:'Content',
  priority:'High',
  status:'In Progress',
  progress:60,
  dueDate:'2026-09-16',
  dueTime:'17:00',
  description:'Product shooting for Flite sandals.',
  notes:''
 },
 {
  id:'t2',
  name:'Social Media Content',
  category:'Content',
  priority:'Medium',
  status:'In Progress',
  progress:40,
  dueDate:'2026-09-17',
  dueTime:'17:00',
  description:'Shoot and edit social media content.',
  notes:''
 },
 {
  id:'t3',
  name:'Live Setup',
  category:'Live',
  priority:'High',
  status:'Not Started',
  progress:0,
  dueDate:'2026-09-18',
  dueTime:'12:00',
  description:'Prepare live setup quotation and requirements.',
  notes:''
 }
];

let logs=JSON.parse(localStorage.getItem('nona_v21_logs')||'null')||[
 {
  id:'l1',
  date:'2026-09-07',
  task:'Budget quotation presentation + Flite product shoot',
  description:'Presented completed budget quotation and carried out Flite product shooting.'
 },
 {
  id:'l2',
  date:'2026-09-08',
  task:'Product shooting + content brainstorming',
  description:'Continued product shooting and brainstormed social media content.'
 },
 {
  id:'l3',
  date:'2026-09-09',
  task:'Live setup quotation + social media shooting',
  description:'Presented live setup budget quotation and shot social media content.'
 },
 {
  id:'l4',
  date:'2026-09-10',
  task:'Content shooting + video editing',
  description:'Shot content and edited social media videos.'
 }
];

let attendance=JSON.parse(localStorage.getItem('nona_attendance')||'null')||[];

const esc=x=>{
  const d=document.createElement('div');
  d.textContent=x??'';
  return d.innerHTML
};

const me=()=>S.profile?.id;
const admin=()=>String(S.profile?.role||'').toLowerCase()==='admin';

function av(p){
  if(p?.avatar_url)return p.avatar_url;

  const name=(p?.full_name||'User')
    .split(' ')
    .filter(Boolean)
    .slice(0,2)
    .map(x=>x[0])
    .join('')
    .toUpperCase();

  return 'https://ui-avatars.com/api/?name='+
    encodeURIComponent(name)+
    '&background=edf3e4&color=5f7541&bold=true';
}

function save(){
  localStorage.setItem('nona_v21_tasks',JSON.stringify(tasks));
  localStorage.setItem('nona_v21_logs',JSON.stringify(logs));
  localStorage.setItem('nona_attendance',JSON.stringify(attendance));
}

function toast(x){
  const t=document.getElementById('toast');
  t.textContent=x;
  t.className='toast';
  setTimeout(()=>t.className='',2500);
}

function date(x){
  return x?
    new Date(x+'T00:00:00').toLocaleDateString('en-MY',{
      day:'numeric',
      month:'short',
      year:'numeric'
    }):''
}

function dateTime(x){
  return x?
    new Date(x).toLocaleString('en-MY',{
      day:'numeric',
      month:'short',
      hour:'2-digit',
      minute:'2-digit'
    }):''
}

function timeOnly(x){
  return x?
    new Date(x).toLocaleTimeString('en-MY',{
      hour:'2-digit',
      minute:'2-digit'
    }):''
}

function pclass(x){
  return x==='High'?'high':x==='Medium'?'medium':'low'
}

function sclass(x){
  return x==='Completed'?'green':
    x==='In Progress'?'blue':
    x==='Overdue'?'red':''
}

function todayKey(){
  return new Date().toISOString().slice(0,10)
}

function todayAttendance(){
  return attendance.find(x=>x.date===todayKey()&&x.user_id===me())
}

/* AUTH */

async function init(){
  const {data:{session}}=await db.auth.getSession();

  if(session) await enter(session.user);
  else loginPage();

  db.auth.onAuthStateChange(async(e,s)=>{
    if(s&&!S.user)await enter(s.user);

    if(!s&&S.user){
      S.user=null;
      S.profile=null;
      loginPage();
    }
  });
}

async function enter(u){
  S.user=u;

  await profile();

  if(!S.profile){
    await db.from('profiles').insert({
      id:u.id,
      staff_code:(u.email||'').includes('admin')?'ADMIN001':'NC001',
      full_name:(u.email||'').includes('admin')?'Admin':'Staff',
      department:(u.email||'').includes('admin')?'Management':'Digital',
      position:(u.email||'').includes('admin')?'Administrator':'Staff',
      role:(u.email||'').includes('admin')?'admin':'staff',
      status:'Active'
    });

    await profile();
  }

  await Promise.all([
    profiles(),
    channels(),
    notifs(),
    docs(),
    loadEvents(),
    loadConversations()
  ]);

  subscribe();
  render();
}

async function profile(){
  const r=await db
    .from('profiles')
    .select('*')
    .eq('id',S.user.id)
    .maybeSingle();

  if(!r.error)S.profile=r.data;
}

async function profiles(){
  const r=await db
    .from('profiles')
    .select('*')
    .order('full_name');

  if(!r.error)S.profiles=r.data||[];
}

async function channels(){
  const r=await db
    .from('channels')
    .select('*')
    .order('name');

  if(!r.error)S.channels=r.data||[];
}

async function notifs(){
  const r=await db
    .from('communication_notifications')
    .select('*')
    .eq('profile_id',me())
    .order('created_at',{ascending:false})
    .limit(50);

  if(!r.error)S.notifications=r.data||[];
}

async function docs(){
  const r=await db
    .from('knowledge_documents')
    .select('*')
    .order('created_at',{ascending:false});

  if(!r.error)S.docs=r.data||[];
}

async function loadEvents(){
  const r=await db
    .from('calendar_events')
    .select('*')
    .order('event_date');

  if(!r.error)S.events=r.data||[];
}

function subscribe(){
  db.channel('nona-portal-live')
    .on(
      'postgres_changes',
      {event:'*',schema:'public',table:'messages'},
      async()=>{
        if(S.page==='communication'){
          await chatLoad();
          render();
        }
      }
    )
    .on(
      'postgres_changes',
      {event:'*',schema:'public',table:'communication_notifications'},
      async()=>{
        await notifs();
        render();
      }
    )
    .subscribe();
}

function loginPage(err=''){
  document.getElementById('app').innerHTML=`
    <div class="login">
      <div class="loginbox">
        <b style="font-size:23px">Nona Costex</b>
        <div class="small muted" style="margin:4px 0 22px">
          Staff Portal
        </div>

        ${err?`<div class="error">${esc(err)}</div>`:''}

        <label class="small muted">Email</label>
        <input id="email"
          type="email"
          placeholder="Supabase account email"
          style="margin:5px 0 13px">

        <label class="small muted">Password</label>
        <input id="pass"
          type="password"
          placeholder="Password"
          style="margin:5px 0 16px">

        <button class="btn"
          style="width:100%"
          onclick="login()">
          Sign in
        </button>
      </div>
    </div>`;
}

async function login(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('pass').value;

  const r=await db.auth.signInWithPassword({
    email,
    password
  });

  if(r.error)return loginPage(r.error.message);

  await enter(r.data.user);
}

async function logout(){
  await db.auth.signOut();
}

/* NAV */

function nav(id,label,b=0){
  return `
    <button class="${S.page===id?'active':''}"
      onclick="go('${id}')">
      ${label}
      ${b?`<span class="pill red" style="float:right">${b}</span>`:''}
    </button>`;
}

function go(p){
  S.page=p;
  S.sidebar=false;
  S.modal=null;

  if(p==='communication')chatLoad();

  render();
}

/* MAIN RENDER */

function render(){
  if(!S.user)return loginPage();

  const unread=S.notifications.filter(n=>!n.is_read).length;

  document.getElementById('app').innerHTML=`
    <div class="app">

      <aside class="side ${S.sidebar?'open':''}">

        <div class="brand">
          Nona Costex
          <small>Staff Portal</small>
        </div>

        <div class="nav-title">Workspace</div>

        <div class="nav">
          ${nav('dashboard','Dashboard')}
          ${nav('tasks','Tasks')}
          ${nav('worklogs','Work Logs')}

          ${nav('knowledge','Knowledge Hub')}
          ${nav('calendar','Calendar')}
        </div>

        <div class="nav-title">Attendance</div>

        <div class="nav">
          ${nav('attendance','Attendance')}
        </div>

        ${admin()?`
          <div class="nav-title">Admin</div>
          <div class="nav">
            ${nav('staff','Staff Management')}
            ${nav('analytics','Analytics')}
            ${nav('data','Data Management')}
          </div>
        `:''}

        <div class="nav-title">Account</div>

        <div class="nav">
          ${nav('profile','My Profile')}
        </div>

        <div style="margin-top:18px">
          <button
            style="width:100%;background:transparent;border:0;text-align:left;padding:10px;color:#777"
            onclick="logout()">
            Log out
          </button>
        </div>

      </aside>

      <section class="main">

        <header class="top">

          <div class="row">
            <button
              class="btn secondary mobile"
              onclick="S.sidebar=!S.sidebar;render()">
              Menu
            </button>

            <b>Nona Costex Staff Portal</b>
          </div>

          <div class="row">

            <button
              class="btn secondary small"
              onclick="notifications()">
              Notifications ${unread?`(${unread})`:''}
            </button>

            <div class="row hide">

function saveTask(){

  const g=id=>document.getElementById(id).value;

  const id=g('task-id');

  const d={
    name:g('task-name'),
    description:g('task-desc'),
    category:g('task-cat'),
    priority:g('task-pri'),
    status:g('task-status'),
    progress:Number(g('task-progress'))||0,
    dueDate:g('task-date'),
    dueTime:g('task-time'),
    notes:g('task-notes')
  };

  if(!d.name||!d.dueDate)
    return toast('Task name and due date are required.');

  if(d.status==='Completed')
    d.progress=100;

  if(id){
    const found=tasks.find(x=>x.id===id);
    if(found)Object.assign(found,d);
  }else{
    tasks.push({
      ...d,
      id:'t'+Date.now()
    });
  }

  save();

  S.modal=null;

  toast('Task saved');

  render();
}

function deleteTask(id){

  if(!confirm('Delete this task?'))return;

  tasks=tasks.filter(x=>x.id!==id);

  save();

  S.modal=null;

  render();

  toast('Task deleted');
}

/* CALENDAR */

function calendar(){

  const d=new Date(
    S.calendarDate.getFullYear(),
    S.calendarDate.getMonth(),
    1
  );

  const year=d.getFullYear();
  const month=d.getMonth();

  const first=new Date(year,month,1).getDay();
  const days=new Date(year,month+1,0).getDate();
  const prevDays=new Date(year,month,0).getDate();

  let cells='';

  for(let i=0;i<42;i++){

    const num=i-first+1;

    let dayDate;

    let other=false;

    if(num<1){
      dayDate=new Date(year,month-1,prevDays+num);
      other=true;
    }else if(num>days){
      dayDate=new Date(year,month+1,num-days);
      other=true;
    }else{
      dayDate=new Date(year,month,num);
    }

    const key=dayDate.toISOString().slice(0,10);

    const isToday=key===todayKey();

    const events=S.events.filter(e=>e.event_date===key);

    cells+=`
      <div
        class="calendar-day ${other?'other':''} ${isToday?'today':''}"
        onclick="calendarDateClick('${key}')">

        <div class="day-number">
          ${dayDate.getDate()}
        </div>

        ${events.map(e=>`
          <div class="event ${e.event_type==='Public Holiday'?'holiday':''}">
            ${esc(e.title)}
          </div>
        `).join('')}

      </div>
    `;
  }

  return `
    <div class="grid">

      <div class="calendar-head">

        <div>
          <h1 class="title">Calendar</h1>
          <p class="sub">
            Company events, holidays and important dates.
          </p>
        </div>

        ${
          admin()?
            `<button class="btn" onclick="openEvent()">
              + Add Event
            </button>`:
            ''
        }

      </div>

      <div class="card">

        <div class="calendar-head">

          <button
            class="btn secondary small"
            onclick="changeMonth(-1)">
            Previous
          </button>

          <b style="font-size:17px">
            ${d.toLocaleDateString('en-MY',{
              month:'long',
              year:'numeric'
            })}
          </b>

          <div class="row">
            <button
              class="btn secondary small"
              onclick="goTodayMonth()">
              Today
            </button>

            <button
              class="btn secondary small"
              onclick="changeMonth(1)">
              Next
            </button>
          </div>

        </div>

        <div class="calendar-grid">

          ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat']
            .map(x=>`
              <div class="calendar-weekday">
                ${x}
              </div>
            `).join('')}

          ${cells}

        </div>

      </div>

    </div>
  `;
}

function changeMonth(n){
  S.calendarDate=new Date(
    S.calendarDate.getFullYear(),
    S.calendarDate.getMonth()+n,
    1
  );
  render();
}

function goTodayMonth(){

function calendarDateClick(key){

  const events=S.events.filter(x=>x.event_date===key);

  if(admin()){
    S.modal={
      type:'event',
      data:{
        id:'',
        title:'',
        event_date:key,
        event_type:'Company Event',
        description:''
      }
    };
    render();
  }else if(events.length){
    S.modal={
      type:'event-view',
      data:{events}
    };
    render();
  }
}

async function saveEvent(){

  const id=document.getElementById('event-id').value;

  const d={
    title:document.getElementById('event-title').value.trim(),
    event_date:document.getElementById('event-date').value,
    event_type:document.getElementById('event-type').value,
    description:document.getElementById('event-desc').value
  };

  if(!d.title||!d.event_date)
    return toast('Event title and date are required.');

  let r;

  if(id){
    r=await db
      .from('calendar_events')
      .update({
        ...d,
        updated_at:new Date().toISOString()
      })
      .eq('id',id);
  }else{
    r=await db
      .from('calendar_events')
      .insert({
        ...d,
        created_by:me()
      });
  }

  if(r.error)
    return toast(r.error.message);

  await loadEvents();

  S.modal=null;

  render();

  toast('Calendar event saved');

async function deleteEvent(id){

  if(!confirm('Delete this event?'))return;

    .eq('id',id);

/* COMMUNICATION */

async function loadConversations(){

  const m=await db
    .from('conversation_members')
    .select('conversation_id,profile_id,role')
    .eq('profile_id',me());

  if(m.error){
    S.conversations=[];
    S.conversationMembers=[];
    return;
  }

  S.conversationMembers=m.data||[];

  const ids=[
    ...new Set(
      S.conversationMembers.map(x=>x.conversation_id)
    )
  ];

  if(!ids.length){
    S.conversations=[];
    return;
  }

  const c=await db
    .from('conversations')
    .select('*')
    .in('id',ids)
    .order('updated_at',{ascending:false});

  S.conversations=c.error?[]:(c.data||[]);
}

async function loadConversationMembers(cid){

  const r=await db
    .from('conversation_members')
    .select('conversation_id,profile_id,role')
    .eq('conversation_id',cid);

  S.conversationMembers=r.error?[]:(r.data||[]);

  let q=db
    .from('messages')
    .select('*')
    .order('created_at',{ascending:true})
    .limit(200);

  q=S.channel?
    q.eq('channel_id',S.channel.id):
    q.eq('conversation_id',S.conversation.id);

  const r=await q;

  if(!r.error)S.messages=r.data||[];
}

async function saveGroup(){

  const name=document
    .getElementById('group-name')
    .value
    .trim();

  const selected=[
    ...document.querySelectorAll('.group-member:checked')
  ].map(x=>x.value);

  if(!name)
    return toast('Group name is required.');

  if(!selected.length)
    return toast('Select at least one member.');

  const c=await db
    .from('conversations')
    .insert({
      name,
      type:'group',
      created_by:me()
    })
    .select()
    .single();

  if(c.error)return toast(c.error.message);

  const rows=[
    {
      conversation_id:c.data.id,
      profile_id:me(),
      role:'admin'
    },
    ...selected
      .filter(x=>x!==me())
      .map(x=>({
        conversation_id:c.data.id,
        profile_id:x,
        role:'member'
      }))
  ];

  const r=await db
    .from('conversation_members')
    .insert(rows);

  if(r.error){
    await db
      .from('conversations')
      .delete()
      .eq('id',c.data.id);

    return toast(r.error.message);
  }

  await loadConversations();

  S.modal=null;

  await selectConversation(c.data.id);
}

async function renameGroup(){

  if(!S.conversation?.group||
     currentConversationRole()!=='admin')
    return toast('Only the group admin can rename this group.');

  const current=conversationName(
    S.conversations.find(
      x=>x.id===S.conversation.id
    )
  );

  const name=prompt('New group name',current);

  if(!name||!name.trim())return;

  const r=await db
    .from('conversations')
    .update({
      name:name.trim(),
      updated_at:new Date().toISOString()
    })
    .eq('id',S.conversation.id);

  if(r.error)return toast(r.error.message);

  await loadConversations();

  render();
}

async function saveMembers(){

  const selected=[
    ...document.querySelectorAll('.group-add-member:checked')
  ].map(x=>x.value);

  if(!selected.length)
    return toast('Select at least one member.');

  const existing=new Set(
    S.conversationMembers.map(x=>x.profile_id)
  );

  const rows=selected
    .filter(x=>!existing.has(x))
    .map(x=>({
      conversation_id:S.conversation.id,
      profile_id:x,
      role:'member'
    }));

  if(!rows.length)
    return toast('Those members are already in the group.');

  const r=await db
    .from('conversation_members')
    .insert(rows);

  if(r.error)return toast(r.error.message);

  await loadConversationMembers(
    S.conversation.id

  S.modal=null;

  render();
}

async function removeMember(pid){

  if(!S.conversation?.group||
     currentConversationRole()!=='admin')
    return toast('Only the group admin can remove members.');

  if(pid===me())
    return toast('Use Leave Group to leave the group.');

  if(!confirm('Remove this member from the group?'))
    return;

  const r=await db
    .from('conversation_members')
    .delete()
    .eq('conversation_id',S.conversation.id)
    .eq('profile_id',pid);

  if(r.error)return toast(r.error.message);

  await loadConversationMembers(
    S.conversation.id

  await loadConversations();

  render();
}

async function selectChannel(id){

  S.channel=S.channels.find(x=>x.id===id);

  S.conversation=null;

  await chatLoad();

  render();
}

async function direct(target){

  let cid=null;

  const cs=await db
    .from('conversations')
    .select('id');

  for(const c of cs.data||[]){

    const mm=await db
      .from('conversation_members')
      .select('profile_id')
      .eq('conversation_id',c.id);

    const ids=(mm.data||[]).map(x=>x.profile_id);

    if(
      ids.includes(me())&&
      ids.includes(target)&&
      ids.length===2
    ){
      cid=c.id;
      break;
    }
  }

  if(!cid){

    const c=await db
      .from('conversations')
      .insert({})
      .select()
      .single();

    if(c.error)return toast(c.error.message);

    cid=c.data.id;

    const ins=await db
      .from('conversation_members')
      .insert([
        {
          conversation_id:cid,
          profile_id:me()
        },
        {
          conversation_id:cid,
          profile_id:target
        }
      ]);

    if(ins.error)return toast(ins.error.message);
  }

  S.conversation={
    id:cid,
    target
  };

  S.channel=null;

  await loadConversationMembers(cid);
  await chatLoad();

  render();
}

async function send(){

  const i=document.getElementById('msg');

  const text=i.value.trim();

  if(!text&&!S.pendingFile)return;

  if(!S.channel&&!S.conversation)
    return toast('Select a channel or person first.');

  const row={
    sender_id:me(),
    message_text:text||null
  };

  if(S.channel)
    row.channel_id=S.channel.id;
  else
    row.conversation_id=S.conversation.id;

  if(S.pendingFile){

    row.attachment_name=S.pendingFile.name;
    row.attachment_url=S.pendingFile.url;
    row.attachment_type=S.pendingFile.type;

  }

  const r=await db
    .from('messages')
    .insert(row);

  if(r.error)return toast(r.error.message);

  i.value='';

  S.pendingFile=null;

  await chatLoad();

  render();
}

async function fileAttach(inp){

  const f=inp.files[0];

  if(!f)return;

  if(f.size>10*1024*1024)
    return toast('File must be under 10 MB.');

  const path=
    'chat/'+
    me()+'/'+
    Date.now()+'-'+
    f.name.replace(
      /[^a-zA-Z0-9._-]/g,
      '_'
    );

  const r=await db
    .storage
    .from('nona-files')
    .upload(path,f);

  if(r.error)return toast(r.error.message);

  const u=
    db.storage
      .from('nona-files')
      .getPublicUrl(path)
      .data.publicUrl;

  S.pendingFile={
    name:f.name,
    type:f.type,
    url:u
  };

  render();
}

async function uploadDoc(){

  i.type='file';

  i.onchange=async()=>{

    const f=i.files[0];

    if(!f)return;

    const title=prompt(
      'Document title',
      f.name
    );

    if(!title)return;

    const path=
      'knowledge/'+
      me()+'/'+
      Date.now()+'-'+
      f.name.replace(
        /[^a-zA-Z0-9._-]/g,
        '_'
      );

    const u=await db
      .storage
      .from('nona-files')
      .upload(path,f);

    if(u.error)return toast(u.error.message);

    const url=
      db.storage
        .from('nona-files')
        .getPublicUrl(path)
        .data.publicUrl;

    const r=await db
      .from('knowledge_documents')
      .insert({
        title,
        category:'General',
        file_name:f.name,
        file_url:url,
        file_type:f.type,
        uploaded_by:me()
      });

    if(r.error)return toast(r.error.message);

    await docs();

    render();
  };

  i.click();
}

function backup(){

    new Blob(

          {tasks,logs,attendance},
          null,

function restore(i){

  const r=new FileReader();

  r.onload=()=>{

    try{

      const x=JSON.parse(r.result);

      tasks=x.tasks||tasks;
      logs=x.logs||logs;
      attendance=x.attendance||attendance;

      save();

      render();

      toast('Backup restored');

    }catch(e){

      toast('Invalid backup file');

    }

  };

  r.readAsText(i.files[0]);
}

                id="task-progress"
                type="number"
                min="0"
                max="100"
                value="${Number(t.progress)||0}">
            </div>

            <div>
              <label class="small muted">
                Due Date
              </label>

              <input
                id="task-date"
                type="date"
                value="${t.dueDate||''}">
            </div>

            <div>
              <label class="small muted">
                Due Time
              </label>

              <input
                id="task-time"
                type="time"
                value="${t.dueTime||''}">
            </div>

          </div>

          <label class="small muted">
            Description
          </label>

          <textarea id="task-desc">${esc(t.description||'')}</textarea>

          <label class="small muted">
            Notes
          </label>

          <textarea id="task-notes">${esc(t.notes||'')}</textarea>

          <input
            id="task-id"
            type="hidden"
            value="${esc(t.id||'')}">

          <div class="row between"
            style="margin-top:14px">

            <div>

              ${
                t.id?
                  `<button
                    class="btn danger small"
                    onclick="deleteTask('${t.id}')">
                    Delete Task
                  </button>`:''
              }

            </div>

            <div class="row">

              <button
                class="btn secondary"
                onclick="S.modal=null;render()">
                Cancel
              </button>

              <button
                class="btn"
                onclick="saveTask()">
                Save
              </button>

            </div>

          </div>

        </div>

      </div>
    `;
  }

  if(m.type==='log'){

    const d=m.data;

    return `
      <div class="modalbg">

        <div class="modal">

          <div class="row between">

            <h2 style="margin:0">
              ${d.id?'Edit':'Add'} Work Log
            </h2>

            <button
              class="btn secondary"
              onclick="S.modal=null;render()">
              Close
            </button>

          </div>

          <label class="small muted">
            Date
          </label>

          <input
            id="log-date"
            type="date"
            value="${d.date||''}">

          <label class="small muted">
            Activity
          </label>

          <input
            id="log-task"
            value="${esc(d.task||'')}">

          <label class="small muted">
            Description
          </label>

          <textarea
            id="log-desc">${esc(d.description||'')}</textarea>

          <input
            id="log-id"
            type="hidden"
            value="${esc(d.id||'')}">

          <div class="row between"
            style="margin-top:14px">

            <div>
              ${
                d.id?
                  `<button
                    class="btn danger small"
                    onclick="delLog('${d.id}');S.modal=null;render()">
                    Delete
                  </button>`:''
              }
            </div>

            <div class="row">

              <button
                class="btn secondary"
                onclick="S.modal=null;render()">
                Cancel
              </button>

              <button
                class="btn"
                onclick="saveLog()">
                Save
              </button>

            </div>

          </div>

        </div>

      </div>
    `;
  }

  if(m.type==='staff'){

    const p=m.data;

    return `
      <div class="modalbg">

        <div class="modal">

          <div class="row between">

            <div>
              <h2 style="margin:0">
                Edit Staff
              </h2>

              <div class="small muted">
                Update profile information and leave balance.
              </div>
            </div>

            <button
              class="btn secondary"
              onclick="S.modal=null;render()">
              Close
            </button>

          </div>

          <div
            class="grid two"
            style="margin-top:18px">

            <div>
              <label class="small muted">
                User ID
              </label>

              <input
                value="${esc(p.id)}"
                disabled>
            </div>

            <div>
              <label class="small muted">
                Staff Code
              </label>

              <input
                value="${esc(p.staff_code||'')}"
                disabled>
            </div>

            <div>
              <label class="small muted">
                Full Name
              </label>

              <input
                id="staff-name"
                value="${esc(p.full_name||'')}">
            </div>

            <div>
              <label class="small muted">
                Employee ID
              </label>

              <input
                id="staff-employee"
                value="${esc(p.employee_id||'')}">
            </div>

            <div>
              <label class="small muted">
                Position
              </label>

              <input
                id="staff-position"
                value="${esc(p.position||'')}">
            </div>

            <div>
              <label class="small muted">
                Department
              </label>

              <input
                id="staff-department"
                value="${esc(p.department||'')}">
            </div>

            <div>
              <label class="small muted">
                Phone
              </label>

              <input
                id="staff-phone"
                value="${esc(p.phone||'')}">
            </div>

            <div>
              <label class="small muted">
                Join Date
              </label>

              <input
                id="staff-join"
                type="date"
                value="${p.join_date||''}">
            </div>

            <div>
              <label class="small muted">
                Role
              </label>

              <select id="staff-role">
                <option
                  value="staff"
                  ${p.role==='staff'?'selected':''}>
                  Staff
                </option>

                <option
                  value="admin"
                  ${p.role==='admin'?'selected':''}>
                  Admin
                </option>
              </select>
            </div>

            <div>
              <label class="small muted">
                Status
              </label>

              <select id="staff-status">
                ${['Active','Inactive','On Leave']
                  .map(x=>`
                    <option
                      ${p.status===x?'selected':''}>
                      ${x}
                    </option>
                  `).join('')}
              </select>
            </div>

          </div>

          <div style="margin-top:20px">
            <b>Leave Balance</b>
          </div>

          <div
            class="grid four"
            style="margin-top:10px">

            <div class="leave-box">
              <label class="small muted">
                Annual
              </label>

              <input
                id="staff-annual"
                type="number"
                min="0"
                value="${Number(p.annual_leave)||0}">
            </div>

            <div class="leave-box">
              <label class="small muted">
                Medical
              </label>

              <input
                id="staff-medical"
                type="number"
                min="0"
                value="${Number(p.medical_leave)||0}">
            </div>

            <div class="leave-box">
              <label class="small muted">
                Emergency
              </label>

              <input
                id="staff-emergency"
                type="number"
                min="0"
                value="${Number(p.emergency_leave)||0}">
            </div>

            <div class="leave-box">
              <label class="small muted">
                Unpaid
              </label>

              <input
                id="staff-unpaid"
                type="number"
                min="0"
                value="${Number(p.unpaid_leave)||0}">
            </div>

          </div>

          <input
            id="staff-id"
            type="hidden"
            value="${esc(p.id)}">

          <div
            class="row"
            style="justify-content:flex-end;margin-top:20px">

            <button
              class="btn secondary"
              onclick="S.modal=null;render()">
              Cancel
            </button>

            <button
              class="btn"
              onclick="saveStaff()">
              Save Changes
            </button>

          </div>

        </div>

      </div>
    `;
  }

  if(m.type==='event'){

    const e=m.data;

    return `
      <div class="modalbg">

        <div class="modal">

          <div class="row between">

            <h2 style="margin:0">
              ${e.id?'Edit':'Add'} Calendar Event
            </h2>

            <button
              class="btn secondary"
              onclick="S.modal=null;render()">
              Close
            </button>

          </div>

          <label class="small muted">
            Event Title
          </label>

          <input
            id="event-title"
            value="${esc(e.title||'')}">

          <div class="grid two">

            <div>
              <label class="small muted">
                Date
              </label>

              <input
                id="event-date"
                type="date"
                value="${e.event_date||''}">
            </div>

            <div>
              <label class="small muted">
                Type
              </label>

              <select id="event-type">
                ${[
                  'Public Holiday',
                  'Company Holiday',
                  'Company Event'
                ].map(x=>`
                  <option
                    ${e.event_type===x?'selected':''}>
                    ${x}
                  </option>
                `).join('')}
              </select>
            </div>

          </div>

          <label class="small muted">
            Description
          </label>

          <textarea id="event-desc">${esc(e.description||'')}</textarea>

          <input
            id="event-id"
            type="hidden"
            value="${esc(e.id||'')}">

          <div class="row between"
            style="margin-top:15px">

            <div>
              ${
                e.id?
                  `<button
                    class="btn danger small"
                    onclick="deleteEvent('${e.id}')">
                    Delete
                  </button>`:''
              }
            </div>

            <div class="row">

              <button
                class="btn secondary"
                onclick="S.modal=null;render()">
                Cancel
              </button>

              <button
                class="btn"
                onclick="saveEvent()">
                Save
              </button>

            </div>

          </div>

        </div>

      </div>
    `;
  }

  if(m.type==='event-view'){

    return `
      <div class="modalbg">

        <div class="modal">

          <div class="row between">
            <h2 style="margin:0">
              Calendar Events
            </h2>

            <button
              class="btn secondary"
              onclick="S.modal=null;render()">
              Close
            </button>
          </div>

          <div style="margin-top:15px">

            ${m.data.events.map(e=>`
              <div class="notification-card">

                <div class="notification-thumb">
                  <span class="thumb-letter">
                    ${e.event_type==='Public Holiday'?'PH':'EV'}
                  </span>
                </div>

                <div>
                  <b>${esc(e.title)}</b>

                  <div class="small muted">
                    ${esc(e.event_type)}
                  </div>

                  <div class="small muted">
                    ${esc(e.description||'')}
                  </div>
                </div>

              </div>
            `).join('')}

          </div>

        </div>

      </div>
    `;
  }

  if(m.type==='group-create'){

    return `
      <div class="modalbg">

        <div class="modal">

          <div class="row between">
            <h2 style="margin:0">
              Create Group
            </h2>

            <button
              class="btn secondary"
              onclick="S.modal=null;render()">
              Close
            </button>
          </div>

          <label class="small muted">
            Group Name
          </label>

          <input
            id="group-name"
            placeholder="e.g. Digital Team"
            style="margin:5px 0 14px">

          <div class="small muted">
            Select members
          </div>

          <div
            class="grid"
            style="max-height:330px;overflow:auto;margin-top:10px">

            ${S.profiles
              .filter(p=>p.id!==me())
              .map(p=>`
                <label
                  class="row"
                  style="padding:9px;border:1px solid #eee;border-radius:9px">

                  <input
                    class="group-member"
                    type="checkbox"
                    value="${p.id}"
                    style="width:auto">

                  <img
                    class="avatar"
                    src="${av(p)}">

                  <span>
                    <b>${esc(p.full_name)}</b>
                    <small class="muted">
                      ${esc(p.position||'')}
                    </small>
                  </span>

                </label>
              `).join('')}

          </div>

          <div
            class="row"
            style="justify-content:flex-end;margin-top:16px">

            <button
              class="btn secondary"
              onclick="S.modal=null;render()">
              Cancel
            </button>

            <button
              class="btn"
              onclick="saveGroup()">
              Create Group
            </button>

          </div>

        </div>

      </div>
    `;
  }

  if(m.type==='group-members'){

    const ids=new Set(
      S.conversationMembers.map(x=>x.profile_id)
    );

    return `
      <div class="modalbg">

        <div class="modal">

          <div class="row between">

            <h2 style="margin:0">
              Manage Members
            </h2>

            <button
              class="btn secondary"
              onclick="S.modal=null;render()">
              Close
            </button>

          </div>

          <div
            class="small muted"
            style="margin:15px 0 8px">
            Current members
          </div>

          ${S.conversationMembers.map(x=>{

            const p=S.profiles.find(
              y=>y.id===x.profile_id
            );

            return `
              <div
                class="row between"
                style="padding:9px 0;border-bottom:1px solid #eee">

                <div class="row">

                  <img
                    class="avatar"
                    src="${av(p)}">

                  <div>
                    <b>${esc(p?.full_name||'User')}</b>

                    <div class="small muted">
                      ${esc(x.role)}
                    </div>
                  </div>

                </div>

                ${
                  x.profile_id!==me()?
                    `<button
                      class="btn danger small"
                      onclick="removeMember('${x.profile_id}')">
                      Remove
                    </button>`:
                    `<span class="small muted">
                      You
                    </span>`
                }

              </div>
            `;

          }).join('')}

          <div
            class="small muted"
            style="margin:16px 0 8px">
            Add members
          </div>

          <div
            class="grid"
            style="max-height:250px;overflow:auto">

            ${S.profiles
              .filter(
                p=>p.id!==me()&&!ids.has(p.id)
              )
              .map(p=>`
                <label
                  class="row"
                  style="padding:8px;border:1px solid #eee;border-radius:8px">

                  <input
                    class="group-add-member"
                    type="checkbox"
                    value="${p.id}"
                    style="width:auto">

                  <img
                    class="avatar"
                    src="${av(p)}">

                  <span>
                    ${esc(p.full_name)}
                  </span>

                </label>
              `).join('')||
              `<div class="small muted">
                Everyone is already in this group.
              </div>`
            }

          </div>

          <div
            class="row"
            style="justify-content:flex-end;margin-top:16px">

            <button
              class="btn secondary"
              onclick="S.modal=null;render()">
              Close
            </button>

            <button
              class="btn"
              onclick="saveMembers()">
              Add Selected
            </button>

          </div>

        </div>

      </div>
    `;
  }

  return '';
}

setInterval(()=>{
  const el=document.getElementById('live-clock');

  if(el){
    el.textContent=new Date().toLocaleTimeString(
      'en-MY',
      {
        hour:'2-digit',
        minute:'2-digit',
        second:'2-digit'
      }
    );
  }
},1000);

init();
</script>
</body>
</html>
