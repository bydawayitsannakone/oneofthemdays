<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nona Costex Staff Portal</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f1;
  --card:#fff;
  --text:#272923;
  --muted:#77796f;
  --line:#e5e5df;
  --soft:#eceee7;
  --accent:#6d765e;
  --accent-dark:#59614d;
  --danger:#b85c5c;
  --warning:#b88b43;
  --success:#668265;
  --shadow:0 8px 25px rgba(40,45,35,.06);
}
body{
  font-family:Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* LOGIN */
.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:#eeefe9;
}
.login-box{
  width:100%;
  max-width:410px;
  background:white;
  padding:38px;
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  border-radius:18px;
}
.logo{
  font-size:24px;
  font-weight:700;
  letter-spacing:-.5px;
}
.login-sub{
  color:var(--muted);
  font-size:13px;
  margin-top:6px;
  margin-bottom:28px;
}
.field{margin-bottom:16px}
.field label{
  display:block;
  font-size:12px;
  font-weight:600;
  margin-bottom:7px;
  color:#55584e;
}
input,select,textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:9px;
  padding:11px 12px;
  outline:none;
  background:#fff;
  color:var(--text);
}
textarea{min-height:100px;resize:vertical}
input:focus,select:focus,textarea:focus{
  border-color:var(--accent);
}
.btn{
  border:0;
  border-radius:9px;
  padding:10px 15px;
  background:var(--accent);
  color:#fff;
  font-weight:600;
}
.btn:hover{background:var(--accent-dark)}
.btn.secondary{
  background:#eceee8;
  color:#50554a;
}
.btn.danger{background:#b85c5c}
.btn.warning{background:#b88b43}
.btn.small{padding:7px 10px;font-size:12px}
.login-error{
  color:#a74d4d;
  font-size:12px;
  margin-top:10px;
}

/* APP */
.app{display:none;min-height:100vh}
.sidebar{
  width:245px;
  background:#e9ebe4;
  position:fixed;
  top:0;
  bottom:0;
  left:0;
  padding:24px 15px;
  z-index:100;
  border-right:1px solid #dfe1d9;
}
.brand{
  padding:0 12px 25px;
  font-size:20px;
  font-weight:700;
}
.brand span{
  display:block;
  font-size:11px;
  font-weight:400;
  color:var(--muted);
  margin-top:4px;
}
.nav-section{
  color:#92958b;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
  padding:13px 12px 7px;
}
.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  color:#55594f;
  text-align:left;
  padding:10px 12px;
  border-radius:9px;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:13px;
  margin:2px 0;
}
.nav-btn:hover,.nav-btn.active{
  background:#fff;
  color:#3f4939;
}
.icon{
  width:17px;
  height:17px;
  flex:none;
}
.main{
  margin-left:245px;
  min-height:100vh;
}
.topbar{
  height:70px;
  background:rgba(255,255,255,.92);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:50;
}
.page-title{
  font-size:18px;
  font-weight:700;
}
.top-actions{
  display:flex;
  align-items:center;
  gap:10px;
}
.icon-btn{
  width:37px;
  height:37px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
.badge-dot{
  position:absolute;
  right:5px;
  top:5px;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#b85c5c;
}
.user-mini{
  display:flex;
  align-items:center;
  gap:9px;
  padding-left:5px;
}
.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#dfe2d8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:700;
  overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.user-mini-name{font-size:12px;font-weight:600}
.user-mini-role{font-size:10px;color:var(--muted)}
.content{padding:28px;max-width:1600px;margin:auto}

/* CARDS */
.grid{
  display:grid;
  gap:15px;
}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
  box-shadow:var(--shadow);
}
.stat-label{
  color:var(--muted);
  font-size:11px;
  margin-bottom:10px;
}
.stat-number{font-size:27px;font-weight:700}
.stat-small{font-size:11px;color:var(--muted);margin-top:5px}
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:15px;
}
.section-title{font-size:14px;font-weight:700}
.section-sub{font-size:11px;color:var(--muted);margin-top:3px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{
  padding:12px 10px;
  border-bottom:1px solid var(--line);
  text-align:left;
  font-size:12px;
}
th{
  color:#85877e;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.5px;
}
tr:last-child td{border-bottom:0}
.status,.priority{
  display:inline-block;
  padding:5px 8px;
  border-radius:20px;
  font-size:10px;
  font-weight:600;
}
.status.pending{background:#eeeae0;color:#887347}
.status.progress{background:#e7ece2;color:#607055}
.status.completed{background:#e4eee5;color:#5b795d}
.status.overdue{background:#f2e2e2;color:#a45151}
.priority.high{background:#f2e2e2;color:#a45151}
.priority.medium{background:#eeeae0;color:#887347}
.priority.low{background:#e7ece2;color:#607055}
.progress{
  height:7px;
  background:#eceee9;
  border-radius:20px;
  overflow:hidden;
}
.progress > span{
  display:block;
  height:100%;
  background:var(--accent);
}
.empty{
  padding:30px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.toolbar{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-bottom:15px;
}
.toolbar input,.toolbar select{max-width:220px}

/* DASHBOARD */
.welcome{
  margin-bottom:22px;
}
.welcome h2{font-size:21px}
.welcome p{font-size:12px;color:var(--muted);margin-top:5px}
.list-item{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:11px 0;
  border-bottom:1px solid var(--line);
}
.list-item:last-child{border-bottom:0}
.item-title{font-size:12px;font-weight:600}
.item-meta{font-size:10px;color:var(--muted);margin-top:4px}
.activity{
  border-left:2px solid #d9ddd2;
  padding-left:13px;
  margin:10px 0;
}
.activity strong{font-size:11px}
.activity p{font-size:10px;color:var(--muted);margin-top:3px}

/* MODAL */
.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(30,32,27,.4);
  z-index:500;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal{
  width:100%;
  max-width:620px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:15px;
  padding:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.18);
}
.modal.large{max-width:850px}
.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}
.modal-title{font-size:17px;font-weight:700}
.close{
  width:32px;
  height:32px;
  border:0;
  background:#f0f1ec;
  border-radius:8px;
}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.form-full{grid-column:1/-1}
.modal-foot{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px;
}

/* CALENDAR */
.calendar-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}
.month-title{font-size:17px;font-weight:700}
.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
}
.weekday{
  background:#f0f1ec;
  padding:10px;
  font-size:10px;
  color:#85877e;
  text-align:center;
  border-right:1px solid var(--line);
}
.day{
  min-height:105px;
  padding:8px;
  border-top:1px solid var(--line);
  border-right:1px solid var(--line);
  background:#fff;
  cursor:pointer;
}
.day:hover{background:#fafaf7}
.day.other{background:#f8f8f5;color:#b1b3ab}
.day.today{background:#eef1e9}
.day-number{
  font-size:11px;
  font-weight:700;
  margin-bottom:6px;
}
.event{
  padding:4px 5px;
  background:#e9eee4;
  border-radius:5px;
  font-size:9px;
  margin-bottom:4px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.event.task{background:#ece9e0}
.event.overdue{background:#f2e2e2;color:#9f5050}

/* PROFILE */
.profile-head{
  display:flex;
  gap:20px;
  align-items:center;
  margin-bottom:20px;
}
.profile-avatar{
  width:82px;
  height:82px;
  border-radius:50%;
  background:#e0e3da;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:25px;
  font-weight:700;
}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-name{font-size:20px;font-weight:700}
.profile-position{font-size:12px;color:var(--muted);margin-top:4px}

/* NOTIFICATION */
.notification{
  padding:14px;
  border:1px solid var(--line);
  border-radius:10px;
  margin-bottom:9px;
  background:#fff;
}
.notification.unread{background:#f1f3ed;border-color:#dce2d5}
.notification-title{font-size:12px;font-weight:700}
.notification-text{font-size:11px;color:var(--muted);margin-top:4px}
.notification-time{font-size:9px;color:#999;margin-top:7px}

/* MOBILE */
.mobile-menu{display:none}
.overlay{display:none}
@media(max-width:1000px){
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:1fr 1fr}
}
@media(max-width:760px){
  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
  }
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .mobile-menu{display:flex}
  .topbar{padding:0 15px;height:62px}
  .content{padding:18px 14px}
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr}
  .user-mini-name,.user-mini-role{display:none}
  .form-grid{grid-template-columns:1fr}
  .form-full{grid-column:auto}
  .calendar{min-width:650px}
  .calendar-scroll{overflow-x:auto}
  .day{min-height:85px}
  .overlay.show{
    display:block;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.25);
    z-index:90;
  }
}

/* TOAST */
.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#292c26;
  color:#fff;
  padding:12px 15px;
  border-radius:9px;
  font-size:11px;
  z-index:1000;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}
</style>
</head>

function get(key, fallback=[]){
  try{
    const raw=localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){return fallback}
}
function set(key,value){
  localStorage.setItem(key,JSON.stringify(value));
}

function initData(){
  if(!localStorage.getItem(KEYS.staff)) set(KEYS.staff,defaultStaff);
  if(!localStorage.getItem(KEYS.logs)) set(KEYS.logs,defaultLogs);

  if(!localStorage.getItem(KEYS.activity)) set(KEYS.activity,[]);

  let logs=get(KEYS.logs);
  let changed=false;
  logs=logs.map(x=>{
    if(!x.staffId){x.staffId="NC001";changed=true}
    if(!x.assignedBy){x.assignedBy="admin";changed=true}
    return x;
  });
  if(changed)set(KEYS.logs,logs);
}

/* =========================
   HELPERS
========================= */

function uid(prefix){
  return prefix+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
}
function esc(v){
  return String(v??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
function today(){
  const d=new Date();
  return d.toISOString().slice(0,10);
}
function fmtDate(date){
  if(!date)return "-";
  const d=new Date(date+"T00:00:00");
  return d.toLocaleDateString("en-MY",{day:"2-digit",month:"short",year:"numeric"});
}
function fmtDateTime(v){
  if(!v)return "-";
  const d=new Date(v);
  return d.toLocaleString("en-MY",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
}
function staffName(id){
  if(id==="admin")return "Admin";
  const s=get(KEYS.staff).find(x=>x.id===id || x.code===id);
  return s?s.name:"Unknown";
}
function initials(name){
  return String(name||"?").split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase();
}
function isOverdue(task){
  if(task.status==="Completed")return false;
  if(!task.dueDate)return false;
  const deadline=new Date(task.dueDate+"T"+(task.dueTime||"23:59"));
  return deadline < new Date();
}
function statusClass(status){
  if(status==="Completed")return "completed";
  if(status==="In Progress")return "progress";
  return "pending";
}
function priorityClass(p){
  return String(p||"Medium").toLowerCase();
}
function toast(msg){
  const old=document.querySelector(".toast");
  if(old)old.remove();
  const t=document.createElement("div");
  t.className="toast";
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2500);
}
function addActivity(action,detail,staffId=null){
  const arr=get(KEYS.activity);
  arr.unshift({
    id:uid("ACT"),
    action,
    detail,
    staffId:staffId || currentUser?.staffId || "admin",
    createdAt:new Date().toISOString()
  });
  set(KEYS.activity,arr.slice(0,500));
}
function addNotification(staffId,title,message,type="general"){
  const arr=get(KEYS.notifications);
  arr.unshift({
    id:uid("NOT"),
    staffId,
    title,
    message,
    type,
    read:false,
    createdAt:new Date().toISOString()
  });
  set(KEYS.notifications,arr.slice(0,500));
}
function unreadCount(){
  if(!currentUser)return 0;
  return get(KEYS.notifications).filter(n=>n.staffId===currentUser.staffId && !n.read).length;
}
function updateNotificationUI(){
  const count=unreadCount();
  const dot=document.getElementById("topNotifDot");
  if(dot)dot.classList.toggle("hidden",count===0);
  const nav=document.getElementById("navNotifCount");
  if(nav)nav.innerHTML=count?`<span class="status overdue">${count}</span>`:"";
}
function closeModal(){
  document.getElementById("modalRoot").innerHTML="";
}
function openModal(html,large=false){
  document.getElementById("modalRoot").innerHTML=
    `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
      <div class="modal ${large?"large":""}">${html}</div>
    </div>`;
}

  document.getElementById("overlay").classList.remove("show");

function login(){
  const username=document.getElementById("loginUsername").value.trim();
  const password=document.getElementById("loginPassword").value.trim();
  const staff=get(KEYS.staff);

  if(username.toLowerCase()==="admin" && password==="ADMIN001"){
    currentUser={
      role:"admin",
      staffId:"admin",
      name:"Admin"
    };
  }else{
    const user=staff.find(s=>

      s.code===password
    );
    if(user){
      currentUser={
        role:"staff",
        staffId:user.id,
        name:user.name
      };
    }else{
      document.getElementById("loginError").textContent="Invalid username or password.";

  }

  document.getElementById("loginPage").style.display="none";
  document.getElementById("app").style.display="block";

  document.getElementById("adminNav").style.display=
    currentUser.role==="admin"?"block":"none";

  document.getElementById("topName").textContent=currentUser.name;

    currentUser.role==="admin"?"Administrator":"Staff";

  addActivity("Login",currentUser.name+" logged into the portal",currentUser.staffId);

  updateNotificationUI();
  showPage("dashboard");
}

function taskTable(tasks){
  if(!tasks.length)return `<div class="empty">No tasks found.</div>`;

  return `
  <div class="table-wrap">
  <table>
    <thead><tr>
      <th>Task</th>
      ${currentUser.role==="admin"?`<th>Assigned To</th>`:""}
      <th>Due</th>
      <th>Priority</th>
      <th>Status</th>
      <th>Action</th>
    </tr></thead>
    <tbody>
    ${tasks.map(t=>`
      <tr>
        <td>
          <strong>${esc(t.title)}</strong>
          <div class="item-meta">${esc(t.description||"")}</div>
        </td>
        ${currentUser.role==="admin"?`<td>${esc(staffName(t.staffId))}</td>`:""}
        <td>${t.dueDate?fmtDate(t.dueDate):"-"} ${esc(t.dueTime||"")}</td>
        <td><span class="priority ${priorityClass(t.priority)}">${esc(t.priority)}</span></td>
        <td><span class="status ${isOverdue(t)?"overdue":statusClass(t.status)}">${isOverdue(t)?"Overdue":esc(t.status)}</span></td>
        <td>
          <div class="actions">
            <button class="btn small secondary" onclick="viewTask('${t.id}')">View</button>
            ${currentUser.role==="admin"
              ?`<button class="btn small" onclick="openTaskModal('${t.id}')">Edit</button>
                <button class="btn small danger" onclick="deleteTask('${t.id}')">Delete</button>`
              :`<button class="btn small" onclick="updateTaskStatus('${t.id}')">Update</button>`
            }
          </div>
        </td>
      </tr>
    `).join("")}
    </tbody>
  </table>
  </div>`;
}

function filterTasks(){
  let tasks=get(KEYS.logs);
  if(currentUser.role!=="admin")
    tasks=tasks.filter(t=>t.staffId===currentUser.staffId);

  const q=(document.getElementById("taskSearch")?.value||"").toLowerCase();
  const status=document.getElementById("taskStatus")?.value||"";
  const priority=document.getElementById("taskPriority")?.value||"";

  tasks=tasks.filter(t=>{
    const matchQ=(t.title+" "+(t.description||"")+" "+staffName(t.staffId)).toLowerCase().includes(q);
    const matchStatus=!status || (status==="Overdue"?isOverdue(t):t.status===status);
    const matchPriority=!priority || t.priority===priority;
    return matchQ&&matchStatus&&matchPriority;
  });

  document.getElementById("taskTable").innerHTML=taskTable(tasks);
}

function saveTask(id){
  const arr=get(KEYS.logs);

  const data={
    title:document.getElementById("fTitle").value.trim(),
    staffId:document.getElementById("fStaff").value,
    priority:document.getElementById("fPriority").value,
    workDate:document.getElementById("fWorkDate").value,
    dueDate:document.getElementById("fDueDate").value,
    dueTime:document.getElementById("fDueTime").value,
    status:document.getElementById("fStatus").value,
    description:document.getElementById("fDescription").value.trim(),
    assignedBy:"admin"
  };

  if(!data.title){
    toast("Please enter a task title");
    return;
  }

  if(id){
    const old=arr.find(x=>x.id===id);
    Object.assign(old,data);
    addActivity("Task Updated",`${data.title} updated`,data.staffId);
    if(old.status!==data.status && data.status==="Completed"){
      addNotification("admin","Task completed",`${staffName(data.staffId)} completed "${data.title}"`,"task");
    }
  }else{
    data.id=uid("TASK");
    arr.unshift(data);
    addNotification(
      data.staffId,
      "New task assigned",
      `You have been assigned: ${data.title}`,
      "task"
    );
    addActivity("Task Assigned",`${data.title} assigned to ${staffName(data.staffId)}`,data.staffId);
  }

  set(KEYS.logs,arr);
  closeModal();
  toast(id?"Task updated":"Task assigned");
  showPage("tasks");
}

function deleteTask(id){
  const arr=get(KEYS.logs);
  const task=arr.find(x=>x.id===id);
  if(!task)return;

  if(!confirm("Delete this task?"))return;

  set(KEYS.logs,arr.filter(x=>x.id!==id));
  addActivity("Task Deleted",`${task.title} deleted`,task.staffId);
  toast("Task deleted");
  renderTasks();
}

function updateTaskStatus(id){
  const task=get(KEYS.logs).find(x=>x.id===id);
  if(!task)return;

  openModal(`

      <div class="modal-title">Update Task Status</div>
      <button class="close" onclick="closeModal()">×</button>

function filterLogs(){

  const arr=get(KEYS.attendance);
  const existing=arr.find(a=>a.staffId===currentUser.staffId&&a.date===today());

  const now=new Date();
  const time=now.toLocaleTimeString("en-MY",{hour:"2-digit",minute:"2-digit",hour12:false});

  arr.unshift({
    id:uid("ATT"),
    staffId:currentUser.staffId,
    date:today(),
    clockIn:time,
    clockOut:""
  });

  set(KEYS.attendance,arr);
  addActivity("Clock In",`${currentUser.name} clocked in`,currentUser.staffId);
  toast("Clocked in");
  renderAttendance();
}

function clockOut(){
  const arr=get(KEYS.attendance);
  const record=arr.find(a=>a.staffId===currentUser.staffId&&a.date===today());
  if(!record)return;

  const now=new Date();
  record.clockOut=now.toLocaleTimeString("en-MY",{hour:"2-digit",minute:"2-digit",hour12:false});

  set(KEYS.attendance,arr);
  addActivity("Clock Out",`${currentUser.name} clocked out`,currentUser.staffId);
  toast("Clocked out");
  renderAttendance();
}

        `).join("") || `<div class="empty">No upcoming schedules.</div>`

function buildCalendar(year,month,schedules,tasks){
  const first=new Date(year,month,1);
  const last=new Date(year,month+1,0);
  const prevLast=new Date(year,month,0).getDate();
  const start=first.getDay();
  const total=Math.ceil((start+last.getDate())/7)*7;
  let html="";

  for(let i=0;i<total;i++){
    const day=i-start+1;
    let date;
    let other=false;

    if(day<1){
      date=new Date(year,month-1,prevLast+day);
      other=true;
    }else if(day>last.getDate()){
      date=new Date(year,month+1,day-last.getDate());
      other=true;
    }else{
      date=new Date(year,month,day);
    }

    const ds=date.toISOString().slice(0,10);
    const isToday=ds===today();

    const ss=schedules.filter(s=>s.date===ds);
    const ts=tasks.filter(t=>t.dueDate===ds);

    html+=`
      <div class="day ${other?"other":""} ${isToday?"today":""}" onclick="calendarDateClick('${ds}')">
        <div class="day-number">${date.getDate()}</div>

        ${ss.slice(0,3).map(s=>`
          <div class="event" title="${esc(s.title)}">
            ${esc(s.time||"")} ${esc(s.title)}
          </div>
        `).join("")}

        ${ts.slice(0,3).map(t=>`
          <div class="event task ${isOverdue(t)?"overdue":""}" title="${esc(t.title)}">
            Task · ${esc(t.title)}
          </div>
        `).join("")}

        ${(ss.length+ts.length)>6?`<div class="item-meta">+ more</div>`:""}
      </div>
    `;
  }

  return html;
}

function changeMonth(n){
  calendarDate.setMonth(calendarDate.getMonth()+n);
  renderSchedule();
}
function calendarToday(){
  calendarDate=new Date();
  renderSchedule();

    <div class="section-title">Schedules</div>
    <div style="margin:10px 0 20px">

function monthlySummary(logs){
  const months={};

  logs.forEach(l=>{
    if(!l.workDate)return;
    const key=l.workDate.slice(0,7);
    if(!months[key])months[key]={total:0,completed:0};
    months[key].total++;
    if(l.status==="Completed")months[key].completed++;
  });

  const rows=Object.entries(months).sort((a,b)=>b[0].localeCompare(a[0]));

  if(!rows.length)return `<div class="empty">No data.</div>`;

  return `<div class="table-wrap"><table>
    <thead><tr><th>Month</th><th>Total</th><th>Completed</th><th>Rate</th></tr></thead>
    <tbody>
      ${rows.map(([m,v])=>{
        const r=Math.round(v.completed/v.total*100);
        return `<tr>
          <td>${m}</td>
          <td>${v.total}</td>
          <td>${v.completed}</td>
          <td>${r}%</td>
        </tr>`;
      }).join("")}
    </tbody>
  </table></div>`;
}

    const data=get(KEYS.attendance);
    rows=[
      ["Date","Staff","Clock In","Clock Out"],
      ...data.map(x=>[
        x.date,
        staffName(x.staffId),
        x.clockIn,
        x.clockOut
      ])
    ];
    filename="nona_attendance.csv";
  }

  if(type==="leave"){
    const data=get(KEYS.leaves);
    rows=[
      ["Staff","Type","Start Date","End Date","Reason","Status"],
      ...data.map(x=>[
        staffName(x.staffId),
        x.type,
        x.startDate,
        x.endDate,
        x.reason,
        x.status
      ])
    ];
    filename="nona_leave_requests.csv";
  }

  const csv=rows.map(row=>
    row.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")
  ).join("\n");

  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=filename;
  a.click();
  URL.revokeObjectURL(url);
}
