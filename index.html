function formatDate(x){
if(!x)return "";

return new Date(x+"T00:00:00")
.toLocaleDateString("en-MY",{
day:"numeric",
month:"short",
year:"numeric"
});
}

function formatDateTime(x){
if(!x)return "";

return new Date(x)
.toLocaleString("en-MY",{
day:"numeric",
month:"short",
year:"numeric",
hour:"2-digit",
minute:"2-digit"
});
}

function priorityClass(x){
return x==="High"
?"high"
:x==="Medium"
?"medium"
:"low";
}

function statusClass(x){
return x==="Completed"
?"green"
:x==="In Progress"
?"blue"
:x==="Overdue"
?"red"
:"";
}

function addActivity(text){
activity.unshift({
id:"act"+Date.now(),
text,
date:new Date().toISOString(),
user:S.profile?.full_name || "System"
});

activity=activity.slice(0,100);
saveLocal();
}

function taskIsOverdue(t){
if(!t.dueDate)return false;
if(t.status==="Completed")return false;

const due =
new Date(
t.dueDate+"T"+(t.dueTime || "23:59")
);

return due < new Date();
}

function taskDisplayStatus(t){
return taskIsOverdue(t)
?"Overdue"
:t.status;
}


/* =========================================================
   AUTH
========================================================= */

async function init(){

const {
data:{session}
}=await db.auth.getSession();

if(session){
await enterApp(session.user);
}else{
loginPage();
}

db.auth.onAuthStateChange(
async(event,session)=>{

if(session && !S.user){
await enterApp(session.user);
}

if(!session){
S.user=null;
S.profile=null;
loginPage();
}

});
}


async function loadProfile(){

const r =
await db
.from("profiles")
.select("*")
.eq("id",S.user.id)
.maybeSingle();

if(!r.error){
S.profile=r.data;
}
}


async function enterApp(user){

S.user=user;

await loadProfile();

if(!S.profile){

const email=(user.email||"").toLowerCase();

const adminAccount=email.includes("admin");

await db.from("profiles").insert({
id:user.id,
staff_code:adminAccount?"ADMIN001":"NC001",
full_name:adminAccount?"Admin":"Atikah",
department:adminAccount?"Management":"Digital",
position:adminAccount
?"Administrator"
:"Live Host Online & Offline",
role:adminAccount?"admin":"staff",
status:"Active"
});

await loadProfile();
}

await Promise.all([
loadProfiles(),
loadChannels(),
loadNotifications(),
loadDocuments()
]);

setupRealtime();

render();
}


async function login(){

const email=
document.getElementById("login-email")
.value.trim();

const password=
document.getElementById("login-password")
.value;

if(!email || !password){
return loginPage("Please enter your email and password.");
}

const r=
await db.auth.signInWithPassword({
email,
password
});

if(r.error){
return loginPage(r.error.message);
}

await enterApp(r.data.user);
}


async function logout(){
await db.auth.signOut();
}

/* =========================================================
   SUPABASE LOADERS
========================================================= */

async function loadProfiles(){

const r =
await db
.from("profiles")
.select("*")
.order("full_name");

if(!r.error){
S.profiles=r.data || [];
}
}


async function loadChannels(){

const r =
await db
.from("channels")
.select("*")
.order("name");

if(!r.error){
S.channels=r.data || [];
}

if(!S.channels.length && S.user){

const created =
await db
.from("channels")
.insert({
name:"General",
description:"General team communication",
created_by:me()
})
.select()
.single();

if(!created.error){
S.channels=[created.data];
}
}
}


async function loadNotifications(){

const r =
await db
.from("communication_notifications")
.select("*")
.eq("profile_id",me())
.order("created_at",{ascending:false})
.limit(50);

if(!r.error){
S.notifications=r.data || [];
}
}


async function loadDocuments(){

const r =
await db
.from("knowledge_documents")
.select("*")
.order("created_at",{ascending:false});

if(!r.error){
S.docs=r.data || [];
}
}


/* =========================================================
   REALTIME
========================================================= */

function setupRealtime(){

db.channel("nona-v21-realtime")

.on(
"postgres_changes",
{
event:"*",
schema:"public",
table:"messages"
},
async()=>{
if(S.page==="communication"){
await loadMessages();
render();
}
})

.on(
"postgres_changes",
{
event:"*",
schema:"public",
table:"communication_notifications"
},
async()=>{
await loadNotifications();
render();
})

.subscribe();

}

function openTask(id){

const original =
id
?tasks.find(t=>t.id===id)
:null;

const t=original
?JSON.parse(JSON.stringify(original))
:{
id:"",
name:"",
category:"General",
priority:"Medium",
status:"Not Started",
dueDate:"",
dueTime:"",
description:"",
notes:"",
checklist:[],
timeline:[]
};

S.modal={
type:"task",
data:t
};

render();
}


function saveTask(){

const g=id=>
document.getElementById(id)?.value || "";

const id=g("task-id");

const data={
name:g("task-name").trim(),
category:g("task-category").trim(),
priority:g("task-priority"),
status:g("task-status"),
dueDate:g("task-date"),
dueTime:g("task-time"),
description:g("task-description"),
notes:g("task-notes")
};

if(!data.name || !data.dueDate){
return toast(
"Task name and due date are required."
);
}

if(id){

const t=tasks.find(x=>x.id===id);

if(t){

const oldStatus=t.status;

Object.assign(t,data);

if(oldStatus!==data.status){
t.timeline=t.timeline||[];

t.timeline.unshift({
text:`Status changed from ${oldStatus} to ${data.status}`,
date:new Date().toISOString(),
user:S.profile.full_name
});

taskHistory.unshift({
task_id:t.id,
text:`Status changed from ${oldStatus} to ${data.status}`,
date:new Date().toISOString()
});
}

}

addActivity(`Updated task: ${data.name}`);

}else{

const newTask={
...data,
id:"t"+Date.now(),
checklist:[],
timeline:[
{
text:"Task created",
date:new Date().toISOString(),
user:S.profile.full_name
}
]
};

tasks.unshift(newTask);

taskHistory.unshift({
task_id:newTask.id,
text:"Task created",
date:new Date().toISOString()
});

addActivity(`Created task: ${data.name}`);

}

saveLocal();

S.modal=null;

toast("Task saved");

render();
}

async function loadMessages(){

if(!S.channel && !S.conversation){
S.messages=[];
return;
}

let query=
db
.from("messages")
.select("*")
.order("created_at",{ascending:true})
.limit(200);

if(S.channel){

query=query.eq(
"channel_id",
S.channel.id
);

}else{

query=query.eq(
"conversation_id",
S.conversation.id
);

}

const r=await query;

if(!r.error){
S.messages=r.data||[];
}
}


async function selectChannel(id){

S.channel=
S.channels.find(x=>x.id===id);

S.conversation=null;

await loadMessages();

render();
}


async function directChat(targetId){

let conversationId=null;

const list=
await db
.from("conversations")
.select("id");

for(const c of list.data||[]){

const members=
await db
.from("conversation_members")
.select("profile_id")
.eq("conversation_id",c.id);

const ids=
(members.data||[])
.map(x=>x.profile_id);

if(
ids.length===2 &&
ids.includes(me()) &&
ids.includes(targetId)
){

conversationId=c.id;
break;

}

}


if(!conversationId){

const created=
await db
.from("conversations")
.insert({})
.select()
.single();

if(created.error){
return toast(created.error.message);
}

conversationId=created.data.id;

const added=
await db
.from("conversation_members")
.insert([
{
conversation_id:conversationId,
profile_id:me()
},
{
conversation_id:conversationId,
profile_id:targetId
}
]);

if(added.error){
return toast(added.error.message);
}

}

S.conversation={
id:conversationId,
target:targetId
};

S.channel=null;

await loadMessages();

render();
}


async function sendMessage(){

const input=
document.getElementById("chat-message");

const text=
input?.value.trim() || "";

if(!text && !S.pendingFile){
return;
}

if(!S.channel && !S.conversation){
return toast(
"Select a channel or person first."
);
}

let row={
sender_id:me(),
message_text:text || null
};

if(S.channel){
row.channel_id=S.channel.id;
}

if(S.conversation){
row.conversation_id=S.conversation.id;
}


/* Attachment */
if(S.pendingFile){

row.attachment_name=
S.pendingFile.name;

row.attachment_url=
S.pendingFile.url;

row.attachment_type=
S.pendingFile.type;

}


/*
Mention notification
*/
const mentionUsers=
S.profiles.filter(p=>
p.id!==me() &&
text.includes("@"+p.full_name.split(" ")[0])
);

const result=
await db
.from("messages")
.insert(row);

if(result.error){

return toast(
result.error.message
);

}


for(const p of mentionUsers){

await db
.from("communication_notifications")
.insert({
profile_id:p.id,
title:"You were mentioned",
message:
`${S.profile.full_name} mentioned you in Communication.`,
is_read:false
});

}


input.value="";

S.pendingFile=null;

await loadMessages();

render();
}


async function attachChatFile(input){

const file=input.files[0];

if(!file)return;

if(file.size>10*1024*1024){

return toast(
"File must be under 10 MB."
);

}

async function uploadDocument(){

const input=
document.createElement("input");

input.type="file";

input.onchange=async()=>{

const file=input.files[0];

if(!file)return;

if(file.size>20*1024*1024){
return toast(
"File must be under 20 MB."
);
}

const title=
prompt(
"Document title",
file.name
);

if(!title)return;

const safe=
file.name.replace(
/[^a-zA-Z0-9._-]/g,
"_"
);

const path=
"knowledge/"+
me()+
"/"+
Date.now()+
"-"+
safe;

const upload=
await db
.storage
.from("nona-files")
.upload(path,file);

if(upload.error){
return toast(
upload.error.message
);
}

const signed=
await db
.storage
.from("nona-files")
.createSignedUrl(
path,
60*60*24*30
);

if(signed.error){
return toast(
signed.error.message
);
}

const result=
await db
.from("knowledge_documents")
.insert({
title,
category:"General",
file_name:file.name,
file_url:signed.data.signedUrl,
file_type:file.type,
uploaded_by:me()
});

if(result.error){
return toast(
result.error.message
);
}

await loadDocuments();

toast("Document uploaded");

render();

};

input.click();
}

function calendarPage(){

first.getDay();

last.getDate();

for(let i=0;i<startDay;i++){

tasks.filter(t=>t.dueDate===dateValue);

function backupData(){

const data={
tasks,
logs,
attendance,
leaves,
schedules,
announcements,
activity,
taskHistory,
exportedAt:new Date().toISOString()
};

const blob=
new Blob(
[
JSON.stringify(data,null,2)
],
{
type:"application/json"
}
);

const a=
document.createElement("a");

a.href=
URL.createObjectURL(blob);

a.download=
"nona-costex-v21-backup.json";

a.click();

}


function restoreData(input){

const file=input.files[0];

if(!file)return;

const reader=
new FileReader();

reader.onload=()=>{

try{

const data=
JSON.parse(reader.result);

if(data.tasks)tasks=data.tasks;
if(data.logs)logs=data.logs;
if(data.attendance)attendance=data.attendance;
if(data.leaves)leaves=data.leaves;
if(data.schedules)schedules=data.schedules;
if(data.announcements)announcements=data.announcements;
if(data.activity)activity=data.activity;
if(data.taskHistory)taskHistory=data.taskHistory;

saveLocal();

toast("Backup restored");

render();

}catch(e){

toast("Invalid backup file.");

}

};

reader.readAsText(file);
}


function resetLocalData(){

if(!confirm(
"Reset local portal data? This cannot be undone."
))return;

localStorage.removeItem("nona_v21_tasks");
localStorage.removeItem("nona_v21_logs");
localStorage.removeItem("nona_v21_attendance");
localStorage.removeItem("nona_v21_leaves");
localStorage.removeItem("nona_v21_schedules");
localStorage.removeItem("nona_v21_announcements");
localStorage.removeItem("nona_v21_activity");
localStorage.removeItem("nona_task_history");

location.reload();
}

${x}

class="btn secondary"

S.modal=null;
render();

<div class="row between">

${esc(t.name)}

<div class="small muted">
${esc(t.category)}

<button
class="btn secondary"
onclick="
S.modal=null;
render();
"
>
×
</button>

</div>


<div
class="row wrap"
style="margin:16px 0"
>

<span class="pill ${priorityClass(t.priority)}">
${esc(t.priority)}

<span class="pill ${statusClass(taskDisplayStatus(t))}">
${esc(taskDisplayStatus(t))}
</span>

</div>


<div class="card" style="background:#fafaf8">

<b>Description</b>

<p class="small">
${esc(t.description||"No description.")}

<div style="margin-top:18px">

<div class="row between">

<b>Checklist</b>

<button
class="btn secondary small"
onclick="addChecklist('${t.id}')"
>
+ Add
</button>

</div>


${
checks.map((c,i)=>`

<label class="check">

<input
type="checkbox"
${c.done?"checked":""}
onchange="
toggleChecklist('${t.id}',${i})
"
>

<span
style="${
c.done
?"text-decoration:line-through;color:#888"
:""
}"
>
${esc(c.text)}
</span>

</label>

`).join("")
||`
<div class="small muted" style="margin-top:10px">

</div>
`
}

</div>


<div style="margin-top:18px">

<div class="row between">

<b>Notes</b>

<button
class="btn secondary small"
onclick="addTaskNote('${t.id}')"
>
+ Add Note
</button>

</div>

<div
class="card"
style="margin-top:8px;background:#fafaf8;white-space:pre-wrap"
>
${esc(t.notes||"No notes yet.")}
</div>

</div>


<div style="margin-top:18px">

<b>Activity Timeline</b>

<div class="timeline">

${
(t.timeline||[])

<div class="timeline-item">

<b>
${esc(x.text)}
</b>

<div class="small muted">
${esc(x.user||"User")}
·
${formatDateTime(x.date)}
</div>

</div>

`).join("")
||`
<div class="small muted">
No activity yet.
</div>
`
}

</div>

</div>


<div
class="row"
style="justify-content:flex-end"
>

<button
class="btn secondary"
onclick="openTask('${t.id}')"
>
Edit Task
</button>

</div>

</div>

</div>

`;
