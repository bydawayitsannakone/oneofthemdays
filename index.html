<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nona Costex Staff Portal</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --green:#16823a;
  --green-dark:#10652d;
  --green-light:#e8f5ec;
  --green-soft:#f3faf5;
  --border:#e2e8e4;
  --text:#172019;
  --muted:#718078;
  --bg:#f7f9f7;
  --white:#fff;
  --danger:#c0392b;
  --shadow:0 4px 20px rgba(0,0,0,.05);
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  font-family:Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input,
textarea,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

/* =========================
   LOGIN
========================= */

.login-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
  background:linear-gradient(135deg,#f3faf5,#fff);
}

.login-card{
  width:100%;
  max-width:420px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:38px;
  box-shadow:var(--shadow);
}

.logo{
  font-size:26px;
  font-weight:700;
  color:var(--green);
  margin-bottom:5px;
}

.login-card h1{
  margin:0 0 8px;
  font-size:25px;
}

.login-card p{
  color:var(--muted);
  margin:0 0 28px;
}

/* =========================
   LAYOUT
========================= */

.app{
  display:flex;
  min-height:100vh;
}

.sidebar{
  width:245px;
  background:#fff;
  border-right:1px solid var(--border);
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  overflow-y:auto;
  z-index:20;
}

.brand{
  padding:25px 22px 20px;
  border-bottom:1px solid var(--border);
}

.brand-title{
  color:var(--green);
  font-weight:700;
  font-size:21px;
}

.brand-sub{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.nav{
  padding:18px 12px;
}

.nav-section{
  font-size:11px;
  color:#9aa59e;
  text-transform:uppercase;
  letter-spacing:.08em;
  margin:18px 10px 8px;
}

.nav button{
  width:100%;
  border:0;
  background:transparent;
  text-align:left;
  padding:11px 12px;
  border-radius:9px;
  margin-bottom:3px;
  color:#46524a;
  font-size:14px;
  transition:.15s;
}

.nav button:hover{
  background:var(--green-light);
  color:var(--green-dark);
}

.nav button.active{
  background:var(--green-light);
  color:var(--green-dark);
  font-weight:600;
}

.nav-icon{
  display:inline-block;
  width:25px;
}

.main{
  margin-left:245px;
  width:calc(100% - 245px);
  min-height:100vh;
}

.topbar{
  height:68px;
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:10;
}

.topbar-title{
  font-size:18px;
  font-weight:600;
}

.top-actions{
  display:flex;
  gap:10px;
  align-items:center;
}

.content{
  padding:28px;
  max-width:1500px;
  margin:auto;
}

/* =========================
   BUTTONS
========================= */

.btn{
  border:0;
  background:var(--green);
  color:white;
  padding:10px 16px;
  border-radius:8px;
  font-size:13px;
  font-weight:600;
  transition:.15s;
}

.btn:hover{
  background:var(--green-dark);
}

.btn.secondary{
  background:#eef5f0;
  color:var(--green-dark);
}

.btn.secondary:hover{
  background:#dfeee4;
}

.btn.danger{
  background:#fff0ee;
  color:var(--danger);
}

.btn.danger:hover{
  background:#ffe1dc;
}

.btn.small{
  padding:7px 11px;
  font-size:12px;
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

/* =========================
   CARDS
========================= */

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  padding:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.025);
}

.grid{
  display:grid;
  gap:18px;
}

.grid-2{
  grid-template-columns:repeat(2,minmax(0,1fr));
}

.grid-3{
  grid-template-columns:repeat(3,minmax(0,1fr));
}

.grid-4{
  grid-template-columns:repeat(4,minmax(0,1fr));
}

.page-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
  gap:15px;
}

.page-head h1{
  margin:0;
  font-size:24px;
}

.page-head p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:13px;
}

.stat{
  padding:20px;
}

.stat-label{
  color:var(--muted);
  font-size:12px;
  margin-bottom:10px;
}

.stat-value{
  font-size:27px;
  font-weight:700;
}

.stat-icon{
  float:right;
  width:38px;
  height:38px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--green-light);
  color:var(--green);
}

/* =========================
   FORMS
========================= */

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  font-size:12px;
  font-weight:600;
  margin-bottom:7px;
  color:#48534d;
}

.input,
textarea,
select{
  width:100%;
  border:1px solid var(--border);
  border-radius:8px;
  padding:11px 12px;
  outline:none;
  background:#fff;
  font-size:13px;
}

.input:focus,
textarea:focus,
select:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(22,130,58,.08);
}

textarea{
  min-height:100px;
  resize:vertical;
}

/* =========================
   TABLE
========================= */

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

th{
  text-align:left;
  background:#f7faf8;
  color:#69756d;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.04em;
}

th,td{
  padding:13px 12px;
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}

tr:hover td{
  background:#fbfdfb;
}

/* =========================
   BADGES
========================= */

.badge{
  display:inline-flex;
  align-items:center;
  padding:5px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:600;
  background:#eef3ef;
  color:#536057;
}

.badge.green{
  background:var(--green-light);
  color:var(--green-dark);
}

.badge.red{
  background:#fff0ee;
  color:var(--danger);
}

.badge.yellow{
  background:#fff7df;
  color:#987000;
}

/* =========================
   PROGRESS
========================= */

.progress{
  height:8px;
  background:#edf1ee;
  border-radius:99px;
  overflow:hidden;
}

.progress i{
  display:block;
  height:100%;
  background:var(--green);
  border-radius:99px;
}

/* =========================
   TASKS
========================= */

.task-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.task-item{
  padding:14px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#fff;
  cursor:pointer;
}

.task-item:hover{
  border-color:#bdd9c5;
}

.task-title{
  font-weight:600;
  font-size:14px;
}

.task-meta{
  color:var(--muted);
  font-size:11px;
  margin-top:7px;
}

/* =========================
   CHAT
========================= */

.chat-layout{
  display:grid;
  grid-template-columns:280px 1fr;
  height:calc(100vh - 124px);
  min-height:550px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
}

.chat-sidebar{
  border-right:1px solid var(--border);
  overflow-y:auto;
}

.chat-sidebar-head{
  padding:15px;
  border-bottom:1px solid var(--border);
}

.chat-list{
  padding:8px;
}

.chat-item{
  padding:12px;
  border-radius:9px;
  cursor:pointer;
  margin-bottom:3px;
}

.chat-item:hover,
.chat-item.active{
  background:var(--green-light);
}

.chat-item-title{
  font-weight:600;
  font-size:13px;
}

.chat-item-sub{
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}

.chat-main{
  display:flex;
  flex-direction:column;
  min-width:0;
}

.chat-header{
  padding:15px 18px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.chat-messages{
  flex:1;
  overflow-y:auto;
  padding:20px;
  background:#fbfcfb;
}

.message{
  margin-bottom:13px;
  max-width:70%;
}

.message.mine{
  margin-left:auto;
}

.message-name{
  font-size:10px;
  color:var(--muted);
  margin-bottom:4px;
}

.message-bubble{
  display:inline-block;
  padding:10px 12px;
  border-radius:11px;
  background:#fff;
  border:1px solid var(--border);
  font-size:13px;
}

.message.mine .message-bubble{
  background:var(--green);
  border-color:var(--green);
  color:#fff;
}

.message-time{
  font-size:9px;
  color:#9aa39e;
  margin-top:4px;
}

.chat-input{
  border-top:1px solid var(--border);
  padding:12px;
  display:flex;
  gap:8px;
}

.chat-input input{
  flex:1;
}

/* =========================
   ATTENDANCE
========================= */

.attendance-clock{
  text-align:center;
  padding:30px;
}

.clock-time{
  font-size:38px;
  font-weight:700;
  color:var(--green);
}

.clock-date{
  color:var(--muted);
  margin-top:5px;
}

.attendance-status{
  padding:20px;
  border-radius:12px;
  background:var(--green-soft);
  border:1px solid #d9ebde;
}

.attendance-status h3{
  margin:0 0 6px;
}

.attendance-time{
  font-size:25px;
  font-weight:700;
  color:var(--green);
}

/* =========================
   CALENDAR
========================= */

.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  border-top:1px solid var(--border);
  border-left:1px solid var(--border);
}

.calendar-day{
  min-height:100px;
  background:#fff;
  border-right:1px solid var(--border);
  border-bottom:1px solid var(--border);
  padding:9px;
}

.calendar-day strong{
  font-size:12px;
}

.calendar-event{
  margin-top:7px;
  padding:5px;
  background:var(--green-light);
  color:var(--green-dark);
  border-radius:5px;
  font-size:10px;
}

/* =========================
   MODAL
========================= */

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(20,30,23,.35);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px;
}

.modal{
  width:100%;
  max-width:560px;
  background:#fff;
  border-radius:15px;
  padding:23px;
  box-shadow:0 20px 60px rgba(0,0,0,.18);
  max-height:90vh;
  overflow:auto;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-head h2{
  margin:0;
  font-size:18px;
}

.close{
  border:0;
  background:transparent;
  font-size:22px;
  color:#7b857f;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:20px;
}

/* =========================
   PROFILE
========================= */

.profile-avatar{
  width:80px;
  height:80px;
  border-radius:50%;
  background:var(--green-light);
  color:var(--green-dark);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:700;
  margin-bottom:15px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){
  .sidebar{
    width:200px;
  }

  .main{
    margin-left:200px;
    width:calc(100% - 200px);
  }

  .grid-4{
    grid-template-columns:repeat(2,1fr);
  }

  .grid-3{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:700px){
  .sidebar{
    display:none;
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .content{
    padding:18px;
  }

  .grid-2,
  .grid-3,
  .grid-4{
    grid-template-columns:1fr;
  }

  .chat-layout{
    grid-template-columns:1fr;
  }

  .chat-sidebar{
    display:none;
  }
}
</style>
</head>

<body>

<div id="app"></div>
<div id="modalRoot"></div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://jccryyxdxykomwsivtjy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_XgF6_KZZxFzxrAqM0E3bEA_Qs2f-HxM";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   STATE
========================================================= */

const S = {
  page:"dashboard",
  user:null,
  profile:null,
  profiles:[],
  channels:[],
  conversations:[],
  conversationMembers:[],
  messages:[],
  notifications:[],
  docs:[],
  channel:null,
  conversation:null,
  sidebar:true,
  modal:null,
  chatSearch:"",
  taskSearch:"",
  taskFilter:"all",
  pendingFile:null
};


/* =========================================================
   HELPERS
========================================================= */

function esc(value){
  if(value === null || value === undefined) return "";
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function me(){
  return S.user?.id || null;
}

function today(){
  return new Date().toISOString().slice(0,10);
}

function nowTime(){
  return new Date().toLocaleTimeString("en-MY",{
    hour:"2-digit",
    minute:"2-digit"
  });
}

function formatDate(d){
  if(!d) return "-";

  return new Date(d).toLocaleDateString("en-MY",{
    day:"2-digit",
    month:"short",
    year:"numeric"
  });
}

function initials(name){
  if(!name) return "?";

  return name
    .split(" ")
    .filter(Boolean)
    .slice(0,2)
    .map(x=>x[0])
    .join("")
    .toUpperCase();
}

function nameOf(p){
  return p?.full_name ||
         p?.name ||
         p?.email ||
         "Unknown";
}

function currentProfile(){
  return S.profile || {};
}

function notify(msg){
  alert(msg);
}


/* =========================================================
   AUTH
========================================================= */

async function login(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if(!email || !password){
    notify("Please enter email and password.");
    return;
  }

  const {data,error} =
    await db.auth.signInWithPassword({
      email,
      password
    });

  if(error){
    notify(error.message);
    return;
  }

  S.user = data.user;

  await initData();

  render();
}

async function logout(){

  await db.auth.signOut();

  S.user = null;
  S.profile = null;
  S.page = "dashboard";

  render();
}

function loginPage(){

  return `
    <div class="login-wrap">

      <div class="login-card">

        <div class="logo">Nona Costex</div>

        <h1>Staff Portal</h1>

        <p>
          Sign in to access your staff workspace.
        </p>

        <div class="form-group">
          <label>Email</label>
          <input
            id="loginEmail"
            class="input"
            type="email"
            placeholder="your@email.com"
          >
        </div>

        <div class="form-group">
          <label>Password</label>
          <input
            id="loginPassword"
            class="input"
            type="password"
            placeholder="••••••••"
            onkeydown="if(event.key==='Enter') login()"
          >
        </div>

        <button
          class="btn"
          style="width:100%"
          onclick="login()"
        >
          Sign In
        </button>

      </div>

    </div>
  `;
}


/* =========================================================
   SUPABASE DATA
========================================================= */

async function profile(){

  if(!me()) return;

  let {data,error} =
    await db
      .from("profiles")
      .select("*")
      .eq("id",me())
      .maybeSingle();

  if(error){
    console.error(error);
    return;
  }

  if(!data){

    const {data:newProfile,error:createError} =
      await db
        .from("profiles")
        .insert({
          id:me(),
          email:S.user.email,
          full_name:S.user.email?.split("@")[0] || "Staff",
          role:"staff"
        })
        .select()
        .single();

    if(createError){
      console.error(createError);
      return;
    }

    data = newProfile;
  }

  S.profile = data;
}

async function profiles(){

  const {data,error} =
    await db
      .from("profiles")
      .select("*")
      .order("full_name");

  if(!error){
    S.profiles = data || [];
  }
}

async function channels(){

  const {data,error} =
    await db
      .from("channels")
      .select("*")
      .order("created_at");

  if(!error){
    S.channels = data || [];
  }
}

async function notifs(){

  if(!me()) return;

  const {data,error} =
    await db
      .from("communication_notifications")
      .select("*")
      .eq("user_id",me())
      .order("created_at",{ascending:false});

  if(!error){
    S.notifications = data || [];
  }
}

async function docs(){

  const {data,error} =
    await db
      .from("knowledge_documents")
      .select("*")
      .order("created_at",{ascending:false});

  if(!error){
    S.docs = data || [];
  }
}


/* =========================================================
   INITIALISE
========================================================= */

async function initData(){

  await profile();
  await profiles();
  await channels();
  await notifs();
  await docs();
  await loadConversations();
}

async function init(){

  const {
    data:{
      session
    }
  } = await db.auth.getSession();

  if(session){

    S.user = session.user;

    await initData();
  }

  render();
}

db.auth.onAuthStateChange(
  async (_event,session)=>{

    if(session && !S.user){

      S.user = session.user;

      await initData();

      render();

    }else if(!session){

      S.user = null;

      render();
    }
  }
);


/* =========================================================
   NAVIGATION
========================================================= */

function nav(page,label,icon){

  return `
    <button
      class="${S.page===page ? "active":""}"
      onclick="go('${page}')"
    >
      <span class="nav-icon">${icon}</span>
      ${label}
    </button>
  `;
}

function go(page){

  S.page = page;

  if(page !== "communication"){
    S.conversation = null;
    S.channel = null;
  }

  render();
}


/* =========================================================
   APP SHELL
========================================================= */

function shell(){

  const profileName =
    nameOf(currentProfile());

  return `
    <div class="app">

      <aside class="sidebar">

        <div class="brand">
          <div class="brand-title">
            Nona Costex
          </div>

          <div class="brand-sub">
            Staff Portal
          </div>
        </div>

        <div class="nav">

          <div class="nav-section">
            Workspace
          </div>

          ${nav("dashboard","Dashboard","⌂")}
          ${nav("attendance","Attendance","◷")}
          ${nav("tasks","Tasks","✓")}
          ${nav("logs","Work Logs","▤")}

          <div class="nav-section">
            Communication
          </div>

          ${nav("communication","Communication","◉")}
          ${nav("knowledge","Knowledge Hub","▧")}
          ${nav("calendar","Calendar","□")}

          <div class="nav-section">
            Management
          </div>

          ${nav("staff","Staff","♙")}
          ${nav("analytics","Analytics","◒")}
          ${nav("data","Data & Backup","◫")}

          <div class="nav-section">
            Account
          </div>

          ${nav("profile","My Profile","○")}

          <button onclick="logout()">
            <span class="nav-icon">↪</span>
            Logout
          </button>

        </div>

      </aside>


      <main class="main">

        <header class="topbar">

          <div class="topbar-title">
            ${pageTitle()}
          </div>

          <div class="top-actions">

            <button
              class="btn secondary small"
              onclick="notifications()"
            >
              🔔
              ${S.notifications.filter(n=>!n.read_at).length || ""}
            </button>

            <button
              class="btn small"
              onclick="go('profile')"
            >
              ${esc(profileName)}
            </button>

          </div>

        </header>

        <section class="content">

          ${page()}

        </section>

      </main>

    </div>
  `;
}

function pageTitle(){

  const titles = {
    dashboard:"Dashboard",
    attendance:"Attendance",
    tasks:"Tasks",

function attendanceCheckIn(){

    getAttendance() || {};

  if(record.checkIn){
    notify("You have already checked in.");

  record.checkIn = nowTime();

  saveAttendance(record);

  render();
}

function attendanceCheckOut(){

  const record =
    getAttendance() || {};

  if(!record.checkIn){
    notify("Please check in first.");
    return;
  }

  if(record.checkOut){
    notify("You have already checked out.");
    return;
  }

  record.checkOut = nowTime();

  saveAttendance(record);

  render();
}

function openTask(id=null){

  const tasks = getTasks();

  const task =
    id
    ? tasks.find(t=>t.id===id)
    : null;

  modal(`
    <div class="modal-head">
      <h2>${task ? "Edit Task" : "New Task"}</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <div class="form-group">
      <label>Task Title</label>
      <input
        id="taskTitle"
        class="input"
        value="${esc(task?.title || "")}"
      >
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea id="taskDescription">${esc(task?.description || "")}</textarea>
    </div>

    <div class="grid grid-2">

      <div class="form-group">
        <label>Status</label>

        <select id="taskStatus" class="input">

          <option
            ${task?.status==="Pending" || !task ? "selected":""}
          >
            Pending
          </option>

          <option
            ${task?.status==="In Progress" ? "selected":""}
          >
            In Progress
          </option>

          <option
            ${task?.status==="Completed" ? "selected":""}
          >
            Completed
          </option>

        </select>
      </div>

      <div class="form-group">
        <label>Due Date</label>

        <input
          id="taskDue"
          class="input"
          type="date"
          value="${esc(task?.due || "")}"
        >
      </div>

    </div>

    <div class="modal-actions">

      ${
        task
        ?
        `
          <button
            class="btn danger"
            onclick="deleteTask(${task.id})"
          >
            Delete
          </button>
        `
        :
        ""
      }

      <button
        class="btn"
        onclick="saveTask(${id || "null"})"
      >
        Save
      </button>

    </div>
  `);
}

function saveTask(id){

  const tasks = getTasks();

  const data = {
    id:id || Date.now(),
    title:document.getElementById("taskTitle").value,
    description:document.getElementById("taskDescription").value,
    status:document.getElementById("taskStatus").value,
    due:document.getElementById("taskDue").value,
    created_at:new Date().toISOString()
  };

  if(!data.title.trim()){
    notify("Please enter a task title.");
    return;
  }

  const index =
    tasks.findIndex(t=>t.id===id);

  if(index >= 0){
    tasks[index] = data;
  }else{
    tasks.push(data);
  }

  setTasks(tasks);

  closeModal();
  render();
}

function deleteTask(id){

  if(!confirm("Delete this task?")) return;

  const tasks =
    getTasks().filter(t=>t.id!==id);

  setTasks(tasks);

  closeModal();
  render();
}

   COMMUNICATION
========================================================= */

async function loadConversations(){

  if(!me()) return;

  const {data,error} =
    await db
      .from("conversation_members")
      .select(`
        conversation_id,
        role,
        conversations(*)
      `)
      .eq("user_id",me());

  if(error){
    console.error(error);
    return;
  }

  S.conversations =
    (data || [])
      .map(x=>({
        ...x.conversations,
        member_role:x.role
      }))
      .filter(Boolean);
}

async function loadConversationMembers(id){

  const {data,error} =
    await db
      .from("conversation_members")
      .select("*")
      .eq("conversation_id",id);

  if(!error){
    S.conversationMembers = data || [];
  }
}

async function loadMessages(){

  if(!S.conversation && !S.channel){
    S.messages = [];
    return;
  }

  let query =
    db
      .from("messages")
      .select("*")
      .order("created_at");

  if(S.conversation){

    query =
      query.eq(
        "conversation_id",
        S.conversation.id
      );

  }else if(S.channel){

    query =
      query.eq(
        "channel_id",
        S.channel.id
      );
  }

  const {data,error} =
    await query;

  if(!error){
    S.messages = data || [];
  }
}

function memberName(id){

  const p =
    S.profiles.find(x=>x.id===id);

  return nameOf(p);
}

function isGroup(c){

  return c?.type === "group";
}

async function selectConversationById(id){

  const c =
    S.conversations.find(x=>x.id===id);

  if(!c) return;

  S.conversation = c;
  S.channel = null;

  await loadConversationMembers(c.id);
  await loadMessages();

  render();
}

async function selectChannelById(id){

  const c =
    S.channels.find(x=>x.id===id);

  if(!c) return;

  S.channel = c;
  S.conversation = null;

  await loadMessages();

  render();
}

async function direct(targetId){

  if(!targetId || targetId===me()) return;

  const {data:mine} =
    await db
      .from("conversation_members")
      .select("conversation_id")
      .eq("user_id",me());

  const myIds =
    (mine || [])
      .map(x=>x.conversation_id);

  if(myIds.length){

    const {data:members} =
      await db
        .from("conversation_members")
        .select("*")
        .in("conversation_id",myIds);

    const grouped = {};

    (members || []).forEach(m=>{

      grouped[m.conversation_id] =
        grouped[m.conversation_id] || [];

      grouped[m.conversation_id].push(m.user_id);
    });

    for(const id of Object.keys(grouped)){

      const users =
        grouped[id];

      const c =
        S.conversations.find(x=>x.id===id);

      if(
        c &&
        c.type==="direct" &&
        users.length===2 &&
        users.includes(targetId) &&
        users.includes(me())
      ){

        await selectConversationById(id);
        return;
      }
    }
  }

  const {
    data:c,
    error
  } =
    await db
      .from("conversations")
      .insert({
        type:"direct",
        created_by:me()
      })
      .select()
      .single();

  if(error){
    notify(error.message);
    return;
  }

  await db
    .from("conversation_members")
    .insert([
      {
        conversation_id:c.id,
        user_id:me(),
        role:"admin"
      },
      {
        conversation_id:c.id,
        user_id:targetId,
        role:"member"
      }
    ]);

  await loadConversations();

  await selectConversationById(c.id);
}

async function createGroup(){

  const name =
    document
      .getElementById("groupName")
      .value
      .trim();

  if(!name){
    notify("Please enter a group name.");
    return;
  }

  const members =
    [...document.querySelectorAll(".groupMember:checked")]
      .map(x=>x.value);

  const {
    data:c,
    error
  } =
    await db
      .from("conversations")
      .insert({
        name,
        type:"group",
        created_by:me()
      })
      .select()
      .single();

  if(error){
    notify(error.message);
    return;
  }

  const rows = [
    {
      conversation_id:c.id,
      user_id:me(),
      role:"admin"
    }
  ];

  members.forEach(id=>{

    rows.push({

async function removeMember(userId){

      .from("conversations")
      .update({name})

async function leaveGroup(){

  if(!confirm("Leave this group?")){
    return;
  }

  const members =
    S.conversationMembers
      .filter(m=>m.user_id!==me());

  const mine =
    S.conversationMembers
      .find(m=>m.user_id===me());

  if(mine?.role==="admin" && members.length){

    await db
      .from("conversation_members")
      .update({role:"admin"})
      .eq(
        "conversation_id",
        S.conversation.id
      )
      .eq(
        "user_id",
        members[0].user_id
      );
  }

  const result =
    await db
      .from("conversation_members")
      .delete()
      .eq(
        "conversation_id",
        S.conversation.id
      )
      .eq(
        "user_id",
        me()
      );

  if(result.error){
    notify(result.error.message);
    return;
  }

  S.conversation = null;

  await loadConversations();

  closeModal();

  render();
}

async function send(){

    document.getElementById("chatMessage");

  if(!input) return;

  const text =
    input.value.trim();

  if(!text) return;

  const row = {
    sender_id:me(),
    content:text
  };

  if(S.conversation){
    row.conversation_id =
      S.conversation.id;
  }

  if(S.channel){
    row.channel_id =
      S.channel.id;
  }

  const result =
    await db
      .from("messages")
      .insert(row);

  if(result.error){
    notify(result.error.message);
    return;
  }

  input.value = "";

  await loadMessages();

  render();
}

}

/* =========================================================
   CALENDAR
========================================================= */

function calendar(){

  const date =
    new Date();

  const year =
    date.getFullYear();

  const month =
    date.getMonth();

  const first =
    new Date(year,month,1);

  const last =
    new Date(year,month+1,0);

  const start =
    first.getDay();

  let cells = "";

  for(let i=0;i<start;i++){

    cells += `
      <div class="calendar-day"></div>
    `;
  }

  for(let d=1;d<=last.getDate();d++){

    cells += `
      <div class="calendar-day">

        <strong>${d}</strong>

        ${
          d===date.getDate()
          ?
          `
            <div class="calendar-event">
              Today
            </div>
          `
          :
          ""
        }

      </div>
    `;
  }

  return `

    <div class="page-head">

      <div>

        <h1>Calendar</h1>

        <p>
          ${date.toLocaleDateString("en-MY",{
            month:"long",
            year:"numeric"
          })}
        </p>

      </div>

    </div>


    <div class="card">

      <div class="calendar-grid">

        ${cells}

      </div>

    </div>
  `;
}

        >

function backup(){

  const data = {

    tasks:getTasks(),

    logs:getLogs(),

    attendance:Object.keys(localStorage)
      .filter(k=>
        k.startsWith("nona_attendance_")
      )
      .reduce((o,k)=>{
        o[k]=localStorage.getItem(k);
        return o;
      },{}),

    exported_at:new Date().toISOString()

  };

  const blob =
    new Blob(
      [JSON.stringify(data,null,2)],
      {type:"application/json"}
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href=url;
  a.download=
    `nona-costex-backup-${today()}.json`;

  a.click();

  URL.revokeObjectURL(url);
}

function restore(event){

  const file =
    event.target.files[0];

  if(!file) return;

  const reader =
    new FileReader();

  reader.onload = e=>{

    try{

      const data =
        JSON.parse(e.target.result);

      if(data.tasks){
        setTasks(data.tasks);
      }

      if(data.logs){
        setLogs(data.logs);
      }

      if(data.attendance){

        Object.entries(
          data.attendance
        ).forEach(([key,value])=>{
          localStorage.setItem(key,value);
        });

      }

      notify("Backup restored successfully.");

      render();

    }catch(err){

      notify(
        "Invalid backup file."
      );

    }

  };

  reader.readAsText(file);
}

          style="
            padding:12px;
            border-bottom:1px solid var(--border);
          "
        >

          <strong>
            ${esc(n.title || "Notification")}
          </strong>

          <div
            style="
              color:var(--muted);
              font-size:12px;
              margin-top:4px;
            "
          >
            ${esc(n.message || n.content || "")}
          </div>

        </div>

      `).join("")
      :
      `
        <p style="color:var(--muted)">
          No notifications.
        </p>
      `
    }


    <div class="modal-actions">

      <button
        class="btn secondary"
        onclick="markRead()"
      >
        Mark All Read
      </button>

    </div>

  `);
}

async function markRead(){

  if(!me()) return;

  await db
    .from("communication_notifications")
    .update({
      read_at:new Date().toISOString()
    })
    .eq("user_id",me())
    .is("read_at",null);

  await notifs();

  closeModal();

  render();
}


/* =========================================================
   MODAL
========================================================= */

function modal(content){

  S.modal = true;

  document.getElementById("modalRoot").innerHTML = `

    <div
      class="modal-overlay"
      onclick="
        if(event.target===this) closeModal()
      "
    >

      <div class="modal">

        ${content}

      </div>

    </div>
  `;
}

function closeModal(){

  S.modal = null;

  document.getElementById(
    "modalRoot"
  ).innerHTML = "";
}


/* =========================================================
   LIVE CLOCK
========================================================= */

setInterval(()=>{

  const clock =
    document.getElementById("liveClock");

  if(clock){
    clock.textContent =
      new Date().toLocaleTimeString(
        "en-MY",
        {
          hour:"2-digit",
          minute:"2-digit",
          second:"2-digit"
        }
      );
  }

},1000);


/* =========================================================
   START
========================================================= */

init();

</script>

</body>
</html>
