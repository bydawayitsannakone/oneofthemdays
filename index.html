<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nona Costex Staff Portal</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f5f5f2;
  --card:#ffffff;
  --text:#292b27;
  --muted:#777a72;
  --line:#e5e5df;
  --olive:#73795e;
  --olive-dark:#555b45;
  --olive-soft:#e9eadf;
  --danger:#b85c5c;
  --danger-soft:#f5e4e4;
  --warning:#b18a43;
  --warning-soft:#f6eedb;
  --success:#638267;
  --success-soft:#e4eee5;
  --shadow:0 8px 30px rgba(40,42,35,.06);
}

body{
  font-family:Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* LOGIN */
.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:#f1f2ed;
}

.login-box{
  width:100%;
  max-width:430px;
  background:white;
  border:1px solid var(--line);
  border-radius:22px;
  padding:38px;
  box-shadow:var(--shadow);
}

.brand{
  text-align:center;
  margin-bottom:30px;
}

.brand-mark{
  width:54px;
  height:54px;
  margin:0 auto 16px;
  border-radius:16px;
  background:var(--olive);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:700;
}

.brand h1{
  font-size:23px;
  margin-bottom:7px;
}

.brand p{
  color:var(--muted);
  font-size:13px;
}

.form-group{
  margin-bottom:17px;
}

.form-group label{
  display:block;
  font-size:12px;
  font-weight:600;
  margin-bottom:7px;
  color:#55584f;
}

input,select,textarea{
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  border-radius:10px;
  padding:11px 12px;
  outline:none;
  color:var(--text);
}

input:focus,select:focus,textarea:focus{
  border-color:var(--olive);
  box-shadow:0 0 0 3px rgba(115,121,94,.1);
}

textarea{
  min-height:100px;
  resize:vertical;
}

.primary-btn{
  width:100%;
  border:0;
  border-radius:10px;
  padding:12px;
  background:var(--olive);
  color:white;
  font-weight:600;
}

.primary-btn:hover{
  background:var(--olive-dark);
}

.login-demo{
  margin-top:20px;
  padding:12px;
  background:var(--bg);
  border-radius:10px;
  font-size:11px;
  color:var(--muted);
  line-height:1.7;
}

/* APP */
.app{
  display:flex;
  min-height:100vh;
}

.sidebar{
  width:245px;
  background:#30332c;
  color:white;
  position:fixed;
  top:0;
  bottom:0;
  left:0;
  z-index:50;
  padding:22px 15px;
  overflow-y:auto;
}

.sidebar-brand{
  padding:7px 12px 25px;
}

.sidebar-brand h2{
  font-size:18px;
}

.sidebar-brand p{
  color:#aaaFA4;
  font-size:11px;
  margin-top:4px;
}

.nav-section{
  margin:18px 10px 8px;
  color:#858a80;
  text-transform:uppercase;
  letter-spacing:.08em;
  font-size:9px;
  font-weight:700;
}

.nav-item{
  width:100%;
  border:0;
  background:transparent;
  color:#cdd0c9;
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 12px;
  border-radius:9px;
  margin-bottom:3px;
  text-align:left;
  font-size:12px;
}

.nav-item:hover{
  background:#3b3f36;
  color:white;
}

.nav-item.active{
  background:#73795e;
  color:white;
}

.nav-icon{
  width:18px;
  height:18px;
  flex:none;
}

.logout-btn{
  margin-top:20px;
  color:#d7aaa8;
}

.main{
  margin-left:245px;
  width:calc(100% - 245px);
  min-height:100vh;
}

.topbar{
  height:70px;
  background:white;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:30;
}

.topbar-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.menu-btn{
  display:none;
  border:0;
  background:none;
}

.page-title{
  font-size:17px;
  font-weight:700;
}

.user-area{
  display:flex;
  align-items:center;
  gap:14px;
}

.notification-btn{
  position:relative;
  border:0;
  background:#f4f4f0;
  width:37px;
  height:37px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.notification-count{
  position:absolute;
  top:-3px;
  right:-3px;
  min-width:16px;
  height:16px;
  border-radius:20px;
  background:var(--danger);
  color:white;
  font-size:9px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.user-mini{
  display:flex;
  align-items:center;
  gap:9px;
}

.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  background:var(--olive-soft);
  color:var(--olive-dark);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:700;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.user-mini-text strong{
  display:block;
  font-size:11px;
}

.user-mini-text span{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:2px;
}

.content{
  padding:28px;
  max-width:1500px;
  margin:auto;
}

/* GENERAL */
.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px;
}

.section-head h2{
  font-size:19px;
}

.section-head p{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.action-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid var(--line);
  background:white;
  color:var(--text);
  border-radius:9px;
  padding:9px 13px;
  font-size:11px;
  font-weight:600;
}

.btn:hover{
  background:#f7f7f4;
}

.btn.primary{
  background:var(--olive);
  border-color:var(--olive);
  color:white;
}

.btn.danger{
  background:var(--danger-soft);
  border-color:transparent;
  color:var(--danger);
}

.btn.success{
  background:var(--success-soft);
  border-color:transparent;
  color:var(--success);
}

.btn.small{
  padding:6px 9px;
  font-size:10px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:24px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  box-shadow:var(--shadow);
}

.stat-card{
  padding:18px;
}

.stat-label{
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.05em;
}

.stat-number{
  font-size:25px;
  font-weight:700;
  margin-top:8px;
}

.stat-note{
  color:var(--muted);
  font-size:10px;
  margin-top:5px;
}

.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.card-head{
  padding:17px 18px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.card-head h3{
  font-size:13px;
}

.card-body{
  padding:18px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}

th{
  text-align:left;
  font-size:9px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.05em;
  padding:11px 12px;
  background:#f8f8f5;
  border-bottom:1px solid var(--line);
}

td{
  padding:12px;
  border-bottom:1px solid #eeeeea;
  font-size:11px;
  vertical-align:middle;
}

tr:last-child td{
  border-bottom:0;
}

.badge{
  display:inline-flex;
  align-items:center;
  border-radius:20px;
  padding:5px 8px;
  font-size:9px;
  font-weight:700;
}

.badge.pending{
  background:#f0f0ec;
  color:#777a70;
}

.badge.progress{
  background:var(--warning-soft);
  color:var(--warning);
}

.badge.completed{
  background:var(--success-soft);
  color:var(--success);
}

.badge.overdue{
  background:var(--danger-soft);
  color:var(--danger);
}

.badge.active{
  background:var(--success-soft);
  color:var(--success);
}

.badge.inactive{
  background:#eeeeeb;
  color:#777;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:35px 15px;
  font-size:12px;
}

/* PROGRESS */
.progress-line{
  height:7px;
  background:#ecece7;
  border-radius:20px;
  overflow:hidden;
  margin-top:8px;
}

.progress-fill{
  height:100%;
  background:var(--olive);
  border-radius:20px;
}

.performance-row{
  margin-bottom:17px;
}

.performance-top{
  display:flex;
  justify-content:space-between;
  font-size:11px;
}

.performance-top span:last-child{
  color:var(--muted);
}

/* PROFILE */
.profile-header{
  padding:25px;
  display:flex;
  gap:22px;
  align-items:center;
}

.profile-avatar{
  width:88px;
  height:88px;
  border-radius:20px;
  background:var(--olive-soft);
  color:var(--olive-dark);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  font-weight:700;
  overflow:hidden;
  flex:none;
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-name{
  font-size:21px;
  font-weight:700;
}

.profile-role{
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}

.profile-code{
  display:inline-block;
  margin-top:10px;
  background:var(--olive-soft);
  color:var(--olive-dark);
  border-radius:7px;
  padding:5px 8px;
  font-size:9px;
  font-weight:700;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1px;
  background:var(--line);
  border:1px solid var(--line);
  border-radius:13px;
  overflow:hidden;
}

.info-item{
  background:white;
  padding:14px;
}

.info-item label{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-bottom:5px;
  text-transform:uppercase;
}

.info-item strong{
  font-size:11px;
  font-weight:600;
}

/* WORKLOAD */
.workload{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:9px;
  font-weight:700;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
}

.dot.green{background:#6f9877}
.dot.yellow{background:#c09b50}
.dot.red{background:#bd6767}

/* SEARCH */
.toolbar{
  display:flex;
  gap:9px;
  margin-bottom:15px;
  flex-wrap:wrap;
}

.toolbar input{
  max-width:300px;
}

/* MODAL */
.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(20,22,18,.45);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal{
  width:100%;
  max-width:620px;
  max-height:90vh;
  overflow-y:auto;
  background:white;
  border-radius:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.18);
}

.modal-head{
  padding:18px 20px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-head h3{
  font-size:15px;
}

.close-btn{
  width:30px;
  height:30px;
  border:0;
  background:#f2f2ee;
  border-radius:8px;
}

.modal-body{
  padding:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.full{
  grid-column:1/-1;
}

.modal-foot{
  padding:15px 20px;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

/* STAFF PROFILE DETAIL */
.detail-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  margin-bottom:20px;
}

.performance-cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:18px;
}

.performance-card{
  padding:15px;
  background:#f8f8f5;
  border-radius:11px;
}

.performance-card small{
  display:block;
  color:var(--muted);
  font-size:9px;
}

.performance-card strong{
  display:block;
  margin-top:5px;
  font-size:20px;
}

/* MOBILE */
.mobile-overlay{
  display:none;
}

@media(max-width:1000px){
  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .grid-2{
    grid-template-columns:1fr;
  }

  .info-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .performance-cards{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:750px){
  .sidebar{
    transform:translateX(-100%);
    transition:.25s ease;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .mobile-overlay.show{
    display:block;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    z-index:40;
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .menu-btn{
    display:flex;
    width:34px;
    height:34px;
    align-items:center;
    justify-content:center;
  }

  .topbar{
    padding:0 15px;
  }

  .user-mini-text{
    display:none;
  }

  .content{
    padding:18px 14px;
  }

  .cards{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .stat-card{
    padding:14px;
  }

  .stat-number{
    font-size:21px;
  }

  .section-head{
    align-items:flex-start;
  }

  .profile-header{
    padding:18px;
    align-items:flex-start;
  }

  .info-grid{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }
}

@media(max-width:480px){
  .cards{
    grid-template-columns:1fr 1fr;
  }

  .page-title{
    font-size:15px;
  }

  .notification-btn{
    width:34px;
    height:34px;
  }

  .performance-cards{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-page">
  <div class="login-box">

    <div class="brand">
      <div class="brand-mark">N</div>
      <h1>Nona Costex</h1>
      <p>Staff Portal</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <input id="loginUsername" type="text" placeholder="Enter username" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="Enter password" required>
      </div>

      <button class="primary-btn" type="submit">Login</button>
    </form>

    <div class="login-demo">
      <strong>Demo Login</strong><br>
      Staff: Atikah / NC001<br>
      Admin: Admin / ADMIN001
    </div>

  </div>
</div>


<!-- APP -->
<div id="app" class="app hidden">

  <div id="mobileOverlay" class="mobile-overlay" onclick="closeSidebar()"></div>

  <aside id="sidebar" class="sidebar">

    <div class="sidebar-brand">
      <h2>Nona Costex</h2>
      <p>Staff Portal</p>
    </div>

    <div class="nav-section">Main</div>

    <button class="nav-item active" data-page="dashboard" onclick="showPage('dashboard')">
      <span class="nav-icon">⌂</span>
      Dashboard
    </button>

    <button class="nav-item" data-page="tasks" onclick="showPage('tasks')">
      <span class="nav-icon">✓</span>
      <span id="tasksNavLabel">My Tasks</span>
    </button>

    <button class="nav-item" data-page="worklogs" onclick="showPage('worklogs')">
      <span class="nav-icon">▤</span>
      Work Logs
    </button>

    <button class="nav-item" data-page="attendance" onclick="showPage('attendance')">
      <span class="nav-icon">◷</span>
      Attendance
    </button>

    <button class="nav-item" data-page="leave" onclick="showPage('leave')">
      <span class="nav-icon">▱</span>
      Leave
    </button>

    <button class="nav-item" data-page="schedule" onclick="showPage('schedule')">
      <span class="nav-icon">□</span>
      Schedule
    </button>

    <button class="nav-item" data-page="announcements" onclick="showPage('announcements')">
      <span class="nav-icon">!</span>
      Announcements
    </button>

    <button class="nav-item" data-page="notifications" onclick="showPage('notifications')">
      <span class="nav-icon">◉</span>
      Notifications
    </button>

    <div id="adminNav" class="hidden">
      <div class="nav-section">Admin</div>

      <button class="nav-item" data-page="staff" onclick="showPage('staff')">
        <span class="nav-icon">♙</span>
        Staff Management
      </button>

      <button class="nav-item" data-page="analytics" onclick="showPage('analytics')">
        <span class="nav-icon">▥</span>
        Analytics
      </button>

      <button class="nav-item" data-page="activity" onclick="showPage('activity')">
        <span class="nav-icon">↻</span>
        Activity History
      </button>
    </div>

    <div class="nav-section">Account</div>

    <button class="nav-item" data-page="profile" onclick="showPage('profile')">
      <span class="nav-icon">♙</span>
      My Profile
    </button>

    <button class="nav-item logout-btn" onclick="logout()">
      <span class="nav-icon">↪</span>
      Logout
    </button>

  </aside>


  <main class="main">

    <header class="topbar">

      <div class="topbar-left">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div id="pageTitle" class="page-title">Dashboard</div>
      </div>

      <div class="user-area">

        <button class="notification-btn" onclick="showPage('notifications')">
          <span>◉</span>
          <span id="notificationCount" class="notification-count hidden">0</span>
        </button>

        <div class="user-mini">
          <div id="topAvatar" class="avatar">A</div>
          <div class="user-mini-text">
            <strong id="topName">Atikah</strong>
            <span id="topRole">Staff</span>
          </div>
        </div>

      </div>

    </header>

    <div id="content" class="content"></div>

  </main>

</div>


<!-- MODAL -->
<div id="modalContainer"></div>


<script>

/* =========================================================
   DATA
========================================================= */

const KEYS = {
  logs: "nona_logs",
  leaves: "nona_leaves",
  attendance: "nona_attendance",
  staff: "nona_staff",
  schedules: "nona_schedules",
  announcements: "nona_announcements",
  notifications: "nona_notifications",
  activity: "nona_activity",
  photos: "nona_photo_"
};

let currentUser = null;
let currentPage = "dashboard";

function getData(key){
  try{
    return JSON.parse(localStorage.getItem(key) || "[]");
  }catch(e){
    return [];
  }
}

function setData(key,data){
  localStorage.setItem(key,JSON.stringify(data));
}

function uid(prefix="id"){
  return prefix + "_" + Date.now() + "_" + Math.random().toString(36).slice(2,7);
}

function todayISO(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================================================
   DEFAULT DATA
========================================================= */

function initData(){

  if(!localStorage.getItem(KEYS.staff)){
    setData(KEYS.staff,[
      {
        id:"NC001",
        code:"NC001",
        name:"Atikah",
        department:"Digital",
        position:"Live Host Online & Offline",
        status:"Active",
        joiningDate:"2026-09-02",
        email:"",
        phone:"",
        manager:""

document.getElementById("loginForm").addEventListener("submit",function(e){
  e.preventDefault();

  const username = document.getElementById("loginUsername").value.trim();
  const password = document.getElementById("loginPassword").value.trim();

  const staff = getData(KEYS.staff);

  if(username.toLowerCase()==="admin" && password==="ADMIN001"){
    currentUser = {
      role:"admin",
      staffId:"admin",
      name:"Admin"
    };

    addActivity("Login","Admin logged into the portal","admin");
    startApp();
    return;
  }

  const found = staff.find(s =>
    s.name.toLowerCase()===username.toLowerCase() &&
    s.code===password
  );

  if(found){
    currentUser = {
      role:"staff",
      staffId:found.id || found.code,
      name:found.name
    };

    addActivity("Login",`${found.name} logged into the portal`,found.id);
    startApp();
    return;
  }

  alert("Invalid username or password.");
});


function startApp(){

  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  setupUserUI();
  generateOverdueNotifications();
  updateNotificationCount();
  showPage("dashboard");
}


function logout(){

  if(currentUser){
    addActivity("Logout",`${currentUser.name} logged out`,currentUser.staffId);
  }

  currentUser = null;

  document.getElementById("app").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");

  document.getElementById("loginUsername").value="";
  document.getElementById("loginPassword").value="";
}


function setupUserUI(){

  const admin = currentUser.role==="admin";

  document.getElementById("adminNav").classList.toggle("hidden",!admin);
  document.getElementById("tasksNavLabel").textContent = admin ? "Tasks" : "My Tasks";

  document.getElementById("topName").textContent = currentUser.name;
  document.getElementById("topRole").textContent = admin ? "Administrator" : "Staff";

  const staff = getCurrentStaff();

  if(staff){
    document.getElementById("topAvatar").innerHTML =
      getPhotoHTML(staff, "top-avatar");
  }else{
    document.getElementById("topAvatar").textContent = "A";
  }
}


/* =========================================================
   STAFF HELPERS
========================================================= */

function getStaff(){
  return getData(KEYS.staff);
}

function getCurrentStaff(){
  if(!currentUser || currentUser.role==="admin") return null;
  return getStaff().find(s => (s.id || s.code)===currentUser.staffId);
}

function getStaffById(id){
  if(id==="admin") return {name:"Admin",code:"ADMIN"};
  return getStaff().find(s => (s.id || s.code)===id);
}

function getPhoto(staffId){
  return localStorage.getItem(KEYS.photos + staffId) || "";
}

function getInitials(name){
  return String(name || "?")
    .split(" ")
    .map(x=>x[0])
    .join("")
    .slice(0,2)
    .toUpperCase();
}

function getPhotoHTML(staff,cls=""){
  const photo = getPhoto(staff.id || staff.code);

  if(photo){
    return `<img class="${cls}" src="${photo}" alt="">`;
  }

  return `<span>${escapeHTML(getInitials(staff.name))}</span>`;
}

function addActivity(action,detail,staffId=null){

  const data = getData(KEYS.activity);

  data.unshift({
    id:uid("act"),
    action,
    detail,
    staffId:staffId || currentUser?.staffId || "admin",
    date:new Date().toISOString()
  });

  setData(KEYS.activity,data.slice(0,500));
}

========================================================= */

function addNotification(staffId,title,message,type="info"){

  const data = getData(KEYS.notifications);

  data.unshift({
    id:uid("not"),
    staffId,
    title,
    message,
    type,
    date:new Date().toISOString(),
    read:false
  });

  setData(KEYS.notifications,data.slice(0,300));
  updateNotificationCount();
}


function updateNotificationCount(){

  if(!currentUser) return;

  const notifications = getData(KEYS.notifications)
    .filter(n => n.staffId===currentUser.staffId && !n.read);

  const el = document.getElementById("notificationCount");

  el.textContent = notifications.length;
  el.classList.toggle("hidden",notifications.length===0);
}


function markNotificationRead(id){

  const data = getData(KEYS.notifications);

  const item = data.find(n=>n.id===id);

  if(item){
    item.read=true;
  }

  setData(KEYS.notifications,data);
  updateNotificationCount();
  showPage("notifications");
}


function markAllRead(){

  const data = getData(KEYS.notifications);

  data.forEach(n=>{
    if(n.staffId===currentUser.staffId){
      n.read=true;
    }
  });

  setData(KEYS.notifications,data);
  updateNotificationCount();
  renderNotifications();
}

   TASK HELPERS
========================================================= */

function getTasks(){

  const logs = getData(KEYS.logs);

  if(currentUser?.role==="staff"){
    return logs.filter(x=>x.staffId===currentUser.staffId);
  }

  return logs;
}

function isOverdue(task){

  if(task.status==="Completed") return false;

  if(!task.dueDate) return false;

  const due = new Date(
    `${task.dueDate}T${task.dueTime || "23:59"}`
  );

  return new Date() > due;
}

function statusBadge(status,overdue=false){

  if(overdue){
    return `<span class="badge overdue">Overdue</span>`;
  }

  if(status==="Completed"){
    return `<span class="badge completed">Completed</span>`;
  }

  if(status==="In Progress"){
    return `<span class="badge progress">In Progress</span>`;
  }

  return `<span class="badge pending">Pending</span>`;
}

function workloadInfo(count){

  if(count>=8){
    return {
      label:"High workload",
      cls:"red"
    };
  }

  if(count>=4){
    return {
      label:"Moderate workload",
      cls:"yellow"
    };
  }

  return {
    label:"Light workload",
    cls:"green"
  };
}

function showPage(page){

  if(!currentUser) return;

  if(
    ["staff","analytics","activity"].includes(page) &&
    currentUser.role!=="admin"
  ){
    page="dashboard";
  }

  currentPage=page;

  document.getElementById("pageTitle").textContent =
    pageTitles[page] || "Dashboard";

  document.querySelectorAll(".nav-item").forEach(btn=>{
    btn.classList.toggle(
      "active",
      btn.dataset.page===page
    );
  });

  closeSidebar();

  switch(page){
    case "dashboard": renderDashboard(); break;
    case "tasks": renderTasks(); break;
    case "worklogs": renderWorkLogs(); break;
    case "attendance": renderAttendance(); break;
    case "leave": renderLeave(); break;
    case "schedule": renderSchedule(); break;
    case "announcements": renderAnnouncements(); break;
    case "notifications": renderNotifications(); break;
    case "staff": renderStaffManagement(); break;
    case "analytics": renderAnalytics(); break;
    case "activity": renderActivity(); break;
    case "profile": renderProfile(); break;
    default: renderDashboard();
  }
}

function filterTaskTable(){

  const q = document.getElementById("taskSearch").value.toLowerCase();
  const status = document.getElementById("taskStatusFilter").value;

  document.querySelectorAll("#taskTable tbody tr").forEach(row=>{

    const text = row.dataset.search || "";
    const rowStatus = row.dataset.status || "";

    const matchText = text.includes(q);
    const matchStatus = !status || rowStatus===status;

    row.style.display =
      matchText && matchStatus ? "" : "none";
  });
}

function saveTask(id){

  const tasks = getData(KEYS.logs);

  const staffId = document.getElementById("taskStaff").value;

  if(!staffId){
    alert("Please select staff.");
    return;
  }

  const data = {
    title:document.getElementById("taskTitle").value.trim(),
    staffId,
    priority:document.getElementById("taskPriority").value,
    workDate:document.getElementById("taskWorkDate").value,
    dueDate:document.getElementById("taskDueDate").value,
    dueTime:document.getElementById("taskDueTime").value,
    status:document.getElementById("taskStatus").value,
    description:document.getElementById("taskDescription").value.trim(),
    assignedBy:"Admin"
  };

  if(id){

    const task = tasks.find(t=>t.id===id);

    if(task){
      Object.assign(task,data);
    }

    addActivity(
      "Task Updated",
      `${data.title} was updated`,
      staffId
    );

  }else{

    const newTask = {
      id:uid("task"),
      ...data
    };

    tasks.unshift(newTask);

    const staff = getStaffById(staffId);

    addNotification(
      staffId,
      "New task assigned",
      `You have been assigned: ${data.title}`,
      "task"
    );

    addActivity(
      "Task Assigned",
      `${data.title} assigned to ${staff?.name || staffId}`,
      staffId
    );
  }

  setData(KEYS.logs,tasks);

  closeModal();
  renderTasks();
}


function deleteTask(id){

  if(!confirm("Delete this task?")) return;

  let tasks = getData(KEYS.logs);
  const task = tasks.find(t=>t.id===id);

  tasks = tasks.filter(t=>t.id!==id);

  setData(KEYS.logs,tasks);

  addActivity(
    "Task Deleted",
    `${task?.title || "Task"} was deleted`,
    task?.staffId || "admin"
  );

  renderTasks();
}


function openTaskStatusModal(id){

  const tasks = getData(KEYS.logs);

  openModal(

function filterLogs(){

  const q=document.getElementById("logSearch").value.toLowerCase();
  const status=document.getElementById("logStatus").value;

  document.querySelectorAll("#logsTable tbody tr").forEach(row=>{

    const text=row.dataset.search||"";
    const rowStatus=row.dataset.status||"";

    row.style.display =
      text.includes(q) &&
      (!status || rowStatus===status)
      ? ""
      : "none";
  });
}

function clockIn(){

  const data=getData(KEYS.attendance);

  let record=data.find(a=>
    a.staffId===currentUser.staffId &&
    a.date===todayISO()
  );

  if(record){
    alert("You have already clocked in today.");
    return;
  }

  record={
    id:uid("att"),
    staffId:currentUser.staffId,
    date:todayISO(),
    clockIn:new Date().toLocaleTimeString([],{
      hour:"2-digit",
      minute:"2-digit"
    }),
    clockOut:""
  };

  data.unshift(record);
  setData(KEYS.attendance,data);

  addActivity(
    "Clock In",
    `${currentUser.name} clocked in`,
    currentUser.staffId
  );

  renderAttendance();
}


function clockOut(){

  const data=getData(KEYS.attendance);

  const record=data.find(a=>
    a.staffId===currentUser.staffId &&
    a.date===todayISO()
  );

  if(!record){
    alert("Please clock in first.");
    return;
  }

  if(record.clockOut){
    alert("You have already clocked out.");
    return;
  }

  record.clockOut=new Date().toLocaleTimeString([],{
    hour:"2-digit",
    minute:"2-digit"
  });

  setData(KEYS.attendance,data);

  addActivity(
    "Clock Out",
    `${currentUser.name} clocked out`,
    currentUser.staffId
  );

  renderAttendance();
}

function filterStaff(){

  const q=document.getElementById("staffSearch").value.toLowerCase();
  const dept=document.getElementById("staffDeptFilter").value;
  const status=document.getElementById("staffStatusFilter").value;

  document.querySelectorAll("#staffTable tbody tr").forEach(row=>{

    const search=row.dataset.search||"";
    const rowDept=row.dataset.dept||"";
    const rowStatus=row.dataset.status||"";

    row.style.display =
      search.includes(q) &&
      (!dept || rowDept===dept) &&
      (!status || rowStatus===status)
      ? ""
      : "none";
  });
}

async function saveStaff(id){

  const staff=getStaff();

  const name=document.getElementById("staffName").value.trim();
  const code=document.getElementById("staffCode").value.trim();

  if(!name || !code){
    alert("Name and staff code are required.");
    return;
  }

  if(
    staff.some(s=>
      s.code.toLowerCase()===code.toLowerCase() &&
      (s.id||s.code)!==id
    )
  ){
    alert("Staff code already exists.");
    return;
  }

  const data={
    name,
    code,
    department:document.getElementById("staffDepartment").value.trim(),
    position:document.getElementById("staffPosition").value.trim(),
    status:document.getElementById("staffStatus").value,
    joiningDate:document.getElementById("staffJoining").value,
    email:document.getElementById("staffEmail").value.trim(),
    phone:document.getElementById("staffPhone").value.trim(),
    manager:document.getElementById("staffManager").value.trim()
  };

  let staffId=id;

  if(id){

    const item=staff.find(s=>(s.id||s.code)===id);

    if(item){

      const oldCode=item.code;

      Object.assign(item,data);

      staffId=item.id||item.code;

      if(oldCode!==item.code){
        const photo=getPhoto(oldCode);

        if(photo){
          localStorage.setItem(
            KEYS.photos+item.code,
            photo
          );

          localStorage.removeItem(
            KEYS.photos+oldCode
          );
        }
      }
    }

    addActivity(
      "Staff Profile Updated",
      `${name}'s profile was updated`,
      staffId
    );

  }else{

    const newStaff={
      id:code,
      ...data
    };

    staff.unshift(newStaff);

    staffId=code;

    addActivity(
      "Staff Added",
      `${name} was added to staff management`,
      staffId
    );
  }

  const file=document.getElementById("staffPhoto").files[0];

  if(file){

    const photo=await fileToBase64(file);

    localStorage.setItem(
      KEYS.photos+staffId,
      photo
    );

  }

  setData(KEYS.staff,staff);

  closeModal();
  renderStaffManagement();
}

      <div class="card stat-card">
        <div class="stat-label">Attendance Records</div>
        <div class="stat-number">${attendance.length}</div>
      </div>

      <div class="card stat-card">
        <div class="stat-label">Active Staff</div>
        <div class="stat-number">${staff.filter(s=>s.status==="Active").length}</div>
      </div>

    </div>

    <div class="card">

      <div class="card-head">
        <h3>Staff Performance Comparison</h3>
      </div>

      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th>Staff</th>
              <th>Total Tasks</th>
              <th>Completed</th>
              <th>In Progress</th>
              <th>Overdue</th>
              <th>Completion Rate</th>
            </tr>
          </thead>

          <tbody>

          ${
            staff.map(s=>{

              const t=logs.filter(l=>l.staffId===(s.id||s.code));

              const done=t.filter(x=>x.status==="Completed").length;
              const progress=t.filter(x=>x.status==="In Progress").length;
              const overdue=t.filter(x=>isOverdue(x)).length;

              const r=t.length
                ? Math.round(done/t.length*100)
                : 0;

              return `
                <tr>

                  <td>
                    <strong>${escapeHTML(s.name)}</strong>
                    <div style="font-size:9px;color:var(--muted)">
                      ${escapeHTML(s.department||"")}
                    </div>
                  </td>

                  <td>${t.length}</td>
                  <td>${done}</td>
                  <td>${progress}</td>
                  <td>${overdue}</td>

                  <td>
                    <strong>${r}%</strong>

                    <div class="progress-line" style="width:100px">
                      <div
                        class="progress-fill"
                        style="width:${r}%"
                      ></div>
                    </div>
                  </td>

                </tr>
              `;

            }).join("")
          }

          </tbody>

        </table>

      </div>

    </div>
  `;
}

/* =========================================================
   MODAL
========================================================= */

function openModal(title,body,onSave){

  const container=document.getElementById("modalContainer");

  container.innerHTML=`

    <div class="modal-backdrop" onclick="backdropClose(event)">

      <div class="modal">

        <div class="modal-head">

          <h3>${escapeHTML(title)}</h3>

          <button class="close-btn" onclick="closeModal()">×</button>

        </div>

        <div class="modal-body">
          ${body}
        </div>

        <div class="modal-foot">

          <button class="btn" onclick="closeModal()">
            Cancel
          </button>

          <button id="modalSaveBtn" class="btn primary">
            Save
          </button>

        </div>

      </div>

    </div>

  `;

  document.getElementById("modalSaveBtn")
    .onclick=onSave;
}


function closeModal(){
  document.getElementById("modalContainer").innerHTML="";
}


function backdropClose(e){

  if(e.target.classList.contains("modal-backdrop")){
    closeModal();
  }
}


/* =========================================================
   FILE
========================================================= */

function fileToBase64(file){

  return new Promise((resolve,reject)=>{

    const reader=new FileReader();

    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;

    reader.readAsDataURL(file);
  });
}


/* =========================================================
   OVERDUE NOTIFICATIONS
========================================================= */

function generateOverdueNotifications(){

  const tasks=getData(KEYS.logs);

  tasks.forEach(task=>{

    if(!isOverdue(task)) return;

    const existing=getData(KEYS.notifications);

    const already=existing.some(n=>
      n.staffId===task.staffId &&
      n.title==="Overdue task" &&
      n.message.includes(task.id)
    );

    if(already) return;

    addNotification(
      task.staffId,
      "Overdue task",
      `${task.title} is overdue. Task ID: ${task.id}`,
      "overdue"
    );

  });
}


/* =========================================================
   EXPORT CSV
========================================================= */

function exportCSV(type){

  let rows=[];
  let filename="";

  if(type==="logs"){

    const data=getData(KEYS.logs);

    rows=[
      ["Staff","Task","Work Date","Due Date","Due Time","Priority","Status","Description"]
    ];

    data.forEach(x=>{
      rows.push([
        getStaffById(x.staffId)?.name||x.staffId,
        x.title,
        x.workDate,
        x.dueDate,
        x.dueTime,
        x.priority,
        x.status,
        x.description
      ]);
    });

    filename="nona_work_logs.csv";
  }

  if(type==="attendance"){

    const data=getData(KEYS.attendance);

    rows=[
      ["Staff","Date","Clock In","Clock Out"]
    ];

    data.forEach(x=>{
      rows.push([
        getStaffById(x.staffId)?.name||x.staffId,
        x.date,
        x.clockIn,
        x.clockOut
      ]);
    });

    filename="nona_attendance.csv";
  }

  if(type==="leaves"){

    const data=getData(KEYS.leaves);

    rows=[
      ["Staff","Leave Type","Start","End","Reason","Status"]
    ];

    data.forEach(x=>{
      rows.push([
        getStaffById(x.staffId)?.name||x.staffId,
        x.type,
        x.start,
        x.end,
        x.reason,
        x.status
      ]);
    });

    filename="nona_leave_requests.csv";
  }

  const csv=rows
    .map(row=>
      row.map(value=>
        `"${String(value??"").replace(/"/g,'""')}"`
      ).join(",")
    )
    .join("\n");

  const blob=new Blob([csv],{
    type:"text/csv;charset=utf-8;"
  });

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;
  a.download=filename;
  a.click();

  URL.revokeObjectURL(url);
}


/* =========================================================
   FORMAT
========================================================= */

function formatDate(date){

  if(!date) return "";

  const d=new Date(date+"T00:00:00");

  if(isNaN(d)) return date;

  return d.toLocaleDateString("en-GB",{
    day:"2-digit",
    month:"short",
    year:"numeric"
  });
}


function formatDateTime(value){

  if(!value) return "";

  const d=new Date(value);

  if(isNaN(d)) return value;

  return d.toLocaleString("en-GB",{
    day:"2-digit",
    month:"short",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}
