<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nona Costex Staff Portal</title>

<style>
*{box-sizing:border-box}
:root{
  --bg:#f5f5f2;
  --card:#fff;
  --text:#252824;
  --muted:#777b75;
  --line:#e5e6e0;
  --accent:#68725f;
  --accent-dark:#4f5848;
  --soft:#edf0e9;
  --danger:#b75d5d;
  --warning:#b58a45;
  --success:#648261;
  --shadow:0 8px 30px rgba(30,35,25,.06);
}
body{
  margin:0;
  font-family:Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* LOGIN */
.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:#f2f3ef;
}
.login-box{
  width:100%;
  max-width:420px;
  background:white;
  border:1px solid var(--line);
  border-radius:20px;
  padding:38px;
  box-shadow:var(--shadow);
}
.login-brand{
  text-align:center;
  margin-bottom:30px;
}
.login-brand .mark{
  width:58px;
  height:58px;
  border-radius:16px;
  background:var(--accent);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 16px;
  font-weight:bold;
  font-size:20px;
}
.login-brand h1{
  margin:0;
  font-size:22px;
}
.login-brand p{
  margin:8px 0 0;
  color:var(--muted);
  font-size:13px;
}
.form-group{margin-bottom:16px}
label{
  display:block;
  font-size:12px;
  font-weight:600;
  margin-bottom:7px;
  color:#50544d;
}
input,select,textarea{
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  border-radius:10px;
  padding:11px 12px;
  color:var(--text);
  outline:none;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--accent);
}
textarea{min-height:100px;resize:vertical}
.btn{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  font-size:13px;
  font-weight:600;
}
.btn-primary{background:var(--accent);color:white}
.btn-primary:hover{background:var(--accent-dark)}
.btn-secondary{background:#eef0eb;color:#4e554a}
.btn-danger{background:#f5e8e8;color:#9c4d4d}
.btn-warning{background:#f6eedf;color:#967238}
.btn-success{background:#e8f0e7;color:#577454}
.btn-light{background:#f6f6f3;color:#5d615a;border:1px solid var(--line)}
.btn-block{width:100%}
.login-error{
  background:#f7e8e8;
  color:#a34f4f;
  padding:10px 12px;
  border-radius:9px;
  font-size:12px;
  margin-bottom:15px;
}

/* APP */
.app{min-height:100vh}
.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:245px;
  background:#fff;
  border-right:1px solid var(--line);
  padding:22px 15px;
  z-index:100;
  overflow-y:auto;
}
.brand{
  padding:4px 10px 25px;
  display:flex;
  align-items:center;
  gap:11px;
}
.brand-mark{
  width:38px;
  height:38px;
  background:var(--accent);
  color:#fff;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:14px;
}
.brand-name{
  font-weight:700;
  font-size:15px;
}
.brand-sub{
  font-size:10px;
  color:var(--muted);
  margin-top:2px;
}
.nav-title{
  font-size:10px;
  color:#9a9d97;
  text-transform:uppercase;
  letter-spacing:.08em;
  padding:10px;
}
.nav-item{
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  border:0;
  background:transparent;
  padding:10px;
  margin:2px 0;
  border-radius:9px;
  color:#666b64;
  text-align:left;
  font-size:13px;
}
.nav-item:hover{background:#f4f5f1}
.nav-item.active{
  background:var(--soft);
  color:var(--accent-dark);
  font-weight:600;
}
.nav-icon{
  width:18px;
  height:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
}
.sidebar-bottom{
  margin-top:25px;
  border-top:1px solid var(--line);
  padding-top:15px;
}
.main{
  margin-left:245px;
  min-height:100vh;
}
.topbar{
  height:68px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:80;
}
.top-title{
  font-size:18px;
  font-weight:700;
}
.top-right{
  display:flex;
  align-items:center;
  gap:12px;
}
.icon-btn{
  width:38px;
  height:38px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:10px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}
.badge-count{
  position:absolute;
  top:-4px;
  right:-4px;
  min-width:17px;
  height:17px;
  padding:0 4px;
  border-radius:99px;
  background:#b75d5d;
  color:#fff;
  font-size:9px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.user-mini{
  display:flex;
  align-items:center;
  gap:9px;
}
.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#dfe4d8;
  color:#4f5848;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:bold;
  overflow:hidden;
}
.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.user-mini-text strong{
  display:block;
  font-size:12px;
}
.user-mini-text span{
  display:block;
  font-size:10px;
  color:var(--muted);
}
.mobile-menu{display:none}
.content{
  padding:28px;
  max-width:1500px;
  margin:auto;
}
.page-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  margin-bottom:22px;
}
.page-head h1{
  margin:0;
  font-size:22px;
}
.page-head p{
  margin:6px 0 0;
  color:var(--muted);
  font-size:12px;
}
.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

/* CARDS */
.grid{
  display:grid;
  gap:15px;
}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:15px;
  padding:18px;
  box-shadow:0 3px 15px rgba(20,25,20,.025);
}
.stat-label{
  color:var(--muted);
  font-size:11px;
  margin-bottom:8px;
}
.stat-value{
  font-size:25px;
  font-weight:700;
}
.stat-small{
  color:var(--muted);
  font-size:10px;
  margin-top:5px;
}
.section{
  margin-top:18px;
}
.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}
.section-title h3{
  font-size:14px;
  margin:0;
}
.table-wrap{
  width:100%;
  overflow-x:auto;
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}
th,td{
  text-align:left;
  padding:12px 10px;
  border-bottom:1px solid var(--line);
  font-size:11px;
}
th{
  color:#777b75;
  font-weight:600;
  background:#fafaf8;
}
td{color:#40443e}
tr:last-child td{border-bottom:0}
.status,.priority{
  display:inline-flex;
  align-items:center;
  border-radius:99px;
  padding:5px 8px;
  font-size:9px;
  font-weight:600;
}
.status-pending{background:#f4eee1;color:#967238}
.status-progress{background:#e9edf3;color:#596b84}
.status-completed{background:#e7f0e5;color:#5d7958}
.status-rejected{background:#f4e7e7;color:#9c5252}
.status-approved{background:#e7f0e5;color:#5d7958}
.status-active{background:#e7f0e5;color:#5d7958}
.status-inactive{background:#eeeeec;color:#777}
.priority-high{background:#f4e5e5;color:#9b4e4e}
.priority-medium{background:#f5eee0;color:#967238}
.priority-low{background:#e9eee7;color:#63745e}
.overdue{
  color:#a54e4e;
  font-weight:600;
}
.empty{
  padding:35px 15px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}
.progress{
  width:100%;
  height:8px;
  background:#eceee9;
  border-radius:99px;
  overflow:hidden;
}
.progress-bar{
  height:100%;
  background:var(--accent);
  border-radius:99px;
}

/* FILTERS */
.filters{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr;
  gap:10px;
  margin-bottom:15px;
}

/* DASHBOARD */
.quick-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
.quick-btn{
  background:#fff;
  border:1px solid var(--line);
  padding:15px;
  border-radius:12px;
  text-align:left;
}
.quick-btn:hover{background:#fafbf8}
.quick-btn strong{
  display:block;
  font-size:12px;
  margin-bottom:4px;
}
.quick-btn span{
  font-size:10px;
  color:var(--muted);
}
.task-mini{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--line);
}
.task-mini:last-child{border-bottom:0}
.task-mini strong{
  display:block;
  font-size:12px;
}
.task-mini span{
  font-size:10px;
  color:var(--muted);
}

/* CALENDAR */
.calendar-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}
.calendar-title{
  font-size:16px;
  font-weight:700;
}
.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
}
.cal-day-name{
  background:#f7f8f5;
  padding:10px 7px;
  font-size:10px;
  color:var(--muted);
  text-align:center;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.cal-cell{
  min-height:110px;
  padding:8px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  background:#fff;
}
.cal-cell:nth-child(7n){border-right:0}
.cal-number{
  font-size:10px;
  color:#777;
  margin-bottom:5px;
}
.cal-today{
  width:22px;
  height:22px;
  border-radius:50%;
  background:var(--accent);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}
.cal-event{
  font-size:8px;
  padding:4px 5px;
  border-radius:5px;
  margin-top:3px;
  background:#edf0e9;
  color:#53604e;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.cal-leave{
  background:#f4e8df;
  color:#936b51;
}

/* PROFILE */
.profile-head{
  display:flex;
  align-items:center;
  gap:18px;
  margin-bottom:20px;
}
.profile-avatar{
  width:78px;
  height:78px;
  border-radius:18px;
  background:#e0e5da;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:20px;
  color:#56604f;
  font-weight:bold;
}
.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.info-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.info-box{
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
}
.info-box small{
  color:var(--muted);
  display:block;
  font-size:9px;
  margin-bottom:4px;
}
.info-box strong{font-size:12px}

/* MODAL */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(30,34,28,.45);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:500;
}
.modal{
  width:100%;
  max-width:650px;
  max-height:90vh;
  overflow-y:auto;
  background:#fff;
  border-radius:17px;
  padding:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.15);
}
.modal.large{max-width:850px}
.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}
.modal-head h2{
  margin:0;
  font-size:17px;
}
.close{
  border:0;
  background:#f2f3ef;
  width:32px;
  height:32px;
  border-radius:8px;
}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.form-full{grid-column:1/-1}
.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px;
}

/* TASK DETAIL */
.detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.detail-item{
  background:#f8f8f6;
  padding:11px;
  border-radius:9px;
}
.detail-item small{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-bottom:4px;
}
.detail-item strong{font-size:11px}
.detail-block{
  margin-top:15px;
}
.detail-block h4{
  margin:0 0 8px;
  font-size:12px;
}
.check-item{
  display:flex;
  gap:8px;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid var(--line);
}
.check-item input{width:auto}
.note{
  background:#f6f7f3;
  padding:10px;
  border-radius:9px;
  font-size:11px;
  margin-bottom:8px;
}
.note-meta{
  font-size:9px;
  color:var(--muted);
  margin-bottom:4px;
}
.timeline{
  border-left:2px solid #e4e7df;
  margin-left:6px;
  padding-left:15px;
}
.timeline-item{
  position:relative;
  padding-bottom:14px;
}
.timeline-item:before{
  content:"";
  position:absolute;
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--accent);
  left:-20px;
  top:4px;
}
.timeline-item strong{
  display:block;
  font-size:10px;
}
.timeline-item span{
  font-size:9px;
  color:var(--muted);
}
.attachment{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  background:#f7f7f4;
  padding:9px;
  border-radius:8px;
  margin-bottom:6px;
  font-size:10px;
}

/* NOTIFICATIONS */
.notification-list{
  display:flex;
  flex-direction:column;
}
.notification{
  padding:14px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  gap:15px;
}
.notification.unread{
  background:#f6f8f3;
}
.notification strong{
  font-size:11px;
}
.notification p{
  font-size:10px;
  color:#676b64;
  margin:5px 0;
}
.notification small{
  color:#999;
  font-size:9px;
}

/* ANALYTICS */
.analytics-number{
  font-size:28px;
  font-weight:700;
}
.chart-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin:10px 0;
}
.chart-name{
  width:120px;
  font-size:10px;
}
.chart-track{
  flex:1;
  height:9px;
  background:#eceee9;
  border-radius:99px;
}
.chart-fill{
  height:100%;
  background:var(--accent);
  border-radius:99px;
}

/* TOAST */
.toast-wrap{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:900;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.toast{
  background:#2f342e;
  color:#fff;
  padding:11px 14px;
  border-radius:10px;
  font-size:11px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
}

/* MOBILE */
@media(max-width:1000px){
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .quick-grid{grid-template-columns:repeat(2,1fr)}
  .filters{grid-template-columns:1fr 1fr}
}
@media(max-width:750px){
  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
    box-shadow:10px 0 30px rgba(0,0,0,.08);
  }
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .mobile-menu{display:flex}
  .topbar{padding:0 15px}
  .top-title{font-size:15px}
  .user-mini-text{display:none}
  .content{padding:18px 14px}
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr}
  .quick-grid{grid-template-columns:1fr 1fr}
  .page-head{flex-direction:column}
  .form-grid,.detail-grid,.info-row{grid-template-columns:1fr}
  .filters{grid-template-columns:1fr}
  .calendar{min-width:650px}
  .calendar-wrap{overflow-x:auto}
  .cal-cell{min-height:85px}
  .modal-overlay{padding:10px}
  .modal{padding:17px}
}
</style>
</head>

<body>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <div class="login-brand">
      <div class="mark">NC</div>
      <h1>Nona Costex Staff Portal</h1>
      <p>Internal Staff Management System</p>
    </div>

    <div id="loginError" class="login-error hidden"></div>

    <div class="form-group">
      <label>Username</label>
      <input id="loginUsername" placeholder="Enter username">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input id="loginPassword" type="password" placeholder="Enter password">
    </div>

    <button class="btn btn-primary btn-block" onclick="login()">Sign In</button>

    <div style="margin-top:18px;text-align:center;color:#999;font-size:10px">
      Staff: Atikah / NC001 &nbsp; • &nbsp; Admin: Admin / ADMIN001
    </div>
  </div>
</div>

<div id="app" class="app hidden">

  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="brand-mark">NC</div>
      <div>
        <div class="brand-name">Nona Costex</div>
        <div class="brand-sub">Staff Portal</div>
      </div>
    </div>

    <div class="nav-title">Main</div>

    <button class="nav-item active" data-page="dashboard" onclick="showPage('dashboard')">
      <span class="nav-icon">⌂</span> Dashboard
    </button>

    <button class="nav-item" data-page="tasks" onclick="showPage('tasks')">
      <span class="nav-icon">✓</span> My Tasks
    </button>

    <button class="nav-item" data-page="worklogs" onclick="showPage('worklogs')">
      <span class="nav-icon">▤</span> Work Logs
    </button>

    <button class="nav-item" data-page="attendance" onclick="showPage('attendance')">
      <span class="nav-icon">◷</span> Attendance
    </button>

    <button class="nav-item" data-page="leave" onclick="showPage('leave')">
      <span class="nav-icon">□</span> Leave
    </button>

    <button class="nav-item" data-page="schedule" onclick="showPage('schedule')">
      <span class="nav-icon">▦</span> Schedule
    </button>

    <button class="nav-item" data-page="announcements" onclick="showPage('announcements')">
      <span class="nav-icon">!</span> Announcements
    </button>

    <div id="adminNav">
      <div class="nav-title">Administration</div>

      <button class="nav-item" data-page="staff" onclick="showPage('staff')">
        <span class="nav-icon">♙</span> Staff Management
      </button>

      <button class="nav-item" data-page="analytics" onclick="showPage('analytics')">
        <span class="nav-icon">▥</span> Analytics
      </button>

      <button class="nav-item" data-page="activity" onclick="showPage('activity')">
        <span class="nav-icon">◉</span> Activity History
      </button>

      <button class="nav-item" data-page="data" onclick="showPage('data')">
        <span class="nav-icon">▣</span> Data Management
      </button>
    </div>

    <div class="nav-title">Account</div>

    <button class="nav-item" data-page="profile" onclick="showPage('profile')">
      <span class="nav-icon">○</span> My Profile
    </button>

    <div class="sidebar-bottom">
      <button class="nav-item" onclick="logout()">
        <span class="nav-icon">↪</span> Logout
      </button>
    </div>
  </aside>

  <main class="main">

function get(key, fallback=[]){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){
    return fallback;
  }
}

function set(key,value){
  localStorage.setItem(key,JSON.stringify(value));
}

function uid(prefix='id'){
  return prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
}

function today(){
  return new Date().toISOString().slice(0,10);
}

function formatDate(date){
  if(!date) return '-';
  const d = new Date(date + 'T00:00:00');
  return d.toLocaleDateString('en-GB',{
    day:'2-digit',
    month:'short',
    year:'numeric'
  });
}

function formatDateTime(date){
  if(!date) return '-';
  const d = new Date(date);
  return d.toLocaleString('en-GB',{
    day:'2-digit',
    month:'short',
    year:'numeric',
    hour:'2-digit',
    minute:'2-digit'
  });
}

function initials(name){
  return (name || '?')
    .split(' ')
    .map(x=>x[0])
    .join('')
    .slice(0,2)
    .toUpperCase();
}

function esc(value){
  return String(value ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

function toast(message){
  const wrap=document.getElementById('toastWrap');
  const el=document.createElement('div');
  el.className='toast';
  el.textContent=message;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(),3000);
}

========================================================= */

function getTasks(){
  return get(K.logs);
}

function isOverdue(task){
  if(task.status==='Completed')return false;
  if(!task.dueDate)return false;

  const due=(task.dueDate+' '+(task.dueTime||'23:59'));
  const now=new Date();

  const d=new Date(due.replace(' ','T'));

  return !isNaN(d.getTime()) && d<now;
}

function taskStatusClass(status){
  if(status==='Completed')return 'status-completed';
  if(status==='In Progress')return 'status-progress';
  return 'status-pending';
}

function priorityClass(priority){
  return 'priority-'+String(priority||'medium').toLowerCase();
}

function getStaffName(id){
  if(id==='admin')return 'Admin';

  const staff=get(K.staff);
  const s=staff.find(x=>x.id===id || x.code===id);

  return s ? s.name : id || '-';
}

function recordTaskHistory(taskId,action,details=''){
  const arr=get(K.taskHistory);

  arr.unshift({
    id:uid('th'),
    taskId,
    action,
    details,
    userId:currentUser?.staffId || 'admin',
    date:new Date().toISOString()
  });

  set(K.taskHistory,arr);
}

function getTaskHistory(taskId){
  return get(K.taskHistory)
    .filter(x=>x.taskId===taskId)
    .sort((a,b)=>new Date(a.date)-new Date(b.date));
}

function taskPage(){

  const search=window.taskSearch||'';
  const filterStatus=window.taskStatusFilter||'All';
  const filterPriority=window.taskPriorityFilter||'All';

  let tasks=getTasks();

  if(currentUser.role!=='admin'){
    tasks=tasks.filter(t=>t.staffId===currentUser.staffId);
  }

  tasks=tasks.filter(t=>{
    const q=search.toLowerCase();

    const matchesSearch=
      !q ||
      t.title.toLowerCase().includes(q) ||
      (t.description||'').toLowerCase().includes(q);

    const matchesStatus=
      filterStatus==='All'||t.status===filterStatus;

    const matchesPriority=
      filterPriority==='All'||t.priority===filterPriority;

    return matchesSearch&&matchesStatus&&matchesPriority;
  });

  tasks.sort((a,b)=>{
    if(a.status==='Completed' && b.status!=='Completed')return 1;
    if(a.status!=='Completed' && b.status==='Completed')return -1;
    return (a.dueDate||'9999').localeCompare(b.dueDate||'9999');
  });

  return `
    <div class="page-head">
      <div>
        <h1>${currentUser.role==='admin'?'Task Management':'My Tasks'}</h1>
        <p>${currentUser.role==='admin'?'Assign and manage staff tasks.':'View and update your assigned tasks.'}</p>
      </div>

      ${
        currentUser.role==='admin'
        ? `<button class="btn btn-primary" onclick="openTaskModal()">+ Assign Task</button>`
        :''
      }
    </div>

    <div class="card">

      <div class="filters">
        <input
          placeholder="Search tasks..."
          value="${esc(search)}"
          oninput="window.taskSearch=this.value;renderCurrentPage()"
        >

        <select onchange="window.taskStatusFilter=this.value;renderCurrentPage()">
          ${['All','Pending','In Progress','Completed'].map(x=>
            `<option ${filterStatus===x?'selected':''}>${x}</option>`
          ).join('')}
        </select>

        <select onchange="window.taskPriorityFilter=this.value;renderCurrentPage()">
          ${['All','High','Medium','Low'].map(x=>
            `<option ${filterPriority===x?'selected':''}>${x}</option>`
          ).join('')}
        </select>

        <button class="btn btn-light" onclick="window.taskSearch='';window.taskStatusFilter='All';window.taskPriorityFilter='All';renderCurrentPage()">Clear</button>
      </div>

      <div class="table-wrap">
        ${
          tasks.length
          ? `
          <table>
            <thead>
              <tr>
                <th>Task</th>
                <th>Assigned To</th>
                <th>Due</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              ${tasks.map(t=>`
                <tr>
                  <td>
                    <strong>${esc(t.title)}</strong>
                    <div style="font-size:9px;color:#999;margin-top:3px">
                      ${esc((t.description||'').slice(0,70))}
                    </div>
                  </td>

                  <td>${esc(getStaffName(t.staffId))}</td>

                  <td class="${isOverdue(t)?'overdue':''}">
                    ${formatDate(t.dueDate)}<br>
                    <span style="font-size:9px">${t.dueTime||''}</span>
                    ${isOverdue(t)?'<br>OVERDUE':''}
                  </td>

                  <td>
                    <span class="priority ${priorityClass(t.priority)}">
                      ${esc(t.priority)}

  const staff=get(K.staff).filter(s=>s.status==='Active');

  document.getElementById('modalRoot').innerHTML=`

          <button class="close" onclick="closeModal()">×</button>
        </div>

        <div class="form-grid">

          <div class="form-group form-full">
            <label>Task Title</label>

          <div class="form-group">

            <select id="taskStaff">

            <label>Work Date</label>
            <input id="taskWorkDate" type="date" value="${task?.workDate||today()}">
          </div>

          <div class="form-group">
            <label>Due Date</label>
            <input id="taskDueDate" type="date" value="${task?.dueDate||today()}">
          </div>

          <div class="form-group">
            <label>Due Time</label>
            <input id="taskDueTime" type="time" value="${task?.dueTime||''}">
          </div>

          <div class="form-group">
            <label>Status</label>
            <select id="taskStatus">
              ${['Pending','In Progress','Completed'].map(x=>
                `<option ${task?.status===x?'selected':''}>${x}</option>`
              ).join('')}

            <textarea id="taskDescription" placeholder="Describe the task...">${esc(task?.description||'')}</textarea>

          <button class="btn btn-light" onclick="closeModal()">Cancel</button>
          ${
            task
            ? `<button class="btn btn-danger" onclick="deleteTask('${task.id}')">Delete</button>`
            :''
          }

            ${task?'Save Changes':'Assign Task'}
          </button>
        </div>
      </div>
    </div>
  `;
}

function saveTask(id){

  const title=document.getElementById('taskTitle').value.trim();

  if(!title){
    toast('Please enter a task title.');
    return;
  }

  const arr=getTasks();

  const data={
    title,
    staffId:document.getElementById('taskStaff').value,
    priority:document.getElementById('taskPriority').value,
    workDate:document.getElementById('taskWorkDate').value,
    dueDate:document.getElementById('taskDueDate').value,
    dueTime:document.getElementById('taskDueTime').value,
    status:document.getElementById('taskStatus').value,
    description:document.getElementById('taskDescription').value.trim()
  };

  if(id){

    const index=arr.findIndex(t=>t.id===id);
    if(index<0)return;

    const old=arr[index];

    arr[index]={
      ...old,
      ...data
    };

    set(K.logs,arr);

    recordTaskHistory(
      id,
      'Task edited',
      'Task details were updated by '+currentUser.name
    );

    addActivity(
      'Edited task',
      'Updated task: '+title,
      currentUser.staffId
    );

    if(old.status!==data.status){
      recordTaskHistory(
        id,
        'Status changed',
        old.status+' → '+data.status
      );

      addNotification(
        data.staffId,
        'Task status updated',
        title+' is now '+data.status,
        'task'
      );
    }

    toast('Task updated.');

  }else{

    const newTask={
      id:uid('task'),
      ...data,
      assignedBy:currentUser.staffId,
      createdAt:new Date().toISOString()
    };

    arr.unshift(newTask);
    set(K.logs,arr);

    recordTaskHistory(
      newTask.id,
      'Task created',
      'Task created by '+currentUser.name
    );

    addActivity(
      'Assigned task',
      'Assigned "'+title+'" to '+getStaffName(data.staffId),
      currentUser.staffId
    );

    addNotification(
      data.staffId,
      'New task assigned',
      title,
      'task'
    );

    toast('Task assigned.');
  }

  closeModal();
  showPage('tasks');
}

function deleteTask(id){

  if(!confirm('Delete this task? This action cannot be undone.'))return;

  const arr=getTasks();
  const task=arr.find(t=>t.id===id);

  set(K.logs,arr.filter(t=>t.id!==id));

  recordTaskHistory(
    id,
    'Task deleted',
    task?.title||''
  );

  addActivity(
    'Deleted task',
    'Deleted task: '+(task?.title||id),
    currentUser.staffId
  );

  closeModal();
  showPage('tasks');
  toast('Task deleted.');
}

function closeModal(){
  document.getElementById('modalRoot').innerHTML='';
  selectedTaskId=null;
}

function changeTaskStatus(id,status){

  const arr=getTasks();
  const task=arr.find(t=>t.id===id);

  if(!task)return;

  const old=task.status;
  task.status=status;

  set(K.logs,arr);

  recordTaskHistory(
    id,
    'Status changed',
    old+' → '+status
  );

  addActivity(
    'Task status changed',
    task.title+' changed to '+status,
    currentUser.staffId
  );

  if(status==='Completed'){
    addNotification(
      'admin',
      'Task completed',
      task.title+' was marked as completed by '+currentUser.name,
      'task'
    );
  }

  toast('Task updated.');
  openTask(id);
}

function addChecklist(id){

  const input=document.getElementById('checkInput');
  const text=input.value.trim();

  if(!text)return;

  const arr=getTasks();
  const task=arr.find(t=>t.id===id);

  if(!task)return;

  task.checklist=task.checklist||[];
  task.checklist.push({
    text,
    done:false
  });

  set(K.logs,arr);

  recordTaskHistory(id,'Checklist updated','Added: '+text);

  openTask(id);
}

function toggleChecklist(id,index){

  const arr=getTasks();
  const task=arr.find(t=>t.id===id);

  if(!task)return;

  task.checklist=task.checklist||[];

  if(!task.checklist[index])return;

  task.checklist[index].done=!task.checklist[index].done;

  set(K.logs,arr);

  recordTaskHistory(
    id,
    'Checklist updated',
    task.checklist[index].done
      ? 'Completed: '+task.checklist[index].text
      : 'Unchecked: '+task.checklist[index].text
  );

  openTask(id);
}

function removeChecklist(id,index){

  const arr=getTasks();
  const task=arr.find(t=>t.id===id);

  if(!task)return;

  const item=task.checklist[index];

  task.checklist.splice(index,1);

  set(K.logs,arr);

  recordTaskHistory(id,'Checklist updated','Removed: '+(item?.text||'item'));

  openTask(id);
}

function addTaskNote(id){

  const input=document.getElementById('taskNote');
  const text=input.value.trim();

  if(!text){
    toast('Please enter a note.');
    return;
  }

  const arr=getTasks();
  const task=arr.find(t=>t.id===id);

  if(!task)return;

  task.notes=task.notes||[];

  task.notes.push({
    id:uid('note'),
    author:currentUser.name,
    authorId:currentUser.staffId,
    text,
    date:new Date().toISOString()
  });

  set(K.logs,arr);

  recordTaskHistory(
    id,
    'Note added',
    currentUser.name+' added a note'
  );

  if(currentUser.role==='staff'){
    addNotification(
      'admin',
      'Task note added',
      currentUser.name+' added a note to '+task.title,
      'task'
    );
  }else{
    addNotification(
      task.staffId,
      'Task note added',
      'Admin added a note to '+task.title,
      'task'
    );
  }

  openTask(id);
}

function attachFile(id){

  const input=document.getElementById('taskAttachment');

  if(!input.files || !input.files[0])return;

  const file=input.files[0];

  if(file.size>3*1024*1024){
    toast('File is too large. Please keep it below 3MB.');
    return;
  }

  const reader=new FileReader();

  reader.onload=function(e){

    const arr=getTasks();
    const task=arr.find(t=>t.id===id);

    if(!task)return;

    task.attachments=task.attachments||[];

    task.attachments.push({
      id:uid('file'),
      name:file.name,
      type:file.type,
      size:file.size,
      data:e.target.result,
      uploadedBy:currentUser.name,
      date:new Date().toISOString()
    });

    set(K.logs,arr);

    recordTaskHistory(
      id,
      'Attachment added',
      file.name
    );

    toast('Attachment added.');
    openTask(id);
  };

  reader.readAsDataURL(file);
}

function removeAttachment(id,index){

  const arr=getTasks();
  const task=arr.find(t=>t.id===id);

  if(!task)return;

  const file=task.attachments[index];

  if(!confirm('Remove this attachment?'))return;

  task.attachments.splice(index,1);

  set(K.logs,arr);

  recordTaskHistory(
    id,
    'Attachment removed',
    file?.name||''
  );

  openTask(id);
}

function filterLogs(){
  const search=(document.getElementById('logSearch')?.value||'').toLowerCase();

  const priority=document.getElementById('logPriority')?.value||'All';

  let logs=get(K.logs)
    .filter(l=>currentUser.role==='admin'||l.staffId===currentUser.staffId)
    .filter(l=>{
      const matchesSearch=
        !search ||
        l.title.toLowerCase().includes(search) ||
        (l.description||'').toLowerCase().includes(search);

      const matchesStatus=status==='All'||l.status===status;
      const matchesPriority=priority==='All'||l.priority===priority;

      return matchesSearch&&matchesStatus&&matchesPriority;
    });

  document.getElementById('logsTable').innerHTML=`
    ${
      logs.length
      ? `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Task</th>

              <th>Date</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Action</th>

            ${logs.map(l=>`

                <td>
                  <span class="status ${taskStatusClass(l.status)}">${esc(l.status)}</span>
                </td>

                <td>
                  <button class="btn btn-light" onclick="openLogModal('${l.id}')">Edit</button>
                  <button class="btn btn-danger" onclick="deleteLog('${l.id}')">Delete</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
      `
      : `<div class="empty">No work logs found.</div>`
    }
  `;
}

function saveLog(id){

    return;
  }

  const arr=get(K.logs);

  const data={
    title,
    staffId:currentUser.role==='admin'
      ? document.getElementById('logStaff').value
      : currentUser.staffId,
    workDate:document.getElementById('logDate').value,
    startTime:document.getElementById('logStart').value,
    endTime:document.getElementById('logEnd').value,
    dueDate:document.getElementById('logDueDate').value,
    dueTime:document.getElementById('logDueTime').value,
    priority:document.getElementById('logPriorityInput').value,
    status:document.getElementById('logStatusInput').value,
    description:document.getElementById('logDescription').value.trim()
  };

  if(id){

    const i=arr.findIndex(x=>x.id===id);

    if(i>=0){
      arr[i]={...arr[i],...data};
    }

  }else{

    arr.unshift({
      id:uid('log'),
      ...data,
      assignedBy:currentUser.role==='admin'?'admin':currentUser.staffId,
      createdAt:new Date().toISOString()
    });
  }

  set(K.logs,arr);

  addActivity(
    id?'Edited work log':'Added work log',
    data.title,
    currentUser.staffId
  );

  closeModal();

function calculateLeave(staffId){

  const leaves=get(K.leaves)
    .filter(l=>l.staffId===staffId);

  const approved=leaves.filter(l=>l.status==='Approved');
  const pending=leaves.filter(l=>l.status==='Pending');
  const rejected=leaves.filter(l=>l.status==='Rejected');

  const approvedDays=approved.reduce((s,l)=>s+(Number(l.days)||0),0);
  const pendingDays=pending.reduce((s,l)=>s+(Number(l.days)||0),0);
  const rejectedDays=rejected.reduce((s,l)=>s+(Number(l.days)||0),0);

  return {
    approved,
    pending,
    rejected,
    approvedDays,
    pendingDays,
    rejectedDays,
    remaining:Math.max(0,14-approvedDays)
  };
}

function calculateLeaveModalDays(){

  const start=document.getElementById('leaveStart').value;
  const end=document.getElementById('leaveEnd').value;

  if(!start||!end)return;

  const a=new Date(start+'T00:00:00');
  const b=new Date(end+'T00:00:00');

  const diff=Math.round((b-a)/86400000)+1;

  document.getElementById('leaveDays').value=diff>0?diff:1;
}

function submitLeave(){

  const start=document.getElementById('leaveStart').value;
  const end=document.getElementById('leaveEnd').value;

  if(end<start){
    toast('End date cannot be before start date.');
    return;
  }

  const days=Number(document.getElementById('leaveDays').value)||1;

  const arr=get(K.leaves);

  const leave={
    id:uid('leave'),
    staffId:currentUser.staffId,
    type:document.getElementById('leaveType').value,
    startDate:start,
    endDate:end,
    days,
    reason:document.getElementById('leaveReason').value.trim(),
    status:'Pending',
    createdAt:new Date().toISOString()
  };

  arr.unshift(leave);
  set(K.leaves,arr);

  addNotification(
    'admin',
    'New leave request',
    currentUser.name+' submitted a leave request.',
    'leave'
  );

  addActivity(
    'Submitted leave request',
    leave.type+' · '+days+' day(s)',
    currentUser.staffId
  );

  closeModal();
  showPage('leave');
  toast('Leave request submitted.');
}

function updateLeave(id,status){

  const arr=get(K.leaves);
  const leave=arr.find(l=>l.id===id);

  if(!leave)return;

  if(status==='Approved'){
    const summary=calculateLeave(leave.staffId);

    if(leave.type==='Annual Leave' &&
       summary.approvedDays+Number(leave.days)>14){

      alert('This approval would exceed the 14-day annual leave allowance.');
      return;
    }
  }

  leave.status=status;
  leave.reviewedBy=currentUser.staffId;
  leave.reviewedAt=new Date().toISOString();

  set(K.leaves,arr);

  addNotification(
    leave.staffId,
    'Leave request '+status.toLowerCase(),
    'Your '+leave.type+' request has been '+status.toLowerCase()+'.',
    'leave'
  );

  addActivity(
    'Leave request '+status,
    getStaffName(leave.staffId)+' · '+leave.type,
    currentUser.staffId
  );

  showPage('leave');
  toast('Leave request updated.');
}

========================================================= */

function leaveCalendarMini(leaves){

  const year=calendarDate.getFullYear();
  const month=calendarDate.getMonth();

  const first=new Date(year,month,1);
  const last=new Date(year,month+1,0);

  const startDay=first.getDay();
  const days=last.getDate();

  let html=`
    <div class="calendar-head">
      <button class="btn btn-light" onclick="changeCalendarMonth(-1)">‹</button>
      <div class="calendar-title">
        ${first.toLocaleDateString('en-US',{month:'long',year:'numeric'})}
      </div>
      <button class="btn btn-light" onclick="changeCalendarMonth(1)">›</button>
    </div>

    <div class="calendar-wrap">
      <div class="calendar">
        ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat']
          .map(x=>`<div class="cal-day-name">${x}</div>`).join('')}
  `;

  for(let i=0;i<startDay;i++){
    html+=`<div class="cal-cell"></div>`;
  }

  for(let d=1;d<=days;d++){

    const date=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

    const isToday=date===today();

    const dayLeaves=leaves.filter(l=>
      l.status==='Approved' &&
      l.startDate<=date &&
      l.endDate>=date
    );

    const daySchedules=get(K.schedules).filter(s=>s.date===date);

    html+=`
      <div class="cal-cell">

        <div class="cal-number ${isToday?'cal-today':''}">
          ${d}
        </div>

        ${dayLeaves.map(l=>`
          <div class="cal-event cal-leave">
            Leave · ${esc(getStaffName(l.staffId))}
          </div>
        `).join('')}

        ${daySchedules.map(s=>`
          <div class="cal-event">
            ${esc(s.title)}
          </div>
        `).join('')}

      </div>
    `;
  }

  html+=`
      </div>
    </div>
  `;

  return html;
}

function changeCalendarMonth(delta){
  calendarDate.setMonth(calendarDate.getMonth()+delta);
  renderCurrentPage();
}

function scheduleCalendar(){

  const year=calendarDate.getFullYear();
  const month=calendarDate.getMonth();

  const first=new Date(year,month,1);
  const last=new Date(year,month+1,0);
  const start=first.getDay();

  let html=`
    <div class="calendar-head">

  `;

  for(let i=0;i<start;i++){
    html+=`<div class="cal-cell"></div>`;
  }

  for(let d=1;d<=last.getDate();d++){

    const date=
      year+'-'+
      String(month+1).padStart(2,'0')+'-'+
      String(d).padStart(2,'0');

    const dayItems=schedules.filter(s=>
      s.date===date &&
      (currentUser.role==='admin'||s.staffId===currentUser.staffId)
    );

    const dayTasks=getTasks().filter(t=>
      t.dueDate===date &&
      (currentUser.role==='admin'||t.staffId===currentUser.staffId)
    );

    html+=`

          </div>
        `).join('')}

      </div>

  }

  html+=`

    </div>
  `;

  return html;
}

function saveStaff(id){

  const name=document.getElementById('staffName').value.trim();
  const code=document.getElementById('staffCode').value.trim();

  if(!name||!code){
    toast('Name and staff code are required.');
    return;
  }

  const arr=get(K.staff);

  const duplicate=arr.some(s=>s.code.toLowerCase()===code.toLowerCase()&&s.id!==id);

  if(duplicate){
    toast('Staff code already exists.');
    return;
  }

  const data={
    name,
    code,
    department:document.getElementById('staffDept').value.trim(),
    position:document.getElementById('staffPosition').value.trim(),
    status:document.getElementById('staffStatus').value,
    joiningDate:document.getElementById('staffJoining').value,
    email:document.getElementById('staffEmail').value.trim(),
    phone:document.getElementById('staffPhone').value.trim()
  };

  if(id){

    const i=arr.findIndex(x=>x.id===id);

    if(i>=0)arr[i]={...arr[i],...data};

  }else{

    arr.push({
      id:code,
      ...data
    });
  }

  set(K.staff,arr);

  addActivity(
    id?'Edited staff':'Added staff',
    name,
    currentUser.staffId
  );

  closeModal();
  showPage('staff');
  toast('Staff record saved.');
}

function deleteStaff(id){

  if(id==='NC001'){
    toast('Demo staff account cannot be deleted.');
    return;
  }

  if(!confirm('Delete this staff record?'))return;

  const arr=get(K.staff);
  const s=arr.find(x=>x.id===id);

  set(K.staff,arr.filter(x=>x.id!==id));

  addActivity(
    'Deleted staff',
    s?.name||id,
    currentUser.staffId
  );

  showPage('staff');
  toast('Staff deleted.');
}

function backupData(){

  const data={
    version:'V20',
    exportedAt:new Date().toISOString(),
    data:{
      logs:get(K.logs),
      leaves:get(K.leaves),
      attendance:get(K.attendance),
      staff:get(K.staff),
      schedules:get(K.schedules),
      announcements:get(K.announcements),
      notifications:get(K.notifications),
      activity:get(K.activity),
      taskHistory:get(K.taskHistory)
    }
  };

  const blob=new Blob(
    [JSON.stringify(data,null,2)],
    {type:'application/json'}
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement('a');
  a.href=url;
  a.download='nona-costex-backup-'+today()+'.json';
  a.click();

  URL.revokeObjectURL(url);

  addActivity(
    'Created backup',
    'Downloaded portal data backup',
    currentUser.staffId
  );

  toast('Backup downloaded.');
}

function restoreData(event){

  const file=event.target.files[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=function(){

    try{

      const json=JSON.parse(reader.result);

      if(!json.data){
        throw new Error('Invalid backup');
      }

      if(!confirm(
        'Restore this backup? Existing portal data will be replaced.'
      ))return;

      Object.entries(json.data).forEach(([key,value])=>{

        const storageKey=K[key];

        if(storageKey){
          set(storageKey,value);
        }
      });

      addActivity(
        'Restored backup',
        'Portal data restored from backup',
        currentUser.staffId
      );

      toast('Data restored. Reloading...');

      setTimeout(()=>location.reload(),1000);

    }catch(e){
      toast('Invalid backup file.');
    }
  };

  reader.readAsText(file);
}

function resetDemoData(){

  if(!confirm(
    'Reset all portal data to demo data? All current data will be deleted.'
  ))return;

  Object.values(K).forEach(key=>{
    if(typeof key==='string' && !key.endsWith('_')){
      localStorage.removeItem(key);
    }
  });

  Object.keys(localStorage)
    .filter(key=>key.startsWith(K.photosPrefix))
    .forEach(key=>localStorage.removeItem(key));

  initData();

  toast('Demo data reset.');

  setTimeout(()=>location.reload(),800);
}

function uploadPhoto(event){

  const file=event.target.files[0];

  if(!file)return;

  if(file.size>2*1024*1024){
    toast('Image is too large. Please use an image below 2MB.');
    return;
  }

  const reader=new FileReader();

  reader.onload=function(e){

    localStorage.setItem(
      K.photosPrefix+currentUser.staffId,
      e.target.result
    );

    document.getElementById('topAvatar').innerHTML=
      `<img src="${e.target.result}">`;

    showPage('profile');

    toast('Profile photo updated.');
  };

  reader.readAsDataURL(file);
}

/* =========================================================
   CSV EXPORT
========================================================= */

function downloadCSV(filename,rows){

  if(!rows.length){
    toast('No data to export.');
    return;
  }

  const headers=Object.keys(rows[0]);

  const csv=[
    headers.join(','),
    ...rows.map(row=>
      headers.map(h=>
        `"${String(row[h]??'').replaceAll('"','""')}"`
      ).join(',')
    )
  ].join('\n');

  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);

  const a=document.createElement('a');
  a.href=url;
  a.download=filename;
  a.click();

  URL.revokeObjectURL(url);
}

function exportCSV(type){

  if(type==='tasks'){

    const rows=get(K.logs).map(t=>({
      Task:t.title,
      Staff:getStaffName(t.staffId),
      WorkDate:t.workDate,
      DueDate:t.dueDate,
      DueTime:t.dueTime,
      Priority:t.priority,
      Status:t.status,
      Description:t.description
    }));

    downloadCSV('nona-costex-tasks.csv',rows);
  }

  if(type==='attendance'){

    const rows=get(K.attendance).map(a=>({
      Date:a.date,
      Staff:getStaffName(a.staffId),
      ClockIn:a.clockIn,
      ClockOut:a.clockOut
    }));

    downloadCSV('nona-costex-attendance.csv',rows);
  }

  if(type==='leave'){

    const rows=get(K.leaves).map(l=>({
      Staff:getStaffName(l.staffId),
      Type:l.type,
      StartDate:l.startDate,
      EndDate:l.endDate,
      Days:l.days,
      Status:l.status,
      Reason:l.reason
    }));

    downloadCSV('nona-costex-leave.csv',rows);
  }

  toast('CSV exported.');
}
