<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nona Costex Staff Portal</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#f4f4f1;
  --card:#ffffff;
  --sidebar:#252923;
  --sidebar2:#30352e;
  --text:#292d28;
  --muted:#777c73;
  --line:#e4e5df;
  --accent:#70795f;
  --accent-dark:#59614c;
  --soft:#eceee8;
  --danger:#b85c5c;
  --warning:#b28a45;
  --success:#648267;
  --info:#657b91;
}

body{
  font-family:Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{display:none!important}

#app{
  min-height:100vh;
}

/* LOGIN */

.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:#eeeee9;
}

.login-box{
  width:100%;
  max-width:420px;
  background:white;
  border:1px solid var(--line);
  border-radius:20px;
  padding:38px;
  box-shadow:0 15px 45px rgba(30,35,28,.08);
}

.logo{
  width:48px;
  height:48px;
  border-radius:14px;
  background:var(--sidebar);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  margin-bottom:20px;
}

.login-box h1{
  font-size:25px;
  margin-bottom:7px;
}

.login-box p{
  color:var(--muted);
  font-size:14px;
  margin-bottom:28px;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:7px;
}

input,select,textarea{
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  color:var(--text);
  border-radius:10px;
  padding:11px 12px;
  outline:none;
}

input:focus,select:focus,textarea:focus{
  border-color:var(--accent);
}

textarea{
  min-height:100px;
  resize:vertical;
}

.btn{
  border:none;
  border-radius:10px;
  padding:10px 15px;
  transition:.2s;
}

.btn-primary{
  background:var(--sidebar);
  color:white;
}

.btn-primary:hover{
  background:#171a17;
}

.btn-secondary{
  background:var(--soft);
  color:var(--text);
}

.btn-danger{
  background:#f6e6e6;
  color:var(--danger);
}

.btn-success{
  background:#e8f0e8;
  color:var(--success);
}

.btn-small{
  padding:7px 10px;
  font-size:12px;
}

.full{
  width:100%;
}

/* LAYOUT */

.layout{
  display:flex;
  min-height:100vh;
}

.sidebar{
  width:245px;
  background:var(--sidebar);
  color:white;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  z-index:100;
  padding:22px 15px;
  display:flex;
  flex-direction:column;
}

.brand{
  padding:8px 10px 25px;
}

.brand h2{
  font-size:18px;
}

.brand span{
  display:block;
  font-size:11px;
  color:#aeb3aa;
  margin-top:4px;
}

.nav-section{
  margin-bottom:20px;
}

.nav-title{
  font-size:10px;
  color:#92988d;
  text-transform:uppercase;
  letter-spacing:1px;
  padding:0 10px 8px;
}

.nav-item{
  width:100%;
  border:none;
  background:transparent;
  color:#d5d8d2;
  text-align:left;
  padding:11px 12px;
  border-radius:9px;
  margin-bottom:3px;
  font-size:13px;
}

.nav-item:hover,
.nav-item.active{
  background:var(--sidebar2);
  color:white;
}

.sidebar-bottom{
  margin-top:auto;
}

.main{
  margin-left:245px;
  width:calc(100% - 245px);
  min-height:100vh;
}

.topbar{
  height:70px;
  background:white;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  position:sticky;
  top:0;
  z-index:50;
}

.topbar-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.menu-btn{
  display:none;
  border:none;
  background:var(--soft);
  width:38px;
  height:38px;
  border-radius:9px;
}

.topbar-title{
  font-size:17px;
  font-weight:600;
}

.user-mini{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:13px;
}

.avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  background:var(--soft);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-weight:600;
  color:var(--accent-dark);
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.content{
  padding:30px;
  max-width:1500px;
  margin:auto;
}

.page-heading{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  margin-bottom:24px;
}

.page-heading h1{
  font-size:25px;
  margin-bottom:6px;
}

.page-heading p{
  color:var(--muted);
  font-size:13px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

/* CARDS */

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:20px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  padding:20px;
}

.stat-label{
  color:var(--muted);
  font-size:12px;
  margin-bottom:10px;
}

.stat-value{
  font-size:27px;
  font-weight:600;
}

.stat-note{
  color:var(--muted);
  font-size:11px;
  margin-top:7px;
}

.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.grid-3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.section-card{
  background:white;
  border:1px solid var(--line);
  border-radius:15px;
  overflow:hidden;
  margin-bottom:18px;
}

.section-head{
  padding:17px 20px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.section-head h3{
  font-size:15px;
}

.section-body{
  padding:20px;
}

/* PROGRESS */

.progress{
  height:8px;
  border-radius:20px;
  background:#e8e9e4;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  background:var(--accent);
  border-radius:20px;
}

/* TABLE */

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th{
  text-align:left;
  font-size:11px;
  color:var(--muted);
  font-weight:600;
  padding:12px 15px;
  background:#fafaf8;
  border-bottom:1px solid var(--line);
}

td{
  padding:13px 15px;
  border-bottom:1px solid var(--line);
  font-size:12px;
}

tr:last-child td{
  border-bottom:none;
}

tr:hover td{
  background:#fafaf8;
}

/* BADGES */

.badge{
  display:inline-flex;
  align-items:center;
  padding:5px 8px;
  border-radius:20px;
  font-size:10px;
  font-weight:600;
}

.badge-pending{
  background:#f3eee1;
  color:#98773a;
}

.badge-progress{
  background:#e7edf3;
  color:#5c7389;
}

.badge-completed{
  background:#e6eee7;
  color:#5d7b62;
}

.badge-active{
  background:#e6eee7;
  color:#5d7b62;
}

.badge-inactive{
  background:#eee;
  color:#777;
}

.badge-overdue{
  background:#f4e5e5;
  color:#aa5a5a;
}

/* ANALYTICS */

.chart-box{
  height:250px;
  display:flex;
  align-items:flex-end;
  gap:10px;
  padding:20px 10px 5px;
}

.chart-bar-wrap{
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  gap:7px;
}

.chart-bar{
  width:100%;
  max-width:42px;
  min-height:3px;
  background:var(--accent);
  border-radius:7px 7px 2px 2px;
  transition:.3s;
}

.chart-label{
  font-size:9px;
  color:var(--muted);
}

.chart-number{
  font-size:10px;
  font-weight:600;
}

.metric{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:13px 0;
  border-bottom:1px solid var(--line);
}

.metric:last-child{
  border-bottom:none;
}

.metric span:first-child{
  font-size:12px;
  color:var(--muted);
}

.metric strong{
  font-size:15px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(20,24,20,.45);
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  background:white;
  width:100%;
  max-width:650px;
  max-height:90vh;
  overflow:auto;
  border-radius:17px;
  padding:25px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-head h3{
  font-size:17px;
}

.close{
  border:none;
  background:var(--soft);
  width:32px;
  height:32px;
  border-radius:8px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.form-grid .full-width{
  grid-column:1/-1;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:20px;
}

/* PROFILE */

.profile-head{
  display:flex;
  gap:20px;
  align-items:center;
}

.profile-photo{
  width:90px;
  height:90px;
  border-radius:18px;
  background:var(--soft);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:26px;
  font-weight:600;
}

.profile-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-info h2{
  font-size:20px;
  margin-bottom:4px;
}

.profile-info p{
  color:var(--muted);
  font-size:12px;
  margin-bottom:3px;
}

.profile-stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-top:20px;
}

.profile-stat{
  padding:13px;
  border:1px solid var(--line);
  border-radius:10px;
}

.profile-stat span{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-bottom:6px;
}

.profile-stat strong{
  font-size:17px;
}

/* FILTER */

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.filters input{
  max-width:230px;
}

.filters select{
  max-width:170px;
}

/* TOAST */

.toast{
  position:fixed;
  right:22px;
  bottom:22px;
  background:var(--sidebar);
  color:white;
  padding:12px 16px;
  border-radius:10px;
  font-size:12px;
  opacity:0;
  transform:translateY(10px);
  pointer-events:none;
  transition:.25s;
  z-index:1000;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

/* EMPTY */

.empty{
  text-align:center;
  padding:35px 15px;
  color:var(--muted);
  font-size:12px;
}

/* RESPONSIVE */

@media(max-width:1000px){
  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .grid-2,
  .grid-3{
    grid-template-columns:1fr;
  }

  .profile-stats{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:760px){
  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .menu-btn{
    display:block;
  }

  .topbar{
    padding:0 17px;
  }

  .content{
    padding:20px 15px;
  }

  .cards{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .card{
    padding:15px;
  }

  .page-heading{
    flex-direction:column;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-grid .full-width{
    grid-column:auto;
  }

  .profile-stats{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:480px){
  .cards{
    grid-template-columns:1fr;
  }

  .profile-head{
    flex-direction:column;
    align-items:flex-start;
  }

  .profile-stats{
    grid-template-columns:1fr 1fr;
  }

  .topbar-title{
    font-size:14px;
  }

  .user-mini span{
    display:none;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<div id="toast" class="toast"></div>

<div id="modal" class="modal">
  <div class="modal-box" id="modalContent"></div>
</div>

<script>

/* =========================================================
   STORAGE
========================================================= */

const KEYS = {
  logs:"nona_logs",
  leaves:"nona_leaves",
  attendance:"nona_attendance",
  staff:"nona_staff",
  schedules:"nona_schedules",
  announcements:"nona_announcements"
};

function getData(key, fallback=[]){
  try{
    const data = JSON.parse(localStorage.getItem(key));
    return Array.isArray(data) ? data : fallback;
  }catch(e){
    return fallback;
  }
}

function saveData(key,data){
  localStorage.setItem(key,JSON.stringify(data));
}

function uid(){
  return Date.now().toString()+Math.random().toString(36).slice(2,8);
}

function esc(value){
  if(value===undefined || value===null) return "";
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* =========================================================
   DEFAULT DATA
========================================================= */

function initData(){

  if(!localStorage.getItem(KEYS.staff)){
    saveData(KEYS.staff,[
      {
        id:"staff1",
        name:"Atikah",
        code:"NC001",
        department:"Digital",
        position:"Live Host Online & Offline",
        status:"Active",
        joining:"2026-09-02",
        email:"",
        phone:""
      },
      {
        id:"staff2",
        name:"Temporary Staff 1",
        code:"NC002",
        department:"Digital",
        position:"Temporary Staff",
        status:"Active",
        joining:"2026-09-02",
        email:"",
        phone:""
      },
      {
        id:"staff3",
        name:"Temporary Staff 2",
        code:"NC003",
        department:"Digital",
        position:"Temporary Staff",
        status:"Active",
        joining:"2026-09-02",
        email:"",
        phone:""
      }
    ]);
  }

  if(!localStorage.getItem(KEYS.logs)){
    saveData(KEYS.logs,[
      {
        id:uid(),
        staffId:"staff1",
        title:"Budget quotation completed and presented to team + Flite product shoot",
        workDate:"2026-09-07",
        startTime:"",
        endTime:"",
        dueDate:"",
        dueTime:"",
        priority:"High",
        status:"Completed",
        description:"Completed budget quotation, presented to team and conducted Flite product shooting."
      },
      {
        id:uid(),
        staffId:"staff1",
        title:"Product shooting + content brainstorming",
        workDate:"2026-09-08",
        startTime:"",
        endTime:"",
        dueDate:"",
        dueTime:"",
        priority:"Medium",
        status:"Completed",
        description:"Continued product shooting and brainstormed social media content ideas."
      },
      {
        id:uid(),
        staffId:"staff1",
        title:"Budget quotation for live setup + social media content shooting",
        workDate:"2026-09-09",
        startTime:"",
        endTime:"",
        dueDate:"",
        dueTime:"",
        priority:"High",
        status:"Completed",
        description:"Presented budget quotation for live setup and shot social media content."
      },
      {
        id:uid(),
        staffId:"staff1",
        title:"Content shooting and video editing",
        workDate:"2026-09-10",
        startTime:"",
        endTime:"",
        dueDate:"",
        dueTime:"",
        priority:"Medium",
        status:"Completed",
        description:"Social media content shooting and video editing."
      }
    ]);
  }

  if(!localStorage.getItem(KEYS.attendance)){
    saveData(KEYS.attendance,[]);
  }

  if(!localStorage.getItem(KEYS.leaves)){
    saveData(KEYS.leaves,[]);
  }

  if(!localStorage.getItem(KEYS.schedules)){
    saveData(KEYS.schedules,[
      {
        id:uid(),
        title:"Content Planning",
        date:"2026-09-15",
        time:"10:00",
        location:"Office"
      },
      {
        id:uid(),
        title:"Product Shooting",
        date:"2026-09-16",
        time:"11:00",
        location:"Studio"
      },
      {
        id:uid(),
        title:"Video Editing",
        date:"2026-09-17",
        time:"14:00",
        location:"Office"
      }
    ]);
  }

  if(!localStorage.getItem(KEYS.announcements)){
    saveData(KEYS.announcements,[
      {
        id:uid(),
        title:"Welcome to Nona Costex Staff Portal",
        text:"Welcome to the staff portal. Please keep your work logs updated.",
        date:"2026-09-15"
      },
      {
        id:uid(),
        title:"Digital Team Content Planning",
        text:"Please update upcoming content and shooting schedules.",
        date:"2026-09-15"
      }
    ]);
  }
}

initData();

/* =========================================================
   SESSION
========================================================= */

let currentUser = null;
let currentPage = "dashboard";

function login(username,password){

  if(username==="Admin" && password==="ADMIN001"){
    currentUser={
      role:"admin",
      name:"Admin",
      code:"ADMIN001"
    };

    renderApp();
    return;
  }

  const staff = getData(KEYS.staff).find(
    s => s.name.toLowerCase()===username.toLowerCase() && s.code===password
  );

  if(staff){
    currentUser={
      role:"staff",
      id:staff.id,
      name:staff.name,
      code:staff.code
    };

    renderApp();
    return;
  }

  showToast("Invalid username or password");
}

function logout(){
  currentUser=null;
  currentPage="dashboard";
  renderLogin();
}

/* =========================================================
   LOGIN
========================================================= */

function renderLogin(){

  document.getElementById("app").innerHTML=`
    <div class="login-screen">
      <div class="login-box">
        <div class="logo">NC</div>

        <h1>Nona Costex</h1>
        <p>Staff Portal</p>

        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>Username</label>
            <input id="loginUsername" required placeholder="Enter username">
          </div>

          <div class="form-group">
            <label>Password / Staff Code</label>
            <input id="loginPassword" type="password" required placeholder="Enter password">
          </div>

          <button class="btn btn-primary full" type="submit">
            Login
          </button>
        </form>

        <div style="margin-top:22px;padding:13px;background:#f7f7f4;border-radius:10px;font-size:11px;color:#777;">
          <strong>Demo Login</strong><br><br>
          Staff: Atikah / NC001<br>
          Admin: Admin / ADMIN001
        </div>
      </div>
    </div>
  `;
}

function handleLogin(e){
  e.preventDefault();

  login(
    document.getElementById("loginUsername").value.trim(),
    document.getElementById("loginPassword").value.trim()
  );
}

/* =========================================================
   APP LAYOUT
========================================================= */

function renderApp(){

  document.getElementById("app").innerHTML=`

    <div class="layout">

      <aside class="sidebar" id="sidebar">

        <div class="brand">
          <h2>Nona Costex</h2>
          <span>Staff Portal</span>
        </div>

        <div id="navigation"></div>

        <div class="sidebar-bottom">
          <button class="nav-item" onclick="logout()">
            ↪ &nbsp; Logout
          </button>
        </div>

      </aside>

      <main class="main">

        <header class="topbar">

          <div class="topbar-left">

            <button class="menu-btn" onclick="toggleSidebar()">
              ☰
            </button>

            <div class="topbar-title" id="topbarTitle">
              Dashboard
            </div>

          </div>

          <div class="user-mini">
            <div class="avatar" id="topAvatar"></div>
            <span id="topUser"></span>
          </div>

        </header>

        <div class="content" id="pageContent"></div>

      </main>

    </div>
  `;

  renderNavigation();
  updateTopbar();
  navigate(currentPage);
}

function renderNavigation(){

  let html="";

  if(currentUser.role==="staff"){

    html=`
      <div class="nav-section">
        <div class="nav-title">Main</div>

        <button class="nav-item" data-page="dashboard" onclick="navigate('dashboard')">
          ▦ &nbsp; Dashboard
        </button>

        <button class="nav-item" data-page="worklogs" onclick="navigate('worklogs')">
          ✓ &nbsp; My Work Log
        </button>

        <button class="nav-item" data-page="attendance" onclick="navigate('attendance')">
          ◷ &nbsp; Attendance
        </button>

        <button class="nav-item" data-page="leave" onclick="navigate('leave')">
          □ &nbsp; Leave

function navigate(page){

  currentPage=page;

  document.querySelectorAll(".nav-item[data-page]").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.page===page);
  });

  const titles={
    dashboard:"Dashboard",
    analytics:"Analytics",
    worklogs:"My Work Log",
    adminlogs:"Work Logs",
    attendance:"Attendance",
    leave:"Leave",
    staff:"Staff Management",
    schedule:"Schedule",
    announcements:"Announcements",
    profile:"My Profile"
  };

  document.getElementById("topbarTitle").textContent=titles[page]||"Dashboard";

  const content=document.getElementById("pageContent");

  if(page==="dashboard"){
    currentUser.role==="admin"
      ? renderAdminDashboard()
      : renderStaffDashboard();
  }

  if(page==="analytics") renderAnalytics();
  if(page==="worklogs") renderStaffLogs();
  if(page==="adminlogs") renderAdminLogs();
  if(page==="attendance") renderAttendance();
  if(page==="leave") renderLeave();
  if(page==="staff") renderStaffManagement();
  if(page==="schedule") renderSchedule();
  if(page==="announcements") renderAnnouncements();
  if(page==="profile") renderProfile();

  if(window.innerWidth<=760){
    document.getElementById("sidebar").classList.remove("open");
  }
}

function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
}

function updateTopbar(){

  const staff = currentUser.role==="staff"

function showToast(message){

function openModal(html){

  document.getElementById("modal").classList.add("show");
}

function closeModal(){
  document.getElementById("modal").classList.remove("show");
}

function formatDate(date){

  if(!date) return "-";

  return new Date(date+"T00:00:00").toLocaleDateString("en-MY",{
    day:"2-digit",
    month:"short",
    year:"numeric"
  });
}

function today(){
  return new Date().toISOString().split("T")[0];
}

function monthName(month){

  return new Date(2026,month,1).toLocaleDateString("en-MY",{
    month:"short"
  });
}

function isOverdue(log){

  if(log.status==="Completed") return false;

  if(!log.dueDate) return false;

  let due=new Date(log.dueDate+"T"+(log.dueTime||"23:59"));

  return due < new Date();
}

function getStats(staffId){

  const logs=getData(KEYS.logs).filter(l=>l.staffId===staffId);

  const completed=logs.filter(l=>l.status==="Completed").length;
  const progress=logs.filter(l=>l.status==="In Progress").length;
  const pending=logs.filter(l=>l.status==="Pending").length;
  const overdue=logs.filter(l=>isOverdue(l)).length;

  const rate=logs.length
    ? Math.round((completed/logs.length)*100)
    : 0;

  return {
    total:logs.length,
    completed,
    progress,
    pending,
    overdue,
    rate
  };
}

function buildMonthlyChart(logs,year){

  const counts=[];

  for(let month=0;month<12;month++){

    const prefix=
      `${year}-${String(month+1).padStart(2,"0")}`;

    const count=logs.filter(
      l=>l.workDate.startsWith(prefix)
    ).length;

    counts.push(count);
  }

  const max=Math.max(...counts,1);

  return counts.map((count,i)=>{

    const height=Math.max(
      4,
      Math.round(count/max*170)
    );

    return `
      <div class="chart-bar-wrap">

        <div class="chart-number">${count}</div>

        <div
          class="chart-bar"
          style="height:${height}px"
          title="${count} task(s)"
        ></div>

        <div class="chart-label">
          ${monthName(i)}
        </div>

      </div>
    `;

  }).join("");
}

function adminLogsTable(logs){

          const s=staff.find(x=>x.id===l.staffId);

          return `

              <td>${esc(s?.name||"Unknown")}</td>

              <td>

function filterAdminLogs(){

  const search=
    document.getElementById("adminLogSearch").value.toLowerCase();

  const status=
    document.getElementById("adminLogStatus").value;

  const staffId=
    document.getElementById("adminLogStaff").value;

  const staff=getData(KEYS.staff);

  const logs=getData(KEYS.logs)
    .filter(l=>{
      const s=staff.find(x=>x.id===l.staffId);

      return (
        l.title.toLowerCase().includes(search) ||
        (s?.name||"").toLowerCase().includes(search)
      );
    })
    .filter(l=>!status || l.status===status)
    .filter(l=>!staffId || l.staffId===staffId)
    .sort((a,b)=>b.workDate.localeCompare(a.workDate));

  document.getElementById("adminLogsTable").innerHTML=
    adminLogsTable(logs);
}

   STATUS
========================================================= */

function statusBadge(status,log){

  if(isOverdue(log)){
    return `<span class="badge badge-overdue">Overdue</span>`;
  }

  if(status==="Completed"){
    return `<span class="badge badge-completed">Completed</span>`;
  }

  if(status==="In Progress"){
    return `<span class="badge badge-progress">In Progress</span>`;
  }

  return `<span class="badge badge-pending">Pending</span>`;
}

            <div class="stat-value">

            </div>
          </div>

            <div class="stat-label">Clock Out</div>

              ${todayRecord?.clockOut||"--:--"}

    }

        ${
          records.length
          ? `

                  <th>Date</th>
                  <th>Staff</th>
                  <th>Clock In</th>
                  <th>Clock Out</th>
                </tr>
              </thead>

              <tbody>

                ${records
                  .sort((a,b)=>b.date.localeCompare(a.date))
                  .map(a=>{

                    const s=staff.find(x=>x.id===a.staffId);

                    return `
                      <tr>
                        <td>${formatDate(a.date)}</td>
                        <td>${esc(s?.name||"Unknown")}</td>
                        <td>${a.clockIn||"-"}</td>
                        <td>${a.clockOut||"-"}</td>
                      </tr>
                    `;

              </tbody>

            </table>
          `
          : `<div class="empty">No attendance records yet.</div>`
        }

      </div>

    </div>
  `;
}

function getTime(){

  return new Date().toLocaleTimeString("en-MY",{
    hour:"2-digit",
    minute:"2-digit",
    hour12:false
  });
}

function clockIn(){

  const attendance=getData(KEYS.attendance);

  const existing=attendance.find(
    a=>a.staffId===currentUser.id && a.date===today()
  );

  if(existing){
    showToast("Already clocked in today");
    return;
  }

  attendance.push({
    id:uid(),
    staffId:currentUser.id,
    date:today(),
    clockIn:getTime(),
    clockOut:""
  });

  saveData(KEYS.attendance,attendance);

  showToast("Clock in recorded");
  renderAttendance();
}

function clockOut(){

  const attendance=getData(KEYS.attendance);

  const existing=attendance.find(
    a=>a.staffId===currentUser.id && a.date===today()
  );

  if(!existing){
    showToast("Please clock in first");
    return;
  }

  if(existing.clockOut){
    showToast("Already clocked out");
    return;
  }

  existing.clockOut=getTime();

  saveData(KEYS.attendance,attendance);

  showToast("Clock out recorded");
  renderAttendance();
}

function changePhoto(e){

  if(!file) return;

  const reader=new FileReader();

  reader.onload=function(){

      "nona_photo_"+currentUser.code,
      reader.result
    );

    showToast("Profile photo updated");

    updateTopbar();
    renderProfile();
  };

  reader.readAsDataURL(file);
}

    title:form.title.value,
    date:form.date.value,
    time:form.time.value,
    location:form.location.value

function deleteSchedule(id){

    .filter(s=>s.id!==id);

}

/* =========================================================
   CSV EXPORT
========================================================= */

function downloadCSV(filename,rows){

  if(!rows.length){
    showToast("No data to export");
    return;
  }

  const headers=Object.keys(rows[0]);

  const csv=[
    headers.join(","),
    ...rows.map(row=>
      headers.map(h=>{
        const value=row[h]??"";
        return `"${String(value).replaceAll('"','""')}"`;
      }).join(",")
    )
  ].join("\n");

  const blob=new Blob(
    ["\ufeff"+csv],
    {type:"text/csv;charset=utf-8;"}
  );

  const url=URL.createObjectURL(blob);

  const link=document.createElement("a");

  link.href=url;
  link.download=filename;

  document.body.appendChild(link);
  link.click();
  link.remove();

  URL.revokeObjectURL(url);

  showToast("CSV exported");
}

function exportLogs(){

  const logs=getData(KEYS.logs);
  const staff=getData(KEYS.staff);

  const rows=logs.map(l=>{

    const s=staff.find(x=>x.id===l.staffId);

    return {
      Date:l.workDate,
      Staff:s?.name||"",
      StaffCode:s?.code||"",
      Task:l.title,
      StartTime:l.startTime,
      EndTime:l.endTime,
      DueDate:l.dueDate,
      DueTime:l.dueTime,
      Priority:l.priority,
      Status:l.status,
      Description:l.description
    };

  });

  downloadCSV(
    "nona-costex-work-logs.csv",
    rows
  );
}
