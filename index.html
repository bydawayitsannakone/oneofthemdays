<style>

body{

textarea{min-height:95px;resize:vertical}

.app{display:flex;min-height:100vh}
.side{

.main{

  top:0;

}
.content{

.brand{

  font-size:19px;

.brand small{

  font-size:11px;

.nav-title{

.nav button{

}
.nav button:hover,

.card{

.grid{display:grid;gap:15px}
.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}

.title{

.btn{

.btn:hover{background:#7f9a58}
.btn.secondary{

  color:#5f7541

.btn.secondary:hover{background:#e1ebd2}
.btn.danger{

.btn.small{

.stat{

.stat span{

}

.pill{

}

.medium{background:#fef3c7;color:#92400e}
.low{background:#edf3e4;color:#5f7541}

.blue{background:#e8f0fb;color:#315b88}
.red{background:#fee2e2;color:#991b1b}
.orange{background:#fff3df;color:#a65d00}

.progress{

}
.progress i{
  display:block;

}

.avatar{

  height:38px;

.small{font-size:12px}

.empty{

table{

}
th,td{

th{

.login{

.loginbox{

}
.error{

.modalbg{

.modal{
  background:#fff;

.toast{

  z-index:200;

/* dashboard */
.hero-card{
  background:linear-gradient(135deg,#f2f6e9,#fff);
  border:1px solid #dfe8d5;
  border-radius:18px;
  padding:22px
}
.mini-icon{
  width:42px;

/* communication */
.chat{

  height:calc(100vh - 125px);

.chatlist{

.chatitem{

.chatitem:hover,

.chatwindow{

}
.chat-header{
  padding:15px;
  border-bottom:1px solid #edf0ed;
  background:#fff

.messages{
  flex:1;
  overflow:auto;
  padding:18px;
  background:#f8faf7
}
.bubble{
  max-width:75%;

  border:1px solid #e4e9e5;
  background:#fff;
  border-radius:14px;

}
.bubble.mine{
  margin-left:auto;
  background:#9fb873;
  color:#fff;
  border-color:#9fb873
}
.meta{
  font-size:10px;
  opacity:.6;
  margin-top:5px
}

/* communication thumbnail */
.comm-preview{
  width:44px;
  height:44px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:#edf3e4;
  color:#5f7541;
  flex:none;
  font-size:19px
}

/* notifications */
.notification-card{
  display:flex;
  gap:12px;
  padding:13px;
  margin-bottom:9px;
  border:1px solid #e4eae5;
  border-radius:13px;
  background:#fbfcfa
}
.notification-card.unread{
  background:#f2f6ea;
  border-color:#dbe6ce
}

/* knowledge */
.knowledge-card{
  display:flex;
  gap:14px;
  padding:15px;
  border:1px solid #e3e9e4;
  border-radius:14px;
  background:#fff
}
.doc-thumb{
  width:55px;
  height:55px;
  border-radius:14px;
  background:#edf3e4;
  color:#5f7541;
  display:grid;
  place-items:center;
  font-size:23px;
  flex:none
}

/* calendar */
.calendar-wrap{
  background:#fff;
  border:1px solid #e2e8e4;
  border-radius:18px;
  overflow:hidden
}
.calendar-head{
  padding:18px;
  border-bottom:1px solid #edf0ed
}
.calendar-week{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  background:#f8faf7;
  border-bottom:1px solid #e5ebe5
}
.calendar-week div{
  padding:10px;
  text-align:center;
  font-size:11px;
  color:#7a847d;
  font-weight:600
}
.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr)
}
.cal-cell{
  min-height:115px;
  border-right:1px solid #edf0ed;
  border-bottom:1px solid #edf0ed;
  padding:9px;
  background:#fff
}
.cal-cell:nth-child(7n){border-right:0}
.cal-cell.muted-day{
  background:#fafbf9;
  color:#aab1ac
}
.cal-cell.today{
  background:#f3f7ed
}
.day-number{
  width:28px;
  height:28px;
  display:grid;
  place-items:center;
  border-radius:50%;
  font-size:12px;
  margin-bottom:5px
}
.today .day-number{
  background:#9fb873;
  color:#fff;
  font-weight:700
}
.cal-event{
  display:block;
  padding:4px 6px;
  border-radius:6px;
  margin-top:4px;
  font-size:10px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis
}
.event-public{
  background:#edf3e4;
  color:#5f7541
}
.event-company{
  background:#e8f0fb;
  color:#315b88
}
.event-other{
  background:#f1eafd;
  color:#7352a5
}

/* mobile */
.mobile{display:none}
.hide{display:flex}

@media(max-width:900px){
  .side{
    transform:translateX(-100%);
    transition:.2s
  }
  .side.open{transform:none}
  .main{margin-left:0}
  .mobile{display:block}
  .hide{display:none}
  .content{padding:15px}
  .four{grid-template-columns:1fr 1fr}
  .three{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .chat{
    grid-template-columns:1fr;
    height:auto
  }
  .chatlist{
    max-height:250px;
    border-right:0;
    border-bottom:1px solid #eee
  }
  .cal-cell{
    min-height:90px;
    padding:5px
  }
  .calendar-week div{padding:7px 2px}
  .cal-event{font-size:9px}
}

@media(max-width:550px){
  .four{grid-template-columns:1fr 1fr}
  .calendar-grid .cal-cell{min-height:72px}
  .day-number{width:24px;height:24px}
}
</style>
</head>

<script>
const SUPABASE_URL='https://jccryyxdxykomwsivtjy.supabase.co';
const SUPABASE_KEY='sb_publishable_XgF6_KZZxFzxrAqM0E3bEA_Qs2f-HxM';

const db=supabase.createClient(

const S={

  user:null,

  messages:[],

  },
  {

    endTime:''
  }
];

const esc=x=>{
  const d=document.createElement('div');
  d.textContent=x??'';
  return d.innerHTML;
};

const av=p=>
  p?.avatar_url||
  'https://ui-avatars.com/api/?name='+
  encodeURIComponent(p?.full_name||'User')+
  '&background=edf3e4&color=5f7541';

const me=()=>S.profile?.id;
const isAdmin=()=>String(S.profile?.role||'').toLowerCase()==='admin';

function saveLocal(){
  localStorage.setItem('nona_v22_tasks',JSON.stringify(tasks));
  localStorage.setItem('nona_v22_logs',JSON.stringify(logs));
}

function toast(x){
  const t=document.getElementById('toast');
  t.textContent=x;
  t.className='toast';
  setTimeout(()=>t.className='',2500);
}

function date(x){
  if(!x)return'';
  return new Date(x+'T00:00:00').toLocaleDateString(
    'en-MY',
    {day:'numeric',month:'short',year:'numeric'}
  );
}

function dateTime(x){
  if(!x)return'';
  return new Date(x).toLocaleString(
    'en-MY',
    {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}
  );
}

function pclass(x){
  return x==='High'?'high':x==='Medium'?'medium':'low';
}

function sclass(x){
  if(x==='Completed')return'green';

  if(x==='On Hold')return'orange';

}

function statusProgress(status){
  if(status==='Completed')return 100;
  if(status==='In Progress')return 50;
  if(status==='On Hold')return 25;
  return 0;
}

/* AUTH */

async function init(){
  const {
    data:{session}
  }=await db.auth.getSession();

  if(session){
    await enter(session.user);
  }else{
    loginPage();
  }

  db.auth.onAuthStateChange(
    async(e,s)=>{
      if(s&&!S.user)await enter(s.user);

      if(!s&&S.user){
        S.user=null;
        S.profile=null;
        loginPage();
      }
    }
  );
}

async function enter(u){
  S.user=u;

  await profile();

  if(!S.profile){
    await db.from('profiles').insert({
      id:u.id,
      staff_code:(u.email||'').includes('admin')?'ADMIN001':'NC001',
      full_name:(u.email||'').includes('admin')?'Admin':'Atikah',
      department:(u.email||'').includes('admin')?'Management':'Digital',
      position:(u.email||'').includes('admin')?
        'Administrator':
        'Live Host Online & Offline',
      role:(u.email||'').includes('admin')?'admin':'staff',
      status:'Active'
    });

    await profile();
  }

  await Promise.all([
    profiles(),
    channels(),
    notifs(),
    docs(),
    loadConversations(),
    loadCalendarEvents()
  ]);

  subscribe();
  render();
}

async function profile(){
  const r=await db
    .from('profiles')
    .select('*')
    .eq('id',S.user.id)
    .maybeSingle();

  if(!r.error)S.profile=r.data;
}

async function profiles(){
  const r=await db
    .from('profiles')
    .select('*')
    .order('full_name');

  if(!r.error)S.profiles=r.data||[];
}

async function channels(){
  const r=await db
    .from('channels')
    .select('*')
    .order('name');

  if(!r.error)S.channels=r.data||[];
}

async function notifs(){
  const r=await db
    .from('communication_notifications')
    .select('*')
    .eq('profile_id',me())
    .order('created_at',{ascending:false})
    .limit(50);

  if(!r.error)S.notifications=r.data||[];
}

async function docs(){
  const r=await db
    .from('knowledge_documents')
    .select('*')
    .order('created_at',{ascending:false});

  if(!r.error)S.docs=r.data||[];
}

async function loadCalendarEvents(){
  const r=await db
    .from('calendar_events')
    .select('*')
    .order('event_date',{ascending:true});

  if(!r.error){
    S.calendarEvents=r.data||[];
  }else{
    S.calendarEvents=[];
  }
}

function subscribe(){
  db.channel('nona-portal')
    .on(
      'postgres_changes',
      {
        event:'*',
        schema:'public',
        table:'messages'
      },
      async()=>{
        if(S.page==='communication'){
          await chatLoad();
          render();
        }
      }
    )
    .on(
      'postgres_changes',
      {
        event:'*',
        schema:'public',
        table:'communication_notifications'
      },
      async()=>{
        await notifs();
        render();
      }
    )
    .on(
      'postgres_changes',
      {
        event:'*',
        schema:'public',
        table:'calendar_events'
      },
      async()=>{
        await loadCalendarEvents();
        if(S.page==='calendar')render();
      }
    )
    .subscribe();
}

/* LOGIN */

function loginPage(err=''){
  document.getElementById('app').innerHTML=`
    <div class="login">
      <div class="loginbox">

        <div class="mini-icon" style="margin-bottom:15px">N</div>

        <b style="font-size:24px">Nona Costex</b>

        <div class="small muted" style="margin:4px 0 24px">
          Staff Portal
        </div>

        ${
          err?
          `<div class="error">${esc(err)}</div>`:
          ''
        }

        <label class="small muted">Email</label>

        <input
          id="email"
          type="email"
          placeholder="Supabase account email"
          style="margin:5px 0 13px"
        >

        <label class="small muted">Password</label>

        <input
          id="pass"
          type="password"
          placeholder="Password"
          style="margin:5px 0 17px"
        >

        <button
          class="btn"
          style="width:100%"
          onclick="login()"
        >
          Sign in
        </button>

        <p
          class="small muted"
          style="text-align:center;margin-top:15px"
        >
          Use the account created in Supabase.
        </p>

      </div>
    </div>
  `;
}

async function login(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('pass').value;

  const r=await db.auth.signInWithPassword({
    email,
    password
  });

  if(r.error){
    return loginPage(r.error.message);
  }

  await enter(r.data.user);
}

async function logout(){
  await db.auth.signOut();
}

/* NAVIGATION */

function nav(id,label,icon,b=0){
  return`
    <button
      class="${S.page===id?'active':''}"
      onclick="go('${id}')"
    >
      ${icon}
      &nbsp;
      ${label}
      ${
        b?
        `<span class="pill red" style="float:right">${b}</span>`:
        ''
      }
    </button>
  `;
}

function go(p){
  S.page=p;
  S.sidebar=false;
  S.modal=null;

  if(p==='communication')chatLoad();

  render();
}

/* RENDER */

function render(){
  if(!S.user){
    loginPage();
    return;
  }

  const unread=S.notifications.filter(
    n=>!n.is_read
  ).length;

      <aside class="side ${S.sidebar?'open':''}">

        <div class="brand">
          Nona Costex
          <small>Staff Portal</small>
        </div>

        <div class="nav-title">Workspace</div>

        <div class="nav">
          ${nav('dashboard','Dashboard','⌂')}
          ${nav('tasks','Tasks','✓')}
          ${nav('worklogs','Work Logs','▤')}
          ${nav('communication','Communication','◌',unread)}
          ${nav('knowledge','Knowledge Hub','▥')}
          ${nav('calendar','Calendar','□')}
        </div>

        ${
          isAdmin()?
          `
            <div class="nav-title">Admin</div>

function openTask(id){

  const t=id?
    tasks.find(x=>x.id===id):
    {
      name:'',
      description:'',
      category:'General',
      priority:'Medium',
      status:'Not Started',
      progress:0,
      dueDate:'',
      dueTime:'',
      notes:''
    };

  S.modal={
    type:'task',
    data:t
  };

  render();
}

function saveTask(){

  const g=id=>
    document.getElementById(id).value;

  const d={
    name:g('task-name').trim(),
    description:g('task-desc'),
    category:g('task-cat'),
    priority:g('task-pri'),
    status:g('task-status'),
    progress:Number(g('task-progress')),
    dueDate:g('task-date'),
    dueTime:g('task-time'),
    notes:g('task-notes')
  };

  const id=g('task-id');

  if(!d.name||!d.dueDate){
    return toast(
      'Task name and due date are required.'
    );
  }

  if(d.status==='Completed'){
    d.progress=100;
  }

  if(id){
    const existing=tasks.find(x=>x.id===id);

    if(existing){
      Object.assign(existing,d);
    }
  }else{
    tasks.push({
      ...d,
      id:'t'+Date.now()
    });
  }

  saveLocal();

  S.modal=null;

  toast('Task saved');

  render();
}

function deleteTask(id){

  if(!confirm('Delete this task?'))return;

  tasks=tasks.filter(x=>x.id!==id);

  saveLocal();

  toast('Task deleted');

  render();
}

/* CALENDAR */

function calendar(){

  const year=S.calendarDate.getFullYear();
  const month=S.calendarDate.getMonth();

  const first=new Date(year,month,1);
  const last=new Date(year,month+1,0);

  const startDay=first.getDay();
  const days=last.getDate();

  const monthName=new Intl.DateTimeFormat(
    'en-MY',
    {month:'long',year:'numeric'}
  ).format(first);

  const cells=[];

  for(let i=0;i<startDay;i++){
    cells.push(`
      <div class="cal-cell muted-day"></div>
    `);
  }

  for(let day=1;day<=days;day++){

    const dateKey=
      `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

    const today=
      new Date().toISOString().slice(0,10)===dateKey;

    const events=S.calendarEvents.filter(
      e=>e.event_date===dateKey
    );

    const dayLogs=logs.filter(
      x=>x.date===dateKey
    );

    cells.push(`
      <div
        class="cal-cell ${today?'today':''}"
        onclick="${isAdmin()?`openCalendarEvent(null,'${dateKey}')`:''}"
      >

        <div class="day-number">
          ${day}
        </div>

        ${
          events.map(e=>`
            <div
              class="cal-event ${
                e.event_type==='Public Holiday'?
                'event-public':
                e.event_type==='Company Holiday'?
                'event-company':
                'event-other'
              }"
              title="${esc(e.title)}"
              onclick="event.stopPropagation();viewCalendarEvent('${e.id}')"
            >
              ${esc(e.title)}
            </div>
          `).join('')
        }

        ${
          dayLogs.map(l=>`
            <div
              class="cal-event event-other"
              title="${esc(l.task)}"
              onclick="event.stopPropagation()"
            >
              Work: ${esc(l.task)}
            </div>
          `).join('')
        }

      </div>
    `);
  }

  return`
    <div class="grid">

      <div class="row between wrap">

        <div>
          <h1 class="title">Calendar</h1>

          <p class="sub">
            Public holidays, company holidays and work events.
          </p>
        </div>

        ${
          isAdmin()?
          `
            <button
              class="btn"
              onclick="openCalendarEvent()"
            >
              + Add Event
            </button>
          `:
          ''
        }

      </div>

      <div class="calendar-wrap">

        <div class="calendar-head">

          <div class="row between">

            <button
              class="btn secondary"
              onclick="changeMonth(-1)"
            >
              ‹
            </button>

            <div style="text-align:center">
              <b style="font-size:18px">
                ${monthName}
              </b>

              <div
                class="small muted"
                style="margin-top:3px"
              >
                Click a date to view events
              </div>
            </div>

            <button
              class="btn secondary"
              onclick="changeMonth(1)"
            >
              ›
            </button>

          </div>

          <div
            class="row"
            style="justify-content:center;margin-top:14px"
          >
            <button
              class="btn secondary small"
              onclick="calendarToday()"
            >
              Today
            </button>
          </div>

        </div>

        <div class="calendar-week">
          <div>Sun</div>
          <div>Mon</div>
          <div>Tue</div>
          <div>Wed</div>
          <div>Thu</div>
          <div>Fri</div>
          <div>Sat</div>
        </div>

        <div class="calendar-grid">
          ${cells.join('')}
        </div>

      </div>

      <div class="grid three">

        <div class="card">
          <div class="row">
            <span class="comm-preview">◆</span>
            <div>
              <b>Public Holiday</b>
              <div class="small muted">
                Official public holidays
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="row">
            <span class="comm-preview">●</span>
            <div>
              <b>Company Holiday</b>
              <div class="small muted">
                Nona Costex holidays
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="row">
            <span class="comm-preview">✦</span>
            <div>
              <b>Company Event</b>
              <div class="small muted">
                Internal activities
              </div>
            </div>
          </div>
        </div>

      </div>

    </div>
  `;
}

  S.calendarDate=new Date(
    S.calendarDate.getFullYear(),
    S.calendarDate.getMonth()+n,

  render();

function calendarToday(){

function openCalendarEvent(id=null,dateKey=''){

  if(!isAdmin()){
    return viewCalendarEvent(id);
  }

  const event=id?
    S.calendarEvents.find(x=>x.id===id):
    {
      id:'',
      title:'',
      event_date:dateKey,
      event_type:'Company Event',
      description:''
    };

  S.modal={
    type:'calendar-event',
    data:event
  };

  render();
}

function viewCalendarEvent(id){

  const e=S.calendarEvents.find(x=>x.id===id);

  if(!e)return;

  if(isAdmin()){
    openCalendarEvent(id);
    return;
  }

  S.modal={
    type:'calendar-view',
    data:e
  };

  render();
}

async function saveCalendarEvent(){

  const id=document.getElementById('cal-id').value;

  const d={
    title:document.getElementById('cal-title').value.trim(),
    event_date:document.getElementById('cal-date').value,
    event_type:document.getElementById('cal-type').value,
    description:document.getElementById('cal-desc').value
  };

  if(!d.title||!d.event_date){
    return toast(
      'Title and date are required.'
    );
  }

  let r;

  if(id){
    r=await db
      .from('calendar_events')
      .update({
        ...d,
        updated_at:new Date().toISOString()
      })
      .eq('id',id);
  }else{
    r=await db
      .from('calendar_events')
      .insert({
        ...d,
        created_by:me()
      });
  }

  if(r.error){
    return toast(r.error.message);
  }

  await loadCalendarEvents();

  S.modal=null;

  toast('Calendar event saved');

  render();
}

async function deleteCalendarEvent(id){

  if(!isAdmin())return;

  if(!confirm('Delete this calendar event?'))return;

  const r=await db
    .from('calendar_events')
    .delete()
    .eq('id',id);

  if(r.error){
    return toast(r.error.message);
  }

  await loadCalendarEvents();

  S.modal=null;

  render();

  toast('Calendar event deleted');
}

/* COMMUNICATION */

async function loadConversations(){

  const m=await db
    .from('conversation_members')
    .select('conversation_id,profile_id,role')
    .eq('profile_id',me());

  if(m.error){
    S.conversations=[];
    S.conversationMembers=[];
    return;
  }

  S.conversationMembers=m.data||[];

  const ids=[
    ...new Set(
      S.conversationMembers.map(
        x=>x.conversation_id
      )
    )
  ];

  if(!ids.length){
    S.conversations=[];
    return;
  }

  const c=await db
    .from('conversations')
    .select('*')
    .in('id',ids)
    .order('updated_at',{ascending:false});

  S.conversations=c.error?
    []:
    (c.data||[]);
}

async function loadConversationMembers(cid){

  const r=await db
    .from('conversation_members')
    .select('conversation_id,profile_id,role')
    .eq('conversation_id',cid);

  S.conversationMembers=
    r.error?
    []:
    (r.data||[]);

  return S.conversationMembers;
}

function currentConversationRole(){

  if(!S.conversation)return'member';

  return(
    S.conversationMembers.find(
      x=>x.profile_id===me()
    )||{}
  ).role||'member';
}

function conversationName(c){

  if(!c)return'';

  if(c.type==='group'){
    return c.name||'Unnamed Group';
  }

  const ids=S.conversationMembers
    .filter(
      x=>
        x.conversation_id===c.id&&
        x.profile_id!==me()
    )
    .map(x=>x.profile_id);

  const p=S.profiles.find(
    x=>x.id===ids[0]
  );

  return p?.full_name||'Direct chat';
}

async function chatLoad(){

  if(!S.channel&&!S.conversation){
    S.messages=[];
    return;
  }

  let q=db
    .from('messages')
    .select('*')
    .order('created_at',{ascending:true})
    .limit(200);

  q=S.channel?
    q.eq('channel_id',S.channel.id):
    q.eq('conversation_id',S.conversation.id);

  const r=await q;

  if(!r.error){
    S.messages=r.data||[];
  }
}

async function selectConversation(cid){

  const c=S.conversations.find(
    x=>x.id===cid
  );

  if(!c)return;

  S.conversation={
    id:cid,

async function saveGroup(){

  const name=
    document.getElementById(
      'group-name'
    ).value.trim();

  const selected=[
    ...document.querySelectorAll(
      '.group-member:checked'
    )
  ].map(x=>x.value);

  if(!name){
    return toast('Group name is required.');
  }

  if(!selected.length){
    return toast('Select at least one member.');
  }

  const c=await db
    .from('conversations')
    .insert({
      name,
      type:'group',
      created_by:me()
    })
    .select()
    .single();

  if(c.error){
    return toast(c.error.message);
  }

  const rows=[
    {
      conversation_id:c.data.id,
      profile_id:me(),
      role:'admin'
    },
    ...selected
      .filter(x=>x!==me())
      .map(x=>({
        conversation_id:c.data.id,
        profile_id:x,
        role:'member'
      }))
  ];

  const r=await db
    .from('conversation_members')
    .insert(rows);

  if(r.error){
    await db
      .from('conversations')
      .delete()
      .eq('id',c.data.id);

    return toast(r.error.message);
  }

  await loadConversations();

  S.modal=null;

  await selectConversation(
    c.data.id
  );
}

async function renameGroup(){

  if(
    !S.conversation?.group||
    currentConversationRole()!=='admin'

    return toast(
      'Only the group admin can rename this group.'

  const current=
    conversationName(
      S.conversations.find(
        x=>x.id===S.conversation.id

  const name=prompt(
    'New group name',
    current

  if(!name||!name.trim())return;

  const r=await db
    .from('conversations')
    .update({
      name:name.trim(),
      updated_at:new Date().toISOString()
    })
    .eq('id',S.conversation.id);

  if(r.error){
    return toast(r.error.message);

  await loadConversations();

  render();
}

async function selectChannel(id){

  S.channel=
    S.channels.find(x=>x.id===id);

  S.conversation=null;

  await chatLoad();

  render();
}

async function direct(target){

  let cid=null;

  const cs=await db
    .from('conversations')
    .select('id');

  for(const c of cs.data||[]){

    const mm=await db
      .from('conversation_members')
      .select('profile_id')
      .eq(
        'conversation_id',
        c.id
      );

    const ids=(mm.data||[])
      .map(x=>x.profile_id);

    if(
      ids.includes(me())&&
      ids.includes(target)&&
      ids.length===2
    ){
      cid=c.id;
      break;
    }
  }

  if(!cid){

    const c=await db
      .from('conversations')
      .insert({})
      .select()
      .single();

    if(c.error){
      return toast(c.error.message);
    }

    cid=c.data.id;

    const ins=await db
      .from('conversation_members')
      .insert([
        {
          conversation_id:cid,
          profile_id:me()
        },
        {
          conversation_id:cid,
          profile_id:target
        }
      ]);

    if(ins.error){
      return toast(ins.error.message);
    }
  }

  S.conversation={
    id:cid,
    target
  };

  S.channel=null;

  await loadConversationMembers(cid);
  await chatLoad();

  render();
}

async function send(){

  const i=document.getElementById('msg');
  const text=i.value.trim();

  if(!text&&!S.pendingFile)return;

  if(!S.channel&&!S.conversation){
    return toast(
      'Select a channel or person first.'
    );
  }

  const row={
    sender_id:me(),
    message_text:text||null
  };

  if(S.channel){
    row.channel_id=S.channel.id;
  }else{
    row.conversation_id=
      S.conversation.id;
  }

  if(S.pendingFile){

    row.attachment_name=
      S.pendingFile.name;

    row.attachment_url=
      S.pendingFile.url;

    row.attachment_type=
      S.pendingFile.type;
  }

  const r=await db
    .from('messages')
    .insert(row);

  if(r.error){
    return toast(r.error.message);
  }

  i.value='';
  S.pendingFile=null;

  await chatLoad();

  render();
}

async function fileAttach(inp){

  const f=inp.files[0];

  if(!f)return;

  if(f.size>10*1024*1024){
    return toast(
      'File must be under 10 MB.'
    );
  }

  const path=
    'chat/'+
    me()+
    '/'+
    Date.now()+
    '-'+
    f.name.replace(
      /[^a-zA-Z0-9._-]/g,
      '_'
    );

  const r=await db
    .storage
    .from('nona-files')
    .upload(path,f);

  if(r.error){
    return toast(r.error.message);
  }

  const u=
    db.storage
      .from('nona-files')
      .getPublicUrl(path)
      .data.publicUrl;

  S.pendingFile={
    name:f.name,
    type:f.type,
    url:u
  };

  render();
}

async function uploadDoc(){

  const i=document.createElement('input');

  i.type='file';

  i.onchange=async()=>{

    const f=i.files[0];

    if(!f)return;

    const title=prompt(
      'Document title',
      f.name
    );

    if(!title)return;

    const path=
      'knowledge/'+
      me()+
      '/'+
      Date.now()+
      '-'+
      f.name.replace(
        /[^a-zA-Z0-9._-]/g,
        '_'
      );

    const u=await db
      .storage
      .from('nona-files')
      .upload(path,f);

    if(u.error){
      return toast(u.error.message);
    }

    const url=
      db.storage
        .from('nona-files')
        .getPublicUrl(path)
        .data.publicUrl;

    const r=await db
      .from('knowledge_documents')
      .insert({
        title,
        category:'General',
        file_name:f.name,
        file_url:url,
        file_type:f.type,
        uploaded_by:me()
      });

    if(r.error){
      return toast(r.error.message);
    }

    await docs();

    render();
  };

  i.click();
}

function backup(){

  const a=document.createElement('a');

  a.href=URL.createObjectURL(
    new Blob(
      [
        JSON.stringify(
          {tasks,logs},
          null,
          2
        )
      ],
      {type:'application/json'}
    )
  );

  a.download=
    'nona-costex-portal-backup.json';

  a.click();
}

function restore(i){

  const r=new FileReader();

  r.onload=()=>{

    try{

      const x=JSON.parse(r.result);

      tasks=x.tasks||tasks;
      logs=x.logs||logs;

      saveLocal();

      render();

      toast('Backup restored');

    }catch(e){

      toast('Invalid backup file');

    }

  };

  r.readAsText(i.files[0]);
}

              Employee ID
            </label>

            <div>
              ${esc(S.profile.employee_id||'')}
            </div>
          </div>

          <div>
            <label class="small muted">
              Phone
            </label>

            <div>
              ${esc(S.profile.phone||'')}
            </div>
          </div>

        </div>

      </div>

    </div>
  `;
}

/* NOTIFICATIONS */

function notifications(){

  S.modal={
    type:'notifications'
  };

  render();
}

async function markRead(){

  await db
    .from('communication_notifications')
    .update({is_read:true})
    .eq('profile_id',me());

  await notifs();

  S.modal=null;

  render();
}

/* MODALS */

function modal(){

  const m=S.modal;

  if(m.type==='notifications'){

    return`
      <div class="modalbg">

        <div class="modal">

          <div class="row between">

            <div>
              <h2 style="margin:0">
                Notifications
              </h2>

              <div
                class="small muted"
                style="margin-top:4px"
              >
                Updates and communication alerts
              </div>
            </div>

            <button
              class="btn secondary"
              onclick="S.modal=null;render()"
            >
              ×
            </button>

          </div>

          <div style="margin-top:18px">

            ${
              S.notifications.map(n=>`
                <div
                  class="notification-card ${
                    n.is_read?'':'unread'
                  }"
                >

                  <div class="comm-preview">
                    ${n.is_read?'✓':'●'}
                  </div>

                  <div style="flex:1">

                    <b>${esc(n.title)}</b>

                    <div
                      class="small muted"
                      style="margin-top:5px"
                    >
                      ${esc(n.message||'')}
                    </div>

                    <div
                      class="small muted"
                      style="margin-top:5px"
                    >
                      ${dateTime(n.created_at)}
                    </div>

                  </div>

                </div>
              `).join('')||
              `
                <div class="empty">
                  No notifications.
                </div>
              `
            }

          </div>

          <button
            class="btn secondary small"
            onclick="markRead()"
          >
            Mark all as read
          </button>

        </div>

      </div>
    `;
  }

  if(m.type==='task'){

    const t=m.data;

    return`
      <div class="modalbg">

        <div class="modal">

          <div class="row between">

            <div>
              <h2 style="margin:0">
                ${t.id?'Edit':'Add'} Task
              </h2>

              <div
                class="small muted"
                style="margin-top:4px"
              >
                Update task details and progress.
              </div>
            </div>

            <button
              class="btn secondary"
              onclick="S.modal=null;render()"
            >
              ×
            </button>

          </div>

          <div
            class="grid two"
            style="margin-top:18px"
          >

            <div>
              <label class="small muted">
                Task
              </label>

              <input
                id="task-name"
                value="${esc(t.name)}"
              >
            </div>

            <div>
              <label class="small muted">
                Category
              </label>

              <input
                id="task-cat"
                value="${esc(t.category)}"
              >
            </div>

            <div>
              <label class="small muted">
                Priority
              </label>

              <select id="task-pri">
                ${
                  ['High','Medium','Low']
                    .map(x=>`
                      <option
                        ${t.priority===x?'selected':''}
                      >
                        ${x}
                      </option>
                    `).join('')
                }
              </select>
            </div>

            <div>
              <label class="small muted">
                Status
              </label>

              <select
                id="task-status"
                onchange="
                  if(this.value==='Completed'){
                    document.getElementById('task-progress').value=100
                  }
                "
              >
                ${
                  [
                    'Not Started',
                    'In Progress',
                    'Completed',
                    'On Hold'
                  ].map(x=>`
                    <option
                      ${t.status===x?'selected':''}
                    >
                      ${x}
                    </option>
                  `).join('')
                }
              </select>
            </div>

            <div>
              <label class="small muted">
                Progress %
              </label>

              <input
                id="task-progress"
                type="number"
                min="0"
                max="100"
                value="${Number(t.progress)||0}"
              >
            </div>

            <div>
              <label class="small muted">
                Due Date
              </label>

              <input
                id="task-date"
                type="date"
                value="${t.dueDate||''}"
              >
            </div>

            <div>
              <label class="small muted">
                Due Time
              </label>

              <input
                id="task-time"
                type="time"
                value="${t.dueTime||''}"
              >
            </div>

          </div>

          <div style="margin-top:13px">

            <label class="small muted">
              Description
            </label>

            <textarea id="task-desc">${esc(
              t.description||''
            )}</textarea>

          </div>

          <div style="margin-top:13px">

            <label class="small muted">
              Notes
            </label>

            <textarea id="task-notes">${esc(
              t.notes||''
            )}</textarea>

          </div>

          <input
            id="task-id"
            type="hidden"
            value="${esc(t.id||'')}"
          >

          <div
            class="row"
            style="
              justify-content:flex-end;
              margin-top:17px
            "
          >

            <button
              class="btn secondary"
              onclick="S.modal=null;render()"
            >
              Cancel
            </button>

            ${
              t.id?
              `
                <button
                  class="btn danger"
                  onclick="
                    S.modal=null;
                    deleteTask('${t.id}')
                  "
                >
                  Delete
                </button>
              `:
              ''
            }

            <button
              class="btn"
              onclick="saveTask()"
            >
              Save Task
            </button>

          </div>

        </div>

      </div>
    `;
  }

  if(m.type==='log'){

    const x=m.data;

    return`
      <div class="modalbg">

        <div class="modal">

          <div class="row between">

            <h2 style="margin:0">
              ${x.id?'Edit':'Add'} Work Log
            </h2>

            <button
              class="btn secondary"
              onclick="S.modal=null;render()"
            >
              ×
            </button>

          </div>

          <div
            class="grid two"
            style="margin-top:18px"
          >

            <div>
              <label class="small muted">
                Date
              </label>

              <input
                id="log-date"
                type="date"
                value="${x.date||''}"
              >
            </div>

            <div>
              <label class="small muted">
                Activity
              </label>

              <input
                id="log-task"
                value="${esc(x.task||'')}"
              >
            </div>

            <div>
              <label class="small muted">
                Start Time
              </label>

              <input
                id="log-start"
                type="time"
                value="${x.startTime||''}"
              >
            </div>

            <div>
              <label class="small muted">
                End Time
              </label>

              <input
                id="log-end"
                type="time"
                value="${x.endTime||''}"
              >
            </div>

          </div>

          <div style="margin-top:13px">

            <label class="small muted">
              Description
            </label>

            <textarea id="log-desc">${esc(
              x.description||''
            )}</textarea>

          </div>

          <input
            id="log-id"
            type="hidden"
            value="${esc(x.id||'')}"
          >

          <div
            class="row"
            style="
              justify-content:flex-end;
              margin-top:17px
            "
          >

            <button
              class="btn secondary"
              onclick="S.modal=null;render()"
            >
              Cancel
            </button>

            <button
              class="btn"
              onclick="saveLog()"
            >
              Save Work Log
            </button>

          </div>

        </div>

      </div>
    `;
  }

  if(m.type==='calendar-event'){

    const e=m.data;

    return`
      <div class="modalbg">

        <div class="modal">

          <div class="row between">

            <div>
              <h2 style="margin:0">
                ${e.id?'Edit':'Add'} Calendar Event
              </h2>

              <div
                class="small muted"
                style="margin-top:4px"
              >
                This event will be visible to all staff.
              </div>
            </div>

            <button
              class="btn secondary"
              onclick="S.modal=null;render()"
            >
              ×
            </button>

          </div>

          <div
            class="grid two"
            style="margin-top:18px"
          >

            <div>
              <label class="small muted">
                Event Title
              </label>

              <input
                id="cal-title"
                value="${esc(e.title||'')}"
                placeholder="e.g. Malaysia Day"
              >
            </div>

            <div>
              <label class="small muted">
                Date
              </label>

              <input
                id="cal-date"
                type="date"
                value="${e.event_date||''}"
              >
            </div>

            <div>
              <label class="small muted">
                Event Type
              </label>

              <select id="cal-type">

                ${
                  [
                    'Public Holiday',
                    'Company Holiday',
                    'Company Event'
                  ].map(x=>`
                    <option
                      ${e.event_type===x?'selected':''}
                    >
                      ${x}
                    </option>
                  `).join('')
                }

              </select>
            </div>

          </div>

          <div style="margin-top:13px">

            <label class="small muted">
              Description
            </label>

            <textarea
              id="cal-desc"
              placeholder="Optional description"
            >${esc(e.description||'')}</textarea>

          </div>

          <input
            id="cal-id"
            type="hidden"
            value="${esc(e.id||'')}"
          >

          <div
            class="row"
            style="
              justify-content:flex-end;
              margin-top:17px
            "
          >

            <button
              class="btn secondary"
              onclick="S.modal=null;render()"
            >
              Cancel
            </button>

            ${
              e.id?
              `
                <button
                  class="btn danger"
                  onclick="deleteCalendarEvent('${e.id}')"
                >
                  Delete
                </button>
              `:
              ''
            }

            <button
              class="btn"
              onclick="saveCalendarEvent()"
            >
              Save Event
            </button>

          </div>

        </div>

      </div>
    `;
  }

  if(m.type==='calendar-view'){

    const e=m.data;

    return`
      <div class="modalbg">

        <div class="modal">

          <div class="row between">

            <div class="row">

              <span class="comm-preview">
                ✦
              </span>

              <div>

                <h2 style="margin:0">
                  ${esc(e.title)}
                </h2>

                <div
                  class="small muted"
                  style="margin-top:4px"
                >
                  ${esc(e.event_type)}
                </div>

              </div>

            </div>

            <button
              class="btn secondary"
              onclick="S.modal=null;render()"
            >
              ×
            </button>

          </div>

          <div
            class="card"
            style="margin-top:18px;background:#f8faf7"
          >

            <b>
              ${date(e.event_date)}
            </b>

            <p class="small muted">
              ${esc(e.description||'No description.')}
            </p>

          </div>

        </div>

      </div>
    `;
  }

  if(m.type==='group-create'){

    return`
      <div class="modalbg">

        <div class="modal">

          <div class="row between">

            <h2 style="margin:0">
              Create Group
            </h2>

            <button
              class="btn secondary"
              onclick="S.modal=null;render()"
            >
              ×
            </button>

          </div>

          <label
            class="small muted"
            style="display:block;margin-top:18px"
          >
            Group Name
          </label>

          <input
            id="group-name"
            placeholder="e.g. Digital Team"
            style="margin-top:5px"
          >

          <div
            class="small muted"
            style="margin:17px 0 8px"
          >
            Select members
          </div>

          <div
            class="grid"
            style="
              max-height:330px;
              overflow:auto
            "
          >

            ${
              S.profiles
                .filter(p=>p.id!==me())
                .map(p=>`
                  <label
                    class="row"
                    style="
                      padding:9px;
                      border:1px solid #e5ebe5;
                      border-radius:10px
                    "
                  >

                    <input
                      class="group-member"
                      type="checkbox"
                      value="${p.id}"
                      style="width:auto"
                    >

                    <img
                      class="avatar"
                      src="${av(p)}"
                    >

                    <span>
                      <b>${esc(p.full_name)}</b>

                      <small
                        class="muted"
                        style="display:block"
                      >
                        ${esc(p.position||'')}
                      </small>
                    </span>

                  </label>
                `).join('')
            }

          </div>

          <div
            class="row"
            style="
              justify-content:flex-end;
              margin-top:17px
            "
          >

            <button
              class="btn secondary"
              onclick="S.modal=null;render()"
            >
              Cancel
            </button>

            <button
              class="btn"
              onclick="saveGroup()"
            >
              Create Group
            </button>

          </div>

        </div>

      </div>
    `;
  }

  if(m.type==='group-members'){

    const ids=new Set(
      S.conversationMembers.map(
        x=>x.profile_id
      )
    );

    return`
      <div class="modalbg">

        <div class="modal">

          <div class="row between">

            <h2 style="margin:0">
              Manage Members
            </h2>

            <button
              class="btn secondary"
              onclick="S.modal=null;render()"
            >
              ×
            </button>

          </div>

          <div
            class="small muted"
            style="margin:16px 0 8px"
          >
            Current Members
          </div>

          ${
            S.conversationMembers.map(x=>{

              const p=S.profiles.find(
                y=>y.id===x.profile_id
              );

              return`
                <div
                  class="row between"
                  style="
                    padding:9px 0;
                    border-bottom:1px solid #eee
                  "
                >

                  <div class="row">

                    <img
                      class="avatar"
                      src="${av(p)}"
                    >

                    <div>
                      <b>
                        ${esc(p?.full_name||'User')}
                      </b>

                      <div class="small muted">
                        ${x.role}
                      </div>
                    </div>

                  </div>

                  ${
                    x.profile_id!==me()?
                    `
                      <button
                        class="btn danger small"
                        onclick="removeMember('${x.profile_id}')"
                      >
                        Remove
                      </button>
                    `:
                    `<span class="small muted">You</span>`
                  }

                </div>
              `;
            }).join('')
          }

          <div
            class="small muted"
            style="margin:17px 0 8px"
          >
            Add Members
          </div>

          <div
            class="grid"
            style="
              max-height:250px;
              overflow:auto
            "
          >

            ${
              S.profiles
                .filter(
                  p=>
                    p.id!==me()&&
                    !ids.has(p.id)
                )
                .map(p=>`
                  <label
                    class="row"
                    style="
                      padding:9px;
                      border:1px solid #eee;
                      border-radius:10px
                    "
                  >

                    <input
                      class="group-add-member"
                      type="checkbox"
                      value="${p.id}"
                      style="width:auto"
                    >

                    <img
                      class="avatar"
                      src="${av(p)}"
                    >

                    <span>
                      ${esc(p.full_name)}
                    </span>

                  </label>
                `).join('')||
                `
                  <div class="small muted">
                    Everyone is already in this group.
                  </div>
                `
            }

          </div>

          <div
            class="row"
            style="
              justify-content:flex-end;
              margin-top:17px
            "
          >

            <button
              class="btn secondary"
              onclick="S.modal=null;render()"
            >
              Close
            </button>

            <button
              class="btn"
              onclick="saveMembers()"
            >
              Add Selected
            </button>

          </div>

        </div>

      </div>
    `;
  }

  return '';
}

init();
</script>
</body>
</html>
