<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nona Costex Staff Portal</title>

<style>
:root{
  --bg:#f5f5f1;
  --surface:#ffffff;
  --surface2:#f0f0ea;
  --text:#252722;
  --muted:#777b72;
  --line:#dedfd7;
  --accent:#737b5b;
  --accent-dark:#596044;
  --danger:#b85c5c;
  --warning:#b78a4b;
  --success:#5f8067;
  --shadow:0 8px 28px rgba(30,35,25,.06);
  --radius:16px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{display:none!important}

/* LOGIN */
.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:var(--bg);
}

.login-card{
  width:100%;
  max-width:430px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:22px;
  padding:38px;
  box-shadow:var(--shadow);
}

.logo{
  width:48px;
  height:48px;
  border-radius:14px;
  background:var(--accent);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  margin-bottom:20px;
}

.login-card h1{
  margin:0 0 8px;
  font-size:27px;
}

.login-card p{
  color:var(--muted);
  margin:0 0 28px;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:7px;
}

input,select,textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px 12px;
  background:#fff;
  color:var(--text);
  outline:none;
}

textarea{
  min-height:100px;
  resize:vertical;
}

input:focus,select:focus,textarea:focus{
  border-color:var(--accent);
}

.primary-btn{
  width:100%;
  border:0;
  background:var(--accent);
  color:#fff;
  padding:12px 16px;
  border-radius:10px;
  font-weight:600;
}

.primary-btn:hover{
  background:var(--accent-dark);
}

.demo-box{
  margin-top:20px;
  padding:13px;
  border-radius:10px;
  background:var(--surface2);
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
}

/* APP */
.app{
  min-height:100vh;
}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:250px;
  background:#fafaf7;
  border-right:1px solid var(--line);
  padding:22px 16px;
  z-index:100;
  display:flex;
  flex-direction:column;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:4px 10px 24px;
}

.brand-mark{
  width:38px;
  height:38px;
  background:var(--accent);
  color:#fff;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
}

.brand-text{
  font-size:14px;
  font-weight:700;
}

.brand-sub{
  display:block;
  font-size:10px;
  color:var(--muted);
  margin-top:2px;
  font-weight:400;
}

.nav{
  flex:1;
  overflow-y:auto;
}

.nav-section{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:#999c93;
  padding:14px 10px 7px;
}

.nav-btn{
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 11px;
  border:0;
  background:transparent;
  color:#555950;
  border-radius:10px;
  margin-bottom:3px;
  text-align:left;
  font-size:13px;
}

.nav-btn:hover{
  background:#ecece5;
}

.nav-btn.active{
  background:#e4e6dc;
  color:#4f573e;
  font-weight:600;
}

.nav-icon{
  width:18px;
  height:18px;
  flex:none;
}

.sidebar-user{
  border-top:1px solid var(--line);
  padding:15px 10px 0;
}

.user-name{
  font-size:13px;
  font-weight:600;
}

.user-role{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.logout-btn{
  margin-top:12px;
  border:1px solid var(--line);
  background:#fff;
  width:100%;
  border-radius:9px;
  padding:9px;
  font-size:12px;
}

.main{
  margin-left:250px;
  min-height:100vh;
}

.topbar{
  height:70px;
  background:rgba(250,250,247,.94);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  position:sticky;
  top:0;
  z-index:80;
}

.topbar-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.mobile-menu{
  display:none;
  border:0;
  background:transparent;
}

.page-title{
  font-size:18px;
  font-weight:700;
}

.topbar-right{
  display:flex;
  align-items:center;
  gap:12px;
}

.notification-btn{
  position:relative;
  width:38px;
  height:38px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.notification-dot{
  position:absolute;
  top:6px;
  right:6px;
  min-width:15px;
  height:15px;
  padding:0 4px;
  border-radius:20px;
  background:var(--danger);
  color:#fff;
  font-size:9px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.content{
  padding:28px 30px 50px;
  max-width:1600px;
  margin:auto;
}

/* GENERAL */
.page{
  display:none;
}

.page.active{
  display:block;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:18px;
}

.section-head h2{
  margin:0;
  font-size:20px;
}

.section-head p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:12px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
  box-shadow:var(--shadow);
}

.card-label{
  color:var(--muted);
  font-size:11px;
  margin-bottom:10px;
}

.card-value{
  font-size:27px;
  font-weight:700;
}

.card-note{
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
}

.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.grid-3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:var(--shadow);
}

.panel-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px;
}

.panel-title h3{
  margin:0;
  font-size:15px;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:11px;
}

.action-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid var(--line);
  background:#fff;
  color:var(--text);
  padding:9px 12px;
  border-radius:9px;
  font-size:12px;
  font-weight:600;
}

.btn:hover{
  background:var(--surface2);
}

.btn-primary{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
}

.btn-danger{
  color:var(--danger);
}

.btn-success{
  color:var(--success);
}

.btn-warning{
  color:var(--warning);
}

.filters{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:9px;
  margin-bottom:15px;
}

.search-input{
  min-width:0;
}

/* TABLE */
.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

th{
  text-align:left;
  padding:11px 10px;
  background:#f5f5f0;
  color:#72766d;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.04em;
  white-space:nowrap;
}

td{
  padding:12px 10px;
  border-bottom:1px solid #eeeeea;
  vertical-align:middle;
}

tr:last-child td{
  border-bottom:0;
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:5px 8px;
  border-radius:20px;
  font-size:10px;
  font-weight:600;
  white-space:nowrap;
}

.badge-pending{
  background:#f0eee6;
  color:#81744e;
}

.badge-progress{
  background:#e8ebe2;
  color:#64704d;
}

.badge-completed{
  background:#e4eee5;
  color:#58735d;
}

.badge-overdue{
  background:#f3e4e2;
  color:#9b5550;
}

.badge-approved{
  background:#e4eee5;
  color:#58735d;
}

.badge-rejected{
  background:#f3e4e2;
  color:#9b5550;
}

.badge-pending-leave{
  background:#f0eee6;
  color:#81744e;
}

/* PROGRESS */
.progress{
  height:8px;
  background:#e7e8e1;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  background:var(--accent);
  border-radius:20px;
}

/* DASHBOARD LIST */
.dashboard-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.list-item{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:11px 0;
  border-bottom:1px solid #eeeeea;
}

.list-item:last-child{
  border-bottom:0;
}

.list-main{
  min-width:0;
}

.list-title{
  font-size:12px;
  font-weight:600;
}

.list-meta{
  font-size:10px;
  color:var(--muted);
  margin-top:4px;
}

/* LEAVE BALANCE */
.leave-balance{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.leave-box{
  background:#f5f5f0;
  border-radius:12px;
  padding:15px;
}

.leave-box strong{
  font-size:24px;
  display:block;
}

.leave-box span{
  color:var(--muted);
  font-size:10px;
}

/* CALENDAR */
.calendar-toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.calendar-title{
  font-size:18px;
  font-weight:700;
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
}

.calendar-head{
  background:#f2f2ed;
  color:#777b72;
  padding:10px;
  font-size:10px;
  text-transform:uppercase;
  text-align:center;
  border-right:1px solid var(--line);
}

.calendar-day{
  min-height:125px;
  background:#fff;
  border-top:1px solid var(--line);
  border-right:1px solid var(--line);
  padding:8px;
  cursor:pointer;
}

.calendar-day:hover{
  background:#fafaf7;
}

.calendar-day.other{
  background:#f7f7f3;
  color:#aaa;
}

.calendar-day.today{
  box-shadow:inset 0 0 0 2px var(--accent);
}

.day-number{
  font-size:11px;
  font-weight:700;
  margin-bottom:7px;
}

.calendar-event{
  font-size:9px;
  padding:4px 5px;
  border-radius:5px;
  background:#e8ebe2;
  color:#596044;
  margin-bottom:4px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.calendar-event.task{
  background:#eeece4;
  color:#81744e;
}

.calendar-event.leave{
  background:#f0e6e3;
  color:#975d56;
}

.calendar-more{
  font-size:9px;
  color:var(--muted);
}

/* MODAL */
.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(20,22,18,.35);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:300;
}

.modal{
  width:100%;
  max-width:650px;
  max-height:90vh;
  overflow-y:auto;
  background:#fff;
  border-radius:18px;
  border:1px solid var(--line);
  box-shadow:0 20px 60px rgba(0,0,0,.15);
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:19px 20px;
  border-bottom:1px solid var(--line);
}

.modal-header h3{
  margin:0;
  font-size:16px;
}

.modal-close{
  border:0;
  background:transparent;
  font-size:22px;
  color:var(--muted);
}

.modal-body{
  padding:20px;
}

.modal-footer{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  padding:15px 20px;
  border-top:1px solid var(--line);
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.form-grid .full{
  grid-column:1/-1;
}

/* PROFILE */
.profile-head{
  display:flex;
  align-items:center;
  gap:18px;
  margin-bottom:22px;
}

.avatar{
  width:76px;
  height:76px;
  border-radius:50%;
  background:#e3e5dc;
  color:#626a4e;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  font-weight:700;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-name{
  font-size:20px;
  font-weight:700;
}

.profile-position{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.info-item{
  padding:12px;
  background:#f6f6f2;
  border-radius:10px;
}

.info-label{
  font-size:9px;
  color:var(--muted);
  text-transform:uppercase;
}

.info-value{
  font-size:12px;
  font-weight:600;
  margin-top:4px;
}

/* NOTIFICATIONS */
.notification-item{
  padding:15px;
  border:1px solid var(--line);
  border-radius:12px;
  margin-bottom:10px;
  background:#fff;
}

.notification-item.unread{
  background:#f3f4ed;
  border-color:#d9dccd;
}

.notification-title{
  font-size:12px;
  font-weight:700;
}

.notification-message{
  font-size:11px;
  color:var(--muted);
  margin-top:5px;
}

.notification-time{
  font-size:9px;
  color:#aaa;
  margin-top:7px;
}

/* EMPTY */
.empty{
  text-align:center;
  padding:35px 15px;
  color:var(--muted);
  font-size:12px;
}

/* TOAST */
.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#252722;
  color:#fff;
  padding:12px 16px;
  border-radius:10px;
  font-size:12px;
  z-index:500;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
}

/* RESPONSIVE */
@media(max-width:1100px){
  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .filters{
    grid-template-columns:repeat(2,1fr);
  }

  .grid-3{
    grid-template-columns:1fr;
  }
}

@media(max-width:800px){
  .sidebar{
    transform:translateX(-100%);
    transition:.25s ease;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
  }

  .mobile-menu{
    display:block;
  }

  .topbar{
    padding:0 16px;
  }

  .content{
    padding:20px 15px 40px;
  }

  .grid-2{
    grid-template-columns:1fr;
  }

  .calendar-day{
    min-height:90px;
  }

  .calendar-event{
    font-size:8px;
  }
}

@media(max-width:600px){
  .login-card{
    padding:27px 22px;
  }

  .cards{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .card{
    padding:14px;
  }

  .card-value{
    font-size:23px;
  }

  .section-head{
    align-items:flex-start;
    flex-direction:column;
  }

  .filters{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-grid .full{
    grid-column:auto;
  }

  .info-grid{
    grid-template-columns:1fr;
  }

  .calendar-head{
    padding:7px 2px;
    font-size:8px;
  }

  .calendar-day{
    min-height:75px;
    padding:5px;
  }

  .calendar-event{
    padding:3px;
  }

  .calendar-more{
    display:none;
  }

  .profile-head{
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<div id="loginPage" class="login-page">
  <div class="login-card">
    <div class="logo">NC</div>
    <h1>Nona Costex</h1>
    <p>Staff Portal</p>

    <form id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <input id="loginUsername" required autocomplete="username">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input id="loginPassword" type="password" required autocomplete="current-password">
      </div>

      <button class="primary-btn" type="submit">Login</button>
    </form>

    <div class="demo-box">
      <strong>Demo Login</strong><br>
      Staff: Atikah / NC001<br>
      Admin: Admin / ADMIN001
    </div>
  </div>
</div>

<div id="app" class="app hidden">

  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="brand-mark">NC</div>
      <div class="brand-text">
        Nona Costex
        <span class="brand-sub">Staff Portal</span>
      </div>
    </div>

    <nav id="nav" class="nav"></nav>

    <div class="sidebar-user">
      <div id="sidebarUserName" class="user-name"></div>
      <div id="sidebarUserRole" class="user-role"></div>
      <button class="logout-btn" onclick="logout()">Log Out</button>
    </div>
  </aside>

  <main class="main">

    <header class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu" onclick="toggleSidebar()">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
        <div id="pageTitle" class="page-title">Dashboard</div>
      </div>

      <div class="topbar-right">
        <button class="notification-btn" onclick="goPage('notifications')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span id="notificationCount" class="notification-dot hidden">0</span>
        </button>
      </div>
    </header>

    <div class="content">

      <!-- DASHBOARD -->
      <section id="page-dashboard" class="page active"></section>

      <!-- TASKS -->
      <section id="page-tasks" class="page"></section>

      <!-- WORK LOGS -->
      <section id="page-logs" class="page"></section>

      <!-- ATTENDANCE -->
      <section id="page-attendance" class="page"></section>

      <!-- LEAVE -->
      <section id="page-leave" class="page"></section>

      <!-- SCHEDULE -->
      <section id="page-schedule" class="page"></section>

      <!-- ANNOUNCEMENTS -->
      <section id="page-announcements" class="page"></section>

      <!-- NOTIFICATIONS -->
      <section id="page-notifications" class="page"></section>

      <!-- STAFF -->
      <section id="page-staff" class="page"></section>

      <!-- ANALYTICS -->
      <section id="page-analytics" class="page"></section>

      <!-- ACTIVITY -->
      <section id="page-activity" class="page"></section>

      <!-- PROFILE -->
      <section id="page-profile" class="page"></section>

    </div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* =========================================================
   STORAGE
========================================================= */

const KEYS = {
  logs:'nona_logs',
  leaves:'nona_leaves',
  attendance:'nona_attendance',
  staff:'nona_staff',
  schedules:'nona_schedules',
  announcements:'nona_announcements',
  notifications:'nona_notifications',
  activity:'nona_activity'
};

let currentUser = null;
let currentPage = 'dashboard';
let calendarDate = new Date();

function getData(key){
  try{
    return JSON.parse(localStorage.getItem(key)) || [];
  }catch(e){
    return [];
  }
}

function setData(key,data){
  localStorage.setItem(key,JSON.stringify(data));
}

function uid(prefix='id'){
  return prefix+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
}

function todayISO(){
  const d=new Date();
  return d.toISOString().slice(0,10);
}

function formatDate(date){
  if(!date) return '-';
  const d=new Date(date+'T00:00:00');
  if(isNaN(d)) return date;
  return d.toLocaleDateString('en-MY',{
    day:'2-digit',
    month:'short',
    year:'numeric'
  });
}

function formatDateShort(date){
  if(!date) return '-';
  const d=new Date(date+'T00:00:00');
  return d.toLocaleDateString('en-MY',{
    day:'2-digit',
    month:'short'
  });
}

function escapeHtml(str){
  return String(str ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function initials(name){
  return String(name||'')
    .split(' ')
    .filter(Boolean)
    .slice(0,2)
    .map(x=>x[0])
    .join('')
    .toUpperCase() || '?';
}

function staffById(id){
  return getData(KEYS.staff).find(s=>s.id===id || s.code===id);
}

function activeStaff(){
  return getData(KEYS.staff).filter(s=>s.status!=='Inactive');
}

document.getElementById('loginForm').addEventListener('submit',e=>{
  e.preventDefault();

  const username=document.getElementById('loginUsername').value.trim();
  const password=document.getElementById('loginPassword').value.trim();

  const staff=getData(KEYS.staff);

  const matchedStaff=staff.find(s=>
    s.name.toLowerCase()===username.toLowerCase() &&
    s.code.toLowerCase()===password.toLowerCase()
  );

  if(matchedStaff){
    currentUser={
      role:'staff',
      staffId:matchedStaff.id,
      name:matchedStaff.name
    };

    addActivity('Login',matchedStaff.name+' logged in',matchedStaff.id);
    startApp();
    return;
  }

  if(username.toLowerCase()==='admin' && password.toLowerCase()==='admin001'){
    currentUser={
      role:'admin',
      staffId:'admin',
      name:'Admin'
    };

    addActivity('Login','Admin logged in','admin');
    startApp();
    return;
  }

  alert('Invalid username or password.');
});

function startApp(){
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  document.getElementById('sidebarUserName').textContent=currentUser.name;
  document.getElementById('sidebarUserRole').textContent=
    currentUser.role==='admin' ? 'Administrator' : 'Staff';

  buildNav();
  updateNotificationCount();
  goPage('dashboard');
}

function logout(){
  if(currentUser){
    addActivity('Logout',currentUser.name+' logged out',currentUser.staffId);
  }

  currentUser=null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginPage').classList.remove('hidden');
  document.getElementById('loginForm').reset();
}

  if(target){
    target.classList.add('active');
  }

  const titles={
    dashboard:'Dashboard',
    tasks:currentUser.role==='admin'?'Tasks':'My Tasks',
    logs:'Work Logs',
    attendance:'Attendance',

    schedule:'Schedule',

function getTasks(){
  return getData(KEYS.logs);
}

function isOverdue(task){
  if(task.status==='Completed') return false;
  if(!task.dueDate) return false;

  let deadline=task.dueDate;

  if(task.dueTime){
    deadline+='T'+task.dueTime;
  }else{
    deadline+='T23:59';
  }

  return new Date(deadline)<new Date();
}

function statusBadge(status,task=null){
  if(task && isOverdue(task)){
    return `<span class="badge badge-overdue">Overdue</span>`;
  }

  if(status==='Completed')
    return `<span class="badge badge-completed">Completed</span>`;

  if(status==='In Progress')
    return `<span class="badge badge-progress">In Progress</span>`;

  return `<span class="badge badge-pending">Pending</span>`;
}

function renderTasks(){

  let tasks=getTasks();

  if(currentUser.role==='staff'){
    tasks=tasks.filter(t=>t.staffId===currentUser.staffId);
  }

  const staff=activeStaff();

  const search=document.getElementById('taskSearch')?.value?.toLowerCase()||'';
  const status=document.getElementById('taskStatus')?.value||'';
  const priority=document.getElementById('taskPriority')?.value||'';
  const staffFilter=document.getElementById('taskStaff')?.value||'';

  if(search){
    tasks=tasks.filter(t=>
      String(t.title).toLowerCase().includes(search) ||
      String(t.description||'').toLowerCase().includes(search)
    );
  }

  if(status) tasks=tasks.filter(t=>t.status===status);
  if(priority) tasks=tasks.filter(t=>t.priority===priority);
  if(staffFilter && currentUser.role==='admin'){
    tasks=tasks.filter(t=>t.staffId===staffFilter);
  }

  tasks.sort((a,b)=>
    String(a.dueDate||'9999').localeCompare(String(b.dueDate||'9999'))
  );

  let rows='';

  tasks.forEach(t=>{
    const person=staffById(t.staffId);

    rows+=`
      <tr>
        <td>
          <strong>${escapeHtml(t.title)}</strong>
          <div class="small muted">${escapeHtml(t.description||'').slice(0,70)}</div>
        </td>

        ${currentUser.role==='admin'
          ? `<td>${escapeHtml(person?.name||'Unknown')}</td>`
          : ''
        }

        <td>
          ${formatDate(t.dueDate)}
          ${t.dueTime?'<div class="small muted">'+escapeHtml(t.dueTime)+'</div>':''}
        </td>

        <td>${escapeHtml(t.priority||'Medium')}</td>

        <td>${statusBadge(t.status,t)}</td>

        <td>
          <div class="action-row">
            <button class="btn" onclick="viewTask('${t.id}')">View</button>
            ${currentUser.role==='admin'
              ? `<button class="btn" onclick="openTaskModal('${t.id}')">Edit</button>
                 <button class="btn btn-danger" onclick="deleteTask('${t.id}')">Delete</button>`
              : `<button class="btn btn-primary" onclick="openTaskStatusModal('${t.id}')">Update</button>`
            }
          </div>
        </td>
      </tr>
    `;
  });

  if(!rows){
    rows=`<tr><td colspan="6"><div class="empty">No tasks found.</div></td></tr>`;
  }

  document.getElementById('page-tasks').innerHTML=`
    <div class="section-head">
      <div>
        <h2>${currentUser.role==='admin'?'Task Management':'My Tasks'}</h2>
        <p>Manage and track assigned work.</p>
      </div>

      ${currentUser.role==='admin'
        ? `<button class="btn btn-primary" onclick="openTaskModal()">+ Assign Task</button>`
        : ''
      }
    </div>

    <div class="panel">
      <div class="filters">
        <input id="taskSearch" class="search-input" placeholder="Search tasks..." value="${escapeHtml(search)}" oninput="renderTasks()">

        <select id="taskStatus" onchange="renderTasks()">
          <option value="">All Status</option>
          <option ${status==='Pending'?'selected':''}>Pending</option>
          <option ${status==='In Progress'?'selected':''}>In Progress</option>
          <option ${status==='Completed'?'selected':''}>Completed</option>
        </select>

        <select id="taskPriority" onchange="renderTasks()">
          <option value="">All Priority</option>
          <option ${priority==='Low'?'selected':''}>Low</option>
          <option ${priority==='Medium'?'selected':''}>Medium</option>
          <option ${priority==='High'?'selected':''}>High</option>
        </select>

        ${currentUser.role==='admin'
          ? `<select id="taskStaff" onchange="renderTasks()">
              <option value="">All Staff</option>
              ${staff.map(s=>`<option value="${s.id}" ${staffFilter===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}
             </select>`
          : ''
        }

        <button class="btn" onclick="clearTaskFilters()">Clear Filters</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Task</th>
              ${currentUser.role==='admin'?'<th>Assigned To</th>':''}
              <th>Due</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function clearTaskFilters(){
  renderTasks();
}

function openTaskModal(taskId=null){

  if(currentUser.role!=='admin') return;

  const task=taskId ? getTasks().find(t=>t.id===taskId) : null;

  const staff=activeStaff();

  openModal(
    task ? 'Edit Task' : 'Assign New Task',
    `
      <form id="taskForm">

        <div class="form-grid">

          <div class="form-group full">
            <label>Task Title</label>
            <input id="taskTitle" required value="${escapeHtml(task?.title||'')}">
          </div>

          <div class="form-group">
            <label>Assign To</label>
            <select id="taskAssigned" required>
              <option value="">Select Staff</option>
              ${staff.map(s=>`
                <option value="${s.id}" ${task?.staffId===s.id?'selected':''}>
                  ${escapeHtml(s.name)}
                </option>
              `).join('')}
            </select>
          </div>

          <div class="form-group">
            <label>Priority</label>
            <select id="taskPriorityInput">
              <option ${task?.priority==='Low'?'selected':''}>Low</option>
              <option ${!task || task?.priority==='Medium'?'selected':''}>Medium</option>
              <option ${task?.priority==='High'?'selected':''}>High</option>
            </select>
          </div>

          <div class="form-group">
            <label>Work Date</label>
            <input id="taskWorkDate" type="date" value="${task?.workDate||todayISO()}">
          </div>

          <div class="form-group">
            <label>Due Date</label>
            <input id="taskDueDate" type="date" value="${task?.dueDate||todayISO()}">
          </div>

          <div class="form-group">
            <label>Due Time</label>
            <input id="taskDueTime" type="time" value="${task?.dueTime||''}">
          </div>

          <div class="form-group">
            <label>Status</label>
            <select id="taskStatusInput">
              <option ${!task || task?.status==='Pending'?'selected':''}>Pending</option>
              <option ${task?.status==='In Progress'?'selected':''}>In Progress</option>
              <option ${task?.status==='Completed'?'selected':''}>Completed</option>
            </select>
          </div>

          <div class="form-group full">
            <label>Description</label>
            <textarea id="taskDescription">${escapeHtml(task?.description||'')}</textarea>
          </div>

        </div>

      </form>
    `,
    `
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveTask('${taskId||''}')">
        ${task?'Save Changes':'Assign Task'}
      </button>
    `
  );
}

function saveTask(taskId){

  const title=document.getElementById('taskTitle').value.trim();
  const staffId=document.getElementById('taskAssigned').value;

  if(!title || !staffId){
    alert('Please complete the required fields.');
    return;
  }

  let tasks=getTasks();

  if(taskId){

    const task=tasks.find(t=>t.id===taskId);

    if(task){
      task.title=title;
      task.staffId=staffId;
      task.priority=document.getElementById('taskPriorityInput').value;
      task.workDate=document.getElementById('taskWorkDate').value;
      task.dueDate=document.getElementById('taskDueDate').value;
      task.dueTime=document.getElementById('taskDueTime').value;
      task.status=document.getElementById('taskStatusInput').value;
      task.description=document.getElementById('taskDescription').value.trim();
      task.updatedAt=new Date().toISOString();

      addActivity(
        'Task Updated',
        title,
        currentUser.staffId
      );
    }

  }else{

    const newTask={
      id:uid('task'),
      staffId,
      title,
      workDate:document.getElementById('taskWorkDate').value,
      dueDate:document.getElementById('taskDueDate').value,
      dueTime:document.getElementById('taskDueTime').value,
      priority:document.getElementById('taskPriorityInput').value,
      status:document.getElementById('taskStatusInput').value,
      description:document.getElementById('taskDescription').value.trim(),
      assignedBy:'Admin',
      createdAt:new Date().toISOString()
    };

    tasks.push(newTask);

    const person=staffById(staffId);

    addNotification(
      staffId,
      'New task assigned',
      `${newTask.title} has been assigned to you.`,
      'task'
    );

    addActivity(
      'Task Assigned',
      `${newTask.title} → ${person?.name||'Staff'}`,
      staffId
    );
  }

  setData(KEYS.logs,tasks);
  closeModal();
  toast(taskId?'Task updated.':'Task assigned.');
  renderTasks();
  renderDashboard();
}

function deleteTask(taskId){

  if(!confirm('Delete this task?')) return;

  let tasks=getTasks();
  const task=tasks.find(t=>t.id===taskId);

  tasks=tasks.filter(t=>t.id!==taskId);
  setData(KEYS.logs,tasks);

  if(task){
    addActivity('Task Deleted',task.title,currentUser.staffId);
  }

  toast('Task deleted.');
  renderTasks();
  renderDashboard();
}

function viewTask(taskId){

  const task=getTasks().find(t=>t.id===taskId);
  if(!task) return;

  const person=staffById(task.staffId);

  openModal(
    'Task Details',
    `
      <div class="info-grid">

        <div class="info-item">
          <div class="info-label">Task</div>
          <div class="info-value">${escapeHtml(task.title)}</div>
        </div>

        <div class="info-item">
          <div class="info-label">Assigned To</div>
          <div class="info-value">${escapeHtml(person?.name||'-')}</div>
        </div>

        <div class="info-item">
          <div class="info-label">Work Date</div>
          <div class="info-value">${formatDate(task.workDate)}</div>
        </div>

        <div class="info-item">
          <div class="info-label">Due</div>
          <div class="info-value">${formatDate(task.dueDate)} ${escapeHtml(task.dueTime||'')}</div>
        </div>

        <div class="info-item">
          <div class="info-label">Priority</div>
          <div class="info-value">${escapeHtml(task.priority||'Medium')}</div>
        </div>

        <div class="info-item">
          <div class="info-label">Status</div>
          <div class="info-value">${statusBadge(task.status,task)}</div>
        </div>

      </div>

      <div style="margin-top:18px">
        <div class="small muted">Description</div>
        <p style="font-size:13px;line-height:1.6">
          ${escapeHtml(task.description||'No description provided.')}
        </p>
      </div>

      <div style="margin-top:18px">
        <div class="small muted">Task History</div>
        <div class="dashboard-list" style="margin-top:8px">
          ${getData(KEYS.activity)
            .filter(a=>
              String(a.detail||'').includes(task.title)
            )
            .slice(-8)
            .reverse()
            .map(a=>`
              <div class="list-item">
                <div class="list-main">
                  <div class="list-title">${escapeHtml(a.action)}</div>
                  <div class="list-meta">${escapeHtml(a.detail||'')}</div>
                </div>
                <div class="small muted">${formatDateTime(a.time)}</div>
              </div>

function openTaskStatusModal(taskId){

  const task=getTasks().find(t=>t.id===taskId);
  if(!task) return;

  openModal(
    'Update Task Status',
    `
      <div class="form-group">
        <label>Status</label>
        <select id="newTaskStatus">
          <option ${task.status==='Pending'?'selected':''}>Pending</option>
          <option ${task.status==='In Progress'?'selected':''}>In Progress</option>
          <option ${task.status==='Completed'?'selected':''}>Completed</option>
        </select>
      </div>
    `,
    `
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveTaskStatus('${taskId}')">Save</button>
    `
  );
}

function saveTaskStatus(taskId){

  let tasks=getTasks();
  const task=tasks.find(t=>t.id===taskId);

  if(!task) return;

  const newStatus=document.getElementById('newTaskStatus').value;
  const oldStatus=task.status;

  task.status=newStatus;
  task.updatedAt=new Date().toISOString();

  setData(KEYS.logs,tasks);

  addActivity(
    'Task Status Updated',
    `${task.title}: ${oldStatus} → ${newStatus}`,
    currentUser.staffId
  );

  if(newStatus==='Completed' && oldStatus!=='Completed'){
    addNotification(
      'admin',
      'Task completed',
      `${currentUser.name} completed "${task.title}".`,
      'task'
    );
  }

  closeModal();
  toast('Task status updated.');
  renderTasks();
  renderDashboard();
}

/* =========================================================

========================================================= */

function renderDashboard(){

  const allTasks=getTasks();

  const tasks=currentUser.role==='admin'
    ? allTasks
    : allTasks.filter(t=>t.staffId===currentUser.staffId);

  const completed=tasks.filter(t=>t.status==='Completed').length;
  const inProgress=tasks.filter(t=>t.status==='In Progress').length;
  const overdue=tasks.filter(t=>isOverdue(t)).length;

  const rate=tasks.length
    ? Math.round((completed/tasks.length)*100)
    : 0;

  const schedules=getData(KEYS.schedules)
    .filter(s=>currentUser.role==='admin'||s.staffId===currentUser.staffId)
    .filter(s=>s.date>=todayISO())
    .sort((a,b)=>a.date.localeCompare(b.date))
    .slice(0,5);

  const upcoming=tasks
    .filter(t=>t.status!=='Completed' && t.dueDate)
    .sort((a,b)=>String(a.dueDate).localeCompare(String(b.dueDate)))
    .slice(0,5);

  let leaveHTML='';

  if(currentUser.role==='staff'){
    const balance=getLeaveBalance(currentUser.staffId);

    leaveHTML=`

        <div class="panel-title">
          <h3>Leave Balance</h3>

        </div>

        <div class="leave-balance">
          <div class="leave-box">
            <strong>${balance.entitlement}</strong>
            <span>Annual Leave Entitlement</span>
          </div>

          <div class="leave-box">
            <strong>${balance.remaining}</strong>
            <span>Days Left</span>
          </div>
        </div>
      </div>
    `;
  }else{
    leaveHTML=`

          <h3>Staff Overview</h3>
          <button class="btn" onclick="goPage('staff')">Manage Staff</button>
        </div>

          ${activeStaff().slice(0,5).map(s=>{
            const st=allTasks.filter(t=>t.staffId===s.id);
            const c=st.filter(t=>t.status==='Completed').length;
            const r=st.length?Math.round(c/st.length*100):0;

            return `
              <div class="list-item">

/* =========================================================
   WORK LOGS
========================================================= */

function renderLogs(){

  let logs=getData(KEYS.logs);

  if(currentUser.role==='staff'){
    logs=logs.filter(l=>l.staffId===currentUser.staffId);
  }

  const search=document.getElementById('logSearch')?.value?.toLowerCase()||'';
  const status=document.getElementById('logStatus')?.value||'';

  if(search){
    logs=logs.filter(l=>
      String(l.title).toLowerCase().includes(search) ||
      String(l.description||'').toLowerCase().includes(search)
    );
  }

  if(status) logs=logs.filter(l=>l.status===status);

  logs.sort((a,b)=>String(b.workDate||'').localeCompare(String(a.workDate||'')));

  let rows='';

  logs.forEach(l=>{
    const person=staffById(l.staffId);

    rows+=`
      <tr>
        <td>${formatDate(l.workDate)}</td>
        ${currentUser.role==='admin'
          ? `<td>${escapeHtml(person?.name||'-')}</td>`
          : ''
        }
        <td>
          <strong>${escapeHtml(l.title)}</strong>
          <div class="small muted">${escapeHtml(l.description||'').slice(0,60)}</div>
        </td>
        <td>${escapeHtml(l.priority||'Medium')}</td>
        <td>${statusBadge(l.status,l)}</td>
        <td>
          <div class="action-row">
            <button class="btn" onclick="openLogModal('${l.id}')">Edit</button>
            <button class="btn btn-danger" onclick="deleteLog('${l.id}')">Delete</button>
          </div>
        </td>
      </tr>
    `;
  });

  if(!rows){
    rows=`<tr><td colspan="6"><div class="empty">No work logs found.</div></td></tr>`;
  }

  document.getElementById('page-logs').innerHTML=`
    <div class="section-head">
      <div>
        <h2>Work Logs</h2>
        <p>Keep track of daily work and progress.</p>
      </div>

      <button class="btn btn-primary" onclick="openLogModal()">+ Add Work Log</button>
    </div>

    <div class="panel">

      <div class="filters">
        <input id="logSearch" placeholder="Search work logs..." value="${escapeHtml(search)}" oninput="renderLogs">

        <select id="logStatus" onchange="renderLogs()">
          <option value="">All Status</option>
          <option ${status==='Pending'?'selected':''}>Pending</option>
          <option ${status==='In Progress'?'selected':''}>In Progress</option>
          <option ${status==='Completed'?'selected':''}>Completed</option>
        </select>

        <button class="btn" onclick="renderLogs()">Apply</button>
        <button class="btn" onclick="exportCSV('logs')">Export CSV</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              ${currentUser.role==='admin'?'<th>Staff</th>':''}
              <th>Task</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;

  const input=document.getElementById('logSearch');
  if(input) input.addEventListener('input',renderLogs);
}

function saveLog(logId){

  let logs=getData(KEYS.logs);

  const data={
    title:document.getElementById('logTitle').value.trim(),
    workDate:document.getElementById('logDate').value,
    startTime:document.getElementById('logStart').value,
    endTime:document.getElementById('logEnd').value,
    dueDate:document.getElementById('logDueDate').value,
    dueTime:document.getElementById('logDueTime').value,
    priority:document.getElementById('logPriority').value,
    status:document.getElementById('logStatusInput').value,
    description:document.getElementById('logDescription').value.trim()
  };

  if(!data.title){
    alert('Please enter a task title.');
    return;
  }

  if(logId){

    const log=logs.find(l=>l.id===logId);

    if(log){
      Object.assign(log,data);

      addActivity(
        'Work Log Updated',
        data.title,
        currentUser.staffId
      );
    }

  }else{

    const staffId=currentUser.role==='admin'
      ? document.getElementById('logStaff').value
      : currentUser.staffId;

    logs.push({
      id:uid('log'),
      staffId,
      ...data,
      assignedBy:currentUser.name,
      createdAt:new Date().toISOString()
    });

    addActivity(
      'Work Log Added',
      data.title,
      staffId
    );
  }

  setData(KEYS.logs,logs);

  closeModal();
  toast('Work log saved.');
  renderLogs();
  renderDashboard();
}

function deleteLog(id){

  if(!confirm('Delete this work log?')) return;

  const logs=getData(KEYS.logs);
  const log=logs.find(l=>l.id===id);

  setData(KEYS.logs,logs.filter(l=>l.id!==id));

  if(log){
    addActivity('Work Log Deleted',log.title,currentUser.staffId);
  }

  toast('Work log deleted.');
  renderLogs();
  renderDashboard();
}

/* =========================================================
   ATTENDANCE
========================================================= */

function renderAttendance(){

  let data=getData(KEYS.attendance);

  if(currentUser.role==='staff'){
    data=data.filter(a=>a.staffId===currentUser.staffId);
  }

  data.sort((a,b)=>String(b.date).localeCompare(String(a.date)));

  const todayRecord=getData(KEYS.attendance).find(a=>
    a.staffId===currentUser.staffId &&
    a.date===todayISO()
  );

  let rows='';

  data.slice(0,100).forEach(a=>{
    const person=staffById(a.staffId);

    rows+=`
      <tr>
        <td>${formatDate(a.date)}</td>
        ${currentUser.role==='admin'
          ? `<td>${escapeHtml(person?.name||'-')}</td>`
          : ''
        }
        <td>${escapeHtml(a.clockIn||'-')}</td>
        <td>${escapeHtml(a.clockOut||'-')}</td>
        <td>${a.clockIn&&a.clockOut?'<span class="badge badge-completed">Complete</span>':'<span class="badge badge-pending">Open</span>'}</td>
      </tr>
    `;
  });

  if(!rows){
    rows=`<tr><td colspan="5"><div class="empty">No attendance records.</div></td></tr>`;
  }

  document.getElementById('page-attendance').innerHTML=`
    <div class="section-head">
      <div>
        <h2>Attendance</h2>
        <p>Clock in and clock out records.</p>
      </div>

      ${currentUser.role==='staff'
        ? `
          <div class="action-row">
            <button class="btn btn-primary" onclick="clockIn()" ${todayRecord?.clockIn?'disabled':''}>Clock In</button>
            <button class="btn" onclick="clockOut()" ${!todayRecord?.clockIn||todayRecord?.clockOut?'disabled':''}>Clock Out</button>
          </div>
        `
        : ''
      }
    </div>

    <div class="panel">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              ${currentUser.role==='admin'?'<th>Staff</th>':''}
              <th>Clock In</th>
              <th>Clock Out</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function clockIn(){

  const data=getData(KEYS.attendance);
  const date=todayISO();

  let record=data.find(a=>
    a.staffId===currentUser.staffId &&
    a.date===date
  );

  if(record?.clockIn){
    alert('You have already clocked in today.');
    return;
  }

  const time=new Date().toLocaleTimeString('en-MY',{
    hour:'2-digit',
    minute:'2-digit',
    hour12:false
  });

  if(!record){
    record={
      id:uid('att'),
      staffId:currentUser.staffId,
      date,
      clockIn:time,
      clockOut:''
    };
    data.push(record);
  }else{
    record.clockIn=time;
  }

  setData(KEYS.attendance,data);

  addActivity('Clock In',`Clocked in at ${time}`,currentUser.staffId);

  toast('Clocked in.');
  renderAttendance();
}

function clockOut(){

  const data=getData(KEYS.attendance);
  const record=data.find(a=>
    a.staffId===currentUser.staffId &&
    a.date===todayISO()
  );

  if(!record || !record.clockIn){
    alert('Please clock in first.');
    return;
  }

  if(record.clockOut){
    alert('You have already clocked out today.');
    return;
  }

  const time=new Date().toLocaleTimeString('en-MY',{
    hour:'2-digit',
    minute:'2-digit',
    hour12:false
  });

  record.clockOut=time;

  setData(KEYS.attendance,data);

  addActivity('Clock Out',`Clocked out at ${time}`,currentUser.staffId);

  toast('Clocked out.');
  renderAttendance();
}

/* =========================================================
   LEAVE
========================================================= */

function getLeaveBalance(staffId){

  const staff=staffById(staffId);

  const entitlement=Number(
    staff?.annualLeaveEntitlement ?? 12
  );

  const approved=getData(KEYS.leaves)
    .filter(l=>
      l.staffId===staffId &&
      l.type==='Annual Leave' &&
      l.status==='Approved'
    )
    .reduce((sum,l)=>sum+Number(l.days||0),0);

  return {
    entitlement,
    used:approved,
    remaining:Math.max(entitlement-approved,0)
  };
}

function renderLeave(){

  let leaves=getData(KEYS.leaves);

  if(currentUser.role==='staff'){
    leaves=leaves.filter(l=>l.staffId===currentUser.staffId);
  }

  leaves.sort((a,b)=>String(b.startDate||'').localeCompare(String(a.startDate||'')));

  let rows='';

  leaves.forEach(l=>{
    const person=staffById(l.staffId);

    let badge='';

    if(l.status==='Approved')
      badge='<span class="badge badge-approved">Approved</span>';
    else if(l.status==='Rejected')
      badge='<span class="badge badge-rejected">Rejected</span>';
    else
      badge='<span class="badge badge-pending-leave">Pending</span>';

    rows+=`
      <tr>
        ${currentUser.role==='admin'
          ? `<td>${escapeHtml(person?.name||'-')}</td>`
          : ''
        }

        <td>${escapeHtml(l.type||'Annual Leave')}</td>
        <td>${formatDate(l.startDate)}</td>
        <td>${formatDate(l.endDate)}</td>
        <td>${Number(l.days||0)}</td>
        <td>${badge}</td>

        ${currentUser.role==='admin'
          ? `<td>
              ${l.status==='Pending'
                ? `<div class="action-row">
                    <button class="btn btn-success" onclick="updateLeave('${l.id}','Approved')">Approve</button>
                    <button class="btn btn-danger" onclick="updateLeave('${l.id}','Rejected')">Reject</button>
                   </div>`
                : '-'
              }
             </td>`
          : ''
        }
      </tr>
    `;
  });

  if(!rows){
    rows=`<tr><td colspan="7"><div class="empty">No leave records.</div></td></tr>`;
  }

  let balanceHTML='';

  if(currentUser.role==='staff'){
    const b=getLeaveBalance(currentUser.staffId);

function openLeaveModal(){

            <label>Leave Type</label>
            <select id="leaveType">
              <option>Annual Leave</option>
              <option>Emergency Leave</option>
              <option>Medical Leave</option>
              <option>Unpaid Leave</option>
            </select>
          </div>

          <div class="form-group">
            <label>Number of Days</label>
            <input id="leaveDays" type="number" min="0.5" step="0.5" value="1">
          </div>

          <div class="form-group">
            <label>Start Date</label>
            <input id="leaveStart" type="date" value="${todayISO()}">
          </div>

          <div class="form-group">
            <label>End Date</label>
            <input id="leaveEnd" type="date" value="${todayISO()}">
          </div>

          <div class="form-group full">
            <label>Reason</label>
            <textarea id="leaveReason"></textarea>
          </div>

        </div>

      </form>
    `,
    `
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitLeave()">Submit Application</button>
    `
  );
}

function submitLeave(){

  const type=document.getElementById('leaveType').value;
  const days=Number(document.getElementById('leaveDays').value);
  const startDate=document.getElementById('leaveStart').value;
  const endDate=document.getElementById('leaveEnd').value;
  const reason=document.getElementById('leaveReason').value.trim();

  if(!startDate || !endDate || !days){
    alert('Please complete the leave details.');
    return;
  }

  if(new Date(endDate)<new Date(startDate)){
    alert('End date cannot be before start date.');
    return;
  }

  if(type==='Annual Leave'){
    const balance=getLeaveBalance(currentUser.staffId);

    if(days>balance.remaining){
      alert(`You only have ${balance.remaining} annual leave day(s) remaining.`);
      return;
    }
  }

  const leaves=getData(KEYS.leaves);

  const leave={
    id:uid('leave'),
    staffId:currentUser.staffId,
    type,
    days,
    startDate,
    endDate,
    reason,
    status:'Pending',
    createdAt:new Date().toISOString()
  };

  leaves.push(leave);
  setData(KEYS.leaves,leaves);

  addNotification(
    'admin',
    'New leave application',
    `${currentUser.name} submitted a leave application.`,
    'leave'
  );

  addActivity(
    'Leave Applied',
    `${type} (${days} day(s))`,
    currentUser.staffId
  );

  closeModal();
  toast('Leave application submitted.');
  renderLeave();
}

function updateLeave(id,status){

  const leaves=getData(KEYS.leaves);
  const leave=leaves.find(l=>l.id===id);

  if(!leave) return;

  leave.status=status;
  leave.updatedAt=new Date().toISOString();

  setData(KEYS.leaves,leaves);

  addNotification(
    leave.staffId,
    `Leave ${status.toLowerCase()}`,
    `Your ${leave.type} application has been ${status.toLowerCase()}.`,
    'leave'
  );

  addActivity(
    `Leave ${status}`,
    `${leave.type} for ${leave.days} day(s)`,
    leave.staffId
  );

  toast(`Leave ${status.toLowerCase()}.`);
  renderLeave();
  renderDashboard();
}

/* =========================================================
   SCHEDULE + CALENDAR
========================================================= */

function renderSchedule(){

  const allSchedules=getData(KEYS.schedules);

  let schedules=currentUser.role==='admin'
    ? allSchedules
    : allSchedules.filter(s=>s.staffId===currentUser.staffId);

  schedules.sort((a,b)=>String(a.date).localeCompare(String(b.date)));

  const year=calendarDate.getFullYear();
  const month=calendarDate.getMonth();

  const monthName=calendarDate.toLocaleDateString('en-MY',{
    month:'long',
    year:'numeric'
  });

  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();

  const prevDays=new Date(year,month,0).getDate();

  let calendarHTML='';

  for(let i=0;i<42;i++){

    const cellIndex=i-firstDay+1;

    let dateObj;
    let dayNumber;
    let other=false;

    if(cellIndex<=0){
      dayNumber=prevDays+cellIndex;
      dateObj=new Date(year,month-1,dayNumber);
      other=true;
    }else if(cellIndex>daysInMonth){
      dayNumber=cellIndex-daysInMonth;
      dateObj=new Date(year,month+1,dayNumber);
      other=true;
    }else{
      dayNumber=cellIndex;
      dateObj=new Date(year,month,dayNumber);
    }

    const iso=
      dateObj.getFullYear()+'-'+
      String(dateObj.getMonth()+1).padStart(2,'0')+'-'+
      String(dateObj.getDate()).padStart(2,'0');

    const today=iso===todayISO();

    const dayTasks=getTasks()
      .filter(t=>
        t.dueDate===iso &&
        (currentUser.role==='admin'||t.staffId===currentUser.staffId)
      );

    const daySchedules=schedules.filter(s=>s.date===iso);

    const dayLeaves=getData(KEYS.leaves)
      .filter(l=>
        l.status==='Approved' &&
        l.startDate<=iso &&
        l.endDate>=iso &&
        (currentUser.role==='admin'||l.staffId===currentUser.staffId)
      );

    const events=[
      ...dayTasks.map(t=>({
        type:'task',
        title:t.title,
        id:t.id
      })),
      ...daySchedules.map(s=>({
        type:'schedule',
        title:s.title,
        id:s.id
      })),
      ...dayLeaves.map(l=>({
        type:'leave',
        title:l.type,
        id:l.id
      }))
    ];

    calendarHTML+=`
      <div class="calendar-day ${other?'other':''} ${today?'today':''}" onclick="calendarDayClick('${iso}')">
        <div class="day-number">${dayNumber}</div>

        ${events.slice(0,3).map(e=>`
          <div class="calendar-event ${e.type==='task'?'task':e.type==='leave'?'leave':''}">
            ${escapeHtml(e.title)}
          </div>
        `).join('')}

        ${events.length>3
          ? `<div class="calendar-more">+${events.length-3} more</div>`
          : ''
        }
      </div>
    `;
  }

  const scheduleRows=schedules.slice(0,30).map(s=>{
    const person=staffById(s.staffId);

    return `
      <tr>
        <td>${formatDate(s.date)}</td>
        <td>${escapeHtml(s.title)}</td>
        ${currentUser.role==='admin'
          ? `<td>${escapeHtml(person?.name||'-')}</td>`
          : ''
        }
        <td>${escapeHtml(s.time||'-')}</td>
        <td>${escapeHtml(s.location||'-')}</td>
        ${currentUser.role==='admin'
          ? `<td>
              <div class="action-row">
                <button class="btn" onclick="openScheduleModal('${s.id}')">Edit</button>
                <button class="btn btn-danger" onclick="deleteSchedule('${s.id}')">Delete</button>
              </div>
             </td>`
          : ''
        }
      </tr>
    `;
  }).join('');

  document.getElementById('page-schedule').innerHTML=`
    <div class="section-head">
      <div>
        <h2>Schedule</h2>
        <p>View tasks, schedules and approved leave on the calendar.</p>
      </div>

      ${currentUser.role==='admin'
        ? `<button class="btn btn-primary" onclick="openScheduleModal()">+ Add Schedule</button>`
        : ''
      }
    </div>

    <div class="panel">

      <div class="calendar-toolbar">
        <div class="calendar-title">${monthName}</div>

        <div class="action-row">
          <button class="btn" onclick="changeMonth(-1)">Previous</button>
          <button class="btn" onclick="calendarDate=new Date();renderSchedule()">Today</button>
          <button class="btn" onclick="changeMonth(1)">Next</button>
        </div>
      </div>

      <div class="calendar">

        ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat']
          .map(d=>`<div class="calendar-head">${d}</div>`)
          .join('')
        }

        ${calendarHTML}

      </div>

    </div>

    <div class="panel" style="margin-top:18px">

      <div class="panel-title">
        <h3>Schedule List</h3>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Schedule</th>
              ${currentUser.role==='admin'?'<th>Staff</th>':''}
              <th>Time</th>
              <th>Location</th>
              ${currentUser.role==='admin'?'<th>Action</th>':''}
            </tr>
          </thead>

          <tbody>
            ${scheduleRows ||
              `<tr><td colspan="6"><div class="empty">No schedules found.</div></td></tr>`
            }
          </tbody>
        </table>
      </div>

    </div>
  `;
}

function changeMonth(amount){
  calendarDate.setMonth(calendarDate.getMonth()+amount);
  renderSchedule();
}

function calendarDayClick(date){

  const tasks=getTasks().filter(t=>
    t.dueDate===date &&
    (currentUser.role==='admin'||t.staffId===currentUser.staffId)
  );

  const schedules=getData(KEYS.schedules).filter(s=>
    s.date===date &&
    (currentUser.role==='admin'||s.staffId===currentUser.staffId)
  );

  const leaves=getData(KEYS.leaves).filter(l=>
    l.status==='Approved' &&
    l.startDate<=date &&
    l.endDate>=date &&
    (currentUser.role==='admin'||l.staffId===currentUser.staffId)
  );

  openModal(
    formatDate(date),
    `
      <div class="dashboard-list">

        ${tasks.map(t=>`
          <div class="list-item">
            <div class="list-main">
              <div class="list-title">Task · ${escapeHtml(t.title)}</div>
              <div class="list-meta">Due ${escapeHtml(t.dueTime||'')}</div>
            </div>
            ${statusBadge(t.status,t)}

        ${schedules.map(s=>`
          <div class="list-item">

              <div class="list-title">Schedule · ${escapeHtml(s.title)}</div>
              <div class="list-meta">${escapeHtml(s.time||'')} · ${escapeHtml(s.location||'')}</div>
            </div>
          </div>
        `).join('')}

        ${leaves.map(l=>{
          const person=staffById(l.staffId);

          return `
            <div class="list-item">
              <div class="list-main">
                <div class="list-title">Leave · ${escapeHtml(l.type)}</div>
                <div class="list-meta">
                  ${currentUser.role==='admin'?escapeHtml(person?.name||'')+' · ':''}
                  ${l.days} day(s)
                </div>
              </div>
            </div>
          `;
        }).join('')}

        ${!tasks.length&&!schedules.length&&!leaves.length
          ? `<div class="empty">Nothing scheduled for this date.</div>`
          : ''
        }

      </div>
    `,
    `
      ${currentUser.role==='admin'
        ? `<button class="btn btn-primary" onclick="closeModal();openScheduleModal(null,'${date}')">+ Add Schedule</button>`
        : ''
      }
      <button class="btn" onclick="closeModal()">Close</button>
    `
  );
}

function openScheduleModal(scheduleId=null,selectedDate=''){

  if(currentUser.role!=='admin') return;

  const schedules=getData(KEYS.schedules);
  const schedule=scheduleId?schedules.find(s=>s.id===scheduleId):null;

  const staff=activeStaff();

  openModal(
    schedule?'Edit Schedule':'Add Schedule',
    `
      <div class="form-grid">

        <div class="form-group full">
          <label>Schedule Title</label>
          <input id="scheduleTitle" value="${escapeHtml(schedule?.title||'')}">
        </div>

        <div class="form-group">
          <label>Assign To</label>
          <select id="scheduleStaff">
            ${staff.map(s=>`
              <option value="${s.id}" ${schedule?.staffId===s.id?'selected':''}>
                ${escapeHtml(s.name)}
              </option>
            `).join('')}
          </select>
        </div>

        <div class="form-group">
          <label>Date</label>
          <input id="scheduleDate" type="date" value="${schedule?.date||selectedDate||todayISO()}">
        </div>

        <div class="form-group">
          <label>Time</label>
          <input id="scheduleTime" type="time" value="${schedule?.time||''}">
        </div>

        <div class="form-group">
          <label>Location</label>
          <input id="scheduleLocation" value="${escapeHtml(schedule?.location||'')}">
        </div>

        <div class="form-group full">
          <label>Description</label>
          <textarea id="scheduleDescription">${escapeHtml(schedule?.description||'')}</textarea>
        </div>

      </div>
    `,
    `
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveSchedule('${scheduleId||''}')">Save</button>
    `
  );
}

function saveSchedule(id){

  const title=document.getElementById('scheduleTitle').value.trim();

  if(!title){
    alert('Please enter a schedule title.');
    return;
  }

  const schedules=getData(KEYS.schedules);

  const data={
    title,
    staffId:document.getElementById('scheduleStaff').value,
    date:document.getElementById('scheduleDate').value,
    time:document.getElementById('scheduleTime').value,
    location:document.getElementById('scheduleLocation').value.trim(),
    description:document.getElementById('scheduleDescription').value.trim()
  };

  if(id){

    const s=schedules.find(x=>x.id===id);

    if(s) Object.assign(s,data);

    addActivity('Schedule Updated',title,currentUser.staffId);

  }else{

    schedules.push({
      id:uid('sch'),
      ...data,
      createdAt:new Date().toISOString()
    });

    addNotification(
      data.staffId,
      'New schedule',
      `${title} has been added to your schedule.`,
      'schedule'
    );

    addActivity('Schedule Added',title,data.staffId);
  }

  setData(KEYS.schedules,schedules);

  closeModal();
  toast('Schedule saved.');
  renderSchedule();
  renderDashboard();
}

function deleteSchedule(id){

  if(!confirm('Delete this schedule?')) return;

  const schedules=getData(KEYS.schedules);
  const s=schedules.find(x=>x.id===id);

  setData(KEYS.schedules,schedules.filter(x=>x.id!==id));

  if(s) addActivity('Schedule Deleted',s.title,currentUser.staffId);

  toast('Schedule deleted.');
  renderSchedule();
  renderDashboard();
}

function saveAnnouncement(){

  const message=document.getElementById('annMessage').value.trim();

  if(!title||!message){
    alert('Please complete the announcement.');
    return;

  const announcements=getData(KEYS.announcements);

  announcements.push({

    title,
    message,

  setData(KEYS.announcements,announcements);

  activeStaff().forEach(s=>{

  closeModal();

function deleteAnnouncement(id){

  if(!confirm('Delete this announcement?')) return;

  const announcements=getData(KEYS.announcements);
  const a=announcements.find(x=>x.id===id);

  setData(
    KEYS.announcements,
    announcements.filter(x=>x.id!==id)
  );

  if(a) addActivity('Announcement Deleted',a.title,currentUser.staffId);

  toast('Announcement deleted.');
  renderAnnouncements();
}

/* =========================================================
   NOTIFICATIONS
========================================================= */

function addNotification(staffId,title,message,type='general'){

  const data=getData(KEYS.notifications);

  data.push({
    id:uid('notif'),
    staffId,
    title,
    message,
    type,
    read:false,
    time:new Date().toISOString()
  });

  setData(KEYS.notifications,data);

  updateNotificationCount();
}

function userNotifications(){

  return getData(KEYS.notifications)
    .filter(n=>n.staffId===currentUser.staffId)
    .sort((a,b)=>String(b.time).localeCompare(String(a.time)));
}

function updateNotificationCount(){

  if(!currentUser) return;

  const count=userNotifications().filter(n=>!n.read).length;

  const el=document.getElementById('notificationCount');

  if(count){
    el.textContent=count>99?'99+':count;
    el.classList.remove('hidden');
  }else{
    el.classList.add('hidden');
  }
}

function renderNotifications(){

  const data=userNotifications();

  document.getElementById('page-notifications').innerHTML=`
    <div class="section-head">
      <div>
        <h2>Notifications</h2>
        <p>Stay updated with tasks, leave and announcements.</p>
      </div>

      ${data.some(n=>!n.read)
        ? `<button class="btn" onclick="markAllNotifications()">Mark all as read</button>`
        : ''
      }
    </div>

    ${
      data.map(n=>`
        <div class="notification-item ${n.read?'':'unread'}">

          <div class="notification-title">
            ${escapeHtml(n.title)}
          </div>

          <div class="notification-message">
            ${escapeHtml(n.message)}
          </div>

          <div class="notification-time">
            ${formatDateTime(n.time)}
          </div>

          ${!n.read
            ? `<button class="btn" style="margin-top:8px" onclick="markNotificationRead('${n.id}')">Mark as read</button>`
            : ''
          }

        </div>
      `).join('') ||
      `<div class="panel"><div class="empty">No notifications.</div></div>`
    }
  `;
}

function markNotificationRead(id){

  const data=getData(KEYS.notifications);
  const n=data.find(x=>x.id===id);

  if(n) n.read=true;

  setData(KEYS.notifications,data);

  updateNotificationCount();
  renderNotifications();
}

function markAllNotifications(){

  const data=getData(KEYS.notifications);

  data.forEach(n=>{
    if(n.staffId===currentUser.staffId){
      n.read=true;
    }
  });

  setData(KEYS.notifications,data);

  updateNotificationCount();
  renderNotifications();
}

function saveStaff(id){

  const staff=getData(KEYS.staff);

  const data={
    name:document.getElementById('staffName').value.trim(),
    code:document.getElementById('staffCode').value.trim(),
    department:document.getElementById('staffDepartment').value.trim(),
    position:document.getElementById('staffPosition').value.trim(),
    status:document.getElementById('staffStatusInput').value,
    joiningDate:document.getElementById('staffJoining').value,
    email:document.getElementById('staffEmail').value.trim(),
    phone:document.getElementById('staffPhone').value.trim(),
    annualLeaveEntitlement:Number(document.getElementById('staffLeave').value||12)
  };

  if(!data.name||!data.code){
    alert('Name and staff code are required.');
    return;
  }

  if(id){

    const s=staff.find(x=>x.id===id);

    if(s) Object.assign(s,data);

    addActivity('Staff Updated',data.name,currentUser.staffId);

  }else{

    if(staff.some(s=>s.code.toLowerCase()===data.code.toLowerCase())){
      alert('Staff code already exists.');
      return;
    }

    staff.push({
      id:uid('staff'),
      ...data
    });

    addActivity('Staff Added',data.name,currentUser.staffId);
  }

  setData(KEYS.staff,staff);

  closeModal();
  toast('Staff information saved.');
  renderStaff();
}

function uploadProfilePhoto(event){

    addActivity('Profile Photo Updated','Uploaded profile photo',currentUser.staffId);

    toast('Profile photo updated.');
    renderProfile();
  };

  reader.readAsDataURL(file);

/* =========================================================
   EXPORT CSV
========================================================= */

function exportCSV(type){

  let data=[];
  let filename='';

  if(type==='logs'){
    data=getData(KEYS.logs).map(l=>({
      Date:l.workDate,
      Task:l.title,
      Staff:staffById(l.staffId)?.name||'',
      Priority:l.priority,
      Status:l.status,
      DueDate:l.dueDate,
      DueTime:l.dueTime,
      Description:l.description
    }));

    filename='nona_work_logs.csv';
  }

  if(type==='attendance'){
    data=getData(KEYS.attendance).map(a=>({
      Date:a.date,
      Staff:staffById(a.staffId)?.name||'',
      ClockIn:a.clockIn,
      ClockOut:a.clockOut
    }));

    filename='nona_attendance.csv';
  }

  if(type==='leaves'){
    data=getData(KEYS.leaves).map(l=>({
      Staff:staffById(l.staffId)?.name||'',
      Type:l.type,
      Start:l.startDate,
      End:l.endDate,
      Days:l.days,
      Status:l.status,
      Reason:l.reason
    }));

    filename='nona_leave_requests.csv';
  }

  if(!data.length){
    alert('No data to export.');
    return;
  }

  const headers=Object.keys(data[0]);

  const csv=[
    headers.join(','),
    ...data.map(row=>
      headers.map(h=>{
        const value=String(row[h]??'').replace(/"/g,'""');
        return `"${value}"`;
      }).join(',')
    )
  ].join('\n');

  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);

  const a=document.createElement('a');
  a.href=url;
  a.download=filename;
  a.click();

  URL.revokeObjectURL(url);
}

/* =========================================================
   MODAL / TOAST
========================================================= */

function openModal(title,body,footer=''){

  document.getElementById('modalRoot').innerHTML=`
    <div class="modal-backdrop" onclick="backdropClose(event)">

      <div class="modal">

        <div class="modal-header">
          <h3>${escapeHtml(title)}</h3>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>

        <div class="modal-body">
          ${body}
        </div>

        ${footer
          ? `<div class="modal-footer">${footer}</div>`
          : ''
        }

      </div>

    </div>
  `;
}

function backdropClose(event){
  if(event.target.classList.contains('modal-backdrop')){
    closeModal();
  }
}

function closeModal(){
  document.getElementById('modalRoot').innerHTML='';
}

function toast(message){

  const root=document.getElementById('toastRoot');

  root.innerHTML=`<div class="toast">${escapeHtml(message)}</div>`;

  setTimeout(()=>{
    root.innerHTML='';
  },2500);
}

function formatDateTime(value){

  if(!value) return '-';

  const d=new Date(value);

  if(isNaN(d)) return value;

  return d.toLocaleString('en-MY',{
    day:'2-digit',
    month:'short',
    hour:'2-digit',
    minute:'2-digit',
    hour12:false
  });
}

/* =========================================================
   OVERDUE NOTIFICATIONS
========================================================= */

function generateOverdueNotifications(){

  const tasks=getTasks();

  tasks.forEach(t=>{

    if(!isOverdue(t)) return;

    const data=getData(KEYS.notifications);

    const already=data.some(n=>
      n.staffId===t.staffId &&
      n.type==='overdue' &&
      String(n.message).includes(t.id)
    );

    if(!already){

      addNotification(
        t.staffId,
        'Task overdue',
        `"${t.title}" is overdue. [${t.id}]`,
        'overdue'
      );
    }
  });
}
