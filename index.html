<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nona Costex Staff Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Helvetica,Arial,sans-serif;background:#f7f9f7;color:#172019}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
input,select,textarea{width:100%;border:1px solid #e2e8e4;border-radius:9px;padding:10px;background:#fff}
textarea{min-height:90px;resize:vertical}

:root{
 --green:#9fb873;
 --green-dark:#7f9a58;
 --green-light:#edf3e4;
 --green-soft:#f6f8f1;
 --border:#e2e8e4;
 --text:#172019;
 --muted:#718078;
 --bg:#f7f9f7;
 --white:#fff;
 --danger:#c0392b;
}

.app{display:flex;min-height:100vh}
.side{width:240px;position:fixed;inset:0 auto 0 0;background:#fff;border-right:1px solid var(--border);padding:18px 12px;z-index:20}
.main{margin-left:240px;flex:1;min-width:0}
.top{height:64px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:10}
.content{padding:22px;max-width:1300px;margin:auto}

.brand{font-weight:700;font-size:19px;padding:5px 10px 20px}
.brand small{display:block;font-size:11px;color:#888;font-weight:400;margin-top:3px}
.nav-title{font-size:10px;color:#aaa;text-transform:uppercase;padding:14px 10px 6px}
.nav button{width:100%;background:transparent;border:0;text-align:left;padding:10px;border-radius:9px;color:#718078}
.nav button:hover,.nav button.active{background:var(--green-light);color:#5f7541}

.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px}
.grid{display:grid;gap:14px}
.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}

.title{font-size:24px;font-weight:700;margin:0}
.sub{font-size:13px;color:var(--muted);margin:5px 0 0}
.small{font-size:12px}
.muted{color:var(--muted)}

.btn{border:0;background:var(--green);color:#fff;padding:9px 14px;border-radius:9px}
.btn:hover{background:var(--green-dark)}
.btn.secondary{background:var(--green-light);color:#5f7541}
.btn.danger{background:#fff0ef;color:var(--danger)}
.btn.small{padding:7px 10px;font-size:12px}

.stat{padding:15px}
.stat b{display:block;font-size:24px}
.stat span{font-size:12px;color:var(--muted)}

.pill{display:inline-block;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:600;background:#eef1ee}
.high{background:#fee2e2;color:#991b1b}
.medium{background:#fef3c7;color:#92400e}
.low,.green{background:var(--green-light);color:#5f7541}
.blue{background:#dbeafe;color:#1e40af}
.red{background:#fee2e2;color:#991b1b}
.orange{background:#fff3cd;color:#856404}

.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#edf3e4}
.progress{height:8px;background:#e8eee5;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--green)}

table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:13px;vertical-align:middle}
th{font-size:11px;color:var(--muted)}

.empty{text-align:center;color:#999;padding:40px 10px}
.knowledge{padding:12px 0;border-bottom:1px solid #eee}

.login{min-height:100vh;display:grid;place-items:center;background:#f0f4ed;padding:20px}
.loginbox{width:min(410px,100%);background:#fff;padding:28px;border:1px solid var(--border);border-radius:18px}
.error{background:#fff0ef;color:#b42318;padding:10px;border-radius:9px;font-size:13px;margin:10px 0}

.modalbg{position:fixed;inset:0;background:#0006;display:grid;place-items:center;z-index:100;padding:18px}
.modal{background:#fff;border-radius:16px;width:min(760px,100%);max-height:90vh;overflow:auto;padding:22px}

.toast{position:fixed;right:18px;top:78px;z-index:200;background:#172019;color:#fff;padding:11px 14px;border-radius:9px;font-size:13px}

.attendance-status{background:var(--green-soft);border:1px solid #dce6ca;border-radius:12px;padding:18px}
.attendance-time,.clock-time{color:var(--green-dark);font-size:28px;font-weight:700}

.chat{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 110px);min-height:550px;padding:0;overflow:hidden}
.chatlist{border-right:1px solid #eee;overflow:auto}
.chatitem{padding:12px;border-bottom:1px solid #eee;cursor:pointer}
.chatitem:hover,.chatitem.active{background:var(--green-soft)}
.chatwindow{display:flex;flex-direction:column;min-width:0}
.messages{flex:1;overflow:auto;padding:16px;background:#fafcf9}
.bubble{max-width:75%;padding:9px 11px;border:1px solid #e7e7e2;background:#fff;border-radius:12px;margin-bottom:9px}
.bubble.mine{margin-left:auto;background:var(--green);color:#fff;border-color:var(--green)}
.meta{font-size:10px;opacity:.6;margin-top:4px}

.mobile{display:none}

.calendar-event{border-left:4px solid var(--green);padding:10px 12px;background:var(--green-soft);border-radius:8px}
.calendar-event.public{border-left-color:#78909c}
.calendar-event.company{border-left-color:var(--green)}
.calendar-event.event{border-left-color:#d5a84c}

.leave-card{padding:16px;border:1px solid var(--border);border-radius:12px;background:#fff}
.leave-number{font-size:28px;font-weight:700;color:var(--green-dark)}

@media(max-width:800px){
 .side{transform:translateX(-100%);transition:.2s}
 .side.open{transform:none}
 .main{margin-left:0}
 .mobile{display:block}
 .content{padding:14px}
 .four,.three,.two{grid-template-columns:1fr 1fr}
 .chat{grid-template-columns:1fr;height:auto}
 .chatlist{max-height:250px;border-right:0;border-bottom:1px solid #eee}
 .hide{display:none}
}

@media(max-width:550px){
 .four,.three,.two{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div id="app"></div>
<div id="toast"></div>

<script>
const SUPABASE_URL='https://jccryyxdxykomwsivtjy.supabase.co';
const SUPABASE_KEY='sb_publishable_XgF6_KZZxFzxrAqM0E3bEA_Qs2f-HxM';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const S={
 page:'dashboard',
 user:null,
 profile:null,
 profiles:[],
 channels:[],
 channel:null,
 conversation:null,
 conversations:[],
 conversationMembers:[],
 messages:[],
 notifications:[],
 docs:[],
 calendarEvents:[],
 leaveRequests:[],
 sidebar:false,
 modal:null,
 chatSearch:'',
 taskSearch:'',
 taskFilter:'',
 leaveFilter:'',
 pendingFile:null
};

let tasks=JSON.parse(localStorage.getItem('nona_tasks')||'null')||[
 {id:'t1',name:'Flite Product Shoot',category:'Content',priority:'High',status:'In Progress',dueDate:'2026-09-16',dueTime:'17:00',description:'Product shooting for Flite sandals.',notes:''},
 {id:'t2',name:'Social Media Content',category:'Content',priority:'Medium',status:'In Progress',dueDate:'2026-09-17',dueTime:'17:00',description:'Shoot and edit social media content.',notes:''},
 {id:'t3',name:'Live Setup',category:'Live',priority:'High',status:'Not Started',dueDate:'2026-09-18',dueTime:'12:00',description:'Prepare live setup quotation and requirements.',notes:''}
];

let logs=JSON.parse(localStorage.getItem('nona_logs')||'null')||[
 {id:'l1',date:'2026-09-07',task:'Budget quotation presentation + Flite product shoot',description:'Presented completed budget quotation and carried out Flite product shooting.',startTime:'09:00',endTime:'17:00'},
 {id:'l2',date:'2026-09-08',task:'Product shooting + content brainstorming',description:'Continued product shooting and brainstormed social media content.',startTime:'09:00',endTime:'17:00'},
 {id:'l3',date:'2026-09-09',task:'Live setup quotation + social media shooting',description:'Presented live setup budget quotation and shot social media content.',startTime:'09:00',endTime:'17:00'},
 {id:'l4',date:'2026-09-10',task:'Content shooting + video editing',description:'Shot content and edited social media videos.',startTime:'09:00',endTime:'17:00'}
];

let attendance=JSON.parse(localStorage.getItem('nona_attendance')||'null')||[];

const esc=x=>{
 const d=document.createElement('div');
 d.textContent=x??'';
 return d.innerHTML;
};

const av=p=>p?.avatar_url||
 'https://ui-avatars.com/api/?name='+encodeURIComponent(p?.full_name||'User')+
 '&background=edf3e4&color=5f7541';

const me=()=>S.profile?.id;
const isAdmin=()=>String(S.profile?.role||'').toLowerCase()==='admin';

function save(){
 localStorage.setItem('nona_tasks',JSON.stringify(tasks));
 localStorage.setItem('nona_logs',JSON.stringify(logs));
 localStorage.setItem('nona_attendance',JSON.stringify(attendance));
}

function toast(x){
 const t=document.getElementById('toast');
 t.textContent=x;
 t.className='toast';
 setTimeout(()=>t.className='',2500);
}

function date(x){
 if(!x)return '';
 return new Date(x+'T00:00:00').toLocaleDateString('en-MY',{
  day:'numeric',month:'short',year:'numeric'
 });
}

function dateTime(x){
 if(!x)return '';
 return new Date(x).toLocaleString('en-MY',{
  day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'
 });
}

function pclass(x){
 return x==='High'?'high':x==='Medium'?'medium':'low';
}

function sclass(x){
 return x==='Completed'?'green':
        x==='In Progress'?'blue':
        x==='Overdue'?'red':'';
}

function daysBetween(a,b){
 if(!a||!b)return 0;
 const start=new Date(a+'T00:00:00');
 const end=new Date(b+'T00:00:00');
 return Math.max(1,Math.floor((end-start)/86400000)+1);
}

async function init(){
 const {data:{session}}=await db.auth.getSession();

 if(session) await enter(session.user);
 else loginPage();

 db.auth.onAuthStateChange(async(e,s)=>{
  if(s&&!S.user) await enter(s.user);
  if(!s&&S.user){
   S.user=null;
   S.profile=null;
   loginPage();
  }
 });
}

async function enter(u){
 S.user=u;

 await profile();

 if(!S.profile){
  const isA=(u.email||'').toLowerCase().includes('admin');

  await db.from('profiles').insert({
   id:u.id,
   staff_code:isA?'ADMIN001':'NC001',
   full_name:isA?'Admin':'Staff',
   department:isA?'Management':'Digital',
   position:isA?'Administrator':'Live Host Online & Offline',
   role:isA?'admin':'staff',
   status:'Active'
  });

  await profile();
 }

 await Promise.all([
  profiles(),
  channels(),
  notifs(),
  docs(),
  loadConversations(),
  loadCalendarEvents(),
  loadLeaveRequests()
 ]);

 subscribe();
 render();
}

async function profile(){
 const r=await db.from('profiles').select('*').eq('id',S.user.id).maybeSingle();
 if(!r.error)S.profile=r.data;
}

async function profiles(){
 const r=await db.from('profiles').select('*').order('full_name');
 if(!r.error)S.profiles=r.data||[];
}

async function channels(){
 const r=await db.from('channels').select('*').order('name');
 if(!r.error)S.channels=r.data||[];
}

async function notifs(){
 const r=await db.from('communication_notifications')
 .select('*')
 .eq('profile_id',me())
 .order('created_at',{ascending:false})
 .limit(50);

 if(!r.error)S.notifications=r.data||[];
}

async function docs(){
 const r=await db.from('knowledge_documents')
 .select('*')
 .order('created_at',{ascending:false});

 if(!r.error)S.docs=r.data||[];
}

async function loadCalendarEvents(){
 const r=await db.from('calendar_events')
 .select('*')
 .order('event_date',{ascending:true});

 if(!r.error)S.calendarEvents=r.data||[];
}

async function loadLeaveRequests(){
 let q=db.from('leave_requests')
 .select('*')
 .order('created_at',{ascending:false});

 if(!isAdmin())q=q.eq('user_id',me());

 const r=await q;
 if(!r.error)S.leaveRequests=r.data||[];
}

function subscribe(){
 db.channel('nona-portal')
 .on('postgres_changes',{event:'*',schema:'public',table:'messages'},
  async()=>{
   if(S.page==='communication'){
    await chatLoad();
    render();
   }
  })
 .on('postgres_changes',{event:'*',schema:'public',table:'calendar_events'},
  async()=>{
   await loadCalendarEvents();
   if(S.page==='calendar')render();
  })
 .on('postgres_changes',{event:'*',schema:'public',table:'leave_requests'},
  async()=>{
   await loadLeaveRequests();
   if(S.page==='leave')render();
  })
 .subscribe();
}

function loginPage(err=''){
 document.getElementById('app').innerHTML=`
 <div class="login">
  <div class="loginbox">
   <b style="font-size:23px">Nona Costex</b>
   <div class="small muted" style="margin:4px 0 22px">Staff Portal</div>

   ${err?`<div class="error">${esc(err)}</div>`:''}

   <label class="small muted">Email</label>
   <input id="email" type="email" placeholder="Supabase account email" style="margin:5px 0 13px">

   <label class="small muted">Password</label>
   <input id="pass" type="password" placeholder="Password" style="margin:5px 0 16px">

   <button class="btn" style="width:100%" onclick="login()">Sign in</button>
  </div>
 </div>`;
}

async function login(){
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('pass').value;

 const r=await db.auth.signInWithPassword({email,password});

 if(r.error)return loginPage(r.error.message);

 await enter(r.data.user);
}

async function logout(){
 await db.auth.signOut();
}

function nav(id,label,icon,b=0){
 return `
 <button class="${S.page===id?'active':''}" onclick="go('${id}')">
  ${icon} &nbsp; ${label}
  ${b?`<span class="pill red" style="float:right">${b}</span>`:''}
 </button>`;
}

function go(p){
 S.page=p;
 S.sidebar=false;
 S.modal=null;

 if(p==='communication')chatLoad();
 if(p==='leave')loadLeaveRequests();

 render();
}

function render(){
 if(!S.user)return loginPage();

 const unread=S.notifications.filter(n=>!n.is_read).length;

 document.getElementById('app').innerHTML=`
 <div class="app">

  <aside class="side ${S.sidebar?'open':''}">
   <div class="brand">
    Nona Costex
    <small>Staff Portal</small>
   </div>

   <div class="nav-title">Workspace</div>
   <div class="nav">
    ${nav('dashboard','Dashboard','⌂')}
    ${nav('tasks','Tasks','✓')}
    ${nav('worklogs','Work Logs','▤')}
    ${nav('attendance','Attendance','◷')}
    ${nav('leave','Leave','▱')}
    ${nav('communication','Communication','◌',unread)}
    ${nav('knowledge','Knowledge Hub','▥')}
    ${nav('calendar','Calendar','□')}
   </div>

   ${isAdmin()?`
   <div class="nav-title">Admin</div>
   <div class="nav">
    ${nav('staff','Staff Management','♙')}
    ${nav('analytics','Analytics','▥')}
    ${nav('data','Data Management','↥')}
   </div>`:''}

   <div class="nav-title">Account</div>
   <div class="nav">
    ${nav('profile','My Profile','○')}
   </div>

   <div style="margin-top:18px">
    <button style="width:100%;background:transparent;border:0;text-align:left;padding:10px;color:#777" onclick="logout()">
     ↪ Log out
    </button>
   </div>
  </aside>

  <section class="main">
   <header class="top">
    <div class="row">
     <button class="btn secondary mobile" onclick="S.sidebar=!S.sidebar;render()">☰</button>
     <b>Nona Costex Staff Portal</b>
    </div>

    <div class="row">
     <button class="btn secondary small" onclick="notifications()">
      🔔 ${unread||''}
     </button>

     <div class="row hide">
      <img class="avatar" src="${av(S.profile)}">
      <div>
       <b style="font-size:13px">${esc(S.profile.full_name)}</b>
       <div class="small muted">${esc(S.profile.role)}</div>
      </div>
     </div>
    </div>
   </header>

   <main class="content">
    ${page()}
   </main>
  </section>

 </div>

 ${S.modal?modal():''}
 `;
}

function page(){
 return S.page==='dashboard'?dashboard():
 S.page==='tasks'?tasksPage():
 S.page==='worklogs'?logsPage():
 S.page==='attendance'?attendancePage():
 S.page==='leave'?leavePage():
 S.page==='communication'?chatPage():
 S.page==='knowledge'?knowledge():
 S.page==='calendar'?calendar():
 S.page==='staff'?staff():
 S.page==='analytics'?analytics():
 S.page==='data'?dataPage():
 profilePage();
}

 const done=tasks.filter(x=>x.status==='Completed').length;
 const pct=tasks.length?Math.round(done/tasks.length*100):0;

 return `
 <div class="grid">

  <div>
   <h1 class="title">Dashboard</h1>
   <p class="sub">Welcome back, ${esc((S.profile.full_name||'').split(' ')[0])}.</p>

  <div class="grid four">
   <div class="card stat">

    <span>Total Tasks</span>

  <div class="grid two">

    <div class="row between">

    </div>

    <div class="progress" style="margin-top:10px">

    </div>
   </div>

   <div class="card">
    <div class="row between">
     <b>Attendance</b>
     <button class="btn secondary small" onclick="go('attendance')">Open</button>
    </div>
    <p class="small muted">Check in and check out from the Attendance page.</p>
   </div>
  </div>

  <div class="card">
   <div class="row between">
    <b>Recent Work Logs</b>
    <button class="btn secondary small" onclick="go('worklogs')">View all</button>
   </div>

   ${logs.slice(-4).reverse().map(x=>`
    <div class="knowledge">
     <b style="font-size:13px">${esc(x.task)}</b>
     <div class="small muted">${date(x.date)} · ${esc(x.description)}</div>
    </div>
   `).join('')}
  </div>

 </div>`;
}

/* =========================
   TASKS
========================= */

function tasksPage(){
 let a=[...tasks];

 if(S.taskFilter)a=a.filter(x=>x.status===S.taskFilter);

 if(S.taskSearch){
  const q=S.taskSearch.toLowerCase();
  a=a.filter(x=>
   (x.name+' '+x.description+' '+x.category).toLowerCase().includes(q)
  );
 }

 return `
 <div class="grid">

  <div class="row between wrap">
   <div>
    <h1 class="title">Tasks</h1>
    <p class="sub">Create, edit and manage tasks.</p>
   </div>

   <button class="btn" onclick="openTask()">+ Add Task</button>
  </div>

  <div class="row wrap">
   <input style="max-width:280px"
    placeholder="Search tasks..."
    value="${esc(S.taskSearch)}"
    oninput="S.taskSearch=this.value;render()">

   <select style="max-width:180px"
    onchange="S.taskFilter=this.value;render()">
    <option value="">All status</option>
    ${['Not Started','In Progress','Completed','On Hold'].map(x=>
     `<option ${S.taskFilter===x?'selected':''}>${x}</option>`
    ).join('')}
   </select>
  </div>

  <div class="card" style="overflow:auto">
   <table>
    <thead>
     <tr>
      <th>Task</th>
      <th>Priority</th>
      <th>Due</th>
      <th>Status</th>
      <th>Action</th>
     </tr>
    </thead>

    <tbody>
     ${a.map(t=>`
      <tr>
       <td>
        <b>${esc(t.name)}</b>
        <div class="small muted">${esc(t.category)}</div>
       </td>

       <td>
        <span class="pill ${pclass(t.priority)}">${t.priority}</span>
       </td>

       <td>${date(t.dueDate)} ${t.dueTime||''}</td>

       <td>
        <span class="pill ${sclass(t.status)}">${t.status}</span>
       </td>

       <td>
        <div class="row wrap">
         <button class="btn secondary small" onclick="openTask('${t.id}')">Edit</button>
         <button class="btn danger small" onclick="deleteTask('${t.id}')">Delete</button>
        </div>
       </td>
      </tr>
     `).join('')}
    </tbody>
   </table>
  </div>

 </div>`;
}

function openTask(id){
 const t=id
  ?tasks.find(x=>x.id===id)
  :{
   name:'',
   description:'',
   category:'General',
   priority:'Medium',
   status:'Not Started',
   dueDate:'',
   dueTime:'',
   notes:''
  };

 S.modal={type:'task',data:t};
 render();
}

function saveTask(){
 const g=id=>document.getElementById(id).value;

 const id=g('task-id');

 const d={
  name:g('task-name'),
  description:g('task-desc'),
  category:g('task-cat'),
  priority:g('task-pri'),
  status:g('task-status'),
  dueDate:g('task-date'),
  dueTime:g('task-time'),
  notes:g('task-notes')
 };

 if(!d.name||!d.dueDate){
  return toast('Task name and due date are required.');
 }

 if(id){
  Object.assign(tasks.find(x=>x.id===id),d);
 }else{
  tasks.push({...d,id:'t'+Date.now()});
 }

 save();
 S.modal=null;
 toast('Task saved');
 render();
}

function deleteTask(id){
 if(!confirm('Delete this task?'))return;

 tasks=tasks.filter(x=>x.id!==id);
 save();
 toast('Task deleted');
 render();
}

/* =========================
   WORK LOGS
========================= */

function logsPage(){
 return `
 <div class="grid">

  <div class="row between">
   <div>
    <h1 class="title">Work Logs</h1>
    <p class="sub">Daily work records.</p>
   </div>

   <button class="btn" onclick="openLog()">+ Add Log</button>
  </div>

  <div class="card" style="overflow:auto">
   <table>
    <thead>
     <tr>
      <th>Date</th>

       <td>${calcHours(x.startTime,x.endTime)}</td>

       <td>
        <div class="row">
         <button class="btn secondary small" onclick="openLog('${x.id}')">Edit</button>
         <button class="btn danger small" onclick="delLog('${x.id}')">Delete</button>

function calcHours(a,b){
 if(!a||!b)return '-';

 const [ah,am]=a.split(':').map(Number);
 const [bh,bm]=b.split(':').map(Number);

 let mins=(bh*60+bm)-(ah*60+am);

 if(mins<0)mins+=1440;

 return (mins/60).toFixed(1)+'h';
}

async function loadConversations(){

 .select('conversation_id,profile_id,role')
 .eq('profile_id',me());

 if(m.error){
  S.conversations=[];
  S.conversationMembers=[];
  return;
 }

 S.conversationMembers=m.data||[];

 const ids=[...new Set(
  S.conversationMembers.map(x=>x.conversation_id)
 )];

 if(!ids.length){
  S.conversations=[];
  return;
 }

 const c=await db.from('conversations')
 .select('*')
 .in('id',ids)

async function selectChannel(id){
 S.channel=S.channels.find(x=>x.id===id);
 S.conversation=null;

 await chatLoad();
 render();
}

async function direct(target){
 let cid=null;

 const cs=await db.from('conversations').select('id');

 for(const c of cs.data||[]){
  const mm=await db.from('conversation_members')
   .select('profile_id')
   .eq('conversation_id',c.id);

  const ids=(mm.data||[]).map(x=>x.profile_id);

  if(ids.includes(me())&&ids.includes(target)&&ids.length===2){
   cid=c.id;
   break;
  }
 }

 if(!cid){
  const c=await db.from('conversations')
   .insert({})
   .select()
   .single();

  if(c.error)return toast(c.error.message);

  cid=c.data.id;

  const ins=await db.from('conversation_members')
   .insert([
    {conversation_id:cid,profile_id:me(),role:'member'},
    {conversation_id:cid,profile_id:target,role:'member'}
   ]);

  if(ins.error)return toast(ins.error.message);
 }

 S.conversation={
  id:cid,
  target,
  group:false
 };

 S.channel=null;

 await loadConversationMembers(cid);
 await chatLoad();

 render();
}

async function send(){
 const i=document.getElementById('msg');
 const text=i.value.trim();

 if(!text&&!S.pendingFile)return;

 if(!S.channel&&!S.conversation){
  return toast('Select a channel or person first.');
 }

 const row={
  sender_id:me(),
  message_text:text||null
 };

 if(S.channel)row.channel_id=S.channel.id;
 else row.conversation_id=S.conversation.id;

 if(S.pendingFile){
  row.attachment_name=S.pendingFile.name;
  row.attachment_url=S.pendingFile.url;
  row.attachment_type=S.pendingFile.type;
 }

 const r=await db.from('messages').insert(row);

 if(r.error)return toast(r.error.message);

 i.value='';
 S.pendingFile=null;

 await chatLoad();
 render();
}

async function fileAttach(inp){
 const f=inp.files[0];

 if(!f)return;

 if(f.size>10*1024*1024){
  return toast('File must be under 10 MB.');
 }

 const path=
  'chat/'+me()+'/'+Date.now()+
  '-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');

 const r=await db.storage.from('nona-files').upload(path,f);

 if(r.error)return toast(r.error.message);

 const u=db.storage
  .from('nona-files')
  .getPublicUrl(path).data.publicUrl;

 S.pendingFile={
  name:f.name,
  type:f.type,
  url:u
 };

 render();
}

async function uploadDoc(){
 const i=document.createElement('input');
 i.type='file';

 i.onchange=async()=>{
  const f=i.files[0];
  if(!f)return;

  const title=prompt('Document title',f.name);
  if(!title)return;

  const path=
   'knowledge/'+me()+'/'+Date.now()+
   '-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');

  const u=await db.storage
   .from('nona-files')
   .upload(path,f);

  if(u.error)return toast(u.error.message);

  const url=db.storage
   .from('nona-files')
   .getPublicUrl(path).data.publicUrl;

  const r=await db.from('knowledge_documents').insert({
   title,
   category:'General',
   file_name:f.name,
   file_url:url,
   file_type:f.type,
   uploaded_by:me()
  });

  if(r.error)return toast(r.error.message);

  await docs();
  render();
 };

 i.click();
}

function backup(){
 const a=document.createElement('a');

 a.href=URL.createObjectURL(
  new Blob(
   [JSON.stringify({tasks,logs,attendance},null,2)],
   {type:'application/json'}
  )
 );

 a.download='nona-staff-portal-backup.json';
 a.click();
}

function restore(i){
 const r=new FileReader();

 r.onload=()=>{
  try{
   const x=JSON.parse(r.result);

   tasks=x.tasks||tasks;
   logs=x.logs||logs;
   attendance=x.attendance||attendance;

   save();
   render();
   toast('Restored');
  }catch(e){
   toast('Invalid backup');
  }
 };

 r.readAsText(i.files[0]);
}

    <label class="small muted">Group Name</label>
    <input id="group-name" placeholder="e.g. Digital Team">

    <div class="small muted" style="margin:15px 0 8px">
     Select Members
    </div>

    <div class="grid" style="max-height:330px;overflow:auto">

     ${S.profiles
      .filter(p=>p.id!==me())
      .map(p=>`
       <label
        class="row"
        style="padding:8px;border:1px solid #eee;border-radius:8px">

        <input
         class="group-member"
         type="checkbox"
         value="${p.id}"
         style="width:auto">

        <img class="avatar" src="${av(p)}">

        <span>
         ${esc(p.full_name)}
         <small class="muted">${esc(p.position||'')}</small>
        </span>

       </label>
      `).join('')}

    </div>

    <div class="row" style="justify-content:flex-end;margin-top:16px">
     <button class="btn secondary" onclick="S.modal=null;render()">Cancel</button>
     <button class="btn" onclick="saveGroup()">Create Group</button>
    </div>

   </div>
  </div>`;
 }

 if(m.type==='group-members'){
  const ids=new Set(
   S.conversationMembers.map(x=>x.profile_id)
  );

  return `
  <div class="modalbg">
   <div class="modal">

    <div class="row between">
     <h2>Manage Members</h2>
     <button class="btn secondary" onclick="S.modal=null;render()">×</button>
    </div>

    <div class="small muted" style="margin:8px 0">
     Current Members
    </div>

    ${S.conversationMembers.map(x=>{
     const p=S.profiles.find(y=>y.id===x.profile_id);

     return `
     <div
      class="row between"
      style="padding:8px 0;border-bottom:1px solid #eee">

      <div class="row">
       <img class="avatar" src="${av(p)}">

       <div>
        <b>${esc(p?.full_name||'User')}</b>
        <div class="small muted">${x.role}</div>
       </div>
      </div>

      ${x.profile_id!==me()
       ?`<button class="btn danger small" onclick="removeMember('${x.profile_id}')">Remove</button>`
       :'<span class="small muted">You</span>'}

     </div>`;
    }).join('')}

    <div class="small muted" style="margin:16px 0 8px">
     Add Members
    </div>

    <div class="grid" style="max-height:250px;overflow:auto">

     ${S.profiles
      .filter(p=>p.id!==me()&&!ids.has(p.id))
      .map(p=>`
       <label
        class="row"
        style="padding:8px;border:1px solid #eee;border-radius:8px">

        <input
         class="group-add-member"
         type="checkbox"
         value="${p.id}"
         style="width:auto">

        <img class="avatar" src="${av(p)}">

        <span>${esc(p.full_name)}</span>

       </label>
      `).join('')||
      '<div class="small muted">Everyone is already in this group.</div>'}

    </div>

    <div class="row" style="justify-content:flex-end;margin-top:16px">
     <button class="btn secondary" onclick="S.modal=null;render()">Close</button>
     <button class="btn" onclick="saveMembers()">Add Selected</button>
    </div>

   </div>
  </div>`;
 }

 return '';
}

init();
</script>
</body>
</html>
