<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nona Costex Staff Portal</title>

<style>
*{box-sizing:border-box}
:root{
  --bg:#f5f5f1;
  --card:#ffffff;
  --text:#252823;
  --muted:#777b73;
  --line:#e4e5df;
  --accent:#68705b;
  --accent-dark:#515847;
  --soft:#eef0e9;
  --danger:#b85b5b;
  --warning:#b38a45;
  --success:#668064;
  --sidebar:#30352f;
}
body{
  margin:0;
  font-family:Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.login-box{
  width:100%;
  max-width:420px;
  background:white;
  border:1px solid var(--line);
  border-radius:20px;
  padding:34px;
  box-shadow:0 15px 40px rgba(0,0,0,.06);
}
.logo{
  font-size:25px;
  font-weight:700;
  letter-spacing:-.5px;
}
.logo-sub{
  color:var(--muted);
  margin-top:6px;
  font-size:13px;
}
.form-group{margin-bottom:16px}
label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:7px;
}
input,select,textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px 12px;
  background:#fff;
  color:var(--text);
  outline:none;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--accent);
}
textarea{min-height:100px;resize:vertical}

.btn{
  border:0;
  border-radius:10px;
  padding:10px 15px;
  background:var(--accent);
  color:white;
  font-weight:600;
}
.btn:hover{background:var(--accent-dark)}
.btn.secondary{
  background:var(--soft);
  color:var(--text);
}
.btn.danger{background:#f5e5e5;color:var(--danger)}
.btn.small{padding:7px 10px;font-size:12px}

.app{
  display:none;
  min-height:100vh;
}
.sidebar{
  width:245px;
  background:var(--sidebar);
  color:white;
  position:fixed;
  top:0;
  left:0;
  bottom:0;
  padding:22px 14px;
  overflow-y:auto;
  z-index:1000;
}
.sidebar-brand{
  padding:8px 12px 25px;
}
.sidebar-brand h2{
  margin:0;
  font-size:20px;
}
.sidebar-brand span{
  display:block;
  margin-top:5px;
  color:#b9beb5;
  font-size:11px;
}
.nav-section{
  color:#92998f;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
  padding:12px;
}
.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  color:#d9ddd6;
  padding:11px 12px;
  border-radius:9px;
  text-align:left;
  margin-bottom:3px;
  display:flex;
  align-items:center;
  gap:10px;
}
.nav-btn:hover,.nav-btn.active{
  background:#454b43;
  color:white;
}
.nav-icon{
  width:18px;
  height:18px;
  flex:none;
}
.main{
  margin-left:245px;
  min-height:100vh;
}
.topbar{
  height:70px;
  background:white;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:900;
}
.page-title{
  font-size:21px;
  font-weight:700;
}
.top-actions{
  display:flex;
  align-items:center;
  gap:10px;
}
.icon-btn{
  width:38px;
  height:38px;
  border:1px solid var(--line);
  background:white;
  border-radius:10px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}
.icon-btn svg{width:18px;height:18px}
.badge-count{
  position:absolute;
  right:-4px;
  top:-4px;
  min-width:17px;
  height:17px;
  padding:0 4px;
  background:#b85b5b;
  color:white;
  border-radius:20px;
  font-size:9px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.user-mini{
  display:flex;
  align-items:center;
  gap:9px;
  margin-left:5px;
}
.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  background:var(--soft);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  overflow:hidden;
}
.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.user-mini-text strong{
  display:block;
  font-size:12px;
}
.user-mini-text span{
  display:block;
  color:var(--muted);
  font-size:10px;
}
.content{
  padding:28px;
  max-width:1500px;
  margin:auto;
}
.mobile-menu{
  display:none;
}
.grid{
  display:grid;
  gap:16px;
}
.stats{
  grid-template-columns:repeat(5,1fr);
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  padding:18px;
}
.stat-label{
  color:var(--muted);
  font-size:12px;
}
.stat-value{
  font-size:27px;
  font-weight:700;
  margin-top:8px;
}
.stat-note{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}
.two-col{
  grid-template-columns:1.4fr 1fr;
}
.three-col{
  grid-template-columns:repeat(3,1fr);
}
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}
.section-head h3{
  margin:0;
  font-size:16px;
}
.muted{color:var(--muted)}
.small-text{font-size:12px}
.list{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.list-item{
  padding:12px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#fff;
}
.list-item-title{
  font-weight:600;
  font-size:13px;
}
.list-item-meta{
  margin-top:5px;
  font-size:11px;
  color:var(--muted);
}
.status{
  display:inline-flex;
  align-items:center;
  border-radius:20px;
  padding:4px 8px;
  font-size:10px;
  font-weight:600;
}
.status.pending{background:#f5f0df;color:#927438}
.status.progress{background:#e9edf2;color:#617184}
.status.completed{background:#e8f0e6;color:#60775d}
.status.overdue{background:#f6e5e5;color:#a45252}
.status.approved{background:#e8f0e6;color:#60775d}
.status.rejected{background:#f6e5e5;color:#a45252}

.table-wrap{
  overflow-x:auto;
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  text-align:left;
  padding:12px 10px;
  border-bottom:1px solid var(--line);
  font-size:12px;
  white-space:nowrap;
}
th{
  color:var(--muted);
  font-weight:600;
  background:#fafaf8;
}
.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}
.toolbar>*{max-width:220px}

.progress{
  width:100%;
  height:8px;
  background:#eceee9;
  border-radius:20px;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  background:var(--accent);
  border-radius:20px;
}

.leave-card{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.leave-number{
  font-size:32px;
  font-weight:700;
}
.leave-label{
  color:var(--muted);
  font-size:11px;
}

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(20,23,20,.48);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:2000;
}
.modal{
  background:white;
  width:100%;
  max-width:680px;
  max-height:90vh;
  overflow:auto;
  border-radius:18px;
  padding:24px;
}
.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}
.modal-head h3{margin:0}
.close{
  border:0;
  background:var(--soft);
  width:34px;
  height:34px;
  border-radius:50%;
}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.full{grid-column:1/-1}
.modal-footer{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:20px;
}

.calendar-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}
.calendar-title{
  font-weight:700;
}
.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
}
.cal-week{
  background:#f8f8f5;
  padding:9px;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.cal-day{
  min-height:105px;
  padding:8px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  background:white;
}
.cal-day.muted-day{
  background:#fafaf8;
  color:#b8bbb4;
}
.cal-day.today{
  background:#f0f2ec;
}
.day-num{
  font-size:11px;
  font-weight:700;
  margin-bottom:6px;
}
.cal-event{
  display:block;
  padding:4px 5px;
  border-radius:5px;
  background:#edf0e9;
  margin-bottom:4px;
  font-size:9px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.cal-event.task{background:#e9edf2}
.cal-event.leave{background:#f5f0df}
.cal-event.overdue{background:#f6e5e5}

.notification{
  padding:13px;
  border-bottom:1px solid var(--line);
}
.notification.unread{
  background:#f5f7f2;
}
.notification-title{
  font-size:13px;
  font-weight:600;
}
.notification-message{
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}
.notification-time{
  font-size:9px;
  color:#999;
  margin-top:6px;
}

.timeline{
  border-left:2px solid var(--line);
  padding-left:17px;
  margin-left:5px;
}
.timeline-item{
  position:relative;
  margin-bottom:18px;
}
.timeline-item:before{
  content:"";
  position:absolute;
  left:-24px;
  top:3px;
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--accent);
}
.timeline-action{
  font-size:12px;
  font-weight:600;
}
.timeline-detail{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}
.timeline-time{
  font-size:9px;
  color:#999;
  margin-top:4px;
}

.photo-upload{
  display:flex;
  align-items:center;
  gap:15px;
}
.big-avatar{
  width:80px;
  height:80px;
  border-radius:50%;
  background:var(--soft);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:25px;
  font-weight:700;
}
.big-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#30352f;
  color:white;
  padding:12px 16px;
  border-radius:10px;
  font-size:12px;
  z-index:4000;
  opacity:0;
  transform:translateY(10px);
  transition:.2s;
}
.toast.show{
  opacity:1;
  transform:translateY(0);
}

@media(max-width:1100px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .two-col{grid-template-columns:1fr}
}
@media(max-width:800px){
  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
  }
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .mobile-menu{
    display:flex;
    width:36px;
    height:36px;
    border:1px solid var(--line);
    border-radius:9px;
    background:white;
    align-items:center;
    justify-content:center;
    margin-right:10px;
  }
  .topbar{
    padding:0 15px;
  }
  .content{padding:18px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:1fr}
  .full{grid-column:auto}
  .cal-day{min-height:75px;padding:5px}
  .cal-event{font-size:8px}
  .user-mini-text{display:none}
}
@media(max-width:500px){
  .stats{grid-template-columns:1fr 1fr}
  .stat-value{font-size:22px}
  .page-title{font-size:18px}
  .top-actions .user-mini{display:none}
  .calendar{font-size:9px}
  .cal-week{padding:6px 3px}
  .cal-day{min-height:62px}
}
</style>
</head>

<body>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <div class="logo">Nona Costex</div>
    <div class="logo-sub">Staff Portal</div>

    <div style="height:25px"></div>

    <form id="loginForm">
      <div class="form-group">

</div>

<div id="app" class="app">

<aside id="sidebar" class="sidebar">
  <div class="sidebar-brand">
    <h2>Nona Costex</h2>
    <span>Staff Portal</span>
  </div>

  <div class="nav-section">Main</div>

  <button class="nav-btn active" data-page="dashboard">
    <span class="nav-icon">⌂</span> Dashboard
  </button>

  <button class="nav-btn" data-page="tasks">

  <button class="nav-btn" data-page="worklogs">
    <span class="nav-icon">▤</span> Work Logs
  </button>

  <button class="nav-btn" data-page="attendance">
    <span class="nav-icon">◷</span> Attendance
  </button>

  <button class="nav-btn" data-page="leave">
    <span class="nav-icon">□</span> Leave
  </button>

  <button class="nav-btn" data-page="schedule">
    <span class="nav-icon">▦</span> Schedule
  </button>

  <button class="nav-btn" data-page="announcements">
    <span class="nav-icon">◉</span> Announcements
  </button>

  <button class="nav-btn" data-page="notifications">
    <span class="nav-icon">♢</span> Notifications
    <span id="sideNotifCount" class="badge-count hidden">0</span>

  <div id="adminNav" class="hidden">
    <div class="nav-section">Admin</div>

    <button class="nav-btn" data-page="staff">
      <span class="nav-icon">♙</span> Staff Management
    </button>

    <button class="nav-btn" data-page="analytics">
      <span class="nav-icon">▥</span> Analytics
    </button>

    <button class="nav-btn" data-page="activity">
      <span class="nav-icon">◌</span> Activity History
    </button>

    <button class="nav-btn" data-page="backup">
      <span class="nav-icon">↓</span> Backup & Data
    </button>
  </div>

  <div class="nav-section">Account</div>

  <button class="nav-btn" data-page="profile">
    <span class="nav-icon">◎</span> My Profile
  </button>

  <button id="logoutBtn" class="nav-btn">
    <span class="nav-icon">↪</span> Logout
  </button>
</aside>

<main class="main">

<header class="topbar">
  <div style="display:flex;align-items:center">
    <button id="mobileMenu" class="mobile-menu">☰</button>
    <div id="pageTitle" class="page-title">Dashboard</div>
  </div>

  <div class="top-actions">
    <button class="icon-btn" onclick="openPage('notifications')">
      ♢
      <span id="topNotifCount" class="badge-count hidden">0</span>

    <div class="user-mini">

      <div class="user-mini-text">

        <span id="topUserRole">Staff</span>
      </div>
    </div>
  </div>
</header>

<div id="content" class="content"></div>

</main>
</div>

<div id="modalBg" class="modal-bg hidden">
  <div id="modal" class="modal"></div>
</div>

<div id="toast" class="toast"></div>

<script>
/* =========================
   STORAGE
========================= */

const KEYS = {
  logs:'nona_logs',
  leaves:'nona_leaves',
  attendance:'nona_attendance',
  staff:'nona_staff',
  schedules:'nona_schedules',
  announcements:'nona_announcements',
  notifications:'nona_notifications',
  activity:'nona_activity',
  photos:'nona_photo_',
  tasks:'nona_tasks'
};

let currentUser = null;
let currentPage = 'dashboard';
let calendarDate = new Date();

function get(key, fallback=[]){
  try{
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  }catch(e){
    return fallback;
  }
}

function set(key,value){
  localStorage.setItem(key,JSON.stringify(value));
}

function uid(prefix='id'){
  return prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
}

function esc(value=''){
  return String(value)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

function today(){
  return new Date().toISOString().slice(0,10);
}

function formatDate(date){
  if(!date)return '-';
  const d = new Date(date + 'T00:00:00');
  return d.toLocaleDateString('en-GB',{
    day:'2-digit',
    month:'short',
    year:'numeric'
  });
}

function formatDateTime(value){
  if(!value)return '-';
  const d = new Date(value);
  return d.toLocaleString('en-GB',{
    day:'2-digit',
    month:'short',
    year:'numeric',
    hour:'2-digit',
    minute:'2-digit'
  });
}

function showToast(message){
  const el=document.getElementById('toast');
  el.textContent=message;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
}

/* =========================
   INITIAL DATA
========================= */

function initData(){

  if(!localStorage.getItem(KEYS.staff)){
    set(KEYS.staff,[
      {
        id:'NC001',
        name:'Atikah',
        code:'NC001',
        department:'Digital',
        position:'Live Host Online & Offline',
        status:'Active',
        joiningDate:'2026-09-02',
        email:'',
        phone:'',
        leaveEntitlement:12
      },
      {
        id:'NC002',
        name:'Temporary Staff 1',
        code:'NC002',
        department:'Digital',
        position:'Temporary Staff',
        status:'Active',
        joiningDate:'2026-09-02',
        email:'',
        phone:'',
        leaveEntitlement:12
      },
      {
        id:'NC003',
        name:'Temporary Staff 2',
        code:'NC003',
        department:'Digital',
        position:'Temporary Staff',
        status:'Active',
        joiningDate:'2026-09-02',
        email:'',
        phone:'',
        leaveEntitlement:12
      }
    ]);
  }else{
    const staff=get(KEYS.staff);
    let changed=false;

    staff.forEach(s=>{
      if(s.leaveEntitlement===undefined){
        s.leaveEntitlement=12;
        changed=true;
      }
    });

    if(changed)set(KEYS.staff,staff);
  }

  if(!localStorage.getItem(KEYS.logs)){
    set(KEYS.logs,[
      {
        id:uid('log'),
        staffId:'NC001',
        title:'Budget quotation completed and presented to team + Flite product shoot',
        workDate:'2026-09-07',
        startTime:'',
        endTime:'',
        dueDate:'',
        dueTime:'',
        priority:'Medium',
        status:'Completed',
        description:'Budget quotation was completed and presented to the team. Product shooting for Flite was also completed.'
      },
      {
        id:uid('log'),
        staffId:'NC001',
        title:'Product shooting + content brainstorming',
        workDate:'2026-09-08',
        startTime:'',
        endTime:'',
        dueDate:'',
        dueTime:'',
        priority:'Medium',
        status:'Completed',
        description:'Continued product shooting and brainstormed content ideas.'
      },
      {
        id:uid('log'),
        staffId:'NC001',
        title:'Budget quotation for live setup + social media content shooting',
        workDate:'2026-09-09',
        startTime:'',
        endTime:'',
        dueDate:'',
        dueTime:'',
        priority:'Medium',
        status:'Completed',
        description:'Presented budget quotation for live setup and shot social media content.'
      },
      {
        id:uid('log'),
        staffId:'NC001',
        title:'Content shooting and video editing',
        workDate:'2026-09-10',
        startTime:'',
        endTime:'',
        dueDate:'',
        dueTime:'',
        priority:'Medium',
        status:'Completed',
        description:'Content shooting and video editing.'
      }
    ]);

/* =========================
   TASK HELPERS
========================= */

function taskOverdue(task){
  if(task.status==='Completed')return false;
  if(!task.dueDate)return false;

  const due=new Date(
    task.dueDate+'T'+(task.dueTime || '23:59')
  );

  return due < new Date();
}

function taskStatusClass(status){
  if(status==='Completed')return 'completed';
  if(status==='In Progress')return 'progress';
  return 'pending';
}

function completionRate(tasks){
  if(!tasks.length)return 0;
  return Math.round(
    tasks.filter(t=>t.status==='Completed').length /
    tasks.length * 100
  );
}

/* =========================
   LEAVE
========================= */

function approvedLeaveDays(staffId){
  const leaves=get(KEYS.leaves)
    .filter(l=>l.staffId===staffId && l.status==='Approved');

  let total=0;

  leaves.forEach(l=>{
    if(l.startDate && l.endDate){
      const start=new Date(l.startDate+'T00:00:00');
      const end=new Date(l.endDate+'T00:00:00');

      const diff=Math.floor(
        (end-start)/(1000*60*60*24)
      )+1;

      total += Math.max(diff,1);
    }else{
      total += Number(l.days || 1);
    }
  });

  return total;
}

function leaveBalance(staffId){
  const staff=findStaff(staffId);

  if(!staff)return {
    entitlement:0,
    used:0,
    left:0
  };

  const entitlement=Number(staff.leaveEntitlement || 0);
  const used=approvedLeaveDays(staffId);

  return {
    entitlement,
    used,
    left:Math.max(entitlement-used,0)
  };
}

function filterTasks(){

  let tasks=visibleTasks();

  const search=
    document.getElementById('taskSearch')
    ?.value.toLowerCase() || '';

  const status=
    document.getElementById('taskStatusFilter')
    ?.value || '';

  const staff=
    document.getElementById('taskStaffFilter')
    ?.value || '';

  tasks=tasks.filter(t=>{
    const matchSearch=
      t.title.toLowerCase().includes(search) ||
      (t.description||'').toLowerCase().includes(search);

    let matchStatus=true;

    if(status==='Overdue'){
      matchStatus=taskOverdue(t);
    }else if(status){
      matchStatus=t.status===status;
    }

    const matchStaff=
      !staff || t.staffId===staff;

    return matchSearch && matchStatus && matchStaff;
  });

  renderTaskTable(tasks);
}

function updateTaskStatus(id){

  const tasks=get(KEYS.tasks);
  const task=tasks.find(t=>t.id===id);

  if(!task)return;

  const next=prompt(
    'Enter status:\nPending\nIn Progress\nCompleted',
    task.status
  );

  if(!['Pending','In Progress','Completed'].includes(next))
    return;

  const old=task.status;
  task.status=next;

  if(!task.history)task.history=[];

  task.history.push({
    action:'Status changed',
    detail:old+' → '+next,
    by:currentUser.name,
    at:new Date().toISOString()
  });

  set(KEYS.tasks,tasks);

  addActivity(
    'Task Status Updated',
    task.title+': '+old+' → '+next
  );

  if(next==='Completed'){
    addNotification(
      'admin',
      'Task completed',
      currentUser.name+' completed: '+task.title,
      'task'
    );
  }

  showToast('Task status updated');
  renderPage();
}

function deleteTask(id){

  if(!confirm('Delete this task?'))return;

  const tasks=get(KEYS.tasks);
  const task=tasks.find(t=>t.id===id);

  set(

    tasks.filter(t=>t.id!==id)
  );

  if(task){
    addActivity(
      'Task Deleted',
      'Deleted task: '+task.title

  showToast('Task deleted');
  renderPage();
}

function filterLogs(){

  let logs=visibleLogs();

  const search=
    document.getElementById('logSearch')
    ?.value.toLowerCase() || '';

  const status=
    document.getElementById('logStatus')?.value || '';

  logs=logs.filter(l=>
    (
      l.title.toLowerCase().includes(search) ||
      (l.description||'').toLowerCase().includes(search)
    ) &&
    (!status || l.status===status)
  );

  renderLogTable(logs);

function clockIn(){

  const arr=get(KEYS.attendance);

  let record=arr.find(a=>
    a.staffId===userStaffId() &&
    a.date===today()
  );

  if(record)return;

  record={
    id:uid('att'),
    staffId:userStaffId(),
    date:today(),
    clockIn:new Date().toLocaleTimeString('en-GB',{
      hour:'2-digit',
      minute:'2-digit'
    }),
    clockOut:''
  };

  arr.push(record);
  set(KEYS.attendance,arr);

  addActivity('Clock In','Clocked in');
  showToast('Clocked in');
  renderPage();
}

function clockOut(){

  const arr=get(KEYS.attendance);

  const record=arr.find(a=>
    a.staffId===userStaffId() &&
    a.date===today()
  );

  if(!record)return;

  record.clockOut=new Date().toLocaleTimeString('en-GB',{
    hour:'2-digit',
    minute:'2-digit'
  });

  set(KEYS.attendance,arr);

  addActivity('Clock Out','Clocked out');
  showToast('Clocked out');
  renderPage();
}

        <button class="btn small secondary"
          onclick="changeMonth(-1)">
          ← Previous
        </button>

        <div id="calendarTitle"
          class="calendar-title"></div>

        <button class="btn small secondary"
          onclick="changeMonth(1)">
          Next →
        </button>
      </div>

      <div id="calendar"></div>

    </div>
  `;

  renderCalendar();
}

function changeMonth(amount){
  calendarDate.setMonth(
    calendarDate.getMonth()+amount
  );

  renderCalendar();
}

function renderCalendar(){

  const year=calendarDate.getFullYear();
  const month=calendarDate.getMonth();

  document.getElementById('calendarTitle').textContent=
    calendarDate.toLocaleDateString('en-GB',{
      month:'long',
      year:'numeric'
    });

  const first=new Date(year,month,1);
  const last=new Date(year,month+1,0);

  let html=`
    <div class="calendar">
      ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun']
        .map(d=>`<div class="cal-week">${d}</div>`).join('')}
  `;

  let start=first.getDay();
  start=start===0?6:start-1;

  for(let i=0;i<start;i++){
    html+=`
      <div class="cal-day muted-day"></div>
    `;
  }

  const schedules=visibleSchedules();
  const tasks=visibleTasks();
  const leaves=visibleLeaves();

  for(let day=1;day<=last.getDate();day++){

    const date=
      `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

    const isToday=date===today();

    const daySchedules=schedules.filter(s=>s.date===date);
    const dayTasks=tasks.filter(t=>
      t.dueDate===date
    );
    const dayLeaves=leaves.filter(l=>
      date>=l.startDate &&
      date<=l.endDate
    );

    html+=`
      <div class="cal-day ${isToday?'today':''}"
        onclick="calendarDateClick('${date}')">

        <div class="day-num">${day}</div>

        ${daySchedules.map(s=>`
          <span class="cal-event">
            ${esc(s.time||'')} ${esc(s.title)}
          </span>
        `).join('')}

        ${dayTasks.map(t=>`
          <span class="cal-event ${
            taskOverdue(t)?'overdue':'task'
          }">
            Task: ${esc(t.title)}
          </span>
        `).join('')}

        ${dayLeaves.map(l=>`
          <span class="cal-event leave">
            Leave: ${esc(l.type)}
          </span>
        `).join('')}

      </div>
    `;
  }

  const totalCells=
    start+last.getDate();

  const remaining=
    totalCells%7===0
    ? 0
    : 7-(totalCells%7);

  for(let i=0;i<remaining;i++){
    html+=`
      <div class="cal-day muted-day"></div>
    `;
  }

  html+='</div>';

  document.getElementById('calendar').innerHTML=html;
}

function calendarDateClick(date){

  const schedules=visibleSchedules()
    .filter(s=>s.date===date);

  const tasks=visibleTasks()
    .filter(t=>t.dueDate===date);

  const leaves=visibleLeaves()
    .filter(l=>date>=l.startDate && date<=l.endDate);

  document.getElementById('modal').innerHTML=`

            ${esc(l.status)}

function downloadBackup(){

  const backup={};

  Object.values(KEYS).forEach(key=>{
    if(key.endsWith('_'))return;

    backup[key]=get(key,[]);
  });

  const photos={};

  staffList().forEach(s=>{
    const photo=
      localStorage.getItem(KEYS.photos+s.id);

    if(photo)photos[s.id]=photo;
  });

  backup.photos=photos;

  const blob=new Blob(
    [JSON.stringify(backup,null,2)],
    {type:'application/json'}
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement('a');
  a.href=url;
  a.download=
    'nona-costex-backup-'+today()+'.json';

  a.click();

  URL.revokeObjectURL(url);

  showToast('Backup downloaded');
}

function restoreBackup(){

  const input=document.getElementById('restoreFile');

  if(!input.files.length){
    alert('Please select a backup file.');
    return;
  }

  if(!confirm(
    'Restore this backup? Existing portal data may be replaced.'
  ))return;

  const reader=new FileReader();

  reader.onload=e=>{
    try{

      const backup=JSON.parse(e.target.result);

      Object.keys(KEYS).forEach(key=>{
        if(
          !key.endsWith('_') &&
          backup[key]!==undefined
        ){
          set(key,backup[key]);
        }
      });

      if(backup.photos){
        Object.entries(backup.photos).forEach(
          ([id,photo])=>{
            localStorage.setItem(
              KEYS.photos+id,
              photo
            );
          }
        );
      }

      showToast('Backup restored');

      setTimeout(()=>{
        location.reload();
      },700);

    }catch(err){
      alert('Invalid backup file.');
    }
  };

  reader.readAsText(input.files[0]);
}

/* =========================
   CSV EXPORT
========================= */

function exportCSV(type){

  let data=[];
  let filename='export.csv';

  if(type==='tasks'){
    data=get(KEYS.tasks).map(t=>({
      Task:t.title,
      Staff:findStaff(t.staffId)?.name||'',
      Due_Date:t.dueDate,
      Due_Time:t.dueTime,
      Priority:t.priority,
      Status:t.status
    }));

    filename='nona-tasks.csv';
  }

  if(type==='logs'){
    data=get(KEYS.logs).map(l=>({
      Task:l.title,
      Staff:findStaff(l.staffId)?.name||'',
      Work_Date:l.workDate,
      Due_Date:l.dueDate,
      Status:l.status,
      Priority:l.priority
    }));

    filename='nona-work-logs.csv';
  }

  if(type==='attendance'){
    data=get(KEYS.attendance).map(a=>({
      Staff:findStaff(a.staffId)?.name||'',
      Date:a.date,
      Clock_In:a.clockIn,
      Clock_Out:a.clockOut
    }));

    filename='nona-attendance.csv';
  }

  if(type==='leaves'){
    data=get(KEYS.leaves).map(l=>({
      Staff:findStaff(l.staffId)?.name||'',
      Type:l.type,
      Start_Date:l.startDate,
      End_Date:l.endDate,
      Days:l.days,
      Status:l.status,
      Reason:l.reason
    }));

    filename='nona-leave.csv';
  }

  if(!data.length){
    alert('No data to export.');
    return;
  }

  const headers=Object.keys(data[0]);

  const csv=[
    headers.join(','),
    ...data.map(row=>
      headers.map(h=>
        `"${String(row[h]??'')
          .replaceAll('"','""')}"`
      ).join(',')
    )
  ].join('\n');

  const blob=new Blob(
    [csv],
    {type:'text/csv;charset=utf-8;'}
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement('a');
  a.href=url;
  a.download=filename;
  a.click();

  URL.revokeObjectURL(url);

  showToast('CSV exported');
}

/* Generate overdue notifications */
function generateOverdueNotifications(){

  const tasks=get(KEYS.tasks);

  tasks.forEach(t=>{

    if(!taskOverdue(t))return;

    const notifications=get(KEYS.notifications);

    const already=notifications.some(n=>
      n.staffId===t.staffId &&
      n.type==='overdue' &&
      n.message.includes(t.id)
    );

    if(!already){
      addNotification(
        t.staffId,
        'Task overdue',
        'Task '+t.title+' is overdue. ['+t.id+']',
        'overdue'
      );
    }
  });
}

generateOverdueNotifications();
