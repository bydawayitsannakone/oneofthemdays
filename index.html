<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nona Costex Staff Portal V10</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Helvetica,Arial,sans-serif;
  background:#f4f4f1;
  color:#292b27;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* LOGIN */

.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:#ecece7;
}

.loginbox{
  width:min(420px,100%);
  background:#fff;
  padding:36px;
  border:1px solid #ddd;
  border-radius:20px;
  box-shadow:0 15px 45px #0000000b;
}

.logo{
  width:55px;
  height:55px;
  border-radius:15px;
  background:#34382f;
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:700;
  margin-bottom:20px;
}

.login h1{
  font-size:25px;
}

.muted{
  color:#888;
  font-size:12px;
}

.fg{
  margin:14px 0;
}

.fg label{
  display:block;
  font-size:12px;
  font-weight:600;
  margin-bottom:6px;
}

.fg input,
.fg select,
.fg textarea,
.filters input,
.filters select{
  width:100%;
  padding:11px;
  border:1px solid #ddd;
  border-radius:9px;
  background:#fff;
  outline:none;
}

.fg textarea{
  min-height:85px;
  resize:vertical;
}

.loginbtn{
  width:100%;
  margin-top:5px;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#34382f;
  color:#fff;
  font-weight:700;
}

.demo{
  margin-top:16px;
  padding:12px;
  background:#f4f4f1;
  border-radius:9px;
  font-size:11px;
  line-height:1.7;
}

/* SIDEBAR */

.side{
  position:fixed;
  inset:0 auto 0 0;
  width:240px;
  background:#30342c;
  color:#fff;
  padding:24px 14px;
  z-index:50;
  overflow:auto;
}

.brand{
  display:flex;
  gap:10px;
  align-items:center;
  padding:0 10px;
  margin-bottom:28px;
}

.brand b{
  font-size:14px;
}

.brand small{
  display:block;
  color:#aaa;
  font-size:9px;
  margin-top:2px;
}

.brandicon{
  width:40px;
  height:40px;
  background:#fff;
  color:#30342c;
  border-radius:11px;
  display:grid;
  place-items:center;
  font-weight:700;
}

.nt{
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:#9da198;
  margin:18px 12px 7px;
}

.nav{
  width:100%;
  padding:10px 12px;
  border:0;
  border-radius:8px;
  background:none;
  color:#d7d9d2;
  text-align:left;
  font-size:12px;
  margin:2px 0;
}

.nav:hover,
.nav.active{
  background:#454a40;
  color:#fff;
}

.sidebottom{
  border-top:1px solid #4b5048;
  margin-top:25px;
  padding-top:14px;
}

.miniuser{
  padding:8px 12px;
}

.miniuser b{
  display:block;
  font-size:12px;
}

.miniuser span{
  font-size:10px;
  color:#aaa;
}

.logout{
  width:100%;
  padding:9px 12px;
  border:1px solid #555a51;
  background:none;
  color:#ddd;
  border-radius:8px;
  text-align:left;
  font-size:11px;
}

/* MAIN */

.main{
  margin-left:240px;
  min-height:100vh;
}

.top{
  height:70px;
  background:#fff;
  border-bottom:1px solid #e1e1dc;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:30;
}

.hamb{
  display:none;
  border:0;
  background:#eee;
  width:36px;
  height:36px;
  border-radius:8px;
}

.title{
  font-size:18px;
  font-weight:700;
}

.content{
  padding:25px 28px;
  max-width:1500px;
}

.grid4{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.card{
  background:#fff;
  border:1px solid #e1e1dc;
  border-radius:14px;
  margin-bottom:18px;
  overflow:hidden;
}

.head{
  padding:17px 19px;
  border-bottom:1px solid #eee;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.head h3{
  font-size:14px;
}

.body{
  padding:19px;
}

.stat{
  background:#fff;
  border:1px solid #e1e1dc;
  border-radius:14px;
  padding:18px;
}

.stat label{
  display:block;
  color:#888;
  font-size:11px;
  margin-bottom:9px;
}

.stat strong{
  font-size:26px;
}

/* BUTTONS */

.btn{
  border:0;
  border-radius:9px;
  padding:9px 13px;
  font-size:12px;
  font-weight:600;
}

.primary{
  background:#34382f;
  color:#fff;
}

.secondary{
  background:#eeeee9;
  color:#34382f;
}

.danger{
  background:#f4e5e2;
  color:#98463c;
}

.success{
  background:#e5eee5;
  color:#486049;
}

/* TABLE */

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.filters>*{
  min-width:145px;
  flex:0 1 auto;
}

.table{
  overflow:auto;
}

.table table{
  width:100%;
  border-collapse:collapse;
  min-width:720px;
}

.table th{
  font-size:9px;
  text-transform:uppercase;
  color:#888;
  background:#f8f8f5;
  padding:10px;
  text-align:left;
}

.table td{
  font-size:11px;
  padding:12px;
  border-bottom:1px solid #eee;
}

.actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

/* BADGES */

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:20px;
  font-size:9px;
  font-weight:700;
}

.green{
  background:#e5eee5;
  color:#486049;
}

.yellow{
  background:#eeece1;
  color:#776f45;
}

.red{
  background:#f4e5e2;
  color:#98463c;
}

.grey{
  background:#eee;
  color:#777;
}

/* PROGRESS */

.progress{
  height:8px;
  background:#e8e8e3;
  border-radius:20px;
  overflow:hidden;
}

.fill{
  height:100%;
  background:#69705f;
  border-radius:20px;
}

/* NOTICE */

.notice{
  padding:12px;
  background:#f7f7f3;
  border-radius:9px;
  margin-bottom:8px;
}

.notice b{
  font-size:11px;
}

.notice p{
  font-size:10px;
  color:#777;
  margin-top:4px;
  line-height:1.5;
}

.notice small{
  display:block;
  color:#aaa;
  margin-top:5px;
}

.empty{
  text-align:center;
  padding:30px;
  color:#999;
  font-size:11px;
}

/* ACTIVITY */

.activity{
  display:flex;
  gap:10px;
  padding:11px 0;
  border-bottom:1px solid #eee;
}

.dot{
  width:8px;
  height:8px;
  background:#69705f;
  border-radius:50%;
  margin-top:4px;
  flex:none;
}

.activity p{
  font-size:11px;
}

.activity small{
  font-size:9px;
  color:#999;
}

/* MODAL */

.modalbg{
  position:fixed;
  inset:0;
  background:#191b1770;
  display:grid;
  place-items:center;
  padding:20px;
  z-index:100;
}

.modal{
  width:min(620px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:16px;
}

.modalhead{
  padding:16px 19px;
  border-bottom:1px solid #eee;
  display:flex;
  justify-content:space-between;
}

.modalbody{
  padding:19px;
}

.close{
  border:0;
  background:#eee;
  width:30px;
  height:30px;
  border-radius:8px;
}

.formgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.foot{
  display:flex;
  justify-content:flex-end;
  gap:7px;
  margin-top:15px;
}

/* CHART */

.chart{
  height:210px;
  display:flex;
  align-items:flex-end;
  gap:7px;
  padding:15px;
}

.barwrap{
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  gap:4px;
}

.bar{
  width:100%;
  max-width:35px;
  background:#707666;
  border-radius:5px 5px 0 0;
  min-height:3px;
}

.barwrap small{
  font-size:8px;
  color:#999;
}

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.info div{
  background:#f7f7f3;
  padding:11px;
  border-radius:8px;
}

.info label{
  display:block;
  color:#999;
  font-size:9px;
  margin-bottom:3px;
}

.info span{
  font-size:11px;
}

/* MOBILE */

@media(max-width:900px){

  .side{
    transform:translateX(-100%);
    transition:.2s;
  }

  .side.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
  }

  .hamb{
    display:block;
  }

  .top{
    padding:0 16px;
  }

  .content{
    padding:18px 15px;
  }

  .grid4{
    grid-template-columns:1fr 1fr;
  }

  .grid2,
  .grid3{
    grid-template-columns:1fr;
  }

  .formgrid,
  .info{
    grid-template-columns:1fr;
  }
}

@media(max-width:520px){

  .grid4{
    gap:8px;
  }

  .stat{
    padding:14px;
  }

  .stat strong{
    font-size:21px;
  }

  .head{
    align-items:flex-start;
    flex-direction:column;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

/* =========================================================
   STORAGE
========================================================= */

const K = {
  logs:"nona_logs",
  leaves:"nona_leaves",
  attendance:"nona_attendance",
  staff:"nona_staff",
  schedules:"nona_schedules",
  announcements:"nona_announcements",
  activities:"nona_activities",
  notifications:"nona_notifications"
};

let user = null;
let page = "dashboard";


/* =========================================================
   HELPERS
========================================================= */

const get = k => {
  try{
    return JSON.parse(localStorage.getItem(k)) || [];
  }catch(e){
    return [];
  }
};

const save = (k,v) => {
  localStorage.setItem(k,JSON.stringify(v));
};

const id = p =>
  p+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);

const today = () => {
  let d = new Date();

  return d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0");
};

const now = () => {
  let d = new Date();

  return String(d.getHours()).padStart(2,"0")+":"+
    String(d.getMinutes()).padStart(2,"0");
};

const esc = s =>
  String(s ?? "").replace(/[&<>"']/g,x=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[x]));

const attr = esc;

const fd = x => {

  if(!x) return "-";

  let d = new Date(x+"T00:00:00");

  if(isNaN(d)) return "-";

  return d.toLocaleDateString("en-GB",{
    day:"2-digit",
    month:"short",
    year:"numeric"
  });
};


/* =========================================================
   TOAST
========================================================= */

function toast(x){

  let e = document.querySelector(".toast");

  if(e) e.remove();

  e = document.createElement("div");

  e.className = "toast";

  e.style.cssText =
    "position:fixed;right:20px;bottom:20px;"+
    "background:#30342c;color:white;padding:12px 16px;"+
    "border-radius:9px;font-size:11px;z-index:200";

  e.textContent = x;

  document.body.appendChild(e);

  setTimeout(()=>{
    e.remove();
  },2500);
}


/* =========================================================
   ACTIVITY + NOTIFICATIONS
========================================================= */

function act(text){

  let a = get(K.activities);

  a.unshift({
    id:id("act"),
    text,
    date:new Date().toISOString()
  });

  save(K.activities,a.slice(0,100));
}


function notify(staffId,text){

  let n = get(K.notifications);

  n.unshift({
    id:id("not"),
    staffId,
    text,
    date:new Date().toISOString(),
    read:false
  });

  save(K.notifications,n.slice(0,100));
}


/* =========================================================
   INITIAL DATA
========================================================= */

        id:"staff1",

        email:"",
        phone:""
      },

      {
        id:"staff2",

        department:"Digital",

        email:"",
        phone:""
      },

      {
        id:"staff3",
        name:"Temporary Staff 2",
        code:"NC003",
        department:"Digital",
        position:"Temporary Staff",
        status:"Active",
        joining:"2026-09-01",
        email:"",
        phone:""

  let st = get(K.staff);

    });

    save(K.staff,st);
  }


  if(!localStorage.getItem(K.logs)){

    save(K.logs,[

      {
        id:id("l"),
        staffId:"staff1",
        title:"Budget quotation completed and presented to team",
        date:"2026-09-07",
        dueDate:"2026-09-07",
        dueTime:"18:00",
        priority:"High",
        status:"Completed",
        description:
          "Completed budget quotation, presented it to the team and conducted Flite product shooting."
      },

      {
        id:id("l"),
        staffId:"staff1",
        title:"Product shooting and content brainstorming",
        date:"2026-09-08",
        dueDate:"2026-09-08",
        dueTime:"18:00",
        priority:"Medium",
        status:"Completed",
        description:
          "Continued product shooting and brainstormed social media content ideas."
      },

      {
        id:id("l"),
        staffId:"staff1",
        title:"Live setup quotation and social media shooting",

        dueDate:"2026-09-09",
        dueTime:"18:00",
        priority:"High",

        description:
          "Presented budget quotation for live setup and shot social media content."
      },

      {

  [

  ].forEach(k=>{

      save(k,[]);

  if(!localStorage.getItem(K.schedules)){

        date:"2026-09-02"
      },

      {

        date:"2026-09-09"

/* =========================================================
   LOGIN
========================================================= */

function login(n,p){

  n = n.trim();
  p = p.trim();


  if(
    n.toLowerCase()=="admin" &&
    p.toUpperCase()=="ADMIN001"
  ){

    user = {
      role:"admin",
      name:"Admin",
      code:"ADMIN001"
    };

    page = "dashboard";

    render();

    return;
  }


  let st = get(K.staff).find(s =>
    String(s.name).trim().toLowerCase()==n.toLowerCase() &&
    String(s.code).trim().toUpperCase()==p.toUpperCase()
  );


  if(!st &&
    n.toLowerCase()=="atikah" &&
    p.toUpperCase()=="NC001"
  ){

    st = get(K.staff).find(s =>
      String(s.code).toUpperCase()=="NC001"
    );
  }


  if(st){

    user = {
      role:"staff",
      id:st.id,
      name:st.name,
      code:st.code
    };

    page = "dashboard";

    render();

    return;
  }


  toast("Invalid username or password");
}


function loginPage(){

  app.innerHTML = `

  <div class="login">

    <div class="loginbox">

      <div class="logo">NC</div>

      <h1>Nona Costex</h1>

      <p class="muted" style="margin:6px 0 25px">
        Staff Portal
      </p>

      <form
        onsubmit="event.preventDefault();login(loginName.value,loginPass.value)"
      >

        <div class="fg">

          <label>Username</label>

          <input id="loginName" required>

        </div>


        <div class="fg">

          <label>Password / Staff Code</label>

          <input
            id="loginPass"
            type="password"
            required
          >

        </div>


        <button class="loginbtn">
          Login
        </button>

      </form>


      <div class="demo">

        <b>Demo Login</b><br>

        Staff: Atikah / NC001<br>

        Admin: Admin / ADMIN001

      </div>

    </div>

  </div>

  `;
}


/* =========================================================
   NAVIGATION
========================================================= */

function nav(p,t,i){

  return `
    <button
      class="nav ${page==p?"active":""}"
      onclick="go('${p}')"
    >
      ${i} &nbsp; ${t}
    </button>
  `;
}


function sidebar(){

  if(user.role=="admin"){

    return `

      <div class="nt">
        Management
      </div>

      ${nav("dashboard","Dashboard","⌂")}
      ${nav("analytics","Analytics","◈")}
      ${nav("logs","Work Logs","▤")}
      ${nav("attendance","Attendance","◷")}
      ${nav("leaves","Leave Requests","□")}
      ${nav("staff","Staff Management","♙")}

      <div class="nt">
        Planning
      </div>

      ${nav("schedule","Schedule","▦")}
      ${nav("announcements","Announcements","◉")}
      ${nav("activity","Activity History","◌")}

    `;

  }


  return `

    <div class="nt">
      My Workspace
    </div>

    ${nav("dashboard","Dashboard","⌂")}
    ${nav("logs","My Work Logs","▤")}
    ${nav("attendance","Attendance","◷")}
    ${nav("leaves","My Leave","□")}
    ${nav("schedule","Schedule","▦")}

    <div class="nt">
      Account
    </div>

    ${nav("profile","My Profile","♙")}
    ${nav("notifications","Notifications","🔔")}
    ${nav("activity","My Activity","◌")}

  `;
}


function title(){

  return {

    dashboard:"Dashboard",
    analytics:"Analytics",
    logs:user.role=="admin"
      ?"Work Logs"
      :"My Work Logs",
    attendance:"Attendance",
    leaves:user.role=="admin"
      ?"Leave Requests"
      :"My Leave",
    staff:"Staff Management",
    schedule:"Schedule",
    announcements:"Announcements",
    activity:"Activity History",
    profile:"My Profile",
    notifications:"Notifications"

  }[page] || "Dashboard";
}


function render(){

  if(!user){

    loginPage();

    return;
  }


  app.innerHTML = `

    <aside class="side" id="side">

      <div class="brand">

        <div class="brandicon">
          NC
        </div>

        <div>

          <b>Nona Costex</b>

          <small>
            Staff Portal
          </small>

        </div>

      </div>


      ${sidebar()}


      <div class="sidebottom">

        <div class="miniuser">

          <b>${esc(user.name)}</b>

          <span>${esc(user.code)}</span>

        </div>


        <button
          class="logout"
          onclick="user=null;loginPage()"
        >
          Log Out
        </button>

      </div>

    </aside>


    <main class="main">

      <header class="top">

        <div
          style="display:flex;align-items:center;gap:10px"
        >

          <button
            class="hamb"
            onclick="side.classList.toggle('open')"
          >
            ☰
          </button>

/* =========================================================
   STATS
========================================================= */

function stats(id){

  let l = get(K.logs).filter(x=>x.staffId==id);

  let c = l.filter(
    x=>x.status=="Completed"
  ).length;

  return {

    total:l.length,

    completed:c,

    progress:l.filter(
      x=>x.status=="In Progress"
    ).length,

    pending:l.filter(
      x=>x.status=="Pending"
    ).length,

    overdue:l.filter(
      overdue
    ).length,

    rate:l.length
      ?Math.round(c/l.length*100)
      :0
  };
}


function overdue(x){

  return x.status!="Completed" &&
    x.dueDate &&
    new Date(
      x.dueDate+"T"+(x.dueTime||"23:59")
    ) < new Date();
}


function sc(l,v){

  return `
    <div class="stat">

      <label>${l}</label>

      <strong>${v}</strong>

    </div>
  `;
}


function badge(t,c){

  return `
    <span class="badge ${c}">
      ${esc(t)}
    </span>
  `;
}


function sb(s,o){

  if(o)
    return badge("Overdue","red");

  if(s=="Completed")
    return badge(s,"green");

  if(s=="In Progress")
    return badge(s,"yellow");

  return badge(s,"grey");
}


function pb(s){

  return badge(
    s,
    s=="High"
      ?"red"
      :s=="Medium"
        ?"yellow"
        :"grey"
  );
}


function empty(t){

  return `
    <div class="empty">
      ${esc(t)}
    </div>
  `;
}

function saveLog(e,edit){

  e.preventDefault();


  let a = get(K.logs);

  let old =
    a.find(x=>x.id==edit);


  let x = {

    id:edit||id("log"),

    staffId:
      old?.staffId||user.id,

    title:lt.value.trim(),

    date:ld.value,

    dueDate:lud.value,

    dueTime:lut.value,

    priority:lp.value,

    status:lst.value,

    description:lx.value.trim()

  };


  if(edit){

    a = a.map(q =>
      q.id==edit
      ?x
      :q
    );

  }else{

    a.push(x);

    act(
      `${user.name} added a work log: ${x.title}`
    );

  }


  save(K.logs,a);


  if(
    x.status=="Completed" &&
    old?.status!="Completed"
  ){

    notify(
      x.staffId,
      `Task completed: ${x.title}`
    );

  }


  closeM();

  toast("Work log saved");

  render();
}


function delLog(i){

  if(!confirm("Delete this work log?"))
    return;


  let x =
    get(K.logs).find(q=>q.id==i);


  save(
    K.logs,
    get(K.logs).filter(q=>q.id!=i)
  );


  act(
    `${user.name} deleted a work log: ${x?.title||""}`
  );


  toast("Work log deleted");

  render();
}

function clockIn(){

  let a = get(K.attendance);


  if(
    a.some(
      x=>
        x.staffId==user.id &&
        x.date==today()

  ){

    return toast(

  a.push({

    id:id("att"),

    staffId:user.id,

    date:today(),

    clockIn:now(),

    clockOut:""

  });


  save(K.attendance,a);


  act(
    `${user.name} clocked in`
  );


  toast("Clocked in");

  render();
}


function clockOut(){

  let a = get(K.attendance);


  let x =
    a.find(
      q=>
        q.staffId==user.id &&
        q.date==today()
    );


  if(!x)
    return toast(
      "Please clock in first"
    );


  x.clockOut = now();

  save(K.attendance,a);


  act(
    `${user.name} clocked out`
  );


  toast("Clocked out");

  render();
}

function chart(){

  let d = {};

  get(K.logs).forEach(x=>{

    let k =
      x.date.slice(0,7);

    d[k] =
      (d[k]||0)+1;

  });


  let a =
    Object.entries(d)
    .slice(-8);


  let m =
    Math.max(
      ...a.map(x=>x[1]),
      1
    );


  return `

    <div class="chart">

      ${a.map(x=>`

        <div class="barwrap">

          <span>
            ${x[1]}
          </span>

          <div
            class="bar"
            style="
              height:${x[1]/m*160}px
            "
          ></div>

          <small>
            ${x[0]}
          </small>

        </div>

      `).join("")}

    </div>

  `;
}


/* =========================================================
   CSV EXPORT
========================================================= */

function csv(rows,name){

  let s =
    rows.map(r=>
      r.map(v=>
        `"${String(v??"")
          .replace(/"/g,'""')}"`
      ).join(",")
    ).join("\n");


  let a =
    document.createElement("a");


  a.href =
    URL.createObjectURL(
      new Blob(
        [s],
        {type:"text/csv"}
      )
    );


  a.download = name;

  a.click();

  toast("CSV exported");
}


function csvLogs(){

  let st = get(K.staff);

  let r = [[
    "Staff",
    "Code",
    "Task",
    "Date",
    "Due",
    "Priority",
    "Status",
    "Description"
  ]];


  get(K.logs).forEach(x=>{

    let s =
      st.find(q=>q.id==x.staffId);


    r.push([

      s?.name,
      s?.code,
      x.title,
      x.date,
      x.dueDate,
      x.priority,
      x.status,
      x.description

    ]);

  });


  csv(
    r,
    "nona-work-logs.csv"
  );
}

  let st = get(K.staff);

  let r = [[
    "Staff",

function modal(t,c){

  let d =
    document.createElement("div");


  d.id = "mb";

  d.className = "modalbg";


  d.innerHTML = `

    <div class="modal">

      <div class="modalhead">

        <h3>
          ${esc(t)}
        </h3>

        <button
          class="close"
          onclick="closeM()"
        >
          ×
        </button>

      </div>


      <div class="modalbody">

        ${c}

      </div>

    </div>

  `;


  document.body.appendChild(d);
}


function closeM(){

  document
    .getElementById("mb")
    ?.remove();

}
