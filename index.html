<script>
const URL='https://jccryyxdxykomwsivtjy.supabase.co';
const KEY='sb_publishable_XgF6_KZZxFzxrAqM0E3bEA_Qs2f-HxM';
const db=supabase.createClient(URL,KEY);
const S={page:'dashboard',user:null,profile:null,profiles:[],channels:[],channel:null,conversation:null,messages:[],notifications:[],docs:[],sidebar:false,modal:null,chatSearch:'',taskSearch:'',taskFilter:'',pendingFile:null,conversations:[],conversationMembers:[]};
let tasks=JSON.parse(localStorage.getItem('nona_v21_tasks')||'null')||[
{id:'t1',name:'Flite Product Shoot',category:'Content',priority:'High',status:'In Progress',dueDate:'2026-09-16',dueTime:'17:00',description:'Product shooting for Flite sandals.',notes:''},
{id:'t2',name:'Social Media Content',category:'Content',priority:'Medium',status:'In Progress',dueDate:'2026-09-17',dueTime:'17:00',description:'Shoot and edit social media content.',notes:''},
{id:'t3',name:'Live Setup',category:'Live',priority:'High',status:'Not Started',dueDate:'2026-09-18',dueTime:'12:00',description:'Prepare live setup quotation and requirements.',notes:''}];
let logs=JSON.parse(localStorage.getItem('nona_v21_logs')||'null')||[
{id:'l1',date:'2026-09-07',task:'Budget quotation presentation + Flite product shoot',description:'Presented completed budget quotation and carried out Flite product shooting.'},
{id:'l2',date:'2026-09-08',task:'Product shooting + content brainstorming',description:'Continued product shooting and brainstormed social media content.'},
{id:'l3',date:'2026-09-09',task:'Live setup quotation + social media shooting',description:'Presented live setup budget quotation and shot social media content.'},
{id:'l4',date:'2026-09-10',task:'Content shooting + video editing',description:'Shot content and edited social media videos.'}];
const esc=x=>{const d=document.createElement('div');d.textContent=x??'';return d.innerHTML};
const av=p=>p?.avatar_url||'https://ui-avatars.com/api/?name='+encodeURIComponent(p?.full_name||'User')+'&background=e8e8e3&color=222';
const me=()=>S.profile?.id, admin=()=>S.profile?.role==='admin';
function save(){localStorage.setItem('nona_v21_tasks',JSON.stringify(tasks));localStorage.setItem('nona_v21_logs',JSON.stringify(logs))}
function toast(x){const t=document.getElementById('toast');t.textContent=x;t.className='toast';setTimeout(()=>t.className='',2500)}
function date(x){return x?new Date(x+'T00:00:00').toLocaleDateString('en-MY',{day:'numeric',month:'short',year:'numeric'}):''}
function dateTime(x){return x?new Date(x).toLocaleString('en-MY',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''}
function pclass(x){return x==='High'?'high':x==='Medium'?'medium':'low'}
function sclass(x){return x==='Completed'?'green':x==='In Progress'?'blue':x==='Overdue'?'red':''}
async function init(){const {data:{session}}=await db.auth.getSession();if(session)await enter(session.user);else loginPage();db.auth.onAuthStateChange(async(e,s)=>{if(s&&!S.user)await enter(s.user);if(!s&&S.user){S.user=null;S.profile=null;loginPage()}})}
async function enter(u){S.user=u;await profile();if(!S.profile){await db.from('profiles').insert({id:u.id,staff_code:(u.email||'').includes('admin')?'ADMIN001':'NC001',full_name:(u.email||'').includes('admin')?'Admin':'Atikah',department:(u.email||'').includes('admin')?'Management':'Digital',position:(u.email||'').includes('admin')?'Administrator':'Live Host Online & Offline',role:(u.email||'').includes('admin')?'admin':'staff',status:'Active'});await profile()}await Promise.all([profiles(),channels(),notifs(),docs(),loadConversations()]);subscribe();render()}
async function profile(){const r=await db.from('profiles').select('*').eq('id',S.user.id).maybeSingle();if(!r.error)S.profile=r.data}
async function profiles(){const r=await db.from('profiles').select('*').order('full_name');if(!r.error)S.profiles=r.data||[]}
async function channels(){const r=await db.from('channels').select('*').order('name');if(!r.error)S.channels=r.data||[]}
async function notifs(){const r=await db.from('communication_notifications').select('*').eq('profile_id',me()).order('created_at',{ascending:false}).limit(50);if(!r.error)S.notifications=r.data||[]}
async function docs(){const r=await db.from('knowledge_documents').select('*').order('created_at',{ascending:false});if(!r.error)S.docs=r.data||[]}
function subscribe(){db.channel('nona-v21').on('postgres_changes',{event:'*',schema:'public',table:'messages'},async()=>{if(S.page==='communication'){await chatLoad();render()}}).on('postgres_changes',{event:'*',schema:'public',table:'communication_notifications'},async()=>{await notifs();render()}).subscribe()}
function loginPage(err=''){document.getElementById('app').innerHTML=`<div class="login"><div class="loginbox"><b style="font-size:23px">Nona Costex</b><div class="small muted" style="margin:4px 0 22px">Staff Portal V22</div>${err?`<div class="error">${esc(err)}</div>`:''}<label class="small muted">Email</label><input id="email" type="email" placeholder="Supabase account email" style="margin:5px 0 13px"><label class="small muted">Password</label><input id="pass" type="password" placeholder="Password" style="margin:5px 0 16px"><button class="btn" style="width:100%" onclick="login()">Sign in</button><p class="small muted" style="text-align:center;margin-top:14px">Use the two accounts you created in Supabase.</p></div></div>`}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('pass').value;const r=await db.auth.signInWithPassword({email,password});if(r.error)return loginPage(r.error.message);await enter(r.data.user)}
async function logout(){await db.auth.signOut()}
function nav(id,label,icon,b=0){return `<button class="${S.page===id?'active':''}" onclick="go('${id}')">${icon} &nbsp; ${label}${b?` <span class="pill red" style="float:right">${b}</span>`:''}</button>`}
function go(p){S.page=p;S.sidebar=false;S.modal=null;if(p==='communication')chatLoad();render()}
function render(){if(!S.user)return loginPage();const unread=S.notifications.filter(n=>!n.is_read).length;document.getElementById('app').innerHTML=`<div class="app"><aside class="side ${S.sidebar?'open':''}"><div class="brand">Nona Costex<small>Staff Portal V22</small></div><div class="nav-title">Workspace</div><div class="nav">${nav('dashboard','Dashboard','⌂')}${nav('tasks','Tasks','✓')}${nav('worklogs','Work Logs','▤')}${nav('communication','Communication','◌',unread)}${nav('knowledge','Knowledge Hub','▥')}${nav('calendar','Calendar','□')}</div>${admin()?`<div class="nav-title">Admin</div><div class="nav">${nav('staff','Staff Management','♙')}${nav('analytics','Analytics','▥')}${nav('data','Data Management','↥')}</div>`:''}<div class="nav-title">Account</div><div class="nav">${nav('profile','My Profile','○')}</div><div style="margin-top:18px"><button style="width:100%;background:transparent;border:0;text-align:left;padding:10px;color:#777" onclick="logout()">↪ Log out</button></div></aside><section class="main"><header class="top"><div class="row"><button class="btn secondary mobile" onclick="S.sidebar=!S.sidebar;render()">☰</button><b>Nona Costex Staff Portal</b></div><div class="row"><button class="btn secondary small" onclick="notifications()">🔔 ${unread||''}</button><div class="row hide"><img class="avatar" src="${av(S.profile)}"><div><b style="font-size:13px">${esc(S.profile.full_name)}</b><div class="small muted">${esc(S.profile.role)}</div></div></div></div></header><main class="content">${page()}</main></section></div>${S.modal?modal():''}`}
function page(){return S.page==='dashboard'?dashboard():S.page==='tasks'?tasksPage():S.page==='worklogs'?logsPage():S.page==='communication'?chatPage():S.page==='knowledge'?knowledge():S.page==='calendar'?calendar():S.page==='staff'?staff():S.page==='analytics'?analytics():S.page==='data'?dataPage():profilePage()}
function dashboard(){const done=tasks.filter(x=>x.status==='Completed').length,pct=tasks.length?Math.round(done/tasks.length*100):0;return `<div class="grid"><div><h1 class="title">Dashboard</h1><p class="sub">Welcome back, ${esc(S.profile.full_name.split(' ')[0])}.</p></div><div class="grid four"><div class="card stat"><b>${tasks.length}</b><span>Total Tasks</span></div><div class="card stat"><b>${done}</b><span>Completed</span></div><div class="card stat"><b>${tasks.length-done}</b><span>Active</span></div><div class="card stat"><b>${S.notifications.filter(n=>!n.is_read).length}</b><span>Unread</span></div></div><div class="grid two"><div class="card"><div class="row between"><b>Task Progress</b><b>${pct}%</b></div><div class="progress" style="margin-top:10px"><i style="width:${pct}%"></i></div></div><div class="card"><div class="row between"><b>Communication</b><button class="btn secondary small" onclick="go('communication')">Open</button></div><p class="small muted">${S.notifications.filter(n=>!n.is_read).length?'You have unread communication notifications.':'Nothing unread.'}</p></div></div><div class="card"><div class="row between"><b>Recent Work Logs</b><button class="btn secondary small" onclick="go('worklogs')">View all</button></div>${logs.slice(-4).reverse().map(x=>`<div class="knowledge"><b style="font-size:13px">${esc(x.task)}</b><div class="small muted">${date(x.date)} · ${esc(x.description)}</div></div>`).join('')}</div></div>`}
function tasksPage(){let a=[...tasks];if(S.taskFilter)a=a.filter(x=>x.status===S.taskFilter);if(S.taskSearch){const q=S.taskSearch.toLowerCase();a=a.filter(x=>(x.name+x.description+x.category).toLowerCase().includes(q))}return `<div class="grid"><div class="row between wrap"><div><h1 class="title">Tasks</h1><p class="sub">Task management from the existing portal workflow.</p></div><button class="btn" onclick="openTask()">+ Add Task</button></div><div class="row wrap"><input style="max-width:260px" placeholder="Search tasks..." value="${esc(S.taskSearch)}" oninput="S.taskSearch=this.value;render()"><select style="max-width:170px" onchange="S.taskFilter=this.value;render()"><option value="">All status</option>${['Not Started','In Progress','Completed','On Hold'].map(x=>`<option ${S.taskFilter===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="card" style="overflow:auto"><table><thead><tr><th>Task</th><th>Priority</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>${a.map(t=>`<tr><td><b>${esc(t.name)}</b><div class="small muted">${esc(t.category)}</div></td><td><span class="pill ${pclass(t.priority)}">${t.priority}</span></td><td>${date(t.dueDate)} ${t.dueTime||''}</td><td><span class="pill ${sclass(t.status)}">${t.status}</span></td><td><button class="btn secondary small" onclick="openTask('${t.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div></div>`}
function openTask(id){const t=id?tasks.find(x=>x.id===id):{name:'',description:'',category:'General',priority:'Medium',status:'Not Started',dueDate:'',dueTime:'',notes:''};S.modal={type:'task',data:t};render()}
function saveTask(){const g=id=>document.getElementById(id).value;const id=g('task-id'),d={name:g('task-name'),description:g('task-desc'),category:g('task-cat'),priority:g('task-pri'),status:g('task-status'),dueDate:g('task-date'),dueTime:g('task-time'),notes:g('task-notes')};if(!d.name||!d.dueDate)return toast('Task name and due date are required.');if(id)Object.assign(tasks.find(x=>x.id===id),d);else tasks.push({...d,id:'t'+Date.now()});save();S.modal=null;toast('Task saved');render()}
function logsPage(){return `<div class="grid"><div class="row between"><div><h1 class="title">Work Logs</h1><p class="sub">Daily work records.</p></div><button class="btn" onclick="openLog()">+ Add Log</button></div><div class="card"><table><thead><tr><th>Date</th><th>Activity</th><th>Description</th><th></th></tr></thead><tbody>${logs.map(x=>`<tr><td>${date(x.date)}</td><td><b>${esc(x.task)}</b></td><td>${esc(x.description)}</td><td><button class="btn danger small" onclick="delLog('${x.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`}
function openLog(){S.modal={type:'log',data:{date:new Date().toISOString().slice(0,10),task:'',description:''}};render()}
function saveLog(){const d={date:document.getElementById('log-date').value,task:document.getElementById('log-task').value,description:document.getElementById('log-desc').value};if(!d.date||!d.task)return toast('Date and activity are required.');logs.push({...d,id:'l'+Date.now()});save();S.modal=null;toast('Work log added');render()}
function delLog(id){if(confirm('Delete this work log?')){logs=logs.filter(x=>x.id!==id);save();render()}}
async function loadConversations(){
  const m=await db.from('conversation_members').select('conversation_id,profile_id,role').eq('profile_id',me());
  if(m.error){S.conversations=[];S.conversationMembers=[];return}
  S.conversationMembers=m.data||[];
  const ids=[...new Set(S.conversationMembers.map(x=>x.conversation_id))];
  if(!ids.length){S.conversations=[];return}
  const c=await db.from('conversations').select('*').in('id',ids).order('updated_at',{ascending:false});
  S.conversations=c.error?[]:(c.data||[]);
}
async function loadConversationMembers(cid){
  const r=await db.from('conversation_members').select('conversation_id,profile_id,role').eq('conversation_id',cid);
  S.conversationMembers=r.error?[]:(r.data||[]);return S.conversationMembers;
}
function currentConversationRole(){return S.conversation?((S.conversationMembers.find(x=>x.profile_id===me())||{}).role||'member'):'member'}
function isGroupConversation(c){return c?.type==='group'}
function conversationName(c){if(!c)return'';if(c.type==='group')return c.name||'Unnamed Group';const ids=S.conversationMembers.filter(x=>x.conversation_id===c.id).map(x=>x.profile_id).filter(x=>x!==me());const p=S.profiles.find(x=>x.id===ids[0]);return p?.full_name||'Direct chat'}
async function chatLoad(){if(!S.channel&&!S.conversation){S.messages=[];return}let q=db.from('messages').select('*').order('created_at',{ascending:true}).limit(200);q=S.channel?q.eq('channel_id',S.channel.id):q.eq('conversation_id',S.conversation.id);const r=await q;if(!r.error)S.messages=r.data||[]}
async function selectConversation(cid){const c=S.conversations.find(x=>x.id===cid);if(!c)return;S.conversation={id:cid,group:c.type==='group'};S.channel=null;await loadConversationMembers(cid);await chatLoad();render()}
async function createGroup(){S.modal={type:'group-create'};render()}
async function saveGroup(){const name=document.getElementById('group-name').value.trim();const selected=[...document.querySelectorAll('.group-member:checked')].map(x=>x.value);if(!name)return toast('Group name is required.');if(!selected.length)return toast('Select at least one member.');const c=await db.from('conversations').insert({name,type:'group',created_by:me()}).select().single();if(c.error)return toast(c.error.message);const rows=[{conversation_id:c.data.id,profile_id:me(),role:'admin'},...selected.filter(x=>x!==me()).map(x=>({conversation_id:c.data.id,profile_id:x,role:'member'}))];const r=await db.from('conversation_members').insert(rows);if(r.error){await db.from('conversations').delete().eq('id',c.data.id);return toast(r.error.message)}await loadConversations();S.modal=null;await selectConversation(c.data.id)}
async function renameGroup(){if(!S.conversation?.group||currentConversationRole()!=='admin')return toast('Only the group admin can rename this group.');const name=prompt('New group name',conversationName(S.conversations.find(x=>x.id===S.conversation.id)));if(!name||!name.trim())return;const r=await db.from('conversations').update({name:name.trim(),updated_at:new Date().toISOString()}).eq('id',S.conversation.id);if(r.error)return toast(r.error.message);await loadConversations();render()}
async function addMember(){if(!S.conversation?.group||currentConversationRole()!=='admin')return toast('Only the group admin can add members.');S.modal={type:'group-members'};await loadConversationMembers(S.conversation.id);render()}
async function saveMembers(){const selected=[...document.querySelectorAll('.group-add-member:checked')].map(x=>x.value);if(!selected.length)return toast('Select at least one member.');const existing=new Set(S.conversationMembers.map(x=>x.profile_id));const rows=selected.filter(x=>!existing.has(x)).map(x=>({conversation_id:S.conversation.id,profile_id:x,role:'member'}));if(!rows.length)return toast('Those members are already in the group.');const r=await db.from('conversation_members').insert(rows);if(r.error)return toast(r.error.message);await loadConversationMembers(S.conversation.id);await loadConversations();S.modal=null;render()}
async function removeMember(pid){if(!S.conversation?.group||currentConversationRole()!=='admin')return toast('Only the group admin can remove members.');if(pid===me())return toast('Use Leave Group to leave the group.');if(!confirm('Remove this member from the group?'))return;const r=await db.from('conversation_members').delete().eq('conversation_id',S.conversation.id).eq('profile_id',pid);if(r.error)return toast(r.error.message);await loadConversationMembers(S.conversation.id);await loadConversations();render()}
async function leaveGroup(){if(!S.conversation?.group)return;const r=await db.from('conversation_members').delete().eq('conversation_id',S.conversation.id).eq('profile_id',me());if(r.error)return toast(r.error.message);S.conversation=null;S.messages=[];await loadConversations();render()}

function chatPage(){const active=S.conversations.find(x=>x.id===S.conversation?.id);const target=S.channel?'# '+S.channel.name:S.conversation?(active?.type==='group'?(active.name||'Unnamed Group'):conversationName(active)):'Select a channel or person';const groupAdmin=S.conversation?.group&&currentConversationRole()==='admin';return `<div class="grid"><div><h1 class="title">Communication</h1><p class="sub">Real-time team communication.</p></div><div class="card chat"><div class="chatlist"><div style="padding:12px"><input placeholder="Search..." value="${esc(S.chatSearch)}" oninput="S.chatSearch=this.value;render()"></div><div class="small muted" style="padding:8px 12px">CHANNELS</div>${S.channels.filter(c=>!S.chatSearch||c.name.toLowerCase().includes(S.chatSearch.toLowerCase())).map(c=>`<div class="chatitem ${S.channel?.id===c.id?'active':''}" onclick="selectChannel('${c.id}')"><b># ${esc(c.name)}</b><div class="small muted">${esc(c.description||'')}</div></div>`).join('')}<div class="row between" style="padding:14px 12px 8px"><div class="small muted">GROUPS</div><button class="btn secondary small" onclick="createGroup()">+ Group</button></div>${S.conversations.filter(c=>c.type==='group').filter(c=>!S.chatSearch||String(c.name||'').toLowerCase().includes(S.chatSearch.toLowerCase())).map(c=>`<div class="chatitem ${S.conversation?.id===c.id?'active':''}" onclick="selectConversation('${c.id}')"><b>👥 ${esc(c.name||'Unnamed Group')}</b><div class="small muted">Group chat</div></div>`).join('')}<div class="small muted" style="padding:14px 12px 8px">DIRECT CHAT</div>${S.profiles.filter(p=>p.id!==me()).filter(p=>!S.chatSearch||p.full_name.toLowerCase().includes(S.chatSearch.toLowerCase())).map(p=>`<div class="chatitem ${S.conversation?.target===p.id?'active':''}" onclick="direct('${p.id}')"><div class="row"><img class="avatar" src="${av(p)}"><div><b>${esc(p.full_name)}</b><div class="small muted">${esc(p.position||'')}</div></div></div></div>`).join('')}</div><div class="chatwindow"><div style="padding:13px;border-bottom:1px solid #eee"><div class="row between"><div><b>${esc(target)}</b><div class="small muted">${S.channel?'Team channel':S.conversation?.group?'Group chat':'Direct message'}</div></div>${groupAdmin?`<div class="row wrap"><button class="btn secondary small" onclick="renameGroup()">Rename</button><button class="btn secondary small" onclick="addMember()">Members</button><button class="btn danger small" onclick="leaveGroup()">Leave</button></div>`:S.conversation?.group?`<button class="btn secondary small" onclick="leaveGroup()">Leave</button>`:''}</div></div><div class="messages">${S.messages.map(m=>`<div class="bubble ${m.sender_id===me()?'mine':''}"><div>${esc(m.message_text||'')}</div>${m.attachment_name?`<div class="small">📎 ${esc(m.attachment_name)}</div>`:''}<div class="meta">${m.sender_id===me()?'You':esc(S.profiles.find(p=>p.id===m.sender_id)?.full_name||'User')} · ${dateTime(m.created_at)}</div></div>`).join('')||'<div class="empty">No messages yet.</div>'}</div><div style="padding:12px;border-top:1px solid #eee"><div class="row"><input id="msg" placeholder="Write a message..." onkeydown="if(event.key==='Enter'){send()}"><button class="btn" onclick="send()">Send</button><label class="btn secondary">📎<input type="file" hidden onchange="fileAttach(this)"></label></div>${S.pendingFile?`<div class="small muted" style="margin-top:5px">Attached: ${esc(S.pendingFile.name)}</div>`:''}</div></div></div></div>`}
async function selectChannel(id){S.channel=S.channels.find(x=>x.id===id);S.conversation=null;await chatLoad();render()}
async function direct(target){let cid=null;const cs=await db.from('conversations').select('id');for(const c of cs.data||[]){const mm=await db.from('conversation_members').select('profile_id').eq('conversation_id',c.id);const ids=(mm.data||[]).map(x=>x.profile_id);if(ids.includes(me())&&ids.includes(target)&&ids.length===2){cid=c.id;break}}if(!cid){const c=await db.from('conversations').insert({}).select().single();if(c.error)return toast(c.error.message);cid=c.data.id;const ins=await db.from('conversation_members').insert([{conversation_id:cid,profile_id:me()},{conversation_id:cid,profile_id:target}]);if(ins.error)return toast(ins.error.message)}S.conversation={id:cid,target};S.channel=null;await chatLoad();render()}
async function send(){const i=document.getElementById('msg'),text=i.value.trim();if(!text&&!S.pendingFile)return;if(!S.channel&&!S.conversation)return toast('Select a channel or person first.');const row={sender_id:me(),message_text:text||null};if(S.channel)row.channel_id=S.channel.id;else row.conversation_id=S.conversation.id;if(S.pendingFile){row.attachment_name=S.pendingFile.name;row.attachment_url=S.pendingFile.url;row.attachment_type=S.pendingFile.type}const r=await db.from('messages').insert(row);if(r.error)return toast(r.error.message);i.value='';S.pendingFile=null;await chatLoad();render()}
async function fileAttach(inp){const f=inp.files[0];if(!f)return;if(f.size>10*1024*1024)return toast('File must be under 10 MB.');const path='chat/'+me()+'/'+Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const r=await db.storage.from('nona-files').upload(path,f);if(r.error)return toast(r.error.message);const u=db.storage.from('nona-files').getPublicUrl(path).data.publicUrl;S.pendingFile={name:f.name,type:f.type,url:u};render()}
function knowledge(){return `<div class="grid"><div class="row between"><div><h1 class="title">Knowledge Hub</h1><p class="sub">SOPs, guidelines and shared documents.</p></div>${admin()?`<button class="btn" onclick="uploadDoc()">+ Upload</button>`:''}</div><div class="card"><input placeholder="Search documents..." oninput="S.search=this.value;render()">${S.docs.filter(d=>(d.title+' '+(d.category||'')).toLowerCase().includes((S.search||'').toLowerCase())).map(d=>`<div class="knowledge row"><div style="font-size:24px">📄</div><div style="flex:1"><b>${esc(d.title)}</b><div class="small muted">${esc(d.category||'General')} · ${esc(d.description||'')}</div></div>${d.file_url?`<a class="btn secondary small" href="${esc(d.file_url)}" target="_blank">Open</a>`:''}</div>`).join('')||'<div class="empty">No documents yet.</div>'}</div></div>`}
async function uploadDoc(){const i=document.createElement('input');i.type='file';i.onchange=async()=>{const f=i.files[0];if(!f)return;const title=prompt('Document title',f.name);if(!title)return;const path='knowledge/'+me()+'/'+Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const u=await db.storage.from('nona-files').upload(path,f);if(u.error)return toast(u.error.message);const url=db.storage.from('nona-files').getPublicUrl(path).data.publicUrl;const r=await db.from('knowledge_documents').insert({title,category:'General',file_name:f.name,file_url:url,file_type:f.type,uploaded_by:me()});if(r.error)return toast(r.error.message);await docs();render()};i.click()}
function calendar(){return `<div class="grid"><div><h1 class="title">Calendar</h1><p class="sub">Current work log dates.</p></div><div class="grid two">${[...new Set(logs.map(x=>x.date))].sort().reverse().map(d=>`<div class="card"><b>${date(d)}</b>${logs.filter(x=>x.date===d).map(l=>`<div class="knowledge small">${esc(l.task)}</div>`).join('')}</div>`).join('')||'<div class="card empty">No entries.</div>'}</div></div>`}
function staff(){return `<div class="grid"><div><h1 class="title">Staff Management</h1><p class="sub">Profiles connected to Supabase.</p></div><div class="card" style="overflow:auto"><table><thead><tr><th>Name</th><th>Code</th><th>Department</th><th>Position</th><th>Role</th></tr></thead><tbody>${S.profiles.map(p=>`<tr><td><div class="row"><img class="avatar" src="${av(p)}"><b>${esc(p.full_name)}</b></div></td><td>${esc(p.staff_code)}</td><td>${esc(p.department||'')}</td><td>${esc(p.position||'')}</td><td>${esc(p.role)}</td></tr>`).join('')}</tbody></table></div></div>`}
function analytics(){const done=tasks.filter(x=>x.status==='Completed').length;return `<div class="grid"><h1 class="title">Analytics</h1><div class="grid four"><div class="card stat"><b>${tasks.length}</b><span>Tasks</span></div><div class="card stat"><b>${done}</b><span>Completed</span></div><div class="card stat"><b>${tasks.length?Math.round(done/tasks.length*100):0}%</b><span>Completion</span></div><div class="card stat"><b>${logs.length}</b><span>Work Logs</span></div></div><div class="card"><button class="btn" onclick="window.print()">Print / Report</button></div></div>`}
function dataPage(){return `<div class="grid"><h1 class="title">Data Management</h1><div class="card"><b>Local task/log backup</b><p class="small muted">Communication data is stored in Supabase. Task and work-log data in this V21 build remains browser-local.</p><button class="btn secondary" onclick="backup()">Backup JSON</button><label class="btn secondary">Restore<input type="file" hidden accept="application/json" onchange="restore(this)"></label></div></div>`}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({tasks,logs},null,2)],{type:'application/json'}));a.download='nona-v22-backup.json';a.click()}
function restore(i){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);tasks=x.tasks||tasks;logs=x.logs||logs;save();render();toast('Restored')}catch(e){toast('Invalid backup')}};r.readAsText(i.files[0])}
function profilePage(){return `<div class="grid" style="max-width:700px"><h1 class="title">My Profile</h1><div class="card"><div class="row"><img class="avatar" style="width:70px;height:70px" src="${av(S.profile)}"><div><h2 style="margin:0">${esc(S.profile.full_name)}</h2><div class="muted">${esc(S.profile.position||'')}</div></div></div><div class="grid two" style="margin-top:20px"><div><label class="small muted">Staff Code</label><div>${esc(S.profile.staff_code)}</div></div><div><label class="small muted">Role</label><div>${esc(S.profile.role)}</div></div><div><label class="small muted">Department</label><div>${esc(S.profile.department||'')}</div></div><div><label class="small muted">Email</label><div>${esc(S.user.email||'')}</div></div></div></div></div>`}
function notifications(){S.modal={type:'notifications'};render()}
async function markRead(){await db.from('communication_notifications').update({is_read:true}).eq('profile_id',me());await notifs();S.modal=null;render()}
function modal(){const m=S.modal;if(m.type==='group-create'){return `<div class="modalbg"><div class="modal"><div class="row between"><h2>Create Group</h2><button class="btn secondary" onclick="S.modal=null;render()">×</button></div><label class="small muted">Group name</label><input id="group-name" placeholder="e.g. Digital Team" style="margin:5px 0 14px"><div class="small muted" style="margin-bottom:8px">Select members</div><div class="grid" style="max-height:330px;overflow:auto">${S.profiles.filter(p=>p.id!==me()).map(p=>`<label class="row" style="padding:8px;border:1px solid #eee;border-radius:8px"><input class="group-member" type="checkbox" value="${p.id}" style="width:auto"><img class="avatar" src="${av(p)}"><span>${esc(p.full_name)} <small class="muted">${esc(p.position||'')}</small></span></label>`).join('')}</div><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn secondary" onclick="S.modal=null;render()">Cancel</button><button class="btn" onclick="saveGroup()">Create Group</button></div></div></div>`;}if(m.type==='group-members'){const ids=new Set(S.conversationMembers.map(x=>x.profile_id));return `<div class="modalbg"><div class="modal"><div class="row between"><h2>Manage Members</h2><button class="btn secondary" onclick="S.modal=null;render()">×</button></div><div class="small muted" style="margin:8px 0">Current members</div>${S.conversationMembers.map(x=>{const p=S.profiles.find(y=>y.id===x.profile_id);return `<div class="row between" style="padding:8px 0;border-bottom:1px solid #eee"><div class="row"><img class="avatar" src="${av(p)}"><div><b>${esc(p?.full_name||'User')}</b><div class="small muted">${x.role}</div></div></div>${x.profile_id!==me()?`<button class="btn danger small" onclick="removeMember('${x.profile_id}')">Remove</button>`:'<span class="small muted">You</span>'}</div>`}).join('')}<div class="small muted" style="margin:16px 0 8px">Add members</div><div class="grid" style="max-height:250px;overflow:auto">${S.profiles.filter(p=>p.id!==me()&&!ids.has(p.id)).map(p=>`<label class="row" style="padding:8px;border:1px solid #eee;border-radius:8px"><input class="group-add-member" type="checkbox" value="${p.id}" style="width:auto"><img class="avatar" src="${av(p)}"><span>${esc(p.full_name)}</span></label>`).join('')||'<div class="small muted">Everyone is already in this group.</div>'}</div><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn secondary" onclick="S.modal=null;render()">Close</button><button class="btn" onclick="saveMembers()">Add Selected</button></div></div></div>`;}if(m.type==='notifications')return `<div class="modalbg"><div class="modal"><div class="row between"><h2>Notifications</h2><button class="btn secondary" onclick="S.modal=null;render()">×</button></div>${S.notifications.map(n=>`<div class="knowledge"><b>${esc(n.title)}</b><div class="small muted">${esc(n.message||'')} · ${dateTime(n.created_at)}</div></div>`).join('')||'<div class="empty">No notifications.</div>'}<button class="btn secondary small" onclick="markRead()">Mark all as read</button></div></div>`;
if(m.type==='task'){const t=m.data;return `<div class="modalbg"><div class="modal"><div class="row between"><h2>${t.id?'Edit':'Add'} Task</h2><button class="btn secondary" onclick="S.modal=null;render()">×</button></div><div class="grid two" style="margin-top:14px"><div><label class="small muted">Task</label><input id="task-name" value="${esc(t.name)}"></div><div><label class="small muted">Category</label><input id="task-cat" value="${esc(t.category)}"></div><div><label class="small muted">Priority</label><select id="task-pri">${['High','Medium','Low'].map(x=>`<option ${t.priority===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label class="small muted">Status</label><select id="task-status">${['Not Started','In Progress','Completed','On Hold'].map(x=>`<option ${t.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label class="small muted">Due date</label><input id="task-date" type="date" value="${t.dueDate}"></div><div><label class="small muted">Due time</label><input id="task-time" type="time" value="${t.dueTime||''}"></div></div><label class="small muted">Description</label><textarea id="task-desc">${esc(t.description||'')}</textarea><label class="small muted">Notes</label><textarea id="task-notes">${esc(t.notes||'')}</textarea><input id="task-id" type="hidden" value="${esc(t.id||'')}"><div class="row" style="justify-content:flex-end"><button class="btn secondary" onclick="S.modal=null;render()">Cancel</button><button class="btn" onclick="saveTask()">Save</button></div></div></div>`}
if(m.type==='log'){return `<div class="modalbg"><div class="modal"><h2>Add Work Log</h2><label class="small muted">Date</label><input id="log-date" type="date" value="${m.data.date}"><label class="small muted">Activity</label><input id="log-task"><label class="small muted">Description</label><textarea id="log-desc"></textarea><div class="row" style="justify-content:flex-end"><button class="btn secondary" onclick="S.modal=null;render()">Cancel</button><button class="btn" onclick="saveLog()">Save</button></div></div></div>`}return ''}
init();
</script></body></html>
