<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nona Costex Staff Portal</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f4f4f0;--card:#fff;--text:#242822;--muted:#777b73;
  --line:#e5e6df;--accent:#68705d;--accent2:#858c78;
  --soft:#eef0e9;--danger:#b85c5c;--warning:#b28742;--success:#5e8065;
}
body{margin:0;font-family:Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:420px;background:white;border:1px solid var(--line);border-radius:22px;padding:38px;box-shadow:0 15px 45px #0000000b}
.logo-mark{width:54px;height:54px;border-radius:15px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;margin-bottom:22px}
.login-card h1{margin:0 0 7px;font-size:25px}
.login-card p{color:var(--muted);margin:0 0 28px}
.form-group{margin-bottom:16px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent2)}
textarea{min-height:90px;resize:vertical}
.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--accent);color:white;font-weight:600}
.btn:hover{opacity:.9}
.btn.secondary{background:var(--soft);color:var(--text)}
.btn.danger{background:#f4e6e6;color:var(--danger)}
.btn.small{padding:8px 11px;font-size:12px}
.login-btn{width:100%;margin-top:8px}
.demo{margin-top:20px;padding:12px;background:var(--soft);border-radius:10px;font-size:12px;color:var(--muted);line-height:1.6}

/* APP */
.app{display:flex;min-height:100vh}
.sidebar{width:245px;background:#fff;border-right:1px solid var(--line);position:fixed;left:0;top:0;bottom:0;padding:20px 14px;z-index:20;overflow-y:auto}
.brand{padding:7px 10px 22px;border-bottom:1px solid var(--line);margin-bottom:15px}
.brand strong{display:block;font-size:16px}
.brand span{font-size:11px;color:var(--muted)}
.nav-title{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#999;margin:17px 10px 7px}
.nav-btn{width:100%;border:0;background:none;text-align:left;padding:10px 11px;border-radius:9px;color:#555;display:flex;gap:10px;align-items:center;margin-bottom:2px}
.nav-btn:hover,.nav-btn.active{background:var(--soft);color:var(--text);font-weight:600}
.nav-icon{width:18px;text-align:center;font-size:13px}
.sidebar-bottom{border-top:1px solid var(--line);margin-top:18px;padding-top:15px}
.main{margin-left:245px;width:calc(100% - 245px)}
.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}
.topbar-left{display:flex;align-items:center;gap:12px}
.mobile-menu{display:none;border:0;background:var(--soft);border-radius:9px;padding:8px 11px}
.page{padding:28px;max-width:1500px;margin:auto}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:24px}
.page-head h1{margin:0 0 5px;font-size:25px}
.page-head p{margin:0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* CARDS */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:19px}
.stat-label{font-size:12px;color:var(--muted);margin-bottom:10px}
.stat-value{font-size:27px;font-weight:700}
.stat-note{font-size:11px;color:var(--muted);margin-top:5px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.section-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:19px;margin-bottom:18px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.section-title h3{font-size:15px;margin:0}
.section-title span{font-size:12px;color:var(--muted)}
.progress{height:8px;background:#eceee8;border-radius:10px;overflow:hidden}
.progress-bar{height:100%;background:var(--accent);border-radius:10px}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:650px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#888;padding:11px;border-bottom:1px solid var(--line)}
td{padding:12px 11px;border-bottom:1px solid #f0f0ec;font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:0}
.badge{display:inline-block;border-radius:20px;padding:5px 9px;font-size:10px;font-weight:600}
.badge.pending{background:#f1eee5;color:#96783c}
.badge.progress{background:#e8edf0;color:#587080}
.badge.completed{background:#e7f0e8;color:var(--success)}
.badge.overdue{background:#f5e5e5;color:var(--danger)}
.badge.active{background:#e7f0e8;color:var(--success)}
.badge.inactive{background:#eee;color:#777}

/* LISTS */
.list{display:flex;flex-direction:column;gap:9px}
.list-item{padding:12px;background:#fafaf8;border:1px solid #eeeee9;border-radius:10px}
.list-item strong{font-size:13px}
.list-item small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.empty{text-align:center;padding:28px;color:var(--muted);font-size:13px}

/* PROFILE */
.profile-head{display:flex;gap:20px;align-items:center;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:20px}
.avatar{width:78px;height:78px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:24px;font-weight:700;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile-info h2{margin:0 0 5px;font-size:20px}
.profile-info p{margin:0;color:var(--muted);font-size:12px}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.info-box{padding:13px;background:#fafaf8;border-radius:10px}
.info-box small{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}
.info-box strong{font-size:13px}

/* CALENDAR */
.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.calendar-title{font-weight:700}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.day-name{padding:9px;text-align:center;font-size:10px;color:var(--muted);background:#fafaf8;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.day{min-height:105px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff}
.day.other{background:#fafaf8;color:#aaa}
.day.today{background:#f0f2eb}
.day-number{font-size:12px;font-weight:600;margin-bottom:5px}
.event{font-size:9px;padding:4px 5px;background:var(--soft);border-radius:5px;margin-bottom:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.event.task{background:#edf0f2}
.event.overdue{background:#f5e5e5;color:var(--danger)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:#0006;z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#fff;width:100%;max-width:620px;max-height:90vh;overflow:auto;border-radius:17px;padding:23px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-head h2{font-size:18px;margin:0}
.close{border:0;background:var(--soft);border-radius:8px;width:32px;height:32px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.form-full{grid-column:1/-1}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}

/* TOAST */
.toast{position:fixed;right:22px;bottom:22px;background:#242822;color:#fff;padding:12px 16px;border-radius:10px;font-size:12px;z-index:100;display:none;box-shadow:0 8px 25px #0002}
.toast.show{display:block}

/* MOBILE */
@media(max-width:900px){
  .sidebar{transform:translateX(-100%);transition:.2s}
  .sidebar.open{transform:translateX(0);box-shadow:8px 0 30px #0002}
  .main{margin-left:0;width:100%}
  .mobile-menu{display:block}
  .cards{grid-template-columns:repeat(2,1fr)}
  .grid-2,.grid-3{grid-template-columns:1fr}
}
@media(max-width:600px){
  .page{padding:18px 14px}
  .topbar{padding:0 14px}
  .cards{grid-template-columns:1fr 1fr;gap:9px}
  .card{padding:14px}
  .stat-value{font-size:22px}
  .page-head{flex-direction:column}
  .form-grid,.info-grid{grid-template-columns:1fr}
  .form-full{grid-column:auto}
  .calendar{min-width:650px}
  .calendar-wrap{overflow-x:auto}
  .day{min-height:90px}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="logo-mark">NC</div>
    <h1>Nona Costex</h1>
    <p>Staff Portal</p>

    <div class="form-group">
      <label>Username</label>
      <input id="loginUser" placeholder="Enter username">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input id="loginPass" type="password" placeholder="Enter password">
    </div>

    <button class="btn login-btn" onclick="login()">Login</button>

    <div class="demo">
      <b>Demo Login</b><br>
      Staff: Atikah / NC001<br>
      Admin: Admin / ADMIN001
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">

<aside id="sidebar" class="sidebar">
  <div class="brand">
    <strong>Nona Costex</strong>
    <span>Staff Portal</span>
  </div>

  <div class="nav-title">Main</div>
  <button class="nav-btn active" data-page="dashboard" onclick="go('dashboard')"><span class="nav-icon">⌂</span>Dashboard</button>
  <button class="nav-btn" data-page="tasks" onclick="go('tasks')"><span class="nav-icon">✓</span><span id="taskNav">Tasks</span></button>
  <button class="nav-btn" data-page="logs" onclick="go('logs')"><span class="nav-icon">▤</span>Work Logs</button>
  <button class="nav-btn" data-page="attendance" onclick="go('attendance')"><span class="nav-icon">◷</span>Attendance</button>
  <button class="nav-btn" data-page="leave" onclick="go('leave')"><span class="nav-icon">▢</span>Leave</button>
  <button class="nav-btn" data-page="schedule" onclick="go('schedule')"><span class="nav-icon">□</span>Schedule</button>
  <button class="nav-btn" data-page="announcements" onclick="go('announcements')"><span class="nav-icon">!</span>Announcements</button>
  <button class="nav-btn" data-page="notifications" onclick="go('notifications')"><span class="nav-icon">♢</span>Notifications <span id="navNotif" style="margin-left:auto"></span></button>

  <div id="adminNav">
    <div class="nav-title">Admin</div>
    <button class="nav-btn" data-page="staff" onclick="go('staff')"><span class="nav-icon">♙</span>Staff Management</button>
    <button class="nav-btn" data-page="analytics" onclick="go('analytics')"><span class="nav-icon">◫</span>Analytics</button>
    <button class="nav-btn" data-page="activity" onclick="go('activity')"><span class="nav-icon">≡</span>Activity History</button>
  </div>

  <div class="nav-title">Account</div>
  <button class="nav-btn" data-page="profile" onclick="go('profile')"><span class="nav-icon">○</span>My Profile</button>

  <div class="sidebar-bottom">
    <button class="nav-btn" onclick="logout()"><span class="nav-icon">↪</span>Logout</button>
  </div>
</aside>

<main class="main">
  <header class="topbar">
    <div class="topbar-left">
      <button class="mobile-menu" onclick="toggleSidebar()">☰</button>
      <div>
        <strong id="topTitle">Dashboard</strong>
      </div>
    </div>
    <div style="font-size:12px;color:var(--muted)" id="topUser"></div>
  </header>

  <div id="content" class="page"></div>
</main>
</div>

<!-- MODAL -->
<div id="modalBg" class="modal-bg">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
/* =========================================================
   V17 - NONA COSTEX STAFF PORTAL
   Existing localStorage keys are preserved.
   ========================================================= */

const KEYS={
  logs:'nona_logs',
  leaves:'nona_leaves',
  attendance:'nona_attendance',
  staff:'nona_staff',
  schedules:'nona_schedules',
  announcements:'nona_announcements',
  notifications:'nona_notifications',
  activity:'nona_activity',
  photos:'nona_photo_'
};

let currentUser=null;
let currentPage='dashboard';
let calendarDate=new Date();

const uid=()=>Date.now().toString()+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);

function get(k){
  try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return[]}
}
function set(k,v){localStorage.setItem(k,JSON.stringify(v))}
function esc(v){
  return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))
}
function fmtDate(d){
  if(!d)return '-';
  return new Date(d+'T00:00:00').toLocaleDateString('en-MY',{day:'2-digit',month:'short',year:'numeric'})
}
function initials(name){
  return (name||'?').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase()
}
function isOverdue(t){
  if(t.status==='Completed'||!t.dueDate)return false;
  let x=new Date(t.dueDate+'T'+(t.dueTime||'23:59'));
  return x<new Date();
}
function statusBadge(status,overdue=false){
  if(overdue)return '<span class="badge overdue">Overdue</span>';
  let c=status==='Completed'?'completed':status==='In Progress'?'progress':'pending';
  return `<span class="badge ${c}">${esc(status)}</span>`;
}
function priorityBadge(p){
  if(!p)return '-';
  return `<span class="badge ${p==='High'?'overdue':p==='Medium'?'pending':'completed'}">${esc(p)}</span>`;
}
function staffById(id){return get(KEYS.staff).find(s=>s.id===id)}
function staffName(id){return staffById(id)?.name||id||'-'}

function initData(){
  if(!localStorage.getItem(KEYS.staff)){
    set(KEYS.staff,[
      {id:'NC001',name:'Atikah',code:'NC001',department:'Digital',position:'Live Host Online & Offline',status:'Active',joining:'2026-09-02',email:'',phone:''},
      {id:'NC002',name:'Temporary Staff 1',code:'NC002',department:'Support',position:'Temporary Staff',status:'Active',joining:'2026-09-02',email:'',phone:''},
      {id:'NC003',name:'Temporary Staff 2',code:'NC003',department:'Support',position:'Temporary Staff',status:'Active',joining:'2026-09-02',email:'',phone:''}
    ]);
  }

  if(!localStorage.getItem(KEYS.logs)){
    set(KEYS.logs,[
      {id:uid(),staffId:'NC001',title:'Budget Quotation Presentation + FLITE Product Shoot',workDate:'2026-09-07',startTime:'09:00',endTime:'17:00',dueDate:'2026-09-07',dueTime:'17:00',priority:'High',status:'Completed',description:'Presented budget quotation to team and completed FLITE product shooting.'},
      {id:uid(),staffId:'NC001',title:'Product Shooting + Content Brainstorming',workDate:'2026-09-08',startTime:'09:00',endTime:'17:00',dueDate:'2026-09-08',dueTime:'17:00',priority:'Medium',status:'Completed',description:'Continued product shooting and brainstormed social media content.'},
      {id:uid(),staffId:'NC001',title:'Live Setup Budget + Social Media Shoot',workDate:'2026-09-09',startTime:'09:00',endTime:'17:00',dueDate:'2026-09-09',dueTime:'17:00',priority:'High',status:'Completed',description:'Presented budget quotation for live setup and shot social media content.'},
      {id:uid(),staffId:'NC001',title:'Content Shooting + Video Editing',workDate:'2026-09-10',startTime:'09:00',endTime:'17:00',dueDate:'2026-09-10',dueTime:'17:00',priority:'Medium',status:'Completed',description:'Content shooting and video editing.'}
    ]);
  }

  if(!localStorage.getItem(KEYS.leaves))set(KEYS.leaves,[]);
  if(!localStorage.getItem(KEYS.attendance))set(KEYS.attendance,[]);
  if(!localStorage.getItem(KEYS.schedules)){
    set(KEYS.schedules,[
      {id:uid(),staffId:'NC001',title:'Content Planning',date:'2026-09-15',time:'10:00',location:'Office',description:''},
      {id:uid(),staffId:'NC001',title:'Product Shooting',date:'2026-09-16',time:'11:00',location:'Studio',description:''},
      {id:uid(),staffId:'NC001',title:'Video Editing',date:'2026-09-17',time:'14:00',location:'Office',description:''}
    ]);
  }
  if(!localStorage.getItem(KEYS.announcements)){
    set(KEYS.announcements,[
      {id:uid(),title:'Welcome to Nona Costex Staff Portal',message:'Welcome to the internal staff portal.',date:today(),createdBy:'Admin'},
      {id:uid(),title:'Digital Team Content Planning',message:'Please keep the weekly content planning updated.',date:today(),createdBy:'Admin'}
    ]);
  }
  if(!localStorage.getItem(KEYS.notifications))set(KEYS.notifications,[]);
  if(!localStorage.getItem(KEYS.activity))set(KEYS.activity,[]);
  migrateData();
}

function migrateData(){
  let logs=get(KEYS.logs);
  let changed=false;
  logs=logs.map(x=>{
    if(!x.staffId){x.staffId='NC001';changed=true}
    if(!x.id){x.id=uid();changed=true}
    return x
  });
  if(changed)set(KEYS.logs,logs);
}

function addActivity(action,detail,staffId){
  let a=get(KEYS.activity);
  a.unshift({id:uid(),action,detail,staffId:staffId||currentUser?.staffId||'admin',date:new Date().toISOString()});
  set(KEYS.activity,a.slice(0,300));
}

function addNotification(staffId,title,message,type='info'){
  let n=get(KEYS.notifications);
  n.unshift({id:uid(),staffId,title,message,type,date:new Date().toISOString(),read:false});
  set(KEYS.notifications,n.slice(0,300));
}

function toast(msg){
  const x=document.getElementById('toast');
  x.textContent=msg;x.classList.add('show');
  setTimeout(()=>x.classList.remove('show'),2200);
}

/* LOGIN */
function login(){
  let u=document.getElementById('loginUser').value.trim();
  let p=document.getElementById('loginPass').value.trim();

  if(u.toLowerCase()==='admin' && p==='ADMIN001'){
    currentUser={role:'admin',staffId:'admin',name:'Admin'};
  }else{
    let s=get(KEYS.staff).find(x=>
      (x.name||'').toLowerCase()===u.toLowerCase() &&
      (x.code||'').toLowerCase()===p.toLowerCase()
    );
    if(!s){toast('Invalid username or password');return}
    currentUser={role:'staff',staffId:s.id,name:s.name};
  }

  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('adminNav').classList.toggle('hidden',currentUser.role!=='admin');
  document.getElementById('topUser').textContent=currentUser.name;
  addActivity('Login',`${currentUser.name} logged in`,currentUser.staffId);
  go('dashboard');
}

function logout(){
  addActivity('Logout',`${currentUser.name} logged out`,currentUser.staffId);
  currentUser=null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('loginUser').value='';
  document.getElementById('loginPass').value='';
}

/* NAVIGATION */
function go(page){
  currentPage=page;
  document.querySelectorAll('.nav-btn[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));
  document.getElementById('sidebar').classList.remove('open');

  let titles={
    dashboard:'Dashboard',tasks:currentUser.role==='admin'?'Tasks':'My Tasks',
    logs:'Work Logs',attendance:'Attendance',leave:'Leave',
    schedule:'Schedule',announcements:'Announcements',notifications:'Notifications',
    staff:'Staff Management',analytics:'Analytics',activity:'Activity History',profile:'My Profile'
  };
  document.getElementById('topTitle').textContent=titles[page]||'Dashboard';

  let f={
    dashboard:dashboardPage,tasks:tasksPage,logs:logsPage,attendance:attendancePage,
    leave:leavePage,schedule:schedulePage,announcements:announcementPage,
    notifications:notificationPage,staff:staffPage,analytics:analyticsPage,
    activity:activityPage,profile:profilePage
  };
  if(f[page])f[page]();
  updateNotifCount();
}

function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}

/* DASHBOARD */
function dashboardPage(){
  let tasks=get(KEYS.logs).filter(x=>currentUser.role==='admin'||x.staffId===currentUser.staffId);
  let schedules=get(KEYS.schedules).filter(x=>currentUser.role==='admin'||x.staffId===currentUser.staffId);
  let leaves=get(KEYS.leaves).filter(x=>currentUser.role==='admin'||x.staffId===currentUser.staffId);
  let completed=tasks.filter(x=>x.status==='Completed').length;
  let progress=tasks.filter(x=>x.status==='In Progress').length;
  let overdue=tasks.filter(isOverdue).length;
  let rate=tasks.length?Math.round(completed/tasks.length*100):0;

  let upcoming=tasks.filter(x=>x.status!=='Completed'&&x.dueDate)
    .sort((a,b)=>(a.dueDate+a.dueTime).localeCompare(b.dueDate+b.dueTime)).slice(0,5);

  let todaySchedule=schedules.filter(x=>x.date===today()).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  let recent=get(KEYS.activity).filter(x=>currentUser.role==='admin'||x.staffId===currentUser.staffId).slice(0,5);

  let leaveUsed=leaves.filter(x=>x.status==='Approved').length;
  let leaveLeft=Math.max(0,14-leaveUsed);

  document.getElementById('content').innerHTML=`
    <div class="page-head">
      <div>
        <h1>Dashboard</h1>
        <p>Welcome back, ${esc(currentUser.name)}.</p>
      </div>
      <div class="actions">
        ${currentUser.role==='admin'?'<button class="btn" onclick="openTaskModal()">+ Assign Task</button>':''}
      </div>
    </div>

function taskList(arr){
  if(!arr.length)return '<div class="empty">No tasks for today.</div>';
  return `<div class="list">${arr.map(t=>`
    <div class="list-item" onclick="viewTask('${t.id}')" style="cursor:pointer">
      <strong>${esc(t.title)}</strong>
      <small>${currentUser.role==='admin'?staffName(t.staffId)+' · ':''}${statusBadge(t.status,isOverdue(t))}</small>
    </div>`).join('')}</div>`;
}

    <div class="page-head">

function renderTaskTable(){
  let q=(document.getElementById('taskSearch')?.value||'').toLowerCase();

  let tasks=get(KEYS.logs).filter(x=>currentUser.role==='admin'||x.staffId===currentUser.staffId)
    .filter(x=>(x.title+' '+(x.description||'')).toLowerCase().includes(q))
    .filter(x=>!f||(f==='Overdue'?isOverdue(x):x.status===f));

  document.getElementById('taskTable').innerHTML=tasks.length?`
  <div class="table-wrap"><table>
  <thead><tr><th>Task</th>${currentUser.role==='admin'?'<th>Assigned To</th>':''}<th>Due</th><th>Priority</th><th>Status</th><th>Action</th></tr></thead>
  <tbody>${tasks.map(t=>`
  <tr>
    <td><b>${esc(t.title)}</b><br><small style="color:#888">${esc(t.description||'')}</small></td>
    ${currentUser.role==='admin'?`<td>${esc(staffName(t.staffId))}</td>`:''}
    <td>${fmtDate(t.dueDate)}<br><small>${esc(t.dueTime||'')}</small></td>
    <td>${priorityBadge(t.priority)}</td>

    </div></td>
  </tr>`).join('')}</tbody></table></div>`
  :'<div class="empty">No tasks found.</div>';
}

function openTaskModal(id=null){
  if(currentUser.role!=='admin')return;
  let t=id?get(KEYS.logs).find(x=>x.id===id):null;
  let staff=get(KEYS.staff).filter(x=>x.status==='Active');

  document.getElementById('modalTitle').textContent=t?'Edit Task':'Assign New Task';
  document.getElementById('modalBody').innerHTML=`
  <div class="form-grid">
    <div class="form-group form-full"><label>Task Title</label><input id="mTitle" value="${esc(t?.title||'')}"></div>
    <div class="form-group"><label>Assign To</label><select id="mStaff">${staff.map(s=>`<option value="${s.id}" ${t?.staffId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
    <div class="form-group"><label>Priority</label><select id="mPriority">${['Low','Medium','High'].map(x=>`<option ${t?.priority===x?'selected':''}>${x}</option>`).join('')}</select></div>
    <div class="form-group"><label>Work Date</label><input id="mWorkDate" type="date" value="${t?.workDate||today()}"></div>
    <div class="form-group"><label>Status</label><select id="mStatus">${['Pending','In Progress','Completed'].map(x=>`<option ${t?.status===x?'selected':''}>${x}</option>`).join('')}</select></div>
    <div class="form-group"><label>Due Date</label><input id="mDueDate" type="date" value="${t?.dueDate||today()}"></div>
    <div class="form-group"><label>Due Time</label><input id="mDueTime" type="time" value="${t?.dueTime||'17:00'}"></div>
    <div class="form-group form-full"><label>Description</label><textarea id="mDesc">${esc(t?.description||'')}</textarea></div>
  </div>
  <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveTask('${id||''}')">Save Task</button></div>`;
  showModal();
}

function saveTask(id){
  let logs=get(KEYS.logs);
  let obj={
    id:id||uid(),
    title:document.getElementById('mTitle').value.trim(),
    staffId:document.getElementById('mStaff').value,
    priority:document.getElementById('mPriority').value,
    workDate:document.getElementById('mWorkDate').value,
    status:document.getElementById('mStatus').value,
    dueDate:document.getElementById('mDueDate').value,
    dueTime:document.getElementById('mDueTime').value,
    description:document.getElementById('mDesc').value.trim(),
    assignedBy:'admin'
  };
  if(!obj.title){toast('Please enter a task title');return}
  let old=logs.find(x=>x.id===id);
  if(id)logs=logs.map(x=>x.id===id?{...x,...obj}:x);
  else logs.unshift(obj);
  set(KEYS.logs,logs);

  if(!id)addNotification(obj.staffId,'New task assigned',obj.title,'task');
  addActivity(id?'Task Updated':'Task Assigned',obj.title,obj.staffId);
  closeModal();toast(id?'Task updated':'Task assigned');
  tasksPage();
}

function deleteTask(id){
  if(!confirm('Delete this task?'))return;
  let t=get(KEYS.logs).find(x=>x.id===id);
  set(KEYS.logs,get(KEYS.logs).filter(x=>x.id!==id));
  addActivity('Task Deleted',t?.title||id,t?.staffId);
  toast('Task deleted');renderTaskTable();
}

function viewTask(id){
  let t=get(KEYS.logs).find(x=>x.id===id);
  if(!t)return;
  document.getElementById('modalTitle').textContent='Task Details';
  document.getElementById('modalBody').innerHTML=`
    <div class="info-grid">
      <div class="info-box"><small>Task</small><strong>${esc(t.title)}</strong></div>
      <div class="info-box"><small>Assigned To</small><strong>${esc(staffName(t.staffId))}</strong></div>
      <div class="info-box"><small>Work Date</small><strong>${fmtDate(t.workDate)}</strong></div>
      <div class="info-box"><small>Due</small><strong>${fmtDate(t.dueDate)} ${esc(t.dueTime||'')}</strong></div>
      <div class="info-box"><small>Priority</small><strong>${esc(t.priority||'-')}</strong></div>
      <div class="info-box"><small>Status</small><strong>${statusBadge(t.status,isOverdue(t))}</strong></div>
    </div>
    <div style="margin-top:18px">
      <label>Description</label>
      <div style="padding:13px;background:#fafaf8;border-radius:10px;font-size:13px;line-height:1.6">${esc(t.description||'No description.')}</div>
    </div>
    ${currentUser.role==='staff'&&t.status!=='Completed'?`
      <div class="modal-actions">
        <button class="btn" onclick="updateTaskStatus('${t.id}','${t.status==='Pending'?'In Progress':'Completed'}')">
        Mark as ${t.status==='Pending'?'In Progress':'Completed'}</button>
      </div>`:''}
    ${currentUser.role==='admin'?`<div class="modal-actions"><button class="btn" onclick="closeModal();openTaskModal('${t.id}')">Edit Task</button></div>`:''}

function updateTaskStatus(id,status){
  let logs=get(KEYS.logs);
  let t=logs.find(x=>x.id===id);
  if(!t)return;
  t.status=status;
  set(KEYS.logs,logs);
  addActivity('Task Status Updated',`${t.title} → ${status}`,t.staffId);
  if(status==='Completed')addNotification('admin','Task completed',`${staffName(t.staffId)} completed "${t.title}".`,'task');
  closeModal();toast('Task status updated');go('tasks');
}

function attendancePage(){
  let arr=get(KEYS.attendance);

  let todayRec=arr.find(x=>x.staffId===currentUser.staffId&&x.date===today());

  document.getElementById('content').innerHTML=`
  <div class="page-head"><div><h1>Attendance</h1><p>Track daily attendance.</p></div>
  ${currentUser.role==='staff'?`<div class="actions">${!todayRec?.clockIn?'<button class="btn" onclick="clockIn()">Clock In</button>':''}${todayRec?.clockIn&&!todayRec.clockOut?'<button class="btn" onclick="clockOut()">Clock Out</button>':''}</div>`:''}</div>
  <div class="section-card">
  ${currentUser.role==='staff'?`<div class="cards"><div class="card"><div class="stat-label">Today</div><div class="stat-value">${todayRec?'Recorded':'Not Recorded'}</div><div class="stat-note">${todayRec?.clockIn?'Clock in: '+todayRec.clockIn:'No clock in yet'}</div></div></div>`:''}

  </tbody></table></div></div>`;

function clockIn(){
  let a=get(KEYS.attendance),r=a.find(x=>x.staffId===currentUser.staffId&&x.date===today());
  if(!r){r={id:uid(),staffId:currentUser.staffId,date:today(),clockIn:new Date().toLocaleTimeString('en-MY',{hour:'2-digit',minute:'2-digit'}),clockOut:''};a.push(r)}
  else r.clockIn=new Date().toLocaleTimeString('en-MY',{hour:'2-digit',minute:'2-digit'});
  set(KEYS.attendance,a);addActivity('Clock In','Attendance clocked in',currentUser.staffId);toast('Clocked in');attendancePage();
}
function clockOut(){
  let a=get(KEYS.attendance),r=a.find(x=>x.staffId===currentUser.staffId&&x.date===today());
  if(!r)return;
  r.clockOut=new Date().toLocaleTimeString('en-MY',{hour:'2-digit',minute:'2-digit'});
  set(KEYS.attendance,a);addActivity('Clock Out','Attendance clocked out',currentUser.staffId);toast('Clocked out');attendancePage();
}

  </div>
  <div class="section-card"><div class="section-title"><h3>Upcoming Schedule</h3></div>
  ${schedules.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,10).map(s=>`<div class="list-item" style="margin-bottom:8px"><strong>${esc(s.title)}</strong><small>${fmtDate(s.date)} · ${esc(s.time||'')} · ${esc(s.location||'')}${currentUser.role==='admin'?' · '+esc(staffName(s.staffId)):''}</small></div>`).join('')||'<div class="empty">No schedules.</div>'}</div>`;
  renderCalendar(schedules);
}
function renderCalendar(schedules){
  let y=calendarDate.getFullYear(),m=calendarDate.getMonth();
  document.getElementById('calTitle').textContent=new Date(y,m,1).toLocaleDateString('en-MY',{month:'long',year:'numeric'});
  let first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate();
  let html='<div class="calendar">';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(x=>html+=`<div class="day-name">${x}</div>`);
  for(let i=0;i<42;i++){
    let n=i-first+1,d=n,other=false;
    if(n<1){d=prev+n;other=true}
    if(n>days){d=n-days;other=true}
    let date=other?(n<1?new Date(y,m-1,d):new Date(y,m+1,d)):new Date(y,m,d);
    let ds=date.toISOString().slice(0,10);
    let isT=ds===today();
    let events=schedules.filter(s=>s.date===ds);
    let tasks=get(KEYS.logs).filter(t=>(currentUser.role==='admin'||t.staffId===currentUser.staffId)&&t.dueDate===ds);
    html+=`<div class="day ${other?'other':''} ${isT?'today':''}" onclick="calendarClick('${ds}')"><div class="day-number">${d}</div>
      ${events.map(e=>`<div class="event" title="${esc(e.title)}">• ${esc(e.title)}</div>`).join('')}
      ${tasks.slice(0,3).map(t=>`<div class="event task ${isOverdue(t)?'overdue':''}" title="${esc(t.title)}">✓ ${esc(t.title)}</div>`).join('')}
    </div>`;
  }
  html+='</div>';
  document.getElementById('calendar').innerHTML=html;
}
function changeMonth(n){calendarDate.setMonth(calendarDate.getMonth()+n);schedulePage()}
function calendarClick(date){
  if(currentUser.role==='admin')openScheduleModal(null,date);
}
function openScheduleModal(id=null,date=null){
  let x=id?get(KEYS.schedules).find(a=>a.id===id):null;
  document.getElementById('modalTitle').textContent='Add Schedule';
  document.getElementById('modalBody').innerHTML=`
  <div class="form-grid">
    <div class="form-group form-full"><label>Schedule Title</label><input id="sTitle" value="${esc(x?.title||'')}"></div>
    <div class="form-group"><label>Staff</label><select id="sStaff">${get(KEYS.staff).filter(s=>s.status==='Active').map(s=>`<option value="${s.id}" ${x?.staffId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
    <div class="form-group"><label>Date</label><input id="sDate" type="date" value="${x?.date||date||today()}"></div>
    <div class="form-group"><label>Time</label><input id="sTime" type="time" value="${x?.time||'10:00'}"></div>
    <div class="form-group"><label>Location</label><input id="sLocation" value="${esc(x?.location||'Office')}"></div>
    <div class="form-group form-full"><label>Description</label><textarea id="sDesc">${esc(x?.description||'')}</textarea></div>
  </div>
  <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveSchedule('${id||''}')">Save</button></div>`;
  showModal();
}
function saveSchedule(id){
  let a=get(KEYS.schedules),x={id:id||uid(),title:document.getElementById('sTitle').value.trim(),staffId:document.getElementById('sStaff').value,date:document.getElementById('sDate').value,time:document.getElementById('sTime').value,location:document.getElementById('sLocation').value,description:document.getElementById('sDesc').value};
  if(!x.title){toast('Enter schedule title');return}
  if(id)a=a.map(y=>y.id===id?x:y);else a.unshift(x);
  set(KEYS.schedules,a);addNotification(x.staffId,'New schedule',x.title,'schedule');addActivity('Schedule Added',x.title,x.staffId);
  closeModal();toast('Schedule saved');schedulePage();
}

/* ANNOUNCEMENTS */
function announcementPage(){
  let a=get(KEYS.announcements);
  document.getElementById('content').innerHTML=`
  <div class="page-head"><div><h1>Announcements</h1><p>Company and team updates.</p></div>${currentUser.role==='admin'?'<button class="btn" onclick="openAnnouncementModal()">+ New Announcement</button>':''}</div>
  <div class="list">${a.map(x=>`<div class="section-card"><div class="section-title"><h3>${esc(x.title)}</h3><span>${fmtDate(x.date)}</span></div><div style="font-size:13px;line-height:1.6;color:#555">${esc(x.message)}</div><small style="color:#999;display:block;margin-top:12px">Posted by ${esc(x.createdBy||'Admin')}</small>${currentUser.role==='admin'?`<button class="btn small danger" style="margin-top:12px" onclick="deleteAnnouncement('${x.id}')">Delete</button>`:''}</div>`).join('')||'<div class="empty">No announcements.</div>'}</div>`;
}
function openAnnouncementModal(){
  document.getElementById('modalTitle').textContent='New Announcement';
  document.getElementById('modalBody').innerHTML=`
  <div class="form-group"><label>Title</label><input id="aTitle"></div>
  <div class="form-group"><label>Message</label><textarea id="aMessage"></textarea></div>
  <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveAnnouncement()">Post</button></div>`;
  showModal();
}
function saveAnnouncement(){
  let x={id:uid(),title:document.getElementById('aTitle').value.trim(),message:document.getElementById('aMessage').value.trim(),date:today(),createdBy:'Admin'};
  if(!x.title){toast('Enter title');return}
  let a=get(KEYS.announcements);a.unshift(x);set(KEYS.announcements,a);
  get(KEYS.staff).filter(s=>s.status==='Active').forEach(s=>addNotification(s.id,'New announcement',x.title,'announcement'));
  addActivity('Announcement Posted',x.title);closeModal();toast('Announcement posted');announcementPage();
}
function deleteAnnouncement(id){
  if(!confirm('Delete announcement?'))return;
  set(KEYS.announcements,get(KEYS.announcements).filter(x=>x.id!==id));toast('Deleted');announcementPage();
}

/* NOTIFICATIONS */
function updateNotifCount(){
  if(!currentUser)return;
  let n=get(KEYS.notifications).filter(x=>x.staffId===currentUser.staffId&&!x.read);
  document.getElementById('navNotif').textContent=n.length?`(${n.length})`:'';
}
function notificationPage(){
  let n=get(KEYS.notifications).filter(x=>x.staffId===currentUser.staffId);
  document.getElementById('content').innerHTML=`
  <div class="page-head"><div><h1>Notifications</h1><p>Your latest updates.</p></div><button class="btn secondary" onclick="markAllRead()">Mark all as read</button></div>
  <div class="list">${n.length?n.map(x=>`<div class="list-item" style="${x.read?'opacity:.55':''}" onclick="markRead('${x.id}')"><strong>${esc(x.title)}</strong><small>${esc(x.message)} · ${new Date(x.date).toLocaleString()}</small></div>`).join(''):'<div class="empty">No notifications.</div>'}</div>`;
}
function markRead(id){
  let n=get(KEYS.notifications),x=n.find(a=>a.id===id);if(x)x.read=true;set(KEYS.notifications,n);notificationPage();
}
function markAllRead(){
  let n=get(KEYS.notifications);n.filter(x=>x.staffId===currentUser.staffId).forEach(x=>x.read=true);set(KEYS.notifications,n);notificationPage();
}

/* STAFF */
function staffPage(){
  let s=get(KEYS.staff);
  document.getElementById('content').innerHTML=`
  <div class="page-head"><div><h1>Staff Management</h1><p>Manage staff records and profiles.</p></div><button class="btn" onclick="openStaffModal()">+ Add Staff</button></div>
  <div class="section-card"><div class="actions" style="margin-bottom:16px"><input id="staffSearch" placeholder="Search staff..." oninput="renderStaff()" style="max-width:300px"></div><div id="staffTable"></div></div>`;
  renderStaff();
}
function renderStaff(){
  let q=(document.getElementById('staffSearch')?.value||'').toLowerCase();
  let s=get(KEYS.staff).filter(x=>(x.name+' '+x.code+' '+x.department+' '+x.position).toLowerCase().includes(q));
  document.getElementById('staffTable').innerHTML=`<div class="table-wrap"><table><thead><tr><th>Staff</th><th>Department</th><th>Position</th><th>Status</th><th>Action</th></tr></thead><tbody>${s.map(x=>`<tr><td><b>${esc(x.name)}</b><br><small>${esc(x.code)}</small></td><td>${esc(x.department)}</td><td>${esc(x.position)}</td><td><span class="badge ${x.status==='Active'?'active':'inactive'}">${esc(x.status)}</span></td><td><button class="btn small secondary" onclick="viewStaff('${x.id}')">Profile</button> <button class="btn small" onclick="openStaffModal('${x.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div>`;
}
function openStaffModal(id=null){
  let x=id?staffById(id):null;
  document.getElementById('modalTitle').textContent=x?'Edit Staff':'Add Staff';
  document.getElementById('modalBody').innerHTML=`
  <div class="form-grid">
    <div class="form-group"><label>Name</label><input id="pName" value="${esc(x?.name||'')}"></div>
    <div class="form-group"><label>Staff Code</label><input id="pCode" value="${esc(x?.code||'')}"></div>
    <div class="form-group"><label>Department</label><input id="pDept" value="${esc(x?.department||'')}"></div>
    <div class="form-group"><label>Position</label><input id="pPosition" value="${esc(x?.position||'')}"></div>
    <div class="form-group"><label>Status</label><select id="pStatus"><option ${x?.status==='Active'?'selected':''}>Active</option><option ${x?.status==='Inactive'?'selected':''}>Inactive</option></select></div>
    <div class="form-group"><label>Joining Date</label><input id="pJoin" type="date" value="${x?.joining||''}"></div>
    <div class="form-group"><label>Email</label><input id="pEmail" value="${esc(x?.email||'')}"></div>
    <div class="form-group"><label>Phone</label><input id="pPhone" value="${esc(x?.phone||'')}"></div>
  </div>
  <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveStaff('${id||''}')">Save</button></div>`;
  showModal();
}
function saveStaff(id){
  let a=get(KEYS.staff),x={id:id||document.getElementById('pCode').value.trim(),name:document.getElementById('pName').value.trim(),code:document.getElementById('pCode').value.trim(),department:document.getElementById('pDept').value.trim(),position:document.getElementById('pPosition').value.trim(),status:document.getElementById('pStatus').value,joining:document.getElementById('pJoin').value,email:document.getElementById('pEmail').value.trim(),phone:document.getElementById('pPhone').value.trim()};
  if(!x.name||!x.code){toast('Name and staff code are required');return}
  if(id)a=a.map(y=>y.id===id?x:y);else a.push(x);
  set(KEYS.staff,a);addActivity(id?'Staff Updated':'Staff Added',x.name,x.id);closeModal();toast('Staff saved');staffPage();
}
function viewStaff(id){
  let s=staffById(id),logs=get(KEYS.logs).filter(x=>x.staffId===id),completed=logs.filter(x=>x.status==='Completed').length;
  let photo=localStorage.getItem(KEYS.photos+id);
  document.getElementById('modalTitle').textContent='Staff Profile';
  document.getElementById('modalBody').innerHTML=`
  <div class="profile-head"><div class="avatar">${photo?`<img src="${photo}">`:initials(s.name)}</div><div class="profile-info"><h2>${esc(s.name)}</h2><p>${esc(s.position)} · ${esc(s.department)}</p></div></div>
  <div class="info-grid">
    <div class="info-box"><small>Staff Code</small><strong>${esc(s.code)}</strong></div>
    <div class="info-box"><small>Status</small><strong>${esc(s.status)}</strong></div>
    <div class="info-box"><small>Joining Date</small><strong>${fmtDate(s.joining)}</strong></div>
    <div class="info-box"><small>Email</small><strong>${esc(s.email||'-')}</strong></div>
    <div class="info-box"><small>Phone</small><strong>${esc(s.phone||'-')}</strong></div>
    <div class="info-box"><small>Tasks Completed</small><strong>${completed} / ${logs.length}</strong></div>
  </div>`;
  showModal();
}

/* PROFILE */
function profilePage(){
  let s=currentUser.role==='admin'?{name:'Admin',code:'ADMIN',department:'Administration',position:'Administrator',status:'Active',joining:'',email:'',phone:''}:staffById(currentUser.staffId);
  let photo=currentUser.role==='admin'?null:localStorage.getItem(KEYS.photos+s.id);
  let logs=get(KEYS.logs).filter(x=>currentUser.role==='admin'||x.staffId===s.id);
  let done=logs.filter(x=>x.status==='Completed').length,rate=logs.length?Math.round(done/logs.length*100):0;

  document.getElementById('content').innerHTML=`
  <div class="page-head"><div><h1>My Profile</h1><p>Your employee information and work summary.</p></div></div>
  <div class="section-card">
    <div class="profile-head">
      <div class="avatar">${photo?`<img src="${photo}">`:initials(s.name)}</div>
      <div class="profile-info"><h2>${esc(s.name)}</h2><p>${esc(s.position)} · ${esc(s.department)}</p></div>
    </div>
    <div class="actions" style="margin-bottom:20px">${currentUser.role==='staff'?'<button class="btn secondary" onclick="uploadPhoto()">Change Profile Photo</button>':''}</div>
    <div class="info-grid">
      <div class="info-box"><small>Staff Code</small><strong>${esc(s.code)}</strong></div>
      <div class="info-box"><small>Status</small><strong>${esc(s.status)}</strong></div>
      <div class="info-box"><small>Department</small><strong>${esc(s.department)}</strong></div>
      <div class="info-box"><small>Position</small><strong>${esc(s.position)}</strong></div>
      <div class="info-box"><small>Joining Date</small><strong>${fmtDate(s.joining)}</strong></div>
      <div class="info-box"><small>Email</small><strong>${esc(s.email||'-')}</strong></div>
      <div class="info-box"><small>Phone</small><strong>${esc(s.phone||'-')}</strong></div>
      <div class="info-box"><small>Completion Rate</small><strong>${rate}%</strong></div>
    </div>
  </div>`;
}
function uploadPhoto(){
  let input=document.createElement('input');input.type='file';input.accept='image/*';
  input.onchange=()=>{
    let file=input.files[0];if(!file)return;
    let r=new FileReader();r.onload=()=>{
      localStorage.setItem(KEYS.photos+currentUser.staffId,r.result);
      addActivity('Profile Photo Updated','Profile photo changed',currentUser.staffId);
      toast('Profile photo updated');profilePage();
    };r.readAsDataURL(file);
  };input.click();
}

/* ANALYTICS */
function analyticsPage(){
  let logs=get(KEYS.logs),staff=get(KEYS.staff),att=get(KEYS.attendance);
  let completed=logs.filter(x=>x.status==='Completed').length;
  let rate=logs.length?Math.round(completed/logs.length*100):0;
  document.getElementById('content').innerHTML=`
  <div class="page-head"><div><h1>Analytics</h1><p>Work and attendance overview.</p></div><div class="actions"><button class="btn secondary" onclick="exportCSV('logs')">Export Work Logs</button><button class="btn secondary" onclick="exportCSV('attendance')">Export Attendance</button><button class="btn secondary" onclick="exportCSV('leave')">Export Leave</button></div></div>
  <div class="cards">
    <div class="card"><div class="stat-label">Total Work Logs</div><div class="stat-value">${logs.length}</div></div>
    <div class="card"><div class="stat-label">Completion Rate</div><div class="stat-value">${rate}%</div></div>
    <div class="card"><div class="stat-label">Attendance Records</div><div class="stat-value">${att.length}</div></div>
    <div class="card"><div class="stat-label">Active Staff</div><div class="stat-value">${staff.filter(x=>x.status==='Active').length}</div></div>
  </div>
  <div class="section-card"><div class="section-title"><h3>Staff Performance</h3></div><div class="table-wrap"><table><thead><tr><th>Staff</th><th>Total Tasks</th><th>Completed</th><th>In Progress</th><th>Rate</th></tr></thead><tbody>
  ${staff.map(s=>{let x=logs.filter(l=>l.staffId===s.id),c=x.filter(l=>l.status==='Completed').length,r=x.length?Math.round(c/x.length*100):0;return `<tr><td><b>${esc(s.name)}</b><br><small>${esc(s.position)}</small></td><td>${x.length}</td><td>${c}</td><td>${x.filter(l=>l.status==='In Progress').length}</td><td><div style="display:flex;align-items:center;gap:8px"><div class="progress" style="width:100px"><div class="progress-bar" style="width:${r}%"></div></div>${r}%</div></td></tr>`}).join('')}
  </tbody></table></div></div>`;
}
function exportCSV(type){
  let arr=type==='logs'?get(KEYS.logs):type==='attendance'?get(KEYS.attendance):get(KEYS.leaves);
  if(!arr.length){toast('No data to export');return}
  let keys=Object.keys(arr[0]),csv=[keys.join(',')];
  arr.forEach(x=>csv.push(keys.map(k=>`"${String(x[k]??'').replace(/"/g,'""')}"`).join(',')));
  let blob=new Blob([csv.join('\n')],{type:'text/csv'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=`nona-${type}-${today()}.csv`;a.click();URL.revokeObjectURL(a.href);
}

/* ACTIVITY */
function activityPage(){
  let a=get(KEYS.activity);
  document.getElementById('content').innerHTML=`
  <div class="page-head"><div><h1>Activity History</h1><p>Recent portal activity.</p></div></div>
  <div class="section-card"><div class="list">${a.length?a.slice(0,100).map(x=>`<div class="list-item"><strong>${esc(x.action)}</strong><small>${esc(x.detail)} · ${esc(staffName(x.staffId))} · ${new Date(x.date).toLocaleString()}</small></div>`).join(''):'<div class="empty">No activity.</div>'}</div></div>`;
}

/* MODAL */
function showModal(){document.getElementById('modalBg').classList.add('show')}
function closeModal(){document.getElementById('modalBg').classList.remove('show')}

/* START */
initData();
</script>
