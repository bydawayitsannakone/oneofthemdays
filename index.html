<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nona Costex Staff Portal</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Helvetica,Arial,sans-serif;
  background:#f4f4f1;
  color:#252622;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

:root{
  --olive:#6f745c;
  --olive-dark:#555a45;
  --olive-light:#e7e9df;
  --bg:#f4f4f1;
  --card:#fff;
  --line:#e4e4de;
  --muted:#77796f;
  --danger:#b65c55;
  --warning:#b58a45;
  --success:#638260;
  --sidebar:245px;
}

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:#ecece7;
}
.login-box{
  width:100%;
  max-width:430px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:38px;
  box-shadow:0 12px 40px rgba(0,0,0,.06);
}
.logo-mark{
  width:52px;height:52px;
  border-radius:14px;
  background:var(--olive);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  margin-bottom:22px;
}
.login-box h1{font-size:25px;margin-bottom:6px}
.login-box p{color:var(--muted);font-size:14px;margin-bottom:28px}

.field{margin-bottom:16px}
.field label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:7px;
  color:#55574e;
}
.field input,.field select,.field textarea{
  width:100%;
  border:1px solid #dcdcd5;
  background:#fff;
  border-radius:9px;
  padding:11px 12px;
  outline:none;
}
.field textarea{min-height:100px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--olive);
}
.login-btn,.primary{
  border:0;
  background:var(--olive);
  color:#fff;
  padding:11px 16px;
  border-radius:9px;
  font-weight:700;
}
.login-btn{width:100%;margin-top:5px}
.login-btn:hover,.primary:hover{background:var(--olive-dark)}
.demo{
  margin-top:20px;
  padding:13px;
  border-radius:10px;
  background:#f6f6f2;
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
}

.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar);
  background:#fff;
  border-right:1px solid var(--line);
  position:fixed;
  top:0;bottom:0;left:0;
  padding:24px 14px;
  z-index:30;
  overflow-y:auto;
}
.brand{
  padding:0 12px 24px;
  border-bottom:1px solid var(--line);
  margin-bottom:18px;
}
.brand-name{font-weight:800;font-size:16px}
.brand-sub{font-size:11px;color:var(--muted);margin-top:3px}
.nav-section{
  font-size:10px;
  text-transform:uppercase;
  color:#9a9b94;
  font-weight:700;
  padding:10px 12px 7px;
}
.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  text-align:left;
  padding:10px 12px;
  border-radius:8px;
  color:#5d5f57;
  margin-bottom:2px;
}
.nav-btn:hover{background:#f2f2ee}
.nav-btn.active{
  background:var(--olive-light);
  color:var(--olive-dark);
  font-weight:700;
}
.logout-nav{
  margin-top:18px;
  border-top:1px solid var(--line);
  padding-top:18px;
}

.main{
  margin-left:var(--sidebar);
  width:calc(100% - var(--sidebar));
}
.topbar{
  height:70px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:20;
}
.top-title{font-size:18px;font-weight:800}
.top-user{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:13px;
}
.avatar{
  width:34px;height:34px;
  border-radius:50%;
  background:var(--olive-light);
  color:var(--olive-dark);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:800;
  overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover}

.content{padding:28px;max-width:1500px;margin:auto}

.grid{
  display:grid;
  gap:16px;
}
.cards-4{grid-template-columns:repeat(4,1fr)}
.cards-3{grid-template-columns:repeat(3,1fr)}
.cards-2{grid-template-columns:repeat(2,1fr)}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:13px;
  padding:20px;
}
.stat-label{
  color:var(--muted);
  font-size:12px;
  margin-bottom:10px;
}
.stat-value{font-size:27px;font-weight:800}
.stat-note{font-size:11px;color:var(--muted);margin-top:6px}

.page-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  margin-bottom:22px;
}
.page-head h2{font-size:22px}
.page-head p{color:var(--muted);font-size:13px;margin-top:5px}

.actions{display:flex;gap:8px;flex-wrap:wrap}
.secondary,.danger-btn,.warning-btn{
  border:1px solid var(--line);
  background:#fff;
  padding:9px 13px;
  border-radius:8px;
  font-size:12px;
  font-weight:700;
}
.secondary:hover{background:#f4f4f1}
.danger-btn{color:var(--danger);border-color:#ead0ce}
.warning-btn{color:#956f2e;border-color:#eadfca}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{
  padding:12px 10px;
  text-align:left;
  border-bottom:1px solid var(--line);
  font-size:12px;
}
th{
  color:#777970;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.03em;
}
tr:last-child td{border-bottom:0}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:20px;
  font-size:10px;
  font-weight:800;

.badge.pending{background:#f1eee5;color:#8b7547}
.badge.progress{background:#e9edf0;color:#5e6c75}
.badge.completed{background:#e8efe7;color:#5d785b}
.badge.overdue{background:#f3e4e2;color:#a2524b}
.badge.approved{background:#e8efe7;color:#5d785b}
.badge.rejected{background:#f3e4e2;color:#a2524b}
.badge.active{background:#e8efe7;color:#5d785b}

.progress{

  background:#ecece7;
  border-radius:20px;
  overflow:hidden;
}
.progress span{
  display:block;
  height:100%;
  background:var(--olive);

.quick-grid{

  grid-template-columns:repeat(3,1fr);

.quick{

  border:1px solid var(--line);

  text-align:left;

.quick strong{display:block;font-size:12px}
.quick span{font-size:11px;color:var(--muted)}

.list{display:flex;flex-direction:column;gap:10px}
.list-item{

  border:1px solid var(--line);
  border-radius:10px;
}
.list-item strong{font-size:13px}
.list-item small{display:block;color:var(--muted);margin-top:5px;font-size:11px}

.filterbar{

  gap:9px;
  flex-wrap:wrap;
  margin-bottom:15px;
}
.filterbar input,.filterbar select{
  border:1px solid var(--line);
  padding:9px 10px;
  border-radius:8px;
  background:#fff;
  min-width:150px;
  outline:none;
}

.empty{
  padding:35px 20px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

.calendar-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}
.calendar-title{font-weight:800;font-size:17px}
.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  border-top:1px solid var(--line);
  border-left:1px solid var(--line);
}
.cal-day-name{
  background:#f7f7f4;
  padding:10px;
  font-size:10px;
  font-weight:800;
  color:var(--muted);
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.cal-cell{
  min-height:110px;
  padding:8px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  background:#fff;
}
.cal-cell.muted{background:#fafaf8;color:#b4b5ae}
.cal-cell.today{background:#f0f2e9}
.cal-num{font-size:11px;font-weight:800;margin-bottom:7px}
.cal-event{
  padding:4px 5px;
  border-radius:5px;
  background:var(--olive-light);
  color:var(--olive-dark);
  font-size:9px;
  margin-bottom:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(30,30,28,.42);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal{
  background:#fff;
  width:100%;
  max-width:620px;
  max-height:90vh;
  overflow-y:auto;
  border-radius:15px;
  padding:24px;
}
.modal h3{font-size:18px;margin-bottom:18px}
.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:20px;
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#292a27;
  color:#fff;
  padding:12px 16px;
  border-radius:9px;
  font-size:12px;
  z-index:200;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
}

.mobile-menu{
  display:none;
  border:0;
  background:transparent;
  font-size:22px;
}

.section-gap{margin-top:20px}

.detail-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.detail-box{
  padding:12px;
  background:#f7f7f4;
  border-radius:9px;
}
.detail-box span{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-bottom:4px;
}
.detail-box strong{font-size:12px}

.history-item{
  border-left:2px solid var(--olive);
  padding:4px 0 8px 12px;
  margin-bottom:10px;
}
.history-item strong{font-size:12px}
.history-item small{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

.warning-box{
  background:#f7f1e5;
  border:1px solid #eadfc9;
  color:#866c3b;
  padding:12px;
  border-radius:9px;
  font-size:12px;
  margin-bottom:15px;
}
.success-box{
  background:#edf3eb;
  border:1px solid #d9e6d6;
  color:#587155;
  padding:12px;
  border-radius:9px;
  font-size:12px;
  margin-bottom:15px;
}

@media(max-width:1000px){
  .cards-4{grid-template-columns:repeat(2,1fr)}
  .cards-3{grid-template-columns:1fr 1fr}
}

@media(max-width:760px){
  .sidebar{
    transform:translateX(-100%);
    transition:.2s;
    box-shadow:10px 0 30px rgba(0,0,0,.08);
  }
  .sidebar.open{transform:translateX(0)}
  .main{
    margin-left:0;
    width:100%;
  }
  .mobile-menu{display:block}
  .topbar{padding:0 17px}
  .content{padding:18px}
  .cards-4,.cards-3,.cards-2{grid-template-columns:1fr}
  .page-head{flex-direction:column}
  .quick-grid{grid-template-columns:1fr}
  .calendar{min-width:700px}
  .calendar-wrap{overflow-x:auto}
  .cal-cell{min-height:90px}
  .detail-grid{grid-template-columns:1fr}

</head>

function uid(prefix='id'){
  return prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
}

function nowISO(){
  return new Date().toISOString();
}

function todayISO(){
  const d = new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function get(key,fallback=[]){
  try{
    const raw=localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){
    return fallback;
  }
}

function set(key,value){
  localStorage.setItem(key,JSON.stringify(value));
}

function escapeHTML(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function formatDate(date){
  if(!date)return '-';
  const d=new Date(date+'T00:00:00');
  if(isNaN(d))return date;
  return d.toLocaleDateString('en-MY',{
    day:'2-digit',
    month:'short',
    year:'numeric'
  });
}

function formatDateTime(value){
  if(!value)return '-';
  const d=new Date(value);
  if(isNaN(d))return value;
  return d.toLocaleString('en-MY',{
    day:'2-digit',
    month:'short',
    year:'numeric',
    hour:'2-digit',
    minute:'2-digit'
  });
}

function daysBetween(start,end){
  if(!start || !end)return 0;
  const a=new Date(start+'T00:00:00');
  const b=new Date(end+'T00:00:00');
  const diff=Math.round((b-a)/86400000);
  return diff >= 0 ? diff+1 : 0;
}

function initials(name){
  return String(name||'?')
    .split(' ')
    .filter(Boolean)
    .slice(0,2)
    .map(x=>x[0])
    .join('')
    .toUpperCase();
}

function showToast(message){
  const root=document.getElementById('toastRoot');
  root.innerHTML=`<div class="toast">${escapeHTML(message)}</div>`;
  setTimeout(()=>root.innerHTML='',2800);
}

function migrateData(){

  let logs=get(KEYS.logs);
  logs=logs.map(l=>({
    ...l,
    id:l.id||uid('log'),
    staffId:l.staffId||'staff_atikah',
    status:l.status||'Pending',
    priority:l.priority||'Medium',
    createdAt:l.createdAt||nowISO()
  }));
  set(KEYS.logs,logs);

  let schedules=get(KEYS.schedules);
  schedules=schedules.map(s=>({
    ...s,
    id:s.id||uid('sch'),
    staffId:s.staffId||'staff_atikah'
  }));
  set(KEYS.schedules,schedules);

  let history=get(KEYS.taskHistory);
  if(!Array.isArray(history))history=[];
  set(KEYS.taskHistory,history);
}

/* =========================================================
   HELPERS
   ========================================================= */

function getStaffName(id){
  if(id==='admin')return 'Admin';
  return get(KEYS.staff).find(s=>s.id===id)?.name||'Unknown';
}

function getStaffCode(id){
  if(id==='admin')return 'ADMIN001';
  return get(KEYS.staff).find(s=>s.id===id)?.code||'';
}

function visibleTasks(){

  let logs=get(KEYS.logs);

  if(currentUser.role==='staff'){
    logs=logs.filter(l=>l.staffId===currentUser.staffId);
  }

  return logs;
}

function isOverdue(task){

  if(task.status==='Completed')return false;

  if(!task.dueDate)return false;

  const due=new Date(
    task.dueDate+'T'+(task.dueTime||'23:59')
  );

  return due < new Date();
}

function statusBadge(status){

  let cls='pending';

  if(status==='Completed')cls='completed';
  else if(status==='In Progress')cls='progress';
  else if(status==='Approved')cls='approved';
  else if(status==='Rejected')cls='rejected';

  return `<span class="badge ${cls}">${escapeHTML(status)}</span>`;
}

function priorityBadge(priority){
  const cls=priority==='High'
    ? 'overdue'
    : priority==='Low'
      ? 'completed'
      : 'pending';

  return `<span class="badge ${cls}">${escapeHTML(priority)}</span>`;
}

   ACTIVITY
   ========================================================= */

function addActivity(action,detail,staffId=null){

  const activity=get(KEYS.activity);

  activity.unshift({
    id:uid('act'),
    action,
    detail,
    staffId:staffId||currentUser?.staffId||'admin',
    by:currentUser?.name||'System',
    createdAt:nowISO()
  });

  set(KEYS.activity,activity.slice(0,500));
}

/* =========================================================
   NOTIFICATIONS
   ========================================================= */

function addNotification(staffId,title,message,type='info'){

  const notifications=get(KEYS.notifications);

  notifications.unshift({
    id:uid('not'),
    staffId,
    title,
    message,
    type,
    read:false,
    createdAt:nowISO()
  });

  set(KEYS.notifications,notifications);
}

function generateOverdueNotifications(){

  const logs=get(KEYS.logs);

  logs.forEach(task=>{
    if(!isOverdue(task))return;

    const notifications=get(KEYS.notifications);

    const already=notifications.some(n=>
      n.staffId===task.staffId &&
      n.message.includes(task.id) &&
      n.type==='overdue'
    );

    if(!already){
      addNotification(
        task.staffId,
        'Overdue task',
        `${task.title} is overdue. [${task.id}]`,
        'overdue'
      );
    }
  });
}

function unreadCount(){

  return get(KEYS.notifications)
    .filter(n=>
      n.staffId===currentUser.staffId &&
      !n.read
    ).length;
}

function filterTasks(){

  let tasks=visibleTasks();

  const search=document.getElementById('taskSearch')?.value.toLowerCase()||'';
  const status=document.getElementById('taskStatusFilter')?.value||'';
  const priority=document.getElementById('taskPriorityFilter')?.value||'';

  tasks=tasks.filter(t=>
    (!search ||
      t.title.toLowerCase().includes(search) ||
      (t.description||'').toLowerCase().includes(search)
    ) &&
    (!status||t.status===status) &&
    (!priority||t.priority===priority)
  );

  renderTaskTable(tasks);
}

function renderTaskTable(tasks){

  const root=document.getElementById('taskTable');

  if(!tasks.length){
    root.innerHTML=`<div class="empty">No tasks found.</div>`;
    return;
  }

  root.innerHTML=`

function saveTask(taskId){

  const title=document.getElementById('taskTitle').value.trim();

  if(!title){
    showToast('Task title is required.');
    return;
  }

  let tasks=get(KEYS.logs);

  const staffId=document.getElementById('taskStaff').value;

  const data={
    title,
    staffId,
    priority:document.getElementById('taskPriority').value,
    status:document.getElementById('taskStatus').value,
    workDate:document.getElementById('taskWorkDate').value,
    dueDate:document.getElementById('taskDueDate').value,
    dueTime:document.getElementById('taskDueTime').value,
    description:document.getElementById('taskDescription').value.trim()
  };

  if(taskId){

    const index=tasks.findIndex(t=>t.id===taskId);

    if(index<0)return;

    const old=tasks[index];

    tasks[index]={
      ...old,
      ...data
    };

    addTaskHistory(
      taskId,
      'Task Edited',
      `Task details updated by ${currentUser.name}.`
    );

    if(old.status!==data.status){
      addTaskHistory(
        taskId,
        'Status Changed',
        `${old.status} → ${data.status}`
      );
    }

    addActivity(
      'Task Updated',
      data.title,
      staffId
    );

    showToast('Task updated.');

  }else{

    const newTask={
      id:uid('task'),
      ...data,
      createdAt:nowISO(),
      createdBy:currentUser.name
    };

    tasks.unshift(newTask);
    addTaskHistory(
      newTask.id,
      'Task Created',
      `Task created by ${currentUser.name}.`
    );

    addTaskHistory(
      newTask.id,
      'Task Assigned',
      `Assigned to ${getStaffName(staffId)}.`
    );

    addNotification(
      staffId,
      'New task assigned',
      `You have been assigned: ${data.title}`,
      'task'
    );

    addActivity(
      'Task Assigned',
      `${data.title} → ${getStaffName(staffId)}`,
      staffId
    );

    showToast('Task assigned.');
  }

  set(KEYS.logs,tasks);
  closeModal();
  renderTasks();
}

function deleteTask(taskId){

  const tasks=get(KEYS.logs);
  const task=tasks.find(t=>t.id===taskId);

  if(!task)return;

  if(!confirm(
    `Delete "${task.title}"?\n\nTask history will be kept.`
  ))return;

  set(KEYS.logs,tasks.filter(t=>t.id!==taskId));

  addTaskHistory(
    taskId,
    'Task Deleted',
    `Task deleted by ${currentUser.name}.`
  );

  addActivity(
    'Task Deleted',
    task.title,
    task.staffId
  );

  closeModal();
  showToast('Task deleted.');
  renderTasks();
}

function advanceTask(taskId){

  const tasks=get(KEYS.logs);
  const index=tasks.findIndex(t=>t.id===taskId);

  if(index<0)return;

  const task=tasks[index];
  const oldStatus=task.status;

  task.status=task.status==='Pending'
    ? 'In Progress'
    : 'Completed';

  set(KEYS.logs,tasks);

  addTaskHistory(
    taskId,
    'Status Changed',
    `${oldStatus} → ${task.status}`
  );

  addActivity(
    'Task Status Updated',
    `${task.title}: ${oldStatus} → ${task.status}`,
    task.staffId
  );

  if(task.status==='Completed'){
    addNotification(
      'admin',
      'Task completed',
      `${getStaffName(task.staffId)} completed "${task.title}".`,
      'task'
    );

    addTaskHistory(
      taskId,
      'Task Completed',
      `Completed by ${currentUser.name}.`
    );
  }

  closeModal();
  renderTasks();

function addTaskHistory(taskId,action,detail){

function filterLogs(){

function saveLog(logId){

  const title=document.getElementById('logTitle').value.trim();

  if(!title){
    showToast('Task title is required.');
    return;
  }

  const logs=get(KEYS.logs);

  const data={
    title,
    staffId:document.getElementById('logStaff').value,
    workDate:document.getElementById('logDate').value,
    dueDate:document.getElementById('logDueDate').value,
    dueTime:document.getElementById('logDueTime').value,
    priority:document.getElementById('logPriority').value,
    status:document.getElementById('logStatusInput').value,
    description:document.getElementById('logDescription').value.trim()
  };

  if(logId){

    const i=logs.findIndex(l=>l.id===logId);
    if(i>=0){
      logs[i]={...logs[i],...data};
      addActivity('Work Log Updated',title,data.staffId);
    }

  }else{

    data.id=uid('log');
    data.createdAt=nowISO();
    data.createdBy=currentUser.name;

    logs.unshift(data);

    addActivity('Work Log Added',title,data.staffId);
  }

  set(KEYS.logs,logs);
  closeModal();
  renderLogs();
  showToast('Work log saved.');
}

function deleteLog(id){

  const logs=get(KEYS.logs);
  const log=logs.find(l=>l.id===id);

  if(!log)return;

  if(!confirm(`Delete "${log.title}"?`))return;

  set(KEYS.logs,logs.filter(l=>l.id!==id));

  addActivity('Work Log Deleted',log.title,log.staffId);

  renderLogs();
  showToast('Work log deleted.');
}

      </div>

      <div class="page-head">
        <div>
          <strong>Clock-out Completion</strong>
          <p>Complete attendance records vs total records</p>

            <tr>
              <th>Date</th>

              <th>Clock Out</th>
              <th>Status</th>

            ${

                .sort((a,b)=>b.date.localeCompare(a.date))

function clockIn(){

  const attendance=get(KEYS.attendance);

  let record=attendance.find(a=>
    a.staffId===currentUser.staffId &&
    a.date===todayISO()
  );

  if(record?.clockIn){
    showToast('You already clocked in today.');
    return;
  }

  const time=new Date().toLocaleTimeString('en-MY',{
    hour:'2-digit',
    minute:'2-digit'
  });

  if(!record){
    record={
      id:uid('att'),
      staffId:currentUser.staffId,
      date:todayISO(),
      clockIn:time,
      clockOut:''
    };
    attendance.push(record);
  }else{
    record.clockIn=time;
  }

  set(KEYS.attendance,attendance);
  addActivity('Clock In',`${formatDate(todayISO())} at ${time}`,currentUser.staffId);

  renderAttendance();
  showToast('Clocked in.');
}

function clockOut(){

  const attendance=get(KEYS.attendance);

  const record=attendance.find(a=>
    a.staffId===currentUser.staffId &&
    a.date===todayISO()
  );

  if(!record?.clockIn){
    showToast('Please clock in first.');
    return;
  }

  if(record.clockOut){
    showToast('You already clocked out.');
    return;
  }

  const time=new Date().toLocaleTimeString('en-MY',{
    hour:'2-digit',
    minute:'2-digit'
  });

  record.clockOut=time;

  set(KEYS.attendance,attendance);

  addActivity('Clock Out',`${formatDate(todayISO())} at ${time}`,currentUser.staffId);

  renderAttendance();
  showToast('Clocked out.');
}

function calculateLeave(staffId){

  const leaves=get(KEYS.leaves)
    .filter(l=>l.staffId===staffId);

  const approvedAnnual=leaves
    .filter(l=>l.type==='Annual Leave'&&l.status==='Approved')
    .reduce((sum,l)=>sum+daysBetween(l.startDate,l.endDate),0);

  const pending=leaves
    .filter(l=>l.type==='Annual Leave'&&l.status==='Pending')
    .reduce((sum,l)=>sum+daysBetween(l.startDate,l.endDate),0);

  return {
    used:approvedAnnual,
    pending,
    remaining:Math.max(0,LEAVE_ALLOWANCE-approvedAnnual)
  };
}

function openLeaveModal(){

        <h3>Apply Leave</h3>

        <div class="field">
          <label>LEAVE TYPE</label>
          <select id="leaveType">
            <option>Annual Leave</option>
            <option>Emergency Leave</option>
            <option>Medical Leave</option>
            <option>Unpaid Leave</option>
          </select>
        </div>

        <div class="detail-grid">

          <div class="field">
            <label>START DATE</label>
            <input id="leaveStart" type="date" value="${todayISO()}">
          </div>

          <div class="field">
            <label>END DATE</label>
            <input id="leaveEnd" type="date" value="${todayISO()}">
          </div>

        </div>

        <div class="field">
          <label>REASON</label>
          <textarea id="leaveReason" placeholder="Reason for leave..."></textarea>
        </div>

        <div class="modal-actions">

          <button class="primary" onclick="saveLeave()">Submit Application</button>
        </div>

      </div>
    </div>
  `;
}

function saveLeave(){

  const type=document.getElementById('leaveType').value;
  const start=document.getElementById('leaveStart').value;
  const end=document.getElementById('leaveEnd').value;
  const reason=document.getElementById('leaveReason').value.trim();

  if(!start||!end){
    showToast('Please select leave dates.');
    return;
  }

  if(end<start){
    showToast('End date cannot be before start date.');
    return;
  }

  if(
    type==='Annual Leave' &&
    daysBetween(start,end)>calculateLeave(currentUser.staffId).remaining
  ){
    showToast('Annual leave exceeds your remaining balance.');
    return;
  }

  const leaves=get(KEYS.leaves);

  leaves.unshift({
    id:uid('leave'),
    staffId:currentUser.staffId,
    type,
    startDate:start,
    endDate:end,
    reason,
    status:'Pending',
    createdAt:nowISO()
  });

  set(KEYS.leaves,leaves);

  addActivity(
    'Leave Applied',
    `${type}: ${formatDate(start)} - ${formatDate(end)}`,
    currentUser.staffId
  );

  addNotification(
    'admin',
    'New leave request',
    `${currentUser.name} submitted a leave request.`,
    'leave'
  );

  closeModal();
  renderLeave();
  showToast('Leave application submitted.');
}

function updateLeave(id,status){

  const leaves=get(KEYS.leaves);
  const leave=leaves.find(l=>l.id===id);

  if(!leave)return;

  leave.status=status;

  set(KEYS.leaves,leaves);

  addActivity(
    `Leave ${status}`,
    `${getStaffName(leave.staffId)}: ${leave.type}`,
    leave.staffId
  );

  addNotification(
    leave.staffId,
    `Leave ${status.toLowerCase()}`,
    `Your ${leave.type} request has been ${status.toLowerCase()}.`,
    'leave'
  );

  renderLeave();
  showToast(`Leave ${status.toLowerCase()}.`);
}

/* =========================================================
   SCHEDULE + CALENDAR
   ========================================================= */

function renderSchedule(){

  const year=calendarDate.getFullYear();
  const month=calendarDate.getMonth();

  const monthName=calendarDate.toLocaleString('en-MY',{
    month:'long',
    year:'numeric'
  });

  let schedules=get(KEYS.schedules);

  if(currentUser.role==='staff'){
    schedules=schedules.filter(s=>s.staffId===currentUser.staffId);
  }

  let tasks=visibleTasks();

  const first=new Date(year,month,1);
  const last=new Date(year,month+1,0);

  const startDay=first.getDay();
  const totalDays=last.getDate();

  let cells='';

  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>{
    cells+=`<div class="cal-day-name">${d}</div>`;
  });

  for(let i=0;i<startDay;i++){
    cells+=`<div class="cal-cell muted"></div>`;
  }

  for(let day=1;day<=totalDays;day++){

    const date=
      `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

    const isToday=date===todayISO();

    const daySchedules=schedules.filter(s=>s.date===date);
    const dayTasks=tasks.filter(t=>t.dueDate===date);

    cells+=`
      <div class="cal-cell ${isToday?'today':''}"
        onclick="calendarDateClick('${date}')">

        <div class="cal-num">${day}</div>

        ${daySchedules.map(s=>`
          <div class="cal-event">
            ${escapeHTML(s.time||'')} ${escapeHTML(s.title)}
          </div>
        `).join('')}

        ${dayTasks.slice(0,3).map(t=>`
          <div class="cal-event">
            Task: ${escapeHTML(t.title)}
          </div>
        `).join('')}

        ${
          dayTasks.length>3
          ? `<div style="font-size:9px;color:var(--muted)">
              +${dayTasks.length-3} more
            </div>`
          : ''
        }

      </div>
    `;
  }

  document.getElementById('content').innerHTML=`

    <div class="page-head">
      <div>
        <h2>Schedule</h2>
        <p>Calendar view for schedules and task deadlines.</p>
      </div>

      ${currentUser.role==='admin'
        ? `<button class="primary" onclick="openScheduleModal()">+ Add Schedule</button>`
        : ''}
    </div>

    <div class="card">

      <div class="calendar-head">

        <button class="secondary" onclick="changeMonth(-1)">← Previous</button>

        <div class="calendar-title">${monthName}</div>

        <div class="actions">
          <button class="secondary" onclick="goToday()">Today</button>
          <button class="secondary" onclick="changeMonth(1)">Next →</button>
        </div>

      </div>

      <div class="calendar-wrap">
        <div class="calendar">
          ${cells}
        </div>
      </div>

    </div>

    <div class="card section-gap">
      <div class="page-head">
        <div>
          <strong>Upcoming Schedule</strong>
          <p>Next scheduled activities</p>
        </div>
      </div>

      <div class="list">
        ${
          schedules
            .filter(s=>s.date>=todayISO())
            .sort((a,b)=>a.date.localeCompare(b.date))
            .slice(0,10)
            .map(s=>`
              <div class="list-item">
                <strong>${escapeHTML(s.title)}</strong>
                <small>
                  ${formatDate(s.date)}
                  · ${escapeHTML(s.time||'')}
                  · ${escapeHTML(s.location||'')}
                  ${currentUser.role==='admin'
                    ? ` · ${escapeHTML(getStaffName(s.staffId))}`
                    : ''}
                </small>
              </div>
            `).join('')
          || `<div class="empty">No upcoming schedules.</div>`
        }
      </div>
    </div>
  `;
}

function changeMonth(direction){
  calendarDate.setMonth(calendarDate.getMonth()+direction);
  renderSchedule();
}

function goToday(){
  calendarDate=new Date();
  renderSchedule();
}

function calendarDateClick(date){

  const schedules=get(KEYS.schedules)
    .filter(s=>s.date===date)
    .filter(s=>currentUser.role==='admin'||s.staffId===currentUser.staffId);

  const tasks=visibleTasks().filter(t=>t.dueDate===date);

  document.getElementById('modalRoot').innerHTML=`

        <h3>${formatDate(date)}</h3>

        <strong style="font-size:12px">Schedules</strong>

        <div class="list" style="margin-top:10px">
          ${
            schedules.length
            ? schedules.map(s=>`
              <div class="list-item">
                <strong>${escapeHTML(s.title)}</strong>
                <small>${escapeHTML(s.time||'')} · ${escapeHTML(s.location||'')}</small>
              </div>
            `).join('')
            : `<div class="empty">No schedules.</div>`
          }
        </div>

        <div style="margin-top:20px">
          <strong style="font-size:12px">Task Deadlines</strong>

          <div class="list" style="margin-top:10px">
            ${
              tasks.length

function deleteAnnouncement(id){

  if(!confirm('Delete this announcement?'))return;

  const announcements=get(KEYS.announcements);
  const ann=announcements.find(a=>a.id===id);

  set(
    KEYS.announcements,
    announcements.filter(a=>a.id!==id)
  );

  if(ann)addActivity('Announcement Deleted',ann.title,'admin');

  renderAnnouncements();
}

    return;

  const staff=get(KEYS.staff);

  const duplicate=staff.some(s=>
    s.code.toLowerCase()===code.toLowerCase() &&
    s.id!==staffId
  );

  if(duplicate){
    showToast('Staff code already exists.');
    return;
  }

  const data={
    name,
    code,
    department:document.getElementById('staffDepartment').value.trim(),
    position:document.getElementById('staffPosition').value.trim(),
    status:document.getElementById('staffStatus').value,
    joiningDate:document.getElementById('staffJoining').value,
    email:document.getElementById('staffEmail').value.trim(),
    phone:document.getElementById('staffPhone').value.trim()
  };

  if(staffId){

    if(i>=0)staff[i]={...staff[i],...data};

  }else{

      ...data
    };

    staff.push(newStaff);

    addActivity('Staff Added',name,newStaff.id);
  }

  set(KEYS.staff,staff);

  closeModal();
  renderStaff();
  showToast('Staff saved.');
}

/* =========================================================
   V18 DATA MANAGEMENT
   ========================================================= */

function collectBackupData(){

  const backup={
    backupVersion:'V18',
    exportedAt:nowISO(),
    brand:BRAND,
    data:{}
  };

  Object.values(KEYS).forEach(key=>{
    backup.data[key]=get(key);
  });

  backup.data.photos={};

  Object.keys(localStorage)
    .filter(k=>k.startsWith('nona_photo_'))
    .forEach(k=>{
      backup.data.photos[k]=localStorage.getItem(k);
    });

  return backup;
}

function downloadBackup(){

  const backup=collectBackupData();

  const blob=new Blob(
    [JSON.stringify(backup,null,2)],
    {type:'application/json'}
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement('a');
  a.href=url;
  a.download=
    `nona-costex-backup-${new Date().toISOString().slice(0,10)}.json`;

  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);

  addActivity(
    'Backup Created',
    'Portal data backup downloaded.',
    'admin'
  );

  showToast('Backup downloaded.');
}

function triggerRestore(){
  document.getElementById('restoreFile').click();
}

function restoreBackup(event){

  const file=event.target.files[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=function(e){

    try{

      const backup=JSON.parse(e.target.result);

      if(
        !backup ||
        !backup.data ||
        backup.backupVersion!=='V18'
      ){
        throw new Error('Invalid backup file.');
      }

      const required=[
        KEYS.logs,
        KEYS.leaves,
        KEYS.attendance,
        KEYS.staff,
        KEYS.schedules,
        KEYS.announcements,
        KEYS.notifications,
        KEYS.activity,
        KEYS.taskHistory
      ];

      const valid=required.every(k=>
        Object.prototype.hasOwnProperty.call(backup.data,k)
      );

      if(!valid){
        throw new Error('Backup is missing required data.');
      }

      if(!confirm(
        'Restore this backup?\n\n' +
        'Current portal data will be replaced by the backup.'
      )){
        event.target.value='';
        return;
      }

      required.forEach(key=>{
        set(key,backup.data[key]);
      });

      if(backup.data.photos){

        Object.keys(backup.data.photos).forEach(key=>{
          localStorage.setItem(
            key,
            backup.data.photos[key]
          );
        });
      }

      addActivity(
        'Backup Restored',
        `Backup from ${formatDateTime(backup.exportedAt)} restored.`,
        'admin'
      );

      showToast('Backup restored successfully.');

      setTimeout(()=>{
        location.reload();
      },800);

    }catch(err){

      showToast(
        'Restore failed: invalid or damaged backup.'
      );

    }finally{
      event.target.value='';
    }
  };

  reader.readAsText(file);
}

function resetDemoData(){

  if(!confirm(
    'RESET DEMO DATA?\n\n' +
    'This will remove current portal data and restore the original demo data.\n\n' +
    'It is recommended to download a backup first.'
  ))return;

  const second=confirm(
    'Are you absolutely sure?\n\nAll current tasks, leave records, attendance and portal data will be reset.'
  );

  if(!second)return;

  Object.values(KEYS).forEach(key=>{
    localStorage.removeItem(key);
  });

  Object.keys(localStorage)
    .filter(k=>k.startsWith('nona_photo_'))
    .forEach(k=>localStorage.removeItem(k));

  initData();

  addActivity(
    'Demo Data Reset',
    'Portal data restored to default demo state.',
    'admin'
  );

  showToast('Demo data reset.');

  setTimeout(()=>{
    location.reload();
  },700);
}

function clearNotifications(){

    'Notification History Cleared',
    'Current admin notification history cleared.',
    'admin'

}

function uploadProfilePhoto(event){

  const file=event.target.files[0];

  if(!file)return;

  if(file.size>2*1024*1024){
    showToast('Please use an image below 2MB.');
    return;
  }

  const reader=new FileReader();

  reader.onload=function(e){

    const staff=get(KEYS.staff)
      .find(s=>s.id===currentUser.staffId);

    if(!staff)return;

    localStorage.setItem(
      'nona_photo_'+staff.code,
      e.target.result
    );

    addActivity(
      'Profile Photo Updated',
      staff.name,
      staff.id
    );

    updateTopUser();
    renderProfile();

    showToast('Profile photo updated.');
  };

  reader.readAsDataURL(file);
}

/* =========================================================
   CSV EXPORT
   ========================================================= */

function csvEscape(value){

  const text=String(value??'');

  return `"${text.replace(/"/g,'""')}"`;
}

function downloadCSV(filename,rows){

  if(!rows.length){
    showToast('No data to export.');
    return;
  }

  const headers=Object.keys(rows[0]);

  const csv=[
    headers.map(csvEscape).join(','),
    ...rows.map(row=>
      headers.map(h=>csvEscape(row[h])).join(',')
    )
  ].join('\n');

  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});

  const url=URL.createObjectURL(blob);

  const a=document.createElement('a');
  a.href=url;
  a.download=filename;

  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);
}

function exportCSV(type){

  if(type==='logs'){

    const logs=get(KEYS.logs).map(l=>({
      Date:l.workDate,
      Task:l.title,
      Staff:getStaffName(l.staffId),
      Priority:l.priority,
      Status:l.status,
      DueDate:l.dueDate,
      DueTime:l.dueTime,
      Description:l.description
    }));

    downloadCSV('nona-costex-work-logs.csv',logs);
  }

  if(type==='attendance'){

    const rows=get(KEYS.attendance).map(a=>({
      Date:a.date,
      Staff:getStaffName(a.staffId),
      ClockIn:a.clockIn,
      ClockOut:a.clockOut,
      Status:a.clockIn&&a.clockOut?'Complete':'Missing Clock Out'
    }));

    downloadCSV('nona-costex-attendance.csv',rows);
  }

  if(type==='leaves'){

    const rows=get(KEYS.leaves).map(l=>({
      Staff:getStaffName(l.staffId),
      Type:l.type,
      StartDate:l.startDate,
      EndDate:l.endDate,
      Days:daysBetween(l.startDate,l.endDate),
      Reason:l.reason,
      Status:l.status
    }));

    downloadCSV('nona-costex-leave.csv',rows);
  }

  addActivity(
    'CSV Export',
    `${type} exported.`,
    'admin'
  );

  showToast('CSV exported.');
}
