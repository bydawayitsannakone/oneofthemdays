<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nona Costex Staff Portal</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --green:#9fb873;
  --green-dark:#7f9a58;
  --green-light:#edf3e4;
  --green-soft:#f6f8f1;
  --border:#e2e8e4;
  --text:#172019;
  --muted:#718078;
  --bg:#f7f9f7;
  --white:#fff;
  --danger:#c0392b;
  --warning:#d79a28;
  --shadow:0 8px 30px rgba(35,50,40,.06);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select,textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* LOGIN */

.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bg);
  padding:24px;
}

.login-card{
  width:100%;
  max-width:420px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:20px;
  padding:38px;
  box-shadow:var(--shadow);
}

.logo-box{
  width:54px;
  height:54px;
  border-radius:15px;
  background:var(--green);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:21px;
  margin-bottom:20px;
}

.login-card h1{
  font-size:25px;
  margin-bottom:7px;
}

.login-card p{
  color:var(--muted);
  font-size:14px;
  margin-bottom:26px;
}

/* APP */

.app{
  min-height:100vh;
  display:flex;
}

.sidebar{
  width:245px;
  background:#fff;
  border-right:1px solid var(--border);
  padding:22px 15px;
  position:fixed;
  top:0;
  bottom:0;
  left:0;
  overflow-y:auto;
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  padding:5px 10px 27px;
}

.brand-icon{
  width:39px;
  height:39px;
  border-radius:11px;
  background:var(--green);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  font-weight:bold;
}

.brand-text{
  font-weight:700;
  font-size:15px;
}

.brand-sub{
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

.nav-title{
  color:#a0aaa4;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.8px;
  padding:13px 11px 7px;
}

.nav button{
  width:100%;
  border:0;
  background:transparent;
  padding:10px 11px;
  border-radius:10px;
  display:flex;
  align-items:center;
  gap:11px;
  color:#5e6962;
  font-size:13px;
  text-align:left;
  margin:2px 0;
}

.nav button:hover,
.nav button.active{
  background:var(--green-light);
  color:#5f7541;
}

.nav-icon{
  width:20px;
  text-align:center;
}

.sidebar-bottom{
  position:absolute;
  bottom:15px;
  left:15px;
  right:15px;
  border-top:1px solid var(--border);
  padding-top:14px;
}

.user-mini{
  display:flex;
  align-items:center;
  gap:9px;
  padding:7px;
}

.avatar{
  width:35px;
  height:35px;
  border-radius:50%;
  background:var(--green-light);
  color:#5f7541;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:12px;
}

.user-mini-info{
  min-width:0;
  flex:1;
}

.user-mini-name{
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.user-mini-role{
  color:var(--muted);
  font-size:10px;
}

.logout-btn{
  width:100%;
  border:1px solid var(--border);
  background:#fff;
  padding:9px;
  border-radius:9px;
  color:#66716a;
  font-size:12px;
  margin-top:8px;
}

.main{
  margin-left:245px;
  width:calc(100% - 245px);
  min-height:100vh;
}

.topbar{
  height:68px;
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  position:sticky;
  top:0;
  z-index:10;
}

.topbar-title{
  font-size:17px;
  font-weight:600;
}

.topbar-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.icon-btn{
  width:36px;
  height:36px;
  border:1px solid var(--border);
  background:#fff;
  border-radius:9px;
  position:relative;
}

.notification-dot{
  position:absolute;
  width:7px;
  height:7px;
  background:#d95d5d;
  border-radius:50%;
  top:7px;
  right:7px;
}

.content{
  padding:28px 30px 50px;
  max-width:1500px;
  margin:auto;
}

/* COMMON */

.page-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:15px;
  margin-bottom:25px;
}

.page-head h1{
  font-size:24px;
  margin-bottom:5px;
}

.page-head p{
  color:var(--muted);
  font-size:13px;
}

.btn{
  border:0;
  background:var(--green);
  color:#fff;
  border-radius:9px;
  padding:10px 15px;
  font-size:12px;
  font-weight:600;
}

.btn:hover{
  background:var(--green-dark);
}

.btn.secondary{
  background:var(--green-light);
  color:#5f7541;
}

.btn.outline{
  background:#fff;
  border:1px solid var(--border);
  color:#5e6962;
}

.btn.danger{
  background:#f9e9e7;
  color:var(--danger);
}

.btn.small{
  padding:7px 10px;
  font-size:11px;
}

.input,
select,
textarea{
  width:100%;
  border:1px solid var(--border);
  border-radius:9px;
  padding:10px 12px;
  outline:none;
  background:#fff;
  color:var(--text);
  font-size:13px;
}

.input:focus,
select:focus,
textarea:focus{
  border-color:var(--green);
}

textarea{
  min-height:100px;
  resize:vertical;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  font-size:11px;
  font-weight:600;
  margin-bottom:6px;
  color:#59645d;
}

.grid{
  display:grid;
  gap:15px;
}

.grid-2{
  grid-template-columns:repeat(2,minmax(0,1fr));
}

.grid-3{
  grid-template-columns:repeat(3,minmax(0,1fr));
}

.grid-4{
  grid-template-columns:repeat(4,minmax(0,1fr));
}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
}

.card-pad{
  padding:19px;
}

.card-title{
  font-size:14px;
  font-weight:600;
  margin-bottom:14px;
}

.muted{
  color:var(--muted);
}

.empty{
  padding:35px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

/* DASHBOARD */

.stat-card{
  padding:18px;
}

.stat-label{
  color:var(--muted);
  font-size:11px;
  margin-bottom:9px;
}

.stat-value{
  font-size:27px;
  font-weight:600;
}

.stat-small{
  font-size:10px;
  color:var(--muted);
  margin-top:5px;
}

.dashboard-grid{
  margin-top:18px;
}

.progress{
  height:7px;
  background:#edf0ed;
  border-radius:20px;
  overflow:hidden;
  margin-top:9px;
}

.progress i{
  display:block;
  height:100%;
  background:var(--green);
  border-radius:20px;
}

/* TABLE */

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  text-align:left;
  font-size:10px;
  color:#89938d;
  text-transform:uppercase;
  letter-spacing:.4px;
  padding:12px;
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}

td{
  padding:13px 12px;
  font-size:12px;
  border-bottom:1px solid #eef1ef;
  vertical-align:middle;
}

tr:last-child td{
  border-bottom:0;
}

.badge{
  display:inline-flex;
  align-items:center;
  border-radius:20px;
  padding:5px 9px;
  font-size:10px;
  font-weight:600;
}

.badge.green{
  background:var(--green-light);
  color:#5f7541;
}

.badge.gray{
  background:#f0f2f1;
  color:#6e7872;
}

.badge.red{
  background:#fae9e7;
  color:#a94b40;
}

.badge.yellow{
  background:#fff5df;
  color:#9a7027;
}

/* ATTENDANCE */

.attendance-status{
  padding:22px;
  background:var(--green-soft);
  border:1px solid #dce6ca;
  border-radius:14px;
  margin-bottom:16px;
}

.attendance-time{
  color:var(--green-dark);
  font-size:31px;
  font-weight:600;
  margin:7px 0;
}

.clock-time{
  color:var(--green-dark);
  font-size:24px;
  font-weight:600;
}

.attendance-actions{
  display:flex;
  gap:9px;
  margin-top:15px;
}

/* TASKS */

.task-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  border-bottom:1px solid #eef1ef;
}

.task-row:last-child{
  border-bottom:0;
}

.task-check{
  width:18px;
  height:18px;
  accent-color:var(--green);
}

.task-info{
  flex:1;
}

.task-title{
  font-size:12px;
  font-weight:600;
}

.task-meta{
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
}

/* CHAT */

.chat-layout{
  display:grid;
  grid-template-columns:280px 1fr;
  min-height:600px;
}

.chat-list{
  border-right:1px solid var(--border);
}

.chat-list-head{
  padding:15px;
  border-bottom:1px solid var(--border);
}

.chat-item{
  width:100%;
  border:0;
  background:#fff;
  padding:13px 15px;
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left;
  border-bottom:1px solid #f0f2f1;
}

.chat-item:hover,
.chat-item.active{
  background:var(--green-soft);
}

.chat-item-info{
  min-width:0;
  flex:1;
}

.chat-item-name{
  font-size:12px;
  font-weight:600;
}

.chat-item-preview{
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-main{
  display:flex;
  flex-direction:column;
  min-width:0;
}

.chat-head{
  padding:16px 18px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.chat-head-name{
  font-size:13px;
  font-weight:600;
}

.messages{
  flex:1;
  min-height:450px;
  max-height:550px;
  overflow-y:auto;
  padding:20px;
  background:#fafbfa;
}

.message{
  display:flex;
  margin-bottom:12px;
}

.message.mine{
  justify-content:flex-end;
}

.message-bubble{
  max-width:65%;
  background:#fff;
  border:1px solid var(--border);
  border-radius:13px;
  padding:9px 12px;
  font-size:12px;
}

.message.mine .message-bubble{
  background:var(--green-light);
  border-color:#dce6ca;
}

.message-name{
  font-size:9px;
  color:var(--muted);
  margin-bottom:4px;
}

.message-time{
  color:#9ba49e;
  font-size:8px;
  margin-top:5px;
}

.chat-input{
  border-top:1px solid var(--border);
  padding:12px;
  display:flex;
  gap:8px;
}

.chat-input input{
  flex:1;
}

/* KNOWLEDGE */

.doc-card{
  padding:17px;
}

.doc-icon{
  width:38px;
  height:38px;
  background:var(--green-light);
  color:#5f7541;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:12px;
}

.doc-title{
  font-size:13px;
  font-weight:600;
}

.doc-meta{
  color:var(--muted);
  font-size:10px;
  margin-top:5px;
}

/* PROFILE */

.profile-avatar{
  width:75px;
  height:75px;
  border-radius:50%;
  background:var(--green-light);
  color:#5f7541;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  font-weight:bold;
}

/* MODAL */

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(20,28,23,.42);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal{
  width:100%;
  max-width:560px;
  max-height:90vh;
  overflow-y:auto;
  background:#fff;
  border-radius:17px;
  box-shadow:0 25px 70px rgba(0,0,0,.16);
}

.modal-head{
  padding:18px 20px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-head h3{
  font-size:15px;
}

.modal-close{
  border:0;
  background:transparent;
  font-size:20px;
  color:#88928c;
}

.modal-body{
  padding:20px;
}

.modal-foot{
  padding:15px 20px;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

/* LEAVE */

.leave-card{
  padding:17px;
}

.leave-summary{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.leave-type{
  font-size:13px;
  font-weight:600;
}

.leave-date{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.leave-reason{
  font-size:11px;
  color:#68736c;
  margin-top:9px;
  line-height:1.5;
}

/* CALENDAR */

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}

.calendar-day-head{
  background:var(--green-soft);
  padding:10px;
  font-size:10px;
  color:#68736c;
  text-align:center;
}

.calendar-cell{
  min-height:95px;
  border-top:1px solid var(--border);
  border-right:1px solid var(--border);
  padding:9px;
  font-size:11px;
}

.calendar-cell:nth-child(7n){
  border-right:0;
}

.calendar-number{
  font-weight:600;
}

.today{
  width:24px;
  height:24px;
  background:var(--green);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
}

.event{
  margin-top:7px;
  padding:4px 6px;
  background:var(--green-light);
  color:#5f7541;
  border-radius:5px;
  font-size:9px;
}

/* TOAST */

.toast{
  position:fixed;
  right:25px;
  bottom:25px;
  background:#202721;
  color:#fff;
  padding:12px 16px;
  border-radius:9px;
  font-size:12px;
  z-index:300;
  box-shadow:var(--shadow);
}

/* MOBILE */

.mobile-menu{
  display:none;
}

@media(max-width:900px){
  .sidebar{
    transform:translateX(-100%);
    transition:.2s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .mobile-menu{
    display:block;
  }

  .grid-4{
    grid-template-columns:repeat(2,1fr);
  }

  .grid-3{
    grid-template-columns:1fr;
  }

  .chat-layout{
    grid-template-columns:1fr;
  }

  .chat-list{
    display:none;
  }

  .chat-list.mobile-show{
    display:block;
  }
}

@media(max-width:600px){
  .content{
    padding:20px 15px 40px;
  }

  .topbar{
    padding:0 15px;
  }

  .grid-2,
  .grid-4{
    grid-template-columns:1fr;
  }

  .page-head{
    flex-direction:column;
  }

  .page-head .btn{
    width:100%;
  }
}
</style>
</head>

<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="logo-box">NC</div>
    <h1>Nona Costex</h1>
    <p>Staff Portal</p>

    <div class="form-group">
      <label>Email</label>
      <input id="loginEmail" class="input" type="email" placeholder="Enter your email">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input id="loginPassword" class="input" type="password" placeholder="Enter your password">
    </div>

    <button class="btn" style="width:100%" onclick="login()">Sign In</button>

    <div id="loginError" style="margin-top:12px;color:#c0392b;font-size:11px"></div>
  </div>
</div>


<div id="app" class="app hidden">

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="brand-icon">NC</div>
      <div>
        <div class="brand-text">Nona Costex</div>
        <div class="brand-sub">Staff Portal</div>
      </div>
    </div>

    <div class="nav">

      <div class="nav-title">Main</div>

      <button onclick="go('dashboard')" data-nav="dashboard">
        <span class="nav-icon">⌂</span> Dashboard
      </button>

      <button onclick="go('attendance')" data-nav="attendance">
        <span class="nav-icon">◷</span> Attendance
      </button>

      <button onclick="go('tasks')" data-nav="tasks">
        <span class="nav-icon">✓</span> Tasks
      </button>

      <button onclick="go('logs')" data-nav="logs">
        <span class="nav-icon">▤</span> Work Logs
      </button>

      <button onclick="go('leave')" data-nav="leave">
        <span class="nav-icon">▱</span> Leave
      </button>

      <div class="nav-title">Communication</div>

      <button onclick="go('chat')" data-nav="chat">
        <span class="nav-icon">◌</span> Chat
      </button>

      <button onclick="go('knowledge')" data-nav="knowledge">
        <span class="nav-icon">▧</span> Knowledge Hub
      </button>

      <button onclick="go('calendar')" data-nav="calendar">
        <span class="nav-icon">□</span> Calendar
      </button>

      <div id="adminNav">
        <div class="nav-title">Administration</div>

        <button onclick="go('staff')" data-nav="staff">
          <span class="nav-icon">♙</span> Staff Management
        </button>

        <button onclick="go('analytics')" data-nav="analytics">
          <span class="nav-icon">◒</span> Analytics
        </button>

        <button onclick="go('data')" data-nav="data">
          <span class="nav-icon">▦</span> Data
        </button>
      </div>

      <div class="nav-title">Account</div>

      <button onclick="go('profile')" data-nav="profile">
        <span class="nav-icon">○</span> Profile
      </button>

      <button onclick="go('notifications')" data-nav="notifications">
        <span class="nav-icon">♧</span> Notifications
      </button>

    </div>

    <div class="sidebar-bottom">
      <div class="user-mini">
        <div class="avatar" id="sideAvatar">U</div>
        <div class="user-mini-info">
          <div class="user-mini-name" id="sideName">User</div>
          <div class="user-mini-role" id="sideRole">Staff</div>
        </div>
      </div>

      <button class="logout-btn" onclick="logout()">Sign Out</button>
    </div>

  </aside>


  <main class="main">

    <header class="topbar">

      <div style="display:flex;align-items:center;gap:10px">
        <button class="icon-btn mobile-menu" onclick="toggleSidebar()">☰</button>
        <div class="topbar-title" id="topTitle">Dashboard</div>
      </div>

      <div class="topbar-right">
        <button class="icon-btn" onclick="go('notifications')">
          ♧
          <span class="notification-dot hidden" id="notificationDot"></span>
        </button>
      </div>

    </header>

    <section class="content" id="content"></section>

  </main>

</div>


<div id="modalRoot"></div>
<div id="toastRoot"></div>


<script>

const S = {

/* =========================================================
   HELPERS
========================================================= */

function esc(value){
  if(value === null || value === undefined) return "";
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function initials(name){
  if(!name) return "U";

  return name
    .split(" ")
    .filter(Boolean)
    .slice(0,2)
    .map(x => x[0])
    .join("")
    .toUpperCase();
}

function isAdmin(){
  return S.profile?.role?.toLowerCase() === "admin";
}

function formatDate(date){
  if(!date) return "-";

  return new Date(date).toLocaleDateString("en-MY",{
    day:"numeric",
    month:"short",
    year:"numeric"
  });
}

function formatDateTime(date){
  if(!date) return "-";

  return new Date(date).toLocaleString("en-MY",{
    day:"numeric",
    month:"short",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}

function today(){
  return new Date().toISOString().split("T")[0];
}

function toast(message){
  const root = document.getElementById("toastRoot");

  root.innerHTML = `
    <div class="toast">${esc(message)}</div>
  `;

  setTimeout(()=>{
    root.innerHTML="";
  },3000);
}

function modal(title,body,footer=""){
  document.getElementById("modalRoot").innerHTML = `
    <div class="modal-backdrop" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-head">
          <h3>${title}</h3>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>

        <div class="modal-body">
          ${body}
        </div>

        ${footer ? `<div class="modal-foot">${footer}</div>` : ""}
      </div>
    </div>
  `;
}

function closeModal(event){
  if(event && event.target?.classList?.contains("modal-backdrop") === false){
    return;
  }

  document.getElementById("modalRoot").innerHTML="";
}

function closeModalForce(){
  document.getElementById("modalRoot").innerHTML="";
}

function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
}


/* =========================================================
   AUTH
========================================================= */

async function login(){

  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  document.getElementById("loginError").textContent="";

  if(!email || !password){
    document.getElementById("loginError").textContent =
      "Please enter your email and password.";
    return;
  }

  const {data,error} = await db.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    document.getElementById("loginError").textContent = error.message;
    return;
  }

  await startApp(data.user);
}

async function logout(){

  await db.auth.signOut();

  S.user=null;
  S.profile=null;

  document.getElementById("app").classList.add("hidden");
  document.getElementById("loginScreen").classList.remove("hidden");
}

async function startApp(user){

  S.user=user;

  const {data,error} = await db
    .from("profiles")
    .select("*")
    .eq("id",user.id)
    .single();

  if(error){
    console.error(error);

    S.profile={
      id:user.id,
      email:user.email,
      full_name:user.email?.split("@")[0] || "User",
      role:"staff"
    };
  }else{
    S.profile=data;
  }

  await loadProfiles();

  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  updateUserUI();

  go("dashboard");
}

function updateUserUI(){

  const name =
    S.profile?.full_name ||
    S.user?.email ||
    "User";

  document.getElementById("sideName").textContent=name;
  document.getElementById("sideRole").textContent=
    S.profile?.position ||
    S.profile?.role ||
    "Staff";

  document.getElementById("sideAvatar").textContent=initials(name);

  document.getElementById("adminNav").style.display =
    isAdmin() ? "block" : "none";
}

async function go(page){

  S.page=page;

  document.querySelectorAll("[data-nav]").forEach(btn=>{
    btn.classList.toggle(
      "active",
      btn.dataset.nav===page
    );
  });

  const titles={
    dashboard:"Dashboard",
    attendance:"Attendance",
    tasks:"Tasks",
    logs:"Work Logs",
    leave:"Leave",
    chat:"Chat",
    knowledge:"Knowledge Hub",
    calendar:"Calendar",
    staff:"Staff Management",
    analytics:"Analytics",
    data:"Data",
    profile:"Profile",
    notifications:"Notifications"
  };

  document.getElementById("topTitle").textContent =
    titles[page] || "Dashboard";

  document.getElementById("sidebar").classList.remove("open");

  if(page==="dashboard") await dashboardPage();
  else if(page==="attendance") attendancePage();
  else if(page==="tasks") await tasksPage();
  else if(page==="logs") await logsPage();
  else if(page==="leave") await leavePage();
  else if(page==="chat") await chatPage();
  else if(page==="knowledge") await knowledgePage();
  else if(page==="calendar") calendarPage();
  else if(page==="staff") await staffPage();
  else if(page==="analytics") await analyticsPage();
  else if(page==="data") dataPage();
  else if(page==="profile") profilePage();
  else if(page==="notifications") await notificationsPage();
}

async function saveTask(){

  const title=document.getElementById("taskTitle").value.trim();
  const due=document.getElementById("taskDue").value;
  const status=document.getElementById("taskStatus").value;

  if(!title){
    toast("Please enter a task.");
    return;
  }

  const task={
    title,
    due_date:due || null,
    status,
    user_id:S.user.id
  };

  try{

    const {data,error}=await db
      .from("tasks")
      .insert(task)
      .select()
      .single();

    if(!error && data){
      S.tasks.unshift(data);
    }else{
      task.id=Date.now().toString();
      S.tasks.unshift(task);

      localStorage.setItem(
        "nona_tasks",
        JSON.stringify(S.tasks)
      );
    }

  }catch(e){

    task.id=Date.now().toString();
    S.tasks.unshift(task);

    localStorage.setItem(
      "nona_tasks",
      JSON.stringify(S.tasks)
    );
  }

  closeModalForce();

  toast("Task added.");

  tasksPage();
}

async function toggleTask(id){

  const task=S.tasks.find(x=>String(x.id)===String(id));

  if(!task) return;

  const next=
    task.status==="Completed"
    ?"Pending"
    :"Completed";

  try{

    await db
      .from("tasks")
      .update({status:next})
      .eq("id",id);

  }catch(e){}

  task.status=next;

  localStorage.setItem(
    "nona_tasks",
    JSON.stringify(S.tasks)
  );

  if(S.page==="tasks") tasksPage();
}

async function loadLeaveRequests(){

    .from("leave_requests")
    .select("*")
    .order("created_at",{ascending:false});

  if(!isAdmin()){
    query=query.eq("user_id",S.user.id);
  }

  const {data,error}=await query;

  if(error){

    console.error(error);

    S.leaveRequests=[];

    const el=document.getElementById("leaveList");

    if(el){
      el.innerHTML=`
        <div class="empty">
          Leave table is not available yet.<br>
          Please run the Leave SQL setup in Supabase first.
        </div>
      `;
    }

    return;
  }

  S.leaveRequests=data || [];
}

  document.getElementById("leaveApproved").textContent=approved;
  document.getElementById("leaveRejected").textContent=rejected;

      </div>
    `;

    return;
  }

  list.innerHTML=S.leaveRequests.map(leave=>{

    const staff=S.profiles.find(
      p=>p.id===leave.user_id
    );

    const canReview =
      isAdmin() &&
      leave.status==="Pending";

    return `
      <div class="leave-card" style="border-bottom:1px solid var(--border)">

        <div class="leave-summary">

          <div>

async function submitLeave(){

  const leaveType=document.getElementById("leaveType").value;
  const start=document.getElementById("leaveStart").value;
  const end=document.getElementById("leaveEnd").value;
  const reason=document.getElementById("leaveReason").value.trim();

  if(!start || !end){
    toast("Please select your leave dates.");
    return;
  }

  if(end < start){
    toast("End date cannot be before start date.");
    return;
  }

  const payload={
    user_id:S.user.id,
    leave_type:leaveType,
    start_date:start,
    end_date:end,
    reason:reason || null,
    status:"Pending"
  };

  const {error}=await db
    .from("leave_requests")
    .insert(payload);

  if(error){

    console.error(error);

    toast("Could not submit leave. Please check the Leave table setup.");

    return;
  }

  closeModalForce();

  toast("Leave application submitted.");

  await leavePage();
}

async function reviewLeave(id,status){

  let note="";

  if(status==="Rejected"){

    note=prompt(
      "Reason / note for rejecting this leave:",
      ""
    );

    if(note===null) return;
  }

  const {error}=await db
    .from("leave_requests")
    .update({
      status,
      reviewed_by:S.user.id,
      reviewed_at:new Date().toISOString(),
      admin_note:note || null
    })
    .eq("id",id);

  if(error){

    console.error(error);

    toast(error.message);

    return;
  }

  toast(
    status==="Approved"
    ?"Leave approved."
    :"Leave rejected."
  );

  await leavePage();
}

async function loadConversations(){

  if(!S.user) return;

  const {data,error}=await db
    .from("conversation_members")
    .select(`
      conversation_id,
      role,
      conversations(
        id,
        name,
        is_group,
        created_at
      )
    `)
    .eq("user_id",S.user.id);

  if(error){

    console.error(error);

    S.conversations=[];

    return;
  }

  S.conversations=(data || [])
    .map(x=>({
      ...(x.conversations || {}),
      member_role:x.role
    }))
    .filter(x=>x.id);
}

function chatListHTML(){

  if(!S.conversations.length){
    return `<div class="empty">No conversations yet.</div>`;
  }

  return S.conversations.map(c=>`

    <button
      class="chat-item ${S.conversation?.id===c.id?"active":""}"
      onclick="openConversation('${c.id}')"
    >

      <div class="avatar">
        ${c.is_group ? "G" : "U"}
      </div>

      <div class="chat-item-info">

        <div class="chat-item-name">
          ${esc(conversationName(c))}
        </div>

        <div class="chat-item-preview">
          ${c.is_group ? "Group conversation" : "Direct conversation"}
        </div>

      </div>

    </button>

  `).join("");
}

function filterChats(value){

  const q=value.toLowerCase();

  document.querySelectorAll(".chat-item").forEach(item=>{
    item.style.display =
      item.textContent.toLowerCase().includes(q)
      ?"flex"
      :"none";
  });
}

function conversationName(c){

  if(c.is_group){
    return c.name || "Unnamed Group";
  }

  if(c.name){
    return c.name;
  }

  return "Conversation";
}

async function openConversation(id){

  const c=S.conversations.find(x=>x.id===id);

  if(!c) return;

  S.conversation=c;

  await chatPage();
}

async function loadMessages(){

  const box=document.getElementById("messages");

  if(!box || !S.conversation) return;

  const {data,error}=await db
    .from("messages")
    .select("*")
    .eq("conversation_id",S.conversation.id)
    .order("created_at",{ascending:true});

  if(error){

    box.innerHTML=`
      <div class="empty">
        Unable to load messages.
      </div>
    `;

    return;
  }

  S.messages=data || [];

  if(!S.messages.length){

    box.innerHTML=`
      <div class="empty">
        No messages yet. Say hi 👋
      </div>
    `;

    return;
  }

  box.innerHTML=S.messages.map(message=>{

    const mine=message.user_id===S.user.id;

    const profile=S.profiles.find(
      p=>p.id===message.user_id
    );

    return `
      <div class="message ${mine?"mine":""}">

        <div class="message-bubble">

          ${
            !mine
            ?
            `<div class="message-name">
              ${esc(profile?.full_name || "User")}
            </div>`
            :""
          }

          <div>
            ${esc(message.content || "")}
          </div>

          <div class="message-time">
            ${formatDateTime(message.created_at)}
          </div>

        </div>

      </div>
    `;

  }).join("");

  box.scrollTop=box.scrollHeight;
}

async function sendMessage(){

  const input=document.getElementById("messageInput");

  if(!input || !S.conversation) return;

  const content=input.value.trim();

  if(!content) return;

  const {error}=await db
    .from("messages")
    .insert({
      conversation_id:S.conversation.id,
      user_id:S.user.id,
      content
    });

  if(error){

    console.error(error);

    toast(error.message);

    return;
  }

  input.value="";

  await loadMessages();
}

async function createConversation(){

  const type=document.getElementById("chatType").value;

  if(type==="direct"){

    const target=document.getElementById("directStaff").value;

    if(!target){
      toast("Please select a staff member.");
      return;
    }

    const {data,error}=await db
      .from("conversations")
      .insert({
        name:null,
        is_group:false
      })
      .select()
      .single();

    if(error){

      toast(error.message);
      return;
    }

    await db
      .from("conversation_members")
      .insert([
        {
          conversation_id:data.id,
          user_id:S.user.id,
          role:"admin"
        },
        {
          conversation_id:data.id,
          user_id:target,
          role:"member"
        }
      ]);

    closeModalForce();

    await loadConversations();

    S.conversation=data;

    await chatPage();

    return;
  }


  const name=document
    .getElementById("groupName")
    .value.trim();

  const members=[
    ...document.querySelectorAll(".group-member:checked")
  ].map(x=>x.value);

  if(!name){
    toast("Please enter a group name.");
    return;
  }

  if(!members.length){
    toast("Please select at least one member.");
    return;
  }

  const {data,error}=await db
    .from("conversations")
    .insert({
      name,
      is_group:true
    })
    .select()
    .single();

  if(error){

    toast(error.message);
    return;
  }

  const rows=[
    {
      conversation_id:data.id,
      user_id:S.user.id,
      role:"admin"
    },
    ...members.map(id=>({
      conversation_id:data.id,
      user_id:id,
      role:"member"
    }))
  ];

  const memberResult=await db
    .from("conversation_members")
    .insert(rows);

  if(memberResult.error){

    console.error(memberResult.error);

    toast(memberResult.error.message);

    return;
  }

  closeModalForce();

  await loadConversations();

  S.conversation=data;

  await chatPage();
}

/* =========================================================
   CALENDAR
========================================================= */

function calendarPage(){

  const d=S.calendarDate;

  const year=d.getFullYear();
  const month=d.getMonth();

  const first=new Date(year,month,1);
  const last=new Date(year,month+1,0);

  const start=first.getDay();

  let cells="";

  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]
    .forEach(day=>{
      cells+=`
        <div class="calendar-day-head">
          ${day}
        </div>
      `;
    });

  for(let i=0;i<start;i++){

    cells+=`
      <div class="calendar-cell"></div>
    `;
  }

  for(let day=1;day<=last.getDate();day++){

    const isToday =
      day===new Date().getDate() &&
      month===new Date().getMonth() &&
      year===new Date().getFullYear();

    cells+=`

      <div class="calendar-cell">

        <div class="${isToday?"today":"calendar-number"}">
          ${day}
        </div>

      </div>

    `;
  }

  document.getElementById("content").innerHTML=`

    <div class="page-head">

      <div>
        <h1>Calendar</h1>
        <p>Keep track of important dates.</p>
      </div>

      <div style="display:flex;gap:7px">

        <button class="btn secondary" onclick="changeMonth(-1)">
          ←
        </button>

        <button class="btn secondary" onclick="changeMonth(1)">
          →
        </button>

      </div>

    </div>


    <div class="card card-pad">

      <div style="font-size:17px;font-weight:600;margin-bottom:17px">
        ${d.toLocaleDateString("en-MY",{month:"long",year:"numeric"})}
      </div>

      <div class="calendar">
        ${cells}
      </div>

    </div>
  `;
}

function changeMonth(offset){

  S.calendarDate.setMonth(
    S.calendarDate.getMonth()+offset

            <tr>

              <th>Staff</th>
              <th>User ID</th>
              <th>Position</th>
              <th>Department</th>
              <th>Employee ID</th>
              <th>Phone</th>
              <th>Role</th>
              <th>Status</th>
              <th>Action</th>

            </tr>

          </thead>

          <tbody>

            ${
              S.profiles.map(staff=>`

                <tr>

                  <td>

                    <div style="display:flex;align-items:center;gap:8px">

                      <div class="avatar">
                        ${initials(staff.full_name)}
                      </div>

                      <div>

                        <div style="font-weight:600;font-size:12px">

                    <div style="max-width:100px;overflow:hidden;text-overflow:ellipsis;font-size:9px;color:var(--muted)">
                      ${esc(staff.id)}

                  </td>


                  <td>

                  <td>
                    ${esc(staff.employee_id || "—")}
                  </td>


                  <td>

                  </td>

                      ?"green"
                      :"gray"
                    }">

function editStaff(id){

  const staff=S.profiles.find(
    x=>x.id===id
  );

  if(!staff) return;

  modal(
    "Edit Staff Information",
    `

      <div class="form-group">

        <label>User ID</label>

        <input
          class="input"
          value="${esc(staff.id)}"
          disabled
        >

        <div style="font-size:9px;color:var(--muted);margin-top:5px">
          User ID is the Supabase Auth ID and cannot be changed.
        </div>

      </div>


      <div class="grid grid-2">

        <div class="form-group">

          <label>Full Name</label>

          <input
            id="editFullName"
            class="input"
            value="${esc(staff.full_name || "")}"
          >

        </div>


        <div class="form-group">

          <label>Profile Email</label>

          <input
            id="editEmail"
            class="input"
            type="email"
            value="${esc(staff.email || "")}"
          >

          <div style="font-size:9px;color:var(--muted);margin-top:5px">
            This updates the profile information, not the Supabase login email.
          </div>

        </div>

      </div>


      <div class="grid grid-2">

        <div class="form-group">

          <label>Position</label>

          <input
            id="editPosition"
            class="input"
            value="${esc(staff.position || "")}"
            placeholder="e.g. Digital Marketing Executive"
          >

        </div>


        <div class="form-group">

          <label>Department</label>

          <input
            id="editDepartment"
            class="input"
            value="${esc(staff.department || "")}"
            placeholder="e.g. Digital"
          >

        </div>

      </div>


      <div class="grid grid-2">

        <div class="form-group">

          <label>Employee ID</label>

          <input
            id="editEmployeeId"
            class="input"
            value="${esc(staff.employee_id || "")}"
          >

        </div>


        <div class="form-group">

          <label>Phone</label>

          <input
            id="editPhone"
            class="input"
            value="${esc(staff.phone || "")}"
          >

        </div>

      </div>


      <div class="grid grid-2">

        <div class="form-group">

          <label>Join Date</label>

          <input
            id="editJoinDate"
            class="input"
            type="date"
            value="${esc(staff.join_date || "")}"
          >

        </div>


        <div class="form-group">

          <label>Role</label>

          <select id="editRole">

            <option value="staff" ${staff.role==="staff"?"selected":""}>
              Staff
            </option>

            <option value="admin" ${staff.role==="admin"?"selected":""}>
              Admin
            </option>

          </select>

        </div>

      </div>


      <div class="form-group">

        <label>Status</label>

        <select id="editStatus">

          <option value="Active" ${staff.status==="Active"?"selected":""}>
            Active
          </option>

          <option value="Inactive" ${staff.status==="Inactive"?"selected":""}>
            Inactive
          </option>

          <option value="On Leave" ${staff.status==="On Leave"?"selected":""}>
            On Leave
          </option>

        </select>

      </div>

    `,
    `

      <button
        class="btn outline"
        onclick="closeModalForce()"
      >
        Cancel
      </button>

      <button
        class="btn"
        onclick="saveStaff('${staff.id}')"
      >
        Save Changes
      </button>

    `
  );
}

async function saveStaff(id){

  const updates={

    full_name:
      document.getElementById("editFullName").value.trim(),

    email:
      document.getElementById("editEmail").value.trim(),

    position:
      document.getElementById("editPosition").value.trim(),

    department:
      document.getElementById("editDepartment").value.trim(),

    employee_id:
      document.getElementById("editEmployeeId").value.trim(),

    phone:
      document.getElementById("editPhone").value.trim(),

    join_date:
      document.getElementById("editJoinDate").value || null,

    role:
      document.getElementById("editRole").value,

    status:
      document.getElementById("editStatus").value
  };

  const {data,error}=await db
    .from("profiles")
    .update(updates)
    .eq("id",id)
    .select()
    .single();

  if(error){

    console.error(error);

    toast(error.message);

    return;
  }

  const index=S.profiles.findIndex(
    x=>x.id===id
  );

  if(index!==-1){
    S.profiles[index]=data;
  }

  if(id===S.user.id){
    S.profile=data;
    updateUserUI();
  }

  closeModalForce();

  toast("Staff information updated.");

  await staffPage();
}

async function analyticsPage(){

  await loadTasks();

  const total=S.tasks.length;

  const completed=
    S.tasks.filter(x=>x.status==="Completed").length;

  const progress=
    total
    ?Math.round((completed/total)*100)
    :0;

  document.getElementById("content").innerHTML=`

    <div class="page-head">

      <div>
        <h1>Analytics</h1>
        <p>Overview of workspace activity.</p>
      </div>

    </div>


    <div class="grid grid-3">

      <div class="card stat-card">

        <div class="stat-label">Total Tasks</div>

        <div class="stat-value">
          ${total}
        </div>

      </div>


      <div class="card stat-card">

        <div class="stat-label">Completed Tasks</div>

        <div class="stat-value">
          ${completed}
        </div>

      </div>


      <div class="card stat-card">

        <div class="stat-label">Completion Rate</div>

        <div class="stat-value">
          ${progress}%
        </div>

      </div>

    </div>


    <div class="card card-pad" style="margin-top:15px">

      <div class="card-title">
        Task Completion
      </div>

      <div style="font-size:30px;font-weight:600">
        ${progress}%
      </div>

      <div class="progress">
        <i style="width:${progress}%"></i>
      </div>

    </div>
  `;
}

/* =========================================================
   INITIALISE
========================================================= */

async function init(){

  const {
    data:{
      session
    }
  }=await db.auth.getSession();

  if(session?.user){

    await startApp(session.user);

  }else{

    document
      .getElementById("loginScreen")
      .classList.remove("hidden");

    document
      .getElementById("app")
      .classList.add("hidden");

  }

  db.auth.onAuthStateChange(
    async(event,session)=>{

      if(event==="SIGNED_IN" && session?.user){

        if(!S.user){
          await startApp(session.user);
        }

      }

    }
  );
}

init();
