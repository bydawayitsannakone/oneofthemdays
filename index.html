<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nona Costex Staff Portal</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Helvetica,Arial,sans-serif;
  background:#f4f4f1;
  color:#292c29;
}

button,input,select,textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.app{
  min-height:100vh;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:245px;
  background:#252823;
  color:white;
  padding:25px 16px;
  z-index:100;
  overflow-y:auto;
}

.logo{
  padding:0 12px 28px;
}

.logo h1{
  font-size:21px;
  letter-spacing:-.5px;
}

.logo p{
  font-size:11px;
  color:#aeb3aa;
  margin-top:5px;
}

.nav-title{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:#888e84;
  padding:18px 12px 8px;
}

.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  color:#c7cbc3;
  padding:11px 12px;
  text-align:left;
  border-radius:8px;
  margin-bottom:3px;
  font-size:13px;
  transition:.2s;
}

.nav-btn:hover{
  background:#343830;
  color:white;
}

.nav-btn.active{
  background:#e7e8df;
  color:#272a25;
}

.nav-btn.signout{
  margin-top:20px;
  color:#d5aaa3;
}

.nav-btn.signout:hover{
  background:#45312e;
}

/* MAIN */
.main{
  margin-left:245px;
  min-height:100vh;
}

.topbar{
  height:70px;
  background:white;
  border-bottom:1px solid #e4e5df;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  position:sticky;
  top:0;
  z-index:50;
}

.topbar-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.menu-toggle{
  display:none;
  border:0;
  background:#f0f1eb;
  width:38px;
  height:38px;
  border-radius:8px;
  font-size:18px;
}

.page-title{
  font-size:19px;
  font-weight:600;
}

.top-user{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:13px;
}

.avatar{
  width:35px;
  height:35px;
  border-radius:50%;
  background:#dfe2d6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:600;
  font-size:12px;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.content{
  padding:30px;
}

/* COMMON */
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:22px;
}

.section-head h2{
  font-size:20px;
}

.section-head p{
  color:#777c74;
  font-size:13px;
  margin-top:5px;
}

.btn{
  border:0;
  border-radius:8px;
  padding:10px 15px;
  font-size:12px;
  transition:.2s;
}

.btn-primary{
  background:#30342d;
  color:white;
}

.btn-primary:hover{
  background:#1f221d;
}

.btn-secondary{
  background:#e8e9e2;
  color:#30342d;
}

.btn-danger{
  background:#f2dfdc;
  color:#9b4138;
}

.btn-small{
  padding:7px 10px;
  font-size:11px;
}

.card{
  background:white;
  border:1px solid #e5e6df;
  border-radius:12px;
  padding:20px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:22px;
}

.stat{
  background:white;
  border:1px solid #e5e6df;
  border-radius:12px;
  padding:20px;
}

.stat-label{
  color:#777c74;
  font-size:12px;
  margin-bottom:10px;
}

.stat-value{
  font-size:27px;
  font-weight:600;
}

.stat-small{
  font-size:11px;
  color:#888d84;
  margin-top:5px;
}

/* TABLE */
.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th{
  text-align:left;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.6px;
  color:#858980;
  padding:12px;
  border-bottom:1px solid #e4e5df;
}

td{
  padding:14px 12px;
  border-bottom:1px solid #eeeeea;
  font-size:12px;
  vertical-align:middle;
}

tr:hover td{
  background:#fafaf7;
}

/* BADGES */
.badge{
  display:inline-flex;
  align-items:center;
  border-radius:20px;
  padding:5px 9px;
  font-size:10px;
  font-weight:600;
}

.badge-completed{
  background:#dfeade;
  color:#41633e;
}

.badge-progress{
  background:#e6e3d5;
  color:#746a38;
}

.badge-pending{
  background:#ececec;
  color:#676767;
}

.badge-overdue{
  background:#f2dcd8;
  color:#9a4037;
}

.badge-active{
  background:#dfeade;
  color:#41633e;
}

.badge-inactive{
  background:#ededed;
  color:#777;
}

.badge-high{
  background:#f2dcd8;
  color:#963f37;
}

.badge-medium{
  background:#ebe6d5;
  color:#716438;
}

.badge-low{
  background:#e2e8dc;
  color:#506249;
}

/* FORMS */
.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.form-group{
  margin-bottom:15px;
}

.form-group.full{
  grid-column:1/-1;
}

label{
  display:block;
  font-size:11px;
  font-weight:600;
  color:#646960;
  margin-bottom:7px;
}

input,select,textarea{
  width:100%;
  border:1px solid #dfe1d9;
  border-radius:8px;
  padding:10px 11px;
  font-size:12px;
  background:white;
  outline:none;
}

input:focus,select:focus,textarea:focus{

}

textarea{
  min-height:90px;
  resize:vertical;
}

/* FILTERS */
.filters{

  gap:10px;
  margin-bottom:15px;
}

.filters input{
  width:220px;
}

.filters select{
  width:160px;
}

/* PROGRESS */
.progress-wrap{
  width:100%;
}

.progress-bg{
  height:7px;
  background:#e9eae4;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  background:#777e6e;
  border-radius:20px;
}

.progress-text{
  font-size:10px;
  color:#777c74;
  margin-top:5px;
}

/* DASHBOARD GRID */
.two-col{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-bottom:20px;
}

.three-col{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

/* PROFILE */

  display:flex;
  align-items:center;
  gap:18px;
  padding-bottom:20px;
  margin-bottom:20px;
  border-bottom:1px solid #ededE8;
}

.profile-avatar{

  height:75px;
  border-radius:50%;
  background:#dfe2d6;

  align-items:center;
  justify-content:center;
  font-weight:600;
  font-size:22px;
  overflow:hidden;
  flex-shrink:0;
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-name{
  font-size:20px;
  font-weight:600;
}

.profile-role{
  color:#7b8078;
  font-size:12px;
  margin-top:5px;
}

/* EMPTY */
.empty{
  padding:40px 20px;
  text-align:center;
  color:#858980;
  font-size:12px;
}

/* MODAL */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(30,32,28,.48);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:500;
}

.modal{
  background:white;
  width:100%;
  max-width:650px;
  max-height:90vh;
  overflow-y:auto;
  border-radius:14px;
  padding:25px;
}

.modal.large{
  max-width:850px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.modal-head h3{
  font-size:18px;
}

.close-btn{
  border:0;
  background:#f0f1eb;
  width:32px;
  height:32px;
  border-radius:50%;
  font-size:16px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:20px;
}

/* TOAST */
.toast{
  position:fixed;
  right:25px;
  bottom:25px;
  background:#292d27;
  color:white;
  padding:12px 17px;
  border-radius:8px;
  font-size:12px;
  z-index:999;
  opacity:0;
  transform:translateY(10px);
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

/* ATTENDANCE */
.attendance-box{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.attendance-item{
  padding:18px;
  background:#f7f7f3;
  border-radius:10px;
}

.attendance-label{
  color:#777c74;
  font-size:11px;
  margin-bottom:6px;
}

.attendance-value{
  font-size:18px;
  font-weight:600;
}

/* LEAVE */
.leave-status{
  font-weight:600;
  font-size:11px;
}

/* MOBILE */
@media(max-width:900px){
  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
  }

  .menu-toggle{
    display:block;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .two-col{
    grid-template-columns:1fr;
  }

  .three-col{
    grid-template-columns:1fr;
  }
}

@media(max-width:600px){
  .content{
    padding:18px;
  }

  .topbar{
    padding:0 18px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .stat{
    padding:15px;
  }

  .stat-value{
    font-size:22px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }

  .section-head{
    align-items:flex-start;
    flex-direction:column;
  }

  .filters input,
  .filters select{
    width:100%;
  }
}
</style>
</head>

function getData(key, fallback){
  try{
    const data = localStorage.getItem(key);
    if(data){
      return JSON.parse(data);
    }
  }catch(e){}
  localStorage.setItem(key,JSON.stringify(fallback));
  return fallback;
}

function setData(key,data){
  localStorage.setItem(key,JSON.stringify(data));
}

let logs = getData(STORAGE.logs,DEMO_LOGS);

/* =========================================================
   HELPERS
========================================================= */

function today(){
  const d = new Date();
  return d.toISOString().split("T")[0];
}

function formatDate(date){
  if(!date) return "-";
  const d = new Date(date+"T00:00:00");
  return d.toLocaleDateString("en-GB",{
    day:"2-digit",
    month:"short",
    year:"numeric"
  });
}

function escapeHTML(str){
  if(str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function initials(name){
  return String(name || "?")
    .split(" ")
    .map(x=>x[0])
    .join("")
    .substring(0,2)
    .toUpperCase();
}

function getCurrentStaff(){
  return staff.find(s=>s.id===currentUser) || staff[0];
}

function getStaff(id){
  return staff.find(s=>s.id===id);
}

function getMyLogs(){
  return logs.filter(l=>l.staffId===currentUser);
}

function getStats(staffId){
  const arr = logs.filter(l=>l.staffId===staffId);

  const completed = arr.filter(l=>l.status==="Completed").length;
  const progress = arr.filter(l=>l.status==="In Progress").length;
  const pending = arr.filter(l=>l.status==="Pending").length;

  const overdue = arr.filter(l=>{
    if(l.status==="Completed" || !l.dueDate) return false;

    let deadline;

    if(l.dueTime){
      deadline = new Date(l.dueDate+"T"+l.dueTime);
    }else{
      deadline = new Date(l.dueDate+"T23:59:59");
    }

    return new Date() > deadline;
  }).length;

  const total = arr.length;

  return {
    total,
    completed,
    progress,
    pending,
    overdue,
    rate: total ? Math.round((completed/total)*100) : 0
  };
}

function isOverdue(log){
  if(log.status==="Completed" || !log.dueDate) return false;

  const deadline = log.dueTime
    ? new Date(log.dueDate+"T"+log.dueTime)
    : new Date(log.dueDate+"T23:59:59");

  return new Date() > deadline;
}

function statusBadge(status){
  if(status==="Completed"){
    return '<span class="badge badge-completed">Completed</span>';
  }

  if(status==="In Progress"){
    return '<span class="badge badge-progress">In Progress</span>';
  }

  return '<span class="badge badge-pending">Pending</span>';
}

function priorityBadge(priority){
  const cls =
    priority==="High" ? "badge-high" :
    priority==="Medium" ? "badge-medium" :
    "badge-low";

  return `<span class="badge ${cls}">${escapeHTML(priority || "Low")}</span>`;
}

function activeBadge(status){
  return status==="Active"
    ? '<span class="badge badge-active">Active</span>'
    : '<span class="badge badge-inactive">Inactive</span>';
}

function showToast(message){
  const el = document.getElementById("toast");
  el.textContent = message;
  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },2500);
}

function login(e){
  e.preventDefault();

  const username = document.getElementById("loginUser").value.trim();
  const password = document.getElementById("loginPass").value.trim();

  if(
    username.toLowerCase()==="admin" &&
    password==="ADMIN001"
  ){
    currentUser = "ADMIN";
    currentRole = "admin";
    currentSection = "dashboard";
    renderApp();
    return;
  }

  const user = staff.find(s=>
    (
      s.name.toLowerCase()===username.toLowerCase() ||
      s.id.toLowerCase()===username.toLowerCase()
    ) &&
    s.id===password
  );

  if(user){
    currentUser = user.id;
    currentRole = "staff";
    currentSection = "overview";
    renderApp();
    return;
  }

  alert("Invalid login details.");
}

function navButton(section,label,icon){
  return `
    <button
      class="nav-btn ${currentSection===section ? "active" : ""}"
      onclick="navigate('${section}')"
    >
      ${icon}&nbsp;&nbsp; ${label}
    </button>
  `;
}

function updateNav(){
  document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.classList.remove("active");
  });

  const buttons = document.querySelectorAll(".nav-btn");

  buttons.forEach(btn=>{
    if(btn.getAttribute("onclick")?.includes(`'${currentSection}'`)){
      btn.classList.add("active");
    }
  });
}

function navigate(section){
  currentSection = section;

  const titles = {
    overview:"Overview",
    mySchedule:"My Schedule",
    myLogs:"My Work Log",
    myAttendance:"My Attendance",
    myLeave:"Leave Application",
    myAnnouncements:"Announcements",
    profile:"My Profile",

    dashboard:"Admin Dashboard",
    staff:"Staff Management",
    attendance:"Attendance",
    logs:"Work Logs",
    leaves:"Leave Requests",
    schedule:"Schedule Management",
    announcements:"Announcements"
  };

  const title = document.getElementById("pageTitle");
  if(title) title.textContent = titles[section] || "";

  updateNav();

  const content = document.getElementById("content");
  if(!content) return;

  if(currentRole==="staff"){
    switch(section){
      case "overview": renderStaffOverview(); break;
      case "mySchedule": renderStaffSchedule(); break;
      case "myLogs": renderStaffLogs(); break;
      case "myAttendance": renderStaffAttendance(); break;
      case "myLeave": renderStaffLeave(); break;
      case "myAnnouncements": renderStaffAnnouncements(); break;
      case "profile": renderStaffProfile(); break;
    }
  }else{
    switch(section){
      case "dashboard": renderAdminDashboard(); break;
      case "staff": renderAdminStaff(); break;
      case "attendance": renderAdminAttendance(); break;
      case "logs": renderAdminLogs(); break;
      case "leaves": renderAdminLeaves(); break;
      case "schedule": renderAdminSchedule(); break;
      case "announcements": renderAdminAnnouncements(); break;
    }
  }

  const sidebar = document.getElementById("sidebar");
  if(sidebar) sidebar.classList.remove("open");
}

function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
}

function renderStaffLogs(){
  document.getElementById("content").innerHTML = `
    <div class="section-head">

        <p>Record and manage your daily work.</p>
      </div>

      <button class="btn btn-primary" onclick="openLogModal()">
        + Add Work Log
      </button>
    </div>

    <div class="card">

      <div class="filters">
        <input
          id="myLogSearch"
          placeholder="Search work log..."
          oninput="filterMyLogs()"
        >

        <select id="myLogStatus" onchange="filterMyLogs()">
          <option value="">All Status</option>
          <option>Pending</option>
          <option>In Progress</option>
          <option>Completed</option>
        </select>

        <select id="myLogPriority" onchange="filterMyLogs()">
          <option value="">All Priority</option>
          <option>High</option>
          <option>Medium</option>
          <option>Low</option>
        </select>
      </div>

      <div id="myLogsTable">
        ${renderLogsTable(getMyLogs().sort((a,b)=>b.date.localeCompare(a.date)),true)}
      </div>

    </div>
  `;
}

function filterMyLogs(){
  const search = document.getElementById("myLogSearch").value.toLowerCase();
  const status = document.getElementById("myLogStatus").value;
  const priority = document.getElementById("myLogPriority").value;

  let arr = getMyLogs();

  arr = arr.filter(l=>{
    const matchesSearch =
      l.task.toLowerCase().includes(search) ||
      (l.description || "").toLowerCase().includes(search);

    const matchesStatus = !status || l.status===status;
    const matchesPriority = !priority || l.priority===priority;

    return matchesSearch && matchesStatus && matchesPriority;
  });

  arr.sort((a,b)=>b.date.localeCompare(a.date));

  document.getElementById("myLogsTable").innerHTML =
    renderLogsTable(arr,true);
}

function renderLogsTable(arr,editable){
  if(!arr.length){
    return `<div class="empty">No work logs found.</div>`;
  }

  return `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Task</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Due</th>
            ${editable ? "<th>Action</th>" : ""}
          </tr>
        </thead>

        <tbody>
          ${arr.map(l=>`
            <tr>
              <td>${formatDate(l.date)}</td>

              <td>
                <strong>${escapeHTML(l.task)}</strong>
                ${
                  l.description
                  ? `<div style="font-size:10px;color:#888;margin-top:4px;">
                      ${escapeHTML(l.description)}
                    </div>`
                  : ""
                }
              </td>

              <td>${priorityBadge(l.priority)}</td>

              <td>
                ${
                  isOverdue(l)
                  ? '<span class="badge badge-overdue">Overdue</span>'
                  : statusBadge(l.status)
                }
              </td>

              <td>
                ${
                  l.dueDate
                  ? formatDate(l.dueDate)+(l.dueTime ? " · "+l.dueTime : "")
                  : "-"
                }
              </td>

              ${
                editable
                ? `
                <td>
                  <div style="display:flex;gap:5px;">
                    <button
                      class="btn btn-secondary btn-small"
                      onclick="openEditLogModal('${l.id}')">
                      Edit
                    </button>

                    <button
                      class="btn btn-danger btn-small"
                      onclick="deleteLog('${l.id}')">
                      Delete
                    </button>
                  </div>
                </td>
                `
                : ""
              }
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function saveLog(e,id){
  e.preventDefault();

  const obj = {
    id:id || "L"+Date.now(),
    staffId: id
      ? (logs.find(x=>x.id===id)?.staffId || currentUser)
      : currentUser,
    task:document.getElementById("logTask").value.trim(),
    date:document.getElementById("logDate").value,
    startTime:document.getElementById("logStart").value,
    endTime:document.getElementById("logEnd").value,
    dueDate:document.getElementById("logDueDate").value,
    dueTime:document.getElementById("logDueTime").value,
    priority:document.getElementById("logPriority").value,
    status:document.getElementById("logStatus").value,
    description:document.getElementById("logDescription").value.trim()
  };

  if(id){
    const index = logs.findIndex(x=>x.id===id);
    if(index!==-1) logs[index] = obj;
    showToast("Work log updated.");
  }else{
    logs.push(obj);
    showToast("Work log added.");
  }

  setData(STORAGE.logs,logs);
  closeModal();

  if(currentRole==="staff"){
    navigate("myLogs");
  }else{
    navigate("logs");
  }
}

function openEditLogModal(id){
  openLogModal(id);
}

function deleteLog(id){
  const item = logs.find(x=>x.id===id);

  if(!item) return;

  if(!confirm("Delete this work log?")) return;

  logs = logs.filter(x=>x.id!==id);
  setData(STORAGE.logs,logs);

  showToast("Work log deleted.");

  if(currentRole==="staff"){
    renderStaffLogs();
  }else{
    renderAdminLogs();
  }
}

function currentTime(){
  return new Date().toLocaleTimeString("en-GB",{
    hour:"2-digit",
    minute:"2-digit"
  });
}

function clockIn(){
  const existing = attendance.find(
    a=>a.staffId===currentUser && a.date===today()
  );

  if(existing){
    showToast("You have already clocked in.");
    return;
  }

  attendance.push({
    id:"AT"+Date.now(),
    staffId:currentUser,
    date:today(),
    clockIn:currentTime(),
    clockOut:""
  });

  setData(STORAGE.attendance,attendance);

  showToast("Clock in recorded.");
  renderStaffAttendance();
}

function clockOut(){
  const existing = attendance.find(
    a=>a.staffId===currentUser && a.date===today()
  );

  if(!existing){
    showToast("Please clock in first.");
    return;
  }

  if(existing.clockOut){
    showToast("You have already clocked out.");
    return;
  }

  existing.clockOut = currentTime();

  setData(STORAGE.attendance,attendance);

  showToast("Clock out recorded.");
  renderStaffAttendance();
}

function changeProfilePhoto(e){
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(event){
    localStorage.setItem(
      "nona_photo_"+currentUser,
      event.target.result
    );

    showToast("Profile photo updated.");
    renderStaffProfile();
  };

  reader.readAsDataURL(file);
}

function saveStaff(e,id){
  e.preventDefault();

  const code = id ||
    document.getElementById("staffCode").value.trim();

  const obj = {
    id:code,
    name:document.getElementById("staffName").value.trim(),
    department:document.getElementById("staffDepartment").value.trim(),
    position:document.getElementById("staffPosition").value.trim(),
    joining:document.getElementById("staffJoining").value,
    status:document.getElementById("staffStatus").value,
    email:document.getElementById("staffEmail").value.trim()
  };

  if(id){
    const index=staff.findIndex(s=>s.id===id);

    if(index!==-1){
      staff[index]={
        ...staff[index],
        ...obj
      };
    }

    showToast("Staff details updated.");
  }else{
    if(staff.some(s=>s.id===code)){
      alert("Staff code already exists.");
      return;
    }

    staff.push(obj);
    showToast("Staff added.");
  }

  setData(STORAGE.staff,staff);
  closeModal();
  renderAdminStaff();
}

function toggleStaff(id){
  const s=getStaff(id);

  if(!s) return;

  s.status=s.status==="Active" ? "Inactive" : "Active";

  setData(STORAGE.staff,staff);

  showToast(
    s.status==="Active"
    ? "Staff activated."
    : "Staff deactivated."
  );

  renderAdminStaff();
}

            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody>
          ${arr.map(l=>{
            const s=getStaff(l.staffId);

            return `
              <tr>

                <td>${escapeHTML(s?.name || l.staffId)}</td>

                <td>${escapeHTML(l.type)}</td>

                <td>
                  ${formatDate(l.startDate)}
                  ${
                    l.endDate!==l.startDate
                    ? " - "+formatDate(l.endDate)
                    : ""
                  }
                </td>

                <td>${escapeHTML(l.reason)}</td>

                <td>${escapeHTML(l.status)}</td>

                <td>
                  ${
                    l.status==="Pending"
                    ? `
                      <div style="display:flex;gap:5px;">
                        <button
                          class="btn btn-secondary btn-small"
                          onclick="updateLeave('${l.id}','Approved')">
                          Approve
                        </button>

                        <button
                          class="btn btn-danger btn-small"
                          onclick="updateLeave('${l.id}','Rejected')">
                          Reject
                        </button>
                      </div>
                    `
                    : "-"
                  }
                </td>

              </tr>
            `;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function updateLeave(id,status){
  const item=leaves.find(l=>l.id===id);

  if(!item) return;

  item.status=status;

  setData(STORAGE.leaves,leaves);

  showToast("Leave request updated.");
  renderAdminLeaves();
}

/* =========================================================
   ADMIN SCHEDULE
========================================================= */

function renderAdminSchedule(){
  const arr=[...schedules]
    .sort((a,b)=>a.date.localeCompare(b.date));

  document.getElementById("content").innerHTML=`
    <div class="section-head">
      <div>
        <h2>Schedule Management</h2>
        <p>Manage staff schedules and activities.</p>
      </div>

      <button class="btn btn-primary" onclick="openScheduleModal()">
        + Add Schedule
      </button>
    </div>

    <div class="card">

      ${
        arr.length
        ? `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Staff</th>
                  <th>Activity</th>
                  <th>Time</th>
                  <th>Location</th>
                  <th>Action</th>
                </tr>
              </thead>

              <tbody>
                ${arr.map(x=>{
                  const s=getStaff(x.staffId);

                  return `
                    <tr>

                      <td>${formatDate(x.date)}</td>

                      <td>${escapeHTML(s?.name || x.staffId)}</td>

                      <td>${escapeHTML(x.title)}</td>

                      <td>${escapeHTML(x.time)}</td>

                      <td>${escapeHTML(x.location)}</td>

                      <td>
                        <button
                          class="btn btn-danger btn-small"
                          onclick="deleteSchedule('${x.id}')">
                          Delete
                        </button>
                      </td>

                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        `
        : `<div class="empty">No schedules available.</div>`
      }

    </div>
  `;
}

function openScheduleModal(){
  document.getElementById("modalContainer").innerHTML=`
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">

        <div class="modal-head">
          <h3>Add Schedule</h3>
          <button class="close-btn" onclick="closeModal()">×</button>
        </div>

        <form onsubmit="saveSchedule(event)">

          <div class="form-group">
            <label>Staff</label>

            <select id="scheduleStaff" required>
              ${staff.map(s=>`
                <option value="${s.id}">
                  ${escapeHTML(s.name)} (${s.id})
                </option>
              `).join("")}
            </select>
          </div>

          <div class="form-grid">

            <div class="form-group">
              <label>Date</label>
              <input id="scheduleDate" type="date" required>
            </div>

            <div class="form-group">
              <label>Time</label>
              <input id="scheduleTime" type="time" required>
            </div>

            <div class="form-group full">
              <label>Activity</label>
              <input id="scheduleTitle" required>
            </div>

            <div class="form-group full">
              <label>Location</label>
              <input id="scheduleLocation">
            </div>

          </div>

          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" onclick="closeModal()">
              Cancel
            </button>

            <button class="btn btn-primary">
              Save Schedule
            </button>
          </div>

        </form>

      </div>
    </div>
  `;
}

function saveSchedule(e){
  e.preventDefault();

  schedules.push({
    id:"S"+Date.now(),
    staffId:document.getElementById("scheduleStaff").value,
    date:document.getElementById("scheduleDate").value,
    time:document.getElementById("scheduleTime").value,
    title:document.getElementById("scheduleTitle").value.trim(),
    location:document.getElementById("scheduleLocation").value.trim()
  });

  setData(STORAGE.schedules,schedules);

  closeModal();
  showToast("Schedule added.");
  renderAdminSchedule();
}

function deleteSchedule(id){
  if(!confirm("Delete this schedule?")) return;

  schedules=schedules.filter(x=>x.id!==id);

  setData(STORAGE.schedules,schedules);

  showToast("Schedule deleted.");
  renderAdminSchedule();
}

/* =========================================================
   ADMIN ANNOUNCEMENTS
========================================================= */

function renderAdminAnnouncements(){
  document.getElementById("content").innerHTML=`
    <div class="section-head">
      <div>
        <h2>Announcements</h2>
        <p>Create and manage staff announcements.</p>
      </div>

      <button class="btn btn-primary" onclick="openAnnouncementModal()">
        + New Announcement
      </button>
    </div>

    <div style="display:grid;gap:15px;">

      ${
        announcements.length
        ? [...announcements]
          .sort((a,b)=>b.date.localeCompare(a.date))
          .map(a=>`
            <div class="card">

              <div style="
                display:flex;
                justify-content:space-between;
                gap:20px;
              ">

                <div>

                  <h3 style="font-size:15px;">
                    ${escapeHTML(a.title)}
                  </h3>

                  <p style="
                    font-size:12px;
                    color:#70756d;
                    line-height:1.7;
                    margin-top:8px;
                  ">
                    ${escapeHTML(a.message)}
                  </p>

                  <div style="
                    font-size:10px;
                    color:#999;
                    margin-top:10px;
                  ">
                    ${formatDate(a.date)}
                  </div>

                </div>

                <button
                  class="btn btn-danger btn-small"
                  onclick="deleteAnnouncement('${a.id}')">
                  Delete
                </button>

              </div>

            </div>
          `).join("")
        : `<div class="card"><div class="empty">No announcements.</div></div>`
      }

    </div>
  `;
}

function openAnnouncementModal(){
  document.getElementById("modalContainer").innerHTML=`
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">

        <div class="modal-head">
          <h3>New Announcement</h3>
          <button class="close-btn" onclick="closeModal()">×</button>
        </div>

        <form onsubmit="saveAnnouncement(event)">

          <div class="form-group">
            <label>Title</label>
            <input id="announcementTitle" required>
          </div>

          <div class="form-group">
            <label>Message</label>
            <textarea id="announcementMessage" required></textarea>
          </div>

          <div class="form-group">
            <label>Date</label>
            <input id="announcementDate" type="date" value="${today()}">
          </div>

          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" onclick="closeModal()">
              Cancel
            </button>

            <button class="btn btn-primary">
              Publish
            </button>
          </div>

        </form>

      </div>
    </div>
  `;
}

function saveAnnouncement(e){
  e.preventDefault();

  announcements.push({
    id:"A"+Date.now(),
    title:document.getElementById("announcementTitle").value.trim(),
    message:document.getElementById("announcementMessage").value.trim(),
    date:document.getElementById("announcementDate").value
  });

  setData(STORAGE.announcements,announcements);

  closeModal();
  showToast("Announcement published.");
  renderAdminAnnouncements();
}

function deleteAnnouncement(id){
  if(!confirm("Delete this announcement?")) return;

  announcements=announcements.filter(x=>x.id!==id);

  setData(STORAGE.announcements,announcements);

  showToast("Announcement deleted.");
  renderAdminAnnouncements();
}

/* =========================================================
   MODAL
========================================================= */

function closeModal(e){
  if(e && e.target && !e.target.classList.contains("modal-overlay")){
    return;
  }

  document.getElementById("modalContainer").innerHTML="";
}

   START
========================================================= */

renderLogin();

</script>
