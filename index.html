<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nona Costex Staff Portal</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f2;
  --card:#fff;
  --text:#252525;
  --muted:#777;
  --line:#e5e5e0;
  --dark:#252923;
  --olive:#737b62;
  --olive-dark:#5e654f;
  --soft:#eef0e9;
  --danger:#b85b5b;
  --warning:#b18a42;
  --success:#648263;
}
body{
  font-family:Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* LOGIN */
.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.login-box{
  width:100%;
  max-width:420px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  padding:34px;
  box-shadow:0 15px 40px rgba(0,0,0,.05);
}
.logo{
  font-size:25px;
  font-weight:700;
  letter-spacing:-.5px;
}
.login-sub{
  color:var(--muted);
  margin:8px 0 28px;
  font-size:14px;
}
.field{margin-bottom:16px}
.field label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:7px;
}
.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid var(--line);
  background:#fafaf8;
  border-radius:10px;
  padding:11px 12px;
  outline:none;
}
.field textarea{min-height:100px;resize:vertical}
.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:var(--olive);
}
.primary{
  border:0;
  background:var(--dark);
  color:#fff;
  padding:12px 16px;
  border-radius:10px;
  width:100%;
  font-weight:600;
}
.demo{
  margin-top:18px;
  padding:12px;
  background:var(--soft);
  border-radius:10px;
  font-size:12px;
  color:#555;
  line-height:1.6;
}

/* APP */
.app{display:flex;min-height:100vh}
.sidebar{
  width:245px;
  background:var(--dark);
  color:#fff;
  padding:22px 14px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  z-index:30;
}
.brand{
  padding:8px 10px 26px;
  font-size:20px;
  font-weight:700;
}
.brand small{
  display:block;
  font-size:10px;
  color:#aaa;
  margin-top:4px;
  font-weight:400;
}
.nav-section{
  color:#8e948c;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
  padding:15px 10px 7px;
}
.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  color:#cfd2cc;
  text-align:left;
  padding:10px;
  border-radius:9px;
  margin-bottom:3px;
  font-size:13px;
}
.nav-btn:hover,.nav-btn.active{
  background:#3a4037;
  color:#fff;
}
.nav-btn .badge{
  float:right;
  background:#b85b5b;
  color:#fff;
  min-width:18px;
  height:18px;
  border-radius:20px;
  font-size:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.main{
  margin-left:245px;
  width:calc(100% - 245px);
}
.topbar{
  height:70px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:20;
}
.top-left{
  display:flex;
  align-items:center;
  gap:12px;
}
.page-title{font-size:19px;font-weight:700}
.mobile-menu{
  display:none;
  border:0;
  background:transparent;
  font-size:22px;
}
.top-right{
  display:flex;
  align-items:center;
  gap:12px;
}
.bell{
  position:relative;
  border:1px solid var(--line);
  background:#fff;
  width:38px;
  height:38px;
  border-radius:10px;
}
.bell-count{
  position:absolute;
  top:-5px;
  right:-5px;
  background:#b85b5b;
  color:#fff;
  width:17px;
  height:17px;
  border-radius:50%;
  font-size:9px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.user-mini{
  font-size:12px;
  color:#666;
}
.content{padding:28px}
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:18px;
}
.section-head h2{font-size:20px}
.section-head p{color:var(--muted);font-size:13px;margin-top:4px}
.btn{
  border:1px solid var(--line);
  background:#fff;
  padding:9px 13px;
  border-radius:9px;
  font-size:12px;
}
.btn:hover{background:#f5f5f2}
.btn.dark{
  background:var(--dark);
  color:#fff;
  border-color:var(--dark);
}
.btn.danger{
  color:#fff;
  background:var(--danger);
  border-color:var(--danger);
}
.btn.success{
  color:#fff;
  background:var(--success);
  border-color:var(--success);
}

/* CARDS */
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:22px;
}
.stat{
  background:#fff;
  border:1px solid var(--line);
  border-radius:15px;
  padding:18px;
}
.stat-label{
  color:var(--muted);
  font-size:12px;
}
.stat-value{
  font-size:28px;
  font-weight:700;
  margin-top:8px;
}
.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}
.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:15px;
  padding:19px;
}
.card-title{
  font-size:14px;
  font-weight:700;
  margin-bottom:15px;
}
.progress{
  height:8px;
  background:#e8e9e4;
  border-radius:10px;
  overflow:hidden;
}
.progress span{
  display:block;
  height:100%;
  background:var(--olive);
}
.progress-row{margin-bottom:14px}
.progress-row:last-child{margin-bottom:0}
.progress-top{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  margin-bottom:7px;
}

/* TABLE */
.table-wrap{
  overflow-x:auto;
  background:#fff;
  border:1px solid var(--line);
  border-radius:15px;
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:720px;
}
th{
  text-align:left;
  padding:13px 15px;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.5px;
  color:#888;
  border-bottom:1px solid var(--line);
  background:#fafaf8;
}
td{
  padding:14px 15px;
  font-size:12px;
  border-bottom:1px solid #eee;
  vertical-align:middle;
}
tr:last-child td{border-bottom:0}
tr:hover td{background:#fcfcfa}
.badge-status{
  display:inline-flex;
  padding:5px 8px;
  border-radius:20px;
  font-size:10px;
  font-weight:600;
}
.pending{background:#f3ead8;color:#96743c}
.progressing{background:#e5ebef;color:#557081}
.completed{background:#e4eee5;color:#55725a}
.rejected{background:#f2e3e3;color:#995858}
.overdue{background:#f3dfdf;color:#9b5555}
.priority-high{color:#a14f4f;font-weight:700}
.priority-medium{color:#99743c;font-weight:600}
.priority-low{color:#648263}

/* FILTERS */
.filters{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-bottom:15px;
}
.filters input,.filters select{
  border:1px solid var(--line);
  background:#fff;
  border-radius:9px;
  padding:9px 11px;
  font-size:12px;
  outline:none;
}
.filters input{min-width:200px}

/* EMPTY */
.empty{
  text-align:center;
  padding:38px 20px;
  color:#888;
  font-size:13px;
}

/* MODAL */
.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(20,22,19,.45);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal{
  background:#fff;
  width:100%;
  max-width:620px;
  max-height:90vh;
  overflow-y:auto;
  border-radius:17px;
  padding:23px;
}
.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}
.modal-head h3{font-size:17px}
.close{
  border:0;
  background:#f1f1ed;
  width:30px;
  height:30px;
  border-radius:50%;
}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}
.form-full{grid-column:1/-1}
.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px;
}

/* NOTIFICATION */
.notification-panel{
  position:fixed;
  right:20px;
  top:60px;
  width:360px;
  max-width:calc(100vw - 30px);
  background:#fff;
  border:1px solid var(--line);
  border-radius:15px;
  box-shadow:0 15px 40px rgba(0,0,0,.12);
  z-index:80;
  overflow:hidden;
}
.notification-head{
  padding:14px 16px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.notification-list{max-height:430px;overflow:auto}
.notification{
  padding:13px 15px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}
.notification:hover{background:#fafaf8}
.notification.unread{background:#f1f3ed}
.notification-title{
  font-size:12px;
  font-weight:700;
}
.notification-text{
  color:#666;
  font-size:11px;
  line-height:1.5;
  margin-top:3px;
}
.notification-time{
  color:#999;
  font-size:9px;
  margin-top:5px;
}

/* PROFILE */
.profile-head{
  display:flex;
  gap:18px;
  align-items:center;
}
.avatar{
  width:70px;
  height:70px;
  border-radius:50%;
  background:#e7e9e1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:700;
  overflow:hidden;
}
.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.profile-name{font-size:20px;font-weight:700}
.profile-role{font-size:12px;color:#777;margin-top:4px}
.info-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:20px;
}
.info-item{
  padding:12px;
  background:#f8f8f5;
  border-radius:10px;
}
.info-label{font-size:10px;color:#888}
.info-value{font-size:12px;margin-top:4px;font-weight:600}

/* TOAST */
.toast{
  position:fixed;
  bottom:22px;
  right:22px;
  background:var(--dark);
  color:#fff;
  padding:12px 16px;
  border-radius:10px;
  font-size:12px;
  z-index:200;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
}

/* MOBILE */
@media(max-width:800px){
  .sidebar{
    transform:translateX(-100%);
    transition:.2s;
  }
  .sidebar.open{transform:translateX(0)}
  .main{
    margin-left:0;
    width:100%;
  }
  .mobile-menu{display:block}
  .topbar{padding:0 15px}
  .content{padding:18px 14px}
  .stats{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .stat{padding:14px}
  .stat-value{font-size:23px}
  .grid-2{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .form-full{grid-column:auto}
  .user-mini{display:none}
}

/* PRINT */
@media print{
  .sidebar,.topbar,.btn,.filters,.mobile-menu{display:none!important}
  .main{margin:0;width:100%}
}
</style>
</head>

<body>

<div id="root"></div>

<script>
/* =========================================================
   NONA COSTEX STAFF PORTAL V12
   ========================================================= */

const KEYS = {
  logs:'nona_logs',
  leaves:'nona_leaves',
  attendance:'nona_attendance',
  staff:'nona_staff',
  schedules:'nona_schedules',
  announcements:'nona_announcements',
  notifications:'nona_notifications',
  activity:'nona_activity',
  photoPrefix:'nona_photo_'
};

let currentUser = null;
let currentPage = 'dashboard';
let notificationOpen = false;

/* ---------- BASIC HELPERS ---------- */

function get(key, fallback=[]){
  try{
    const value = JSON.parse(localStorage.getItem(key));
    return value ?? fallback;
  }catch(e){
    return fallback;
  }
}

function set(key,value){
  localStorage.setItem(key,JSON.stringify(value));
}

function uid(prefix='id'){
  return prefix+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
}

function esc(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function today(){
  return new Date().toISOString().slice(0,10);
}

function nowText(){
  return new Date().toLocaleString('en-MY',{
    day:'2-digit',
    month:'short',
    year:'numeric',
    hour:'2-digit',
    minute:'2-digit'
  });
}

function formatDate(date){
  if(!date)return '-';
  const d = new Date(date+'T00:00:00');
  return d.toLocaleDateString('en-MY',{
    day:'2-digit',
    month:'short',
    year:'numeric'
  });
}

function initials(name){
  return String(name||'?')
    .split(' ')
    .map(x=>x[0])
    .join('')
    .slice(0,2)
    .toUpperCase();
}

function toast(message){
  const old=document.querySelector('.toast');
  if(old)old.remove();

  const el=document.createElement('div');
  el.className='toast';
  el.textContent=message;
  document.body.appendChild(el);

  setTimeout(()=>el.remove(),2600);
}

/* ---------- DEFAULT DATA ---------- */

function initData(){

  if(!localStorage.getItem(KEYS.staff)){
    set(KEYS.staff,[
      {
        id:'staff_001',
        name:'Atikah',
        code:'NC001',
        department:'Digital',
        position:'Live Host Online & Offline',
        status:'Active',
        joiningDate:'2026-09-02',
        email:'',
        phone:''
      },
      {
        id:'staff_002',
        name:'Temporary Staff 1',
        code:'NC002',
        department:'Digital',
        position:'Temporary Staff',
        status:'Active',
        joiningDate:'2026-09-02',
        email:'',
        phone:''
      },
      {
        id:'staff_003',
        name:'Temporary Staff 2',
        code:'NC003',
        department:'Digital',
        position:'Temporary Staff',
        status:'Active',
        joiningDate:'2026-09-02',
        email:'',
        phone:''
      }
    ]);
  }

  if(!localStorage.getItem(KEYS.logs)){
    set(KEYS.logs,[
      {
        id:uid('log'),
        staffId:'staff_001',
        title:'Budget quotation completed and presented to team + Flite product shoot',
        workDate:'2026-09-07',
        startTime:'',
        endTime:'',
        dueDate:'2026-09-07',
        dueTime:'18:00',
        priority:'High',
        status:'Completed',
        description:'Prepared budget quotation and presented it to the team. Also completed Flite product shooting.',
        assignedBy:'Admin'
      },
      {
        id:uid('log'),
        staffId:'staff_001',
        title:'Product shooting + content brainstorming',
        workDate:'2026-09-08',
        startTime:'',
        endTime:'',
        dueDate:'2026-09-08',
        dueTime:'18:00',
        priority:'Medium',
        status:'Completed',
        description:'Continued product shooting and brainstormed social media content ideas.',
        assignedBy:'Admin'
      },
      {
        id:uid('log'),
        staffId:'staff_001',
        title:'Budget quotation for live setup + social media content shooting',
        workDate:'2026-09-09',
        startTime:'',
        endTime:'',
        dueDate:'2026-09-09',
        dueTime:'18:00',
        priority:'Medium',
        status:'Completed',
        description:'Presented live setup budget quotation and shot content for social media.',
        assignedBy:'Admin'
      },
      {
        id:uid('log'),
        staffId:'staff_001',
        title:'Content shooting and video editing',
        workDate:'2026-09-10',
        startTime:'',
        endTime:'',
        dueDate:'2026-09-10',
        dueTime:'18:00',
        priority:'Medium',
        status:'Completed',
        description:'Shot social media content and completed video editing.',
        assignedBy:'Admin'
      }
    ]);
  }

  if(!localStorage.getItem(KEYS.leaves))set(KEYS.leaves,[]);
  if(!localStorage.getItem(KEYS.attendance))set(KEYS.attendance,[]);

  if(!localStorage.getItem(KEYS.schedules)){
    set(KEYS.schedules,[
      {
        id:uid('schedule'),
        staffId:'staff_001',
        title:'Content Planning',
        date:'2026-09-15',
        time:'10:00',
        location:'Office'
      },
      {
        id:uid('schedule'),
        staffId:'staff_001',
        title:'Product Shooting',
        date:'2026-09-16',
        time:'11:00',
        location:'Studio'
      },
      {
        id:uid('schedule'),
        staffId:'staff_001',
        title:'Video Editing',
        date:'2026-09-17',
        time:'14:00',
        location:'Office'
      }
    ]);
  }

  if(!localStorage.getItem(KEYS.announcements)){
    set(KEYS.announcements,[
      {
        id:uid('announcement'),
        title:'Welcome to Nona Costex Staff Portal',
        text:'This portal is used for staff work tracking, attendance, leave and internal updates.',
        createdAt:nowText()
      },
      {
        id:uid('announcement'),
        title:'Digital Team Content Planning',
        text:'Please keep social media content planning and work updates updated in the portal.',
        createdAt:nowText()
      }
    ]);
  }

  if(!localStorage.getItem(KEYS.notifications))set(KEYS.notifications,[]);
  if(!localStorage.getItem(KEYS.activity))set(KEYS.activity,[]);

  /* Migration: old V11 logs may not have these fields */
  const logs=get(KEYS.logs);
  let changed=false;

  logs.forEach(log=>{
    if(!log.staffId){
      log.staffId='staff_001';
      changed=true;
    }
    if(!log.assignedBy){

  if(changed)set(KEYS.logs,logs);
}

/* ---------- DATA ---------- */

function staffList(){
  return get(KEYS.staff);
}

function logsList(){
  return get(KEYS.logs);
}

function currentStaff(){
  if(!currentUser)return null;
  return staffList().find(s=>s.id===currentUser.staffId);
}

function getUserNotifications(){
  if(!currentUser)return[];
  return get(KEYS.notifications)
    .filter(n=>n.staffId===currentUser.staffId)
    .sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
}

function unreadCount(){
  return getUserNotifications().filter(n=>!n.read).length;
}

function addActivity(action,detail,staffId=null){
  const list=get(KEYS.activity);

  list.unshift({
    id:uid('activity'),
    userId:currentUser?.staffId || null,
    userName:currentUser?.name || 'System',
    role:currentUser?.role || 'System',
    action,
    detail,
    staffId:staffId || currentUser?.staffId || null,
    createdAt:new Date().toISOString()
  });

  set(KEYS.activity,list.slice(0,500));
}

function addNotification(staffId,title,message,type='info'){
  if(!staffId)return;

  const list=get(KEYS.notifications);

  list.unshift({
    id:uid('notification'),
    staffId,
    title,
    message,
    type,
    read:false,
    createdAt:new Date().toISOString()
  });

  set(KEYS.notifications,list.slice(0,500));
}

function markNotificationRead(id){
  const list=get(KEYS.notifications);
  const item=list.find(n=>n.id===id);
  if(item)item.read=true;
  set(KEYS.notifications,list);
  renderApp();
}

function markAllRead(){
  const list=get(KEYS.notifications);
  list.forEach(n=>{
    if(n.staffId===currentUser.staffId)n.read=true;
  });
  set(KEYS.notifications,list);
  renderApp();
  toast('All notifications marked as read');
}

/* ---------- LOGIN ---------- */

function renderLogin(){
  document.getElementById('root').innerHTML=`
    <div class="login-page">
      <div class="login-box">
        <div class="logo">Nona Costex</div>
        <div class="login-sub">Staff Portal</div>

        <form onsubmit="handleLogin(event)">
          <div class="field">
            <label>Name / Username</label>
            <input id="loginName" required placeholder="Enter your name">
          </div>

          <div class="field">
            <label>Staff Code / Password</label>
            <input id="loginCode" required type="password" placeholder="Enter your code">
          </div>

          <button class="primary">Login</button>
        </form>

        <div class="demo">
          <b>Demo login</b><br>
          Staff: Atikah / NC001<br>
          Admin: Admin / ADMIN001
        </div>
      </div>
    </div>
  `;
}

function handleLogin(e){
  e.preventDefault();

  const username=document.getElementById('loginName').value.trim();
  const password=document.getElementById('loginCode').value.trim();

  if(
    username.toLowerCase()==='admin' &&
    password.toUpperCase()==='ADMIN001'
  ){
    currentUser={
      role:'admin',
      name:'Admin',
      staffId:'admin'
    };

    addActivity('Login','Admin logged into the portal');
    renderApp();
    return;
  }

  const staff=staffList().find(s=>
    s.name.trim().toLowerCase()===username.toLowerCase() &&
    s.code.trim().toUpperCase()===password.toUpperCase()
  );

  if(!staff){
    toast('Invalid name or staff code');
    return;
  }

  currentUser={

  }

    </div>

            onclick="markNotificationRead('${n.id}')">

            <div class="notification-text">${esc(n.message)}</div>
            <div class="notification-time">${formatRelative(n.createdAt)}</div>

        `).join('')
        :`<div class="empty">No notifications</div>`
      }
    </div>
  `;

}

function formatRelative(date){
  const diff=Math.floor((Date.now()-new Date(date).getTime())/60000);

  if(diff<1)return'Just now';
  if(diff<60)return diff+' min ago';

  const h=Math.floor(diff/60);
  if(h<24)return h+' hour'+(h>1?'s':'')+' ago';

  const d=Math.floor(h/24);
  return d+' day'+(d>1?'s':'')+' ago';
}

/* ---------- STATS ---------- */

function getStats(staffId){
  const logs=logsList().filter(l=>l.staffId===staffId);

  const total=logs.length;
  const completed=logs.filter(l=>l.status==='Completed').length;
  const progress=logs.filter(l=>l.status==='In Progress').length;
  const pending=logs.filter(l=>l.status==='Pending').length;

  const now=new Date();

  const overdue=logs.filter(l=>{
    if(l.status==='Completed'||!l.dueDate)return false;

    const due=new Date(
      l.dueDate+'T'+(l.dueTime||'23:59')
    );

    return due<now;
  }).length;

  const rate=total?Math.round((completed/total)*100):0;

  return {total,completed,progress,pending,overdue,rate};
}

function filterTasks(){
  let logs=logsList()
    .filter(l=>currentUser.role==='admin'||l.staffId===currentUser.staffId);

  const search=(document.getElementById('taskSearch')?.value||'').toLowerCase();
  const status=document.getElementById('taskStatus')?.value||'';
  const priority=document.getElementById('taskPriority')?.value||'';
  const staff=document.getElementById('taskStaff')?.value||'';

  logs=logs.filter(l=>{
    const matchesSearch=
      !search ||
      l.title.toLowerCase().includes(search) ||
      (l.description||'').toLowerCase().includes(search);

    const matchesStatus=!status||l.status===status;
    const matchesPriority=!priority||l.priority===priority;
    const matchesStaff=!staff||l.staffId===staff;

    return matchesSearch&&matchesStatus&&matchesPriority&&matchesStaff;
  });

  renderTaskTable(logs);
}

function isOverdue(log){
  if(!log.dueDate||log.status==='Completed')return false;

  return new Date(
    log.dueDate+'T'+(log.dueTime||'23:59')
  ) < new Date();
}

function saveTask(e,id){
  e.preventDefault();

  const logs=logsList();

  const staffId=document.getElementById('taskStaffId').value;
  const staff=staffList().find(s=>s.id===staffId);

  if(!staff){
    toast('Please select a staff');
    return;
  }

  const old=logs.find(x=>x.id===id);

  const data={
    id:id||uid('task'),
    staffId,
    title:document.getElementById('taskTitle').value.trim(),
    workDate:document.getElementById('taskWorkDate').value,
    dueDate:document.getElementById('taskDueDate').value,
    dueTime:document.getElementById('taskDueTime').value,
    priority:document.getElementById('taskPriorityInput').value,
    status:document.getElementById('taskStatusInput').value,
    description:document.getElementById('taskDescription').value.trim(),
    assignedBy:'Admin',
    startTime:old?.startTime||'',
    endTime:old?.endTime||''
  };

  if(old){
    const index=logs.findIndex(x=>x.id===id);
    logs[index]=data;

    set(KEYS.logs,logs);

    addActivity(
      'Task Updated',
      `${data.title} updated for ${staff.name}`,
      staffId
    );

    if(old.staffId!==staffId){
      addNotification(
        staffId,
        'New task assigned',
        `You have been assigned: ${data.title}`,
        'task'
      );
    }

    toast('Task updated');
  }else{
    logs.unshift(data);
    set(KEYS.logs,logs);

    addActivity(
      'Task Assigned',
      `${data.title} assigned to ${staff.name}`,
      staffId
    );

    addNotification(
      staffId,
      'New task assigned',
      `You have been assigned: ${data.title}`,
      'task'
    );

    toast('Task assigned successfully');
  }

  closeModal();
  renderApp();
}

function renderLogsTable(logs){
  const el=document.getElementById('logsTable');
  if(!el)return;

  if(!logs.length){
    el.innerHTML=`<div class="card empty">No work logs found.</div>`;
    return;
  }

  el.innerHTML=`
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Task</th>
            ${currentUser.role==='admin'?'<th>Staff</th>':''}
            <th>Due</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody>
          ${logs.map(log=>{
            const staff=staffList().find(s=>s.id===log.staffId);

            return`
              <tr>
                <td>${formatDate(log.workDate)}</td>
                <td>
                  <b>${esc(log.title)}</b>
                  <div style="font-size:10px;color:#999">${esc(log.description||'')}</div>
                </td>

                ${currentUser.role==='admin'?`<td>${esc(staff?.name||'-')}</td>`:''}

                <td>
                  ${formatDate(log.dueDate)}
                  ${log.dueTime?`<br><span style="color:#999">${esc(log.dueTime)}</span>`:''}
                </td>

                <td>
                  <span class="badge-status ${
                    log.status==='Completed'
                    ?'completed'
                    :log.status==='In Progress'
                    ?'progressing'
                    :'pending'
                  }">
                    ${esc(log.status)}
                  </span>
                </td>

                <td>
                  <button class="btn" onclick="openLogModal('${log.id}')">Edit</button>
                  <button class="btn" onclick="deleteLog('${log.id}')">Delete</button>
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function filterLogs(){
  let logs=logsList()
    .filter(l=>currentUser.role==='admin'||l.staffId===currentUser.staffId);

  const search=(document.getElementById('logSearch')?.value||'').toLowerCase();
  const status=document.getElementById('logStatus')?.value||'';
  const staff=document.getElementById('logStaff')?.value||'';

  logs=logs.filter(l=>
    (!search||
      l.title.toLowerCase().includes(search)||
      (l.description||'').toLowerCase().includes(search))
    &&(!status||l.status===status)
    &&(!staff||l.staffId===staff)
  );

  renderLogsTable(logs);
}

            <div class="field">
              <label>Status</label>

                <option ${old?.status==='Pending'?'selected':''}>Pending</option>

            <button class="btn dark">Save</button>

function saveLog(e,id){
  e.preventDefault();

  const logs=logsList();

  const staffId=document.getElementById('logStaffInput').value;
  const old=logs.find(x=>x.id===id);

  const data={
    id:id||uid('log'),
    staffId,
    title:document.getElementById('logTitle').value.trim(),
    workDate:document.getElementById('logWorkDate').value,
    dueDate:document.getElementById('logDueDate').value,
    dueTime:document.getElementById('logDueTime').value,
    status:document.getElementById('logStatusInput').value,
    priority:document.getElementById('logPriorityInput').value,
    description:document.getElementById('logDescription').value.trim(),
    startTime:old?.startTime||'',
    endTime:old?.endTime||'',
    assignedBy:old?.assignedBy||'Admin'
  };

  if(old){
    const i=logs.findIndex(x=>x.id===id);
    logs[i]=data;
    toast('Work log updated');

    addActivity(
      'Work Log Updated',
      data.title,
      staffId
    );
  }else{
    logs.unshift(data);
    toast('Work log added');

    addActivity(
      'Work Log Added',
      data.title,
      staffId
    );
  }

  set(KEYS.logs,logs);
  closeModal();
  renderApp();
}

function deleteLog(id){
  if(!confirm('Delete this work log?'))return;

  const logs=logsList();
  const old=logs.find(x=>x.id===id);

  set(KEYS.logs,logs.filter(x=>x.id!==id));

  if(old){
    addActivity(
      'Work Log Deleted',
      old.title,
      old.staffId
    );
  }

  toast('Work log deleted');
  renderApp();
}

function renderAttendance(){
  setPageTitle('Attendance');

  const list=get(KEYS.attendance)
    .filter(a=>currentUser.role==='admin'||a.staffId===currentUser.staffId)
    .sort((a,b)=>b.date.localeCompare(a.date));

  const todayRecord=list.find(a=>a.staffId===currentUser.staffId&&a.date===today());

  document.getElementById('pageContent').innerHTML=`
    <div class="section-head">
      <div>
        <h2>Attendance</h2>
        <p>Daily clock in and clock out records.</p>
      </div>

      ${
        currentUser.role==='staff'
        ?`
        ${
          !todayRecord
          ?`<button class="btn dark" onclick="clockIn()">Clock In</button>`
          :!todayRecord.clockOut
          ?`<button class="btn dark" onclick="clockOut()">Clock Out</button>`
          :`<button class="btn" disabled>Completed</button>`
        }
        `
        :''
      }
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            ${currentUser.role==='admin'?'<th>Staff</th>':''}
            <th>Clock In</th>
            <th>Clock Out</th>
          </tr>
        </thead>

        <tbody>
          ${
            list.length
            ?list.map(a=>{
              const s=staffList().find(x=>x.id===a.staffId);

              return`
                <tr>
                  <td>${formatDate(a.date)}</td>
                  ${currentUser.role==='admin'?`<td>${esc(s?.name||'-')}</td>`:''}
                  <td>${esc(a.clockIn||'-')}</td>
                  <td>${esc(a.clockOut||'-')}</td>
                </tr>
              `;
            }).join('')
            :`<tr><td colspan="4"><div class="empty">No attendance records.</div></td></tr>`
          }
        </tbody>
      </table>
    </div>
  `;
}

function clockIn(){
  const list=get(KEYS.attendance);

  if(list.some(a=>a.staffId===currentUser.staffId&&a.date===today())){
    toast('Already clocked in today');
    return;
  }

  list.push({
    id:uid('attendance'),
    staffId:currentUser.staffId,
    date:today(),
    clockIn:new Date().toLocaleTimeString('en-MY',{hour:'2-digit',minute:'2-digit'}),
    clockOut:''
  });

  set(KEYS.attendance,list);

  addActivity('Clock In','Staff clocked in');
  toast('Clocked in');
  renderApp();
}

function clockOut(){
  const list=get(KEYS.attendance);
  const item=list.find(a=>a.staffId===currentUser.staffId&&a.date===today());

  if(!item){
    toast('Please clock in first');
    return;
  }

  item.clockOut=new Date().toLocaleTimeString('en-MY',{hour:'2-digit',minute:'2-digit'});

  set(KEYS.attendance,list);

  addActivity('Clock Out','Staff clocked out');
  toast('Clocked out');
  renderApp();
}

function filterStaff(){
  const search=(document.getElementById('staffSearch')?.value||'').toLowerCase();
  const dep=document.getElementById('staffDepartment')?.value||'';
  const status=document.getElementById('staffStatusFilter')?.value||'';

  const list=staffList().filter(s=>
    (
      !search||
      s.name.toLowerCase().includes(search)||
      s.code.toLowerCase().includes(search)||
      s.position.toLowerCase().includes(search)
    )&&
    (!dep||s.department===dep)&&
    (!status||s.status===status)
  );

  renderStaffTable(list);
}

function saveStaff(e,id){
  e.preventDefault();

  const list=staffList();

  const data={
    id:id||uid('staff'),
    name:document.getElementById('staffName').value.trim(),
    code:document.getElementById('staffCode').value.trim(),
    department:document.getElementById('staffDep').value.trim(),
    position:document.getElementById('staffPosition').value.trim(),
    status:document.getElementById('staffStatus').value,
    joiningDate:document.getElementById('staffJoining').value,
    email:document.getElementById('staffEmail').value.trim(),
    phone:document.getElementById('staffPhone').value.trim()
  };

  if(list.some(s=>s.code.toUpperCase()===data.code.toUpperCase()&&s.id!==id)){
    toast('Staff code already exists');
    return;
  }

  if(id){
    const i=list.findIndex(s=>s.id===id);
    list[i]=data;
    addActivity('Staff Updated',`${data.name} updated`);
  }else{
    list.push(data);
    addActivity('Staff Added',`${data.name} added`);
  }

  set(KEYS.staff,list);

  closeModal();
  toast(id?'Staff updated':'Staff added');
  renderApp();
}

function getPhoto(code){

function changePhoto(e){
  const file=e.target.files[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=function(){
    const s=currentStaff();

    localStorage.setItem(
      KEYS.photoPrefix+s.code,
      reader.result
    );

    addActivity('Profile Photo Updated','Staff profile photo updated');

    toast('Profile photo updated');
    renderApp();
  };

  reader.readAsDataURL(file);
}

/* ---------- CSV EXPORT ---------- */

function csvEscape(value){
  return '"'+String(value??'').replace(/"/g,'""')+'"';
}

function downloadCSV(filename,rows){
  if(!rows.length){
    toast('No data to export');
    return;
  }

  const csv=rows.map(row=>row.map(csvEscape).join(',')).join('\n');

  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);

  const a=document.createElement('a');
  a.href=url;
  a.download=filename;
  a.click();

  URL.revokeObjectURL(url);
}

function exportCSV(type){

  if(currentUser.role!=='admin'){
    toast('Admin only');
    return;
  }

  if(type==='logs'){
    const rows=[
      ['Staff','Task','Work Date','Due Date','Due Time','Priority','Status','Description']
    ];

    logsList().forEach(l=>{
      const s=staffList().find(x=>x.id===l.staffId);

      rows.push([
        s?.name||'',
        l.title,
        l.workDate,
        l.dueDate,
        l.dueTime,
        l.priority,
        l.status,
        l.description
      ]);
    });

    downloadCSV('nona-work-logs.csv',rows);
  }

  if(type==='attendance'){
    const rows=[
      ['Staff','Date','Clock In','Clock Out']
    ];

    get(KEYS.attendance).forEach(a=>{
      const s=staffList().find(x=>x.id===a.staffId);

      rows.push([
        s?.name||'',
        a.date,
        a.clockIn,
        a.clockOut
      ]);
    });

    downloadCSV('nona-attendance.csv',rows);
  }

  if(type==='leave'){
    const rows=[
      ['Staff','Type','Start Date','End Date','Reason','Status']
    ];

    get(KEYS.leaves).forEach(l=>{
      const s=staffList().find(x=>x.id===l.staffId);

      rows.push([
        s?.name||'',
        l.type,
        l.startDate,
        l.endDate,
        l.reason,
        l.status
      ]);
    });

    downloadCSV('nona-leave.csv',rows);
  }

  toast('Export ready');
}

/* ---------- MODAL ---------- */

function closeModal(){
  const el=document.getElementById('modalRoot');
  if(el)el.innerHTML='';
}

/* ---------- ROUTER ---------- */

function renderPage(){

  const content=document.getElementById('pageContent');
  if(!content)return;

  switch(currentPage){

    case'dashboard':
      renderDashboard();
      break;

    case'tasks':
      renderTasks();
      break;

    case'logs':
      renderLogs();
      break;

    case'attendance':
      renderAttendance();
      break;

    case'leave':
      renderLeave();
      break;

    case'schedule':
      renderSchedule();
      break;

    case'announcements':
      renderAnnouncements();
      break;

    case'notifications':
      renderNotifications();
      break;

    case'staff':
      if(currentUser.role==='admin')renderStaff();
      else renderDashboard();
      break;

    case'analytics':
      if(currentUser.role==='admin')renderAnalytics();
      else renderDashboard();
      break;

    case'activity':
      if(currentUser.role==='admin')renderActivity();
      else renderDashboard();
      break;

    case'profile':
      renderProfile();
      break;

    default:
      renderDashboard();
  }
}

/* ---------- AUTO OVERDUE NOTIFICATIONS ---------- */

function generateOverdueNotifications(){

  const logs=logsList();
  const notifications=get(KEYS.notifications);

  logs.forEach(log=>{

    if(!isOverdue(log))return;

    const exists=notifications.some(n=>
      n.staffId===log.staffId &&
      n.type==='overdue' &&
      n.message.includes(log.id)
    );

    if(!exists){

      addNotification(
        log.staffId,
        'Task overdue',
        `Task "${log.title}" is overdue. [${log.id}]`,
        'overdue'
      );
    }
  });
}
