<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nona Costex Staff Portal</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f5f5f2;
  --card:#ffffff;
  --text:#242424;
  --muted:#777;
  --border:#e8e8e3;
  --accent:#6f705c;
  --accent-dark:#595a49;
  --soft:#eeeeea;
  --danger:#b85c5c;
  --warning:#b38a45;
  --success:#5f8065;
  --sidebar:#242521;
  --sidebar-text:#d8d8d1;
}

body{
  font-family:Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* ================= LOGIN ================= */

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at top left,#e8e8df,transparent 35%),
    var(--bg);
}

.login-card{
  width:100%;
  max-width:420px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:20px;
  padding:38px;
  box-shadow:0 15px 50px rgba(0,0,0,.06);
}

.logo-mark{
  width:48px;
  height:48px;
  border-radius:14px;
  background:var(--sidebar);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:700;
  margin-bottom:22px;
}

.login-card h1{
  font-size:25px;
  margin-bottom:7px;
}

.login-card p{
  color:var(--muted);
  font-size:14px;
  margin-bottom:28px;
}

.form-group{
  margin-bottom:17px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:7px;
}

.form-control{
  width:100%;
  padding:12px 13px;
  border:1px solid var(--border);
  border-radius:10px;
  outline:none;
  background:#fff;
  transition:.2s;
}

.form-control:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(111,112,92,.08);
}

.btn{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  transition:.2s;
  font-weight:600;
}

.btn-primary{
  background:var(--sidebar);
  color:white;
}

.btn-primary:hover{
  background:#151613;
  transform:translateY(-1px);
}

.btn-secondary{
  background:var(--soft);
  color:var(--text);
}

.btn-danger{
  background:#f4e5e5;
  color:var(--danger);
}

.btn-success{
  background:#e6eee7;
  color:var(--success);
}

.btn-small{
  padding:7px 11px;
  font-size:12px;
}

.login-demo{
  margin-top:20px;
  padding:12px;
  border-radius:10px;
  background:#f7f7f4;
  font-size:12px;
  color:var(--muted);
  line-height:1.7;
}

/* ================= APP ================= */

.app{
  min-height:100vh;
}

.sidebar{
  width:250px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  background:var(--sidebar);
  color:white;
  padding:24px 15px;
  z-index:100;
  overflow-y:auto;
}

.brand{
  padding:4px 10px 25px;
  border-bottom:1px solid rgba(255,255,255,.08);
  margin-bottom:17px;
}

.brand-title{
  font-size:17px;
  font-weight:700;
}

.brand-sub{
  font-size:11px;
  color:#a9aaa3;
  margin-top:5px;
}

.nav-label{
  color:#85867f;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1.2px;
  padding:12px 10px 7px;
}

.nav-btn{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  border:0;
  background:transparent;
  color:var(--sidebar-text);
  text-align:left;
  padding:10px;
  border-radius:9px;
  margin:2px 0;
  font-size:13px;
}

.nav-btn:hover{
  background:rgba(255,255,255,.06);
}

.nav-btn.active{
  background:#41423a;
  color:white;
}

.nav-icon{
  width:21px;
  text-align:center;
  opacity:.8;
}

.sidebar-bottom{
  margin-top:25px;
  border-top:1px solid rgba(255,255,255,.08);
  padding-top:16px;
}

.main{
  margin-left:250px;
  min-height:100vh;
}

.topbar{
  height:70px;
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  position:sticky;
  top:0;
  z-index:50;
}

.topbar-title{
  font-size:17px;
  font-weight:700;
}

.topbar-right{
  display:flex;
  align-items:center;
  gap:12px;
}

.date-text{
  font-size:12px;
  color:var(--muted);
}

.user-pill{
  display:flex;
  align-items:center;
  gap:9px;
  background:#f5f5f1;
  border-radius:30px;
  padding:6px 11px 6px 6px;
}

.avatar{
  width:30px;
  height:30px;
  border-radius:50%;
  background:#d8d8ce;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:700;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.user-pill span{
  font-size:12px;
  font-weight:600;
}

.content{
  padding:30px;
  max-width:1500px;
  margin:auto;
}

.page-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  margin-bottom:25px;
}

.page-header h2{
  font-size:25px;
  margin-bottom:5px;
}

.page-header p{
  color:var(--muted);
  font-size:13px;
}

/* ================= CARDS ================= */

.stat-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:22px;
}

.stat-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:19px;
  position:relative;
  overflow:hidden;
}

.stat-card:after{
  content:"";
  position:absolute;
  right:-22px;
  top:-22px;
  width:75px;
  height:75px;
  border-radius:50%;
  background:#f1f1ec;
}

.stat-label{
  font-size:12px;
  color:var(--muted);
  position:relative;
  z-index:1;
}

.stat-number{
  font-size:28px;
  font-weight:700;
  margin-top:9px;
  position:relative;
  z-index:1;
}

.stat-note{
  font-size:11px;
  color:var(--muted);
  margin-top:5px;
}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:15px;
  padding:20px;
  margin-bottom:18px;
}

.card-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.card-title{
  font-size:15px;
  font-weight:700;
}

.card-subtitle{
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}

/* ================= GRID ================= */

.two-col{
  display:grid;
  grid-template-columns:1.35fr 1fr;
  gap:18px;
}

.three-col{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

/* ================= TABLE ================= */

.table-wrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:600px;
}

th{
  text-align:left;
  font-size:10px;
  color:#888;
  text-transform:uppercase;
  letter-spacing:.6px;
  padding:10px 9px;
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}

td{
  padding:13px 9px;
  border-bottom:1px solid #f0f0ed;
  font-size:12px;
  vertical-align:middle;
}

tbody tr{
  transition:.15s;
}

tbody tr:hover{
  background:#fafaf8;
}

tbody tr:last-child td{
  border-bottom:0;
}

/* ================= BADGES ================= */

.badge{
  display:inline-flex;
  align-items:center;
  padding:5px 8px;
  border-radius:20px;
  font-size:10px;
  font-weight:700;
  white-space:nowrap;
}

.badge-pending{
  background:#f4eee1;
  color:#9a7939;
}

.badge-progress{
  background:#e9edf0;
  color:#596b78;
}

.badge-completed{
  background:#e5eee6;
  color:#5e7c63;
}

.badge-overdue{
  background:#f4e4e4;
  color:#a95252;
}

.badge-active{
  background:#e5eee6;
  color:#5e7c63;
}

.badge-inactive{
  background:#eeeeee;
  color:#777;
}

/* ================= PROGRESS ================= */

.progress-row{
  margin-bottom:17px;
}

.progress-info{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  margin-bottom:7px;
}

.progress-info span:last-child{
  color:var(--muted);
}

.progress-track{
  height:8px;
  background:#ecece7;
  border-radius:20px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  background:var(--accent);
  border-radius:20px;
  transition:width .4s;
}

/* ================= LIST ================= */

.list-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:13px 0;
  border-bottom:1px solid #f0f0ed;
}

.list-item:last-child{
  border-bottom:0;
}

.list-main{
  min-width:0;
}

.list-title{
  font-size:12px;
  font-weight:600;
  margin-bottom:4px;
}

.list-meta{
  font-size:10px;
  color:var(--muted);
}

/* ================= EMPTY ================= */

.empty{
  text-align:center;
  padding:35px 15px;
  color:var(--muted);
}

.empty-icon{
  font-size:26px;
  margin-bottom:9px;
  opacity:.5;
}

.empty-title{
  color:#555;
  font-size:13px;
  font-weight:600;
  margin-bottom:4px;
}

.empty-text{
  font-size:11px;
}

/* ================= FORMS ================= */

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.form-grid-3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.form-full{
  grid-column:1/-1;
}

textarea.form-control{
  min-height:100px;
  resize:vertical;
}

.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:9px;
  margin-top:17px;
}

/* ================= MODAL ================= */

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:500;
}

.modal{
  background:white;
  width:100%;
  max-width:650px;
  max-height:90vh;
  overflow-y:auto;
  border-radius:18px;
  padding:25px;
  box-shadow:0 25px 80px rgba(0,0,0,.15);
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:22px;
}

.modal-header h3{
  font-size:18px;
}

.close-btn{
  border:0;
  background:#f2f2ee;
  width:30px;
  height:30px;
  border-radius:50%;
}

/* ================= PROFILE ================= */

.profile-top{
  display:flex;
  align-items:center;
  gap:18px;
  padding-bottom:20px;
  border-bottom:1px solid var(--border);
  margin-bottom:20px;
}

.profile-photo{
  width:75px;
  height:75px;
  border-radius:18px;
  background:#e2e2da;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:700;
}

.profile-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-name{
  font-size:19px;
  font-weight:700;
}

.profile-position{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.profile-info-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.info-box{
  background:#f7f7f4;
  padding:12px;
  border-radius:10px;
}

.info-label{
  color:#888;
  font-size:10px;
  margin-bottom:4px;
}

.info-value{
  font-size:12px;
  font-weight:600;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  right:25px;
  bottom:25px;
  background:#292a26;
  color:white;
  padding:12px 17px;
  border-radius:10px;
  font-size:12px;
  z-index:1000;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
  animation:toastIn .25s ease;
}

@keyframes toastIn{
  from{
    transform:translateY(15px);
    opacity:0;
  }
  to{
    transform:translateY(0);
    opacity:1;
  }
}

/* ================= MOBILE ================= */

.mobile-menu{
  display:none;
  border:0;
  background:#f2f2ee;
  width:36px;
  height:36px;
  border-radius:9px;
  font-size:18px;
}

.sidebar-overlay{
  display:none;
}

@media(max-width:1100px){
  .stat-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .two-col{
    grid-template-columns:1fr;
  }

  .three-col{
    grid-template-columns:1fr;
  }
}

@media(max-width:750px){
  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .sidebar-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    z-index:90;
  }

  .sidebar-overlay.show{
    display:block;
  }

  .main{
    margin-left:0;
  }

  .topbar{
    padding:0 16px;
  }

  .mobile-menu{
    display:block;
    margin-right:10px;
  }

  .topbar-left{
    display:flex;
    align-items:center;
  }

  .date-text{
    display:none;
  }

  .content{
    padding:20px 16px;
  }

  .page-header{
    align-items:flex-start;
  }

  .page-header h2{
    font-size:21px;
  }

  .stat-grid{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .stat-card{
    padding:15px;
  }

  .stat-number{
    font-size:23px;
  }

  .form-grid,
  .form-grid-3{
    grid-template-columns:1fr;
  }

  .form-full{
    grid-column:auto;
  }

  .profile-info-grid{
    grid-template-columns:1fr;
  }

  .user-pill span{
    display:none;
  }
}

@media(max-width:450px){
  .stat-grid{
    grid-template-columns:1fr;
  }

  .login-card{
    padding:28px 22px;
  }
}
</style>
</head>

</div>

function getData(key, fallback){
  const saved = localStorage.getItem(key);

  if(saved){
    try{
      return JSON.parse(saved);
    }catch(e){
      return fallback;
    }
  }

  localStorage.setItem(key, JSON.stringify(fallback));
  return fallback;
}

/* =========================================================
   HELPERS
========================================================= */

function today(){
  return new Date().toISOString().split("T")[0];
}

function formatDate(date){
  if(!date) return "-";

  const d = new Date(date + "T00:00:00");

  return d.toLocaleDateString("en-GB",{
    day:"2-digit",
    month:"short",
    year:"numeric"
  });
}

function escapeHTML(value){
  if(value === undefined || value === null) return "";

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function initials(name){
  if(!name) return "?";

  return name
    .split(" ")
    .map(x => x[0])
    .join("")
    .substring(0,2)
    .toUpperCase();
}

function showToast(message){
  const old = document.querySelector(".toast");

  if(old) old.remove();

  const toast = document.createElement("div");
  toast.className = "toast";
  toast.textContent = message;

  document.body.appendChild(toast);

  setTimeout(()=>{
    toast.remove();
  },2500);
}

function getStaff(code){
  return staff.find(s => s.code === code);
}

function getMyLogs(){
  return logs.filter(l => l.staffCode === currentUser.code);
}

function isOverdue(log){
  if(log.status === "Completed") return false;
  if(!log.dueDate) return false;

  let deadline;

  if(log.dueTime){
    deadline = new Date(`${log.dueDate}T${log.dueTime}`);
  }else{
    deadline = new Date(`${log.dueDate}T23:59`);
  }

  return new Date() > deadline;
}

function getStats(code){
  const data = logs.filter(l => l.staffCode === code);

  const total = data.length;
  const completed = data.filter(l => l.status === "Completed").length;
  const progress = data.filter(l => l.status === "In Progress").length;
  const pending = data.filter(l => l.status === "Pending").length;
  const overdue = data.filter(l => isOverdue(l)).length;

  const rate = total ? Math.round((completed / total) * 100) : 0;

  return {
    total,
    completed,
    progress,
    pending,
    overdue,
    rate
  };
}

function statusBadge(status, overdue=false){
  if(overdue){
    return `<span class="badge badge-overdue">Overdue</span>`;
  }

  if(status === "Completed"){
    return `<span class="badge badge-completed">Completed</span>`;
  }

  if(status === "In Progress"){
    return `<span class="badge badge-progress">In Progress</span>`;
  }

  return `<span class="badge badge-pending">Pending</span>`;
}

function activeBadge(status){
  return status === "Active"
    ? `<span class="badge badge-active">Active</span>`
    : `<span class="badge badge-inactive">Inactive</span>`;
}

document.getElementById("loginForm").addEventListener("submit",function(e){

  e.preventDefault();

    document.getElementById("loginUsername").value.trim();

    document.getElementById("loginPassword").value.trim();

  if(
    username.toLowerCase() === "admin" &&
    password === "ADMIN001"
  ){

    currentRole = "admin";
    currentUser = {
      name:"Admin",
      code:"ADMIN001"
    };

    startApp("adminDashboard");
    return;
  }

  const found = staff.find(s =>
    s.name.toLowerCase() === username.toLowerCase() &&
    s.code === password
  );

  if(found){

    currentRole = "staff";
    currentUser = found;

    startApp("staffDashboard");

  alert("Invalid username or password.");
});

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(){

      `nona_photo_${currentUser.code}`,
      reader.result

    updateUserHeader();
    showToast("Profile photo updated.");
    renderStaffProfile();
  };

  reader.readAsDataURL(file);
}

    alert("Staff code already exists.");
    return;
  }

  staff.push({
    id:Date.now(),
    name:document.getElementById("staffName").value,
    code,
    department:document.getElementById("staffDepartment").value,
    position:document.getElementById("staffPosition").value,
    status:"Active",
    joiningDate:document.getElementById("staffJoining").value
  });

  saveData();

  showToast("Staff status updated.");
  navigate("adminStaff");

          </table>

        </div>

      ` : emptyState("▣","No leave requests","No leave requests have been submitted.")}
    </div>
  `;
}

function updateLeave(id,status){

  const leave = leaves.find(l=>l.id === id);

  if(!leave) return;

  leave.status = status;

  saveData();

  showToast(`Leave request ${status.toLowerCase()}.`);
  navigate("adminLeave");
}

/* =========================================================
   ADMIN SCHEDULE
========================================================= */

function renderAdminSchedule(){

  document.getElementById("content").innerHTML = `

        <h2>Schedule Management</h2>
        <p>Create and manage staff schedules.</p>
      </div>

      <button class="btn btn-primary"
        onclick="openScheduleModal()">
        + Add Schedule
      </button>

    </div>

    <div class="card">

      ${schedules.length ? `

        <div class="table-wrap">

          <table>

            <thead>
              <tr>
                <th>Date</th>
                <th>Staff</th>
                <th>Activity</th>
                <th>Time</th>
                <th>Location</th>
                <th></th>
              </tr>
            </thead>

            <tbody>

              ${schedules
                .slice()
                .sort((a,b)=>a.date.localeCompare(b.date))
                .map(s=>{

                  const person = getStaff(s.staffCode);

                  return `
                    <tr>

                      <td>${formatDate(s.date)}</td>

                      <td>
                        ${person ? escapeHTML(person.name) : "-"}
                      </td>

                      <td>${escapeHTML(s.title)}</td>

                }).join("")}

        </div>

      ` : emptyState("◷","No schedules","Create a schedule for your staff.")}
    </div>
  `;

function openScheduleModal(){

  document.getElementById("modalContainer").innerHTML = `

    <div class="modal-overlay" onclick="closeModal(event)">

      <div class="modal" onclick="event.stopPropagation()">

        <div class="modal-header">

          <div>
            <h3>Add Schedule</h3>
            <div class="card-subtitle">
              Assign a new activity to staff.
            </div>
          </div>

          <button class="close-btn"
            onclick="closeModal()">×</button>

        </div>

        <form onsubmit="addSchedule(event)">

          <div class="form-grid">

            <div class="form-group">
              <label>Staff</label>

              <select id="scheduleStaff"
                class="form-control"
                required>

                ${staff
                  .filter(s=>s.status==="Active")
                  .map(s=>`
                    <option value="${s.code}">
                      ${escapeHTML(s.name)} (${escapeHTML(s.code)})
                    </option>
                  `).join("")}

              </select>

            </div>

            <div class="form-group">
              <label>Date</label>
              <input
                id="scheduleDate"
                type="date"
                class="form-control"
                required>
            </div>

            <div class="form-group">
              <label>Activity</label>
              <input
                id="scheduleTitle"
                class="form-control"
                required>
            </div>

            <div class="form-group">
              <label>Time</label>
              <input
                id="scheduleTime"
                type="time"
                class="form-control"
                required>
            </div>

            <div class="form-group form-full">
              <label>Location</label>
              <input
                id="scheduleLocation"
                class="form-control"
                placeholder="Office, Studio, etc."
                required>
            </div>

          </div>

          <div class="form-actions">

            <button
              type="button"
              class="btn btn-secondary"
              onclick="closeModal()">
              Cancel
            </button>

            <button class="btn btn-primary">
              Save Schedule
            </button>

          </div>

        </form>

      </div>

    </div>
  `;
}

function addSchedule(e){

  e.preventDefault();

  schedules.push({
    id:Date.now(),
    staffCode:document.getElementById("scheduleStaff").value,
    date:document.getElementById("scheduleDate").value,
    title:document.getElementById("scheduleTitle").value,
    time:document.getElementById("scheduleTime").value,
    location:document.getElementById("scheduleLocation").value
  });

  saveData();

  closeModal();
  showToast("Schedule added.");
  navigate("adminSchedule");
}

function deleteSchedule(id){

  if(!confirm("Delete this schedule?")) return;

  schedules =
    schedules.filter(s=>s.id !== id);

  saveData();

  showToast("Schedule deleted.");
  navigate("adminSchedule");
}

function openAnnouncementModal(){

function addAnnouncement(e){

  e.preventDefault();

  announcements.push({
    id:Date.now(),
    title:document.getElementById("announcementTitle").value,
    message:document.getElementById("announcementMessage").value,
    date:today()
  });

  saveData();

  closeModal();
  showToast("Announcement published.");
  navigate("adminAnnouncements");
}

function deleteAnnouncement(id){

  if(!confirm("Delete this announcement?")) return;

  announcements =
    announcements.filter(a=>a.id !== id);

  saveData();

  showToast("Announcement deleted.");
  navigate("adminAnnouncements");
}

/* =========================================================
   PAGE ROUTER
========================================================= */

function renderPage(page){

  const content =
    document.getElementById("content");

  content.innerHTML = "";

  if(currentRole === "staff"){

    if(page === "staffDashboard") renderStaffDashboard();
    else if(page === "staffSchedule") renderStaffSchedule();
    else if(page === "staffLogs") renderStaffLogs();
    else if(page === "staffAttendance") renderStaffAttendance();
    else if(page === "staffLeave") renderStaffLeave();
    else if(page === "staffAnnouncements") renderStaffAnnouncements();
    else if(page === "staffProfile") renderStaffProfile();

  }

  if(currentRole === "admin"){

    if(page === "adminDashboard") renderAdminDashboard();
    else if(page === "adminStaff") renderAdminStaff();
    else if(page === "adminAttendance") renderAdminAttendance();
    else if(page === "adminLogs") renderAdminLogs();
    else if(page === "adminLeave") renderAdminLeave();
    else if(page === "adminSchedule") renderAdminSchedule();
    else if(page === "adminAnnouncements") renderAdminAnnouncements();

  }
}

/* =========================================================
   MODAL
========================================================= */

function closeModal(e){

  if(
    e &&
    e.target &&
    !e.target.classList.contains("modal-overlay")
  ){
    return;
  }

  document.getElementById("modalContainer").innerHTML = "";
}

/* =========================================================
   EMPTY STATE
========================================================= */

function emptyState(icon,title,text){

  return `
    <div class="empty">

      <div class="empty-icon">
        ${icon}
      </div>

      <div class="empty-title">
        ${title}
      </div>

      <div class="empty-text">
        ${text}
      </div>

    </div>
  `;
}

   INIT
========================================================= */

updateDate();
