<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nona Costex Staff Portal</title>

<style>
:root{
  --bg:#f5f5f1;
  --surface:#fff;
  --surface2:#f0f0eb;
  --text:#252724;
  --muted:#777b73;
  --line:#dedfd8;
  --accent:#737b61;
  --accent-dark:#596047;
  --accent-soft:#e7e9df;
  --danger:#a65d5d;
  --danger-soft:#f4e5e5;
  --warning:#a6814d;
  --warning-soft:#f6eddc;
  --success:#5f8069;
  --success-soft:#e4eee7;
  --shadow:0 8px 25px rgba(35,38,31,.06);
  --radius:14px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

svg{
  width:18px;
  height:18px;
  stroke:currentColor;
  stroke-width:1.8;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.login-card{
  width:100%;
  max-width:420px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:22px;
  padding:38px;
  box-shadow:var(--shadow);
}

.logo-mark{
  width:46px;
  height:46px;
  border-radius:13px;
  background:var(--accent);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  margin-bottom:20px;
}

.login-card h1{
  margin:0 0 8px;
  font-size:25px;
}

.login-card p{
  margin:0 0 28px;
  color:var(--muted);
  font-size:14px;
}

.form-group{margin-bottom:16px}
label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:7px;
}

input,select,textarea{
  width:100%;
  border:1px solid var(--line);
  background:white;
  border-radius:10px;
  padding:11px 12px;
  color:var(--text);
  outline:none;
}

input:focus,select:focus,textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(115,123,97,.1);
}

textarea{min-height:100px;resize:vertical}

.btn{
  border:0;
  border-radius:10px;
  padding:10px 15px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-weight:600;
  font-size:13px;
}

.btn-primary{background:var(--accent);color:white}
.btn-primary:hover{background:var(--accent-dark)}
.btn-secondary{background:var(--surface2);color:var(--text)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-success{background:var(--success-soft);color:var(--success)}
.btn-sm{padding:7px 10px;font-size:12px}

.login-btn{width:100%;margin-top:8px;padding:13px}

.demo-box{
  margin-top:20px;
  background:var(--surface2);
  border-radius:11px;
  padding:12px;
  font-size:12px;
  color:var(--muted);
  line-height:1.6;
}

.app{min-height:100vh}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:245px;
  background:#292c27;
  color:#fff;
  padding:20px 14px;
  z-index:1000;
  overflow-y:auto;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  padding:7px 9px 25px;
}

.brand-icon{
  width:37px;
  height:37px;
  background:#737b61;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
}

.brand-text strong{display:block;font-size:14px}
.brand-text span{font-size:11px;color:#b8bbb3}

.nav-section{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:#8f938b;
  padding:13px 10px 7px;
}

.nav-item{
  width:100%;
  border:0;
  background:transparent;
  color:#cfd1cb;
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 11px;
  border-radius:9px;
  margin:2px 0;
  text-align:left;
  font-size:13px;
}

.nav-item svg{width:17px;height:17px}
.nav-item:hover{background:#373b34;color:white}
.nav-item.active{background:#737b61;color:white}

.main{
  margin-left:245px;
  min-height:100vh;
}

.topbar{
  height:67px;
  background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:900;
  backdrop-filter:blur(8px);
}

.top-left{
  display:flex;
  align-items:center;
  gap:13px;
}

.page-title{font-size:17px;font-weight:700}

.menu-btn{
  display:none;
  border:0;
  background:var(--surface2);
  border-radius:9px;
  width:38px;
  height:38px;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.icon-btn{
  position:relative;
  width:38px;
  height:38px;
  border:1px solid var(--line);
  background:white;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.badge-count{
  position:absolute;
  top:-4px;
  right:-4px;
  min-width:17px;
  height:17px;
  border-radius:20px;
  background:var(--danger);
  color:white;
  font-size:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 4px;
}

.user-mini{
  display:flex;
  align-items:center;
  gap:9px;
  padding-left:8px;
}

.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  background:var(--accent-soft);
  color:var(--accent-dark);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:12px;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.user-mini div:last-child strong{
  display:block;
  font-size:12px;
}

.user-mini div:last-child span{
  display:block;
  font-size:10px;
  color:var(--muted);
}

.content{
  padding:27px;
  max-width:1500px;
  margin:auto;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:18px;
}

.section-head h2{
  margin:0;
  font-size:19px;
}

.section-head p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:12px;
}

.card-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.stat-card{
  padding:18px;
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.stat-label{
  font-size:12px;
  color:var(--muted);
  margin-bottom:7px;
}

.stat-value{
  font-size:25px;
  font-weight:700;
}

.stat-icon{
  width:38px;
  height:38px;
  border-radius:10px;
  background:var(--accent-soft);
  color:var(--accent-dark);
  display:flex;
  align-items:center;
  justify-content:center;
}

.two-col{
  display:grid;
  grid-template-columns:1.35fr .85fr;
  gap:18px;
}

.card-head{
  padding:17px 18px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.card-head h3{
  margin:0;
  font-size:14px;
}

.card-body{padding:18px}

.progress-wrap{margin-top:10px}
.progress-line{
  height:8px;
  background:var(--surface2);
  border-radius:10px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  background:var(--accent);
  border-radius:10px;
}

.progress-info{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:var(--muted);
  margin-bottom:6px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th{
  text-align:left;
  padding:11px 14px;
  background:#f8f8f5;
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.04em;
  white-space:nowrap;
}

td{
  padding:13px 14px;
  border-top:1px solid var(--line);
  font-size:12px;
  vertical-align:middle;
}

tr:hover td{background:#fcfcfa}

.status,.priority{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 8px;
  border-radius:20px;
  font-size:10px;
  font-weight:600;
  white-space:nowrap;
}

.status-pending{background:#f1f1ed;color:#777b73}
.status-progress{background:var(--warning-soft);color:var(--warning)}
.status-completed{background:var(--success-soft);color:var(--success)}
.status-overdue{background:var(--danger-soft);color:var(--danger)}

.priority-low{background:#f1f1ed;color:#777b73}
.priority-medium{background:var(--warning-soft);color:var(--warning)}
.priority-high{background:var(--danger-soft);color:var(--danger)}

.toolbar{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.toolbar input,.toolbar select{max-width:230px}

.empty{
  text-align:center;
  padding:40px 20px;
  color:var(--muted);
}

.empty svg{
  width:32px;
  height:32px;
  margin-bottom:10px;
}

.list-item{
  padding:13px 0;
  border-bottom:1px solid var(--line);
}

.list-item:last-child{border-bottom:0}

.list-title{
  font-size:13px;
  font-weight:600;
}

.list-meta{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.quick-btn{
  border:1px solid var(--line);
  background:white;
  padding:13px;
  border-radius:11px;
  text-align:left;
  display:flex;
  gap:9px;
  align-items:center;
  font-size:12px;
  font-weight:600;
}

.quick-btn:hover{background:var(--surface2)}

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(20,22,19,.45);
  z-index:2000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal{
  background:white;
  width:100%;
  max-width:620px;
  max-height:90vh;
  overflow:auto;
  border-radius:17px;
  box-shadow:0 20px 60px rgba(0,0,0,.18);
}

.modal-head{
  padding:18px 20px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-head h3{margin:0;font-size:16px}

.modal-close{
  border:0;
  background:var(--surface2);
  border-radius:8px;
  width:32px;
  height:32px;
}

.modal-body{padding:20px}

.modal-foot{
  padding:15px 20px;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.full{grid-column:1/-1}

.toast-container{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:3000;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.toast{
  background:#292c27;
  color:white;
  padding:12px 15px;
  border-radius:10px;
  font-size:12px;
  box-shadow:var(--shadow);
  animation:toastIn .2s ease;
}

.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}

@keyframes toastIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

.profile{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:18px;
}

.profile-side{
  padding:25px;
  text-align:center;
}

.profile-photo{
  width:105px;
  height:105px;
  border-radius:50%;
  background:var(--accent-soft);
  margin:0 auto 15px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  color:var(--accent-dark);
  font-size:28px;
  font-weight:700;
}

.profile-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-name{font-size:17px;font-weight:700}
.profile-position{font-size:11px;color:var(--muted);margin-top:4px}

.detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.detail{
  background:var(--surface2);
  padding:13px;
  border-radius:10px;
}

.detail small{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-bottom:4px;
}

.detail strong{font-size:12px}

.notification{
  display:flex;
  gap:12px;
  padding:14px;
  border-bottom:1px solid var(--line);
}

.notification.unread{background:#f8f9f4}
.notification-icon{
  width:34px;
  height:34px;
  flex:none;
  border-radius:9px;
  background:var(--accent-soft);
  color:var(--accent-dark);
  display:flex;
  align-items:center;
  justify-content:center;
}

.notification-title{font-size:12px;font-weight:700}
.notification-message{font-size:11px;color:var(--muted);margin-top:3px}
.notification-time{font-size:9px;color:#999;margin-top:5px}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  z-index:950;
}

@media(max-width:1050px){
  .card-grid{grid-template-columns:repeat(2,1fr)}
  .two-col{grid-template-columns:1fr}
}

@media(max-width:800px){
  .sidebar{
    transform:translateX(-100%);
    transition:.2s ease;
  }

  .sidebar.open{transform:translateX(0)}
  .overlay.open{display:block}

  .main{margin-left:0}
  .menu-btn{display:flex;align-items:center;justify-content:center}
  .topbar{padding:0 15px}
  .content{padding:18px 14px}
  .user-mini div:last-child{display:none}
  .profile{grid-template-columns:1fr}
}

@media(max-width:600px){
  .card-grid{grid-template-columns:1fr 1fr;gap:9px}
  .stat-card{padding:13px}
  .stat-value{font-size:20px}
  .stat-label{font-size:10px}
  .stat-icon{width:32px;height:32px}
  .stat-icon svg{width:15px;height:15px}

  .section-head{align-items:flex-start}
  .section-head .btn{white-space:nowrap}

  .form-grid{grid-template-columns:1fr}
  .full{grid-column:auto}

  .quick-grid{grid-template-columns:1fr}
  .detail-grid{grid-template-columns:1fr}

  .login-card{padding:27px 21px}

  .toast-container{
    left:14px;
    right:14px;
    bottom:14px;
  }
}

@media(max-width:390px){
  .card-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div id="loginPage" class="login-page">
  <div class="login-card">
    <div class="logo-mark">NC</div>
    <h1>Nona Costex</h1>
    <p>Staff Portal</p>

    <div class="form-group">
      <label>Username</label>
      <input id="loginUsername" placeholder="Enter username">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input id="loginPassword" type="password" placeholder="Enter password">
    </div>

    <button class="btn btn-primary login-btn" onclick="login()">
      <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>
      Sign In
    </button>

    <div class="demo-box">
      <strong>Demo Login</strong><br>
      Staff: Atikah / NC001<br>
      Admin: Admin / ADMIN001
    </div>
  </div>
</div>

<div id="app" class="app hidden">

  <div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="brand-icon">NC</div>
      <div class="brand-text">
        <strong>Nona Costex</strong>
        <span>Staff Portal</span>
      </div>
    </div>

    <div class="nav-section">Main</div>

    <button class="nav-item active" data-page="dashboard" onclick="showPage('dashboard')">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Dashboard
    </button>

    <button class="nav-item" data-page="tasks" onclick="showPage('tasks')">
      <svg viewBox="0 0 24 24"><path d="M9 11l2 2 4-4"/><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8"/></svg>
      <span id="taskNavText">My Tasks</span>
    </button>

    <button class="nav-item" data-page="logs" onclick="showPage('logs')">
      <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      Work Logs
    </button>

    <button class="nav-item" data-page="attendance" onclick="showPage('attendance')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      Attendance
    </button>

    <button class="nav-item" data-page="leave" onclick="showPage('leave')">
      <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
      Leave
    </button>

    <button class="nav-item" data-page="schedule" onclick="showPage('schedule')">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/></svg>
      Schedule
    </button>

    <button class="nav-item" data-page="announcements" onclick="showPage('announcements')">
      <svg viewBox="0 0 24 24"><path d="M4 11h4l9-5v12l-9-5H4z"/><path d="M8 13v5"/></svg>
      Announcements
    </button>

    <button class="nav-item" data-page="notifications" onclick="showPage('notifications')">
      <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
      Notifications
      <span id="sideNotifCount" class="badge-count hidden"></span>
    </button>

    <div id="adminNav" class="hidden">
      <div class="nav-section">Admin</div>

      <button class="nav-item" data-page="staff" onclick="showPage('staff')">
        <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Staff Management
      </button>

      <button class="nav-item" data-page="analytics" onclick="showPage('analytics')">
        <svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h17"/><path d="m7 15 4-5 3 3 5-7"/></svg>
        Analytics
      </button>

      <button class="nav-item" data-page="activity" onclick="showPage('activity')">
        <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 8h8M8 12h6M8 16h4"/></svg>
        Activity History
      </button>
    </div>

    <div class="nav-section">Account</div>

    <button class="nav-item" data-page="profile" onclick="showPage('profile')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      My Profile
    </button>

    <button class="nav-item" onclick="logout()">
      <svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M19 4v16"/></svg>
      Logout
    </button>
  </aside>

  <main class="main">

    <header class="topbar">
      <div class="top-left">
        <button class="menu-btn" onclick="toggleSidebar()">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div id="pageTitle" class="page-title">Dashboard</div>
      </div>

      <div class="top-actions">
        <button class="icon-btn" onclick="showPage('notifications')" title="Notifications">
          <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
          <span id="topNotifCount" class="badge-count hidden"></span>
        </button>

        <div class="user-mini">
          <div id="topAvatar" class="avatar">A</div>
          <div>
            <strong id="topUserName">Atikah</strong>
            <span id="topUserRole">Staff</span>
          </div>
        </div>
      </div>
    </header>

let currentUser=null;

function uid(prefix='id'){
  return prefix+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
}

function get(key){
  try{return JSON.parse(localStorage.getItem(KEYS[key])||'[]')}
  catch(e){return []}
}

function set(key,value){
  localStorage.setItem(KEYS[key],JSON.stringify(value));
}

function esc(value){
  return String(value??'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

function today(){
  return new Date().toISOString().slice(0,10);
}

function nowTime(){
  return new Date().toTimeString().slice(0,5);
}

function formatDate(date){
  if(!date)return '-';
  const d=new Date(date+'T00:00:00');
  return d.toLocaleDateString('en-GB',{
    day:'2-digit',
    month:'short',
    year:'numeric'
  });
}

function formatDateTime(value){
  if(!value)return '-';
  return new Date(value).toLocaleString('en-GB',{
    day:'2-digit',
    month:'short',
    year:'numeric',
    hour:'2-digit',
    minute:'2-digit'
  });
}

function initials(name){
  return String(name||'')
    .split(' ')
    .map(x=>x[0])
    .join('')
    .slice(0,2)
    .toUpperCase();
}

function activeStaff(){
  return get('staff').filter(s=>s.status==='Active');
}

function getStaff(id){
  return get('staff').find(s=>s.id===id || s.staffId===id);
}

function currentStaff(){
  return getStaff(currentUser?.staffId);
}

function isAdmin(){
  return currentUser?.role==='admin';
}

function isOverdue(task){
  if(task.status==='Completed')return false;
  if(!task.dueDate)return false;

  const deadline=new Date(
    task.dueDate+'T'+(task.dueTime||'23:59')
  );

  return new Date()>deadline;
}

function statusClass(status){
  if(status==='Completed')return 'status-completed';
  if(status==='In Progress')return 'status-progress';
  return 'status-pending';
}

function priorityClass(priority){
  if(priority==='High')return 'priority-high';
  if(priority==='Medium')return 'priority-medium';
  return 'priority-low';
}

/* =========================
   TOAST
========================= */

function toast(message,type=''){
  const box=document.createElement('div');
  box.className='toast '+type;
  box.textContent=message;

  document.getElementById('toastContainer').appendChild(box);

  setTimeout(()=>box.remove(),2800);
}

/* =========================
   ACTIVITY
========================= */

function addActivity(action,detail,staffId=null){
  const arr=get('activity');

  arr.unshift({
    id:uid('act'),
    action,
    detail,
    staffId:staffId || currentUser?.staffId || null,
    createdAt:new Date().toISOString()
  });

  set('activity',arr.slice(0,500));
}

/* =========================
   NOTIFICATIONS
========================= */

function addNotification(staffId,title,message,type='general'){
  const arr=get('notifications');

  arr.unshift({
    id:uid('not'),
    staffId,
    title,
    message,
    type,
    read:false,
    createdAt:new Date().toISOString()
  });

  set('notifications',arr.slice(0,500));
}

function getUserNotifications(){
  if(!currentUser)return[];

  return get('notifications')
    .filter(n=>n.staffId===currentUser.staffId);
}

function unreadCount(){
  return getUserNotifications().filter(n=>!n.read).length;
}

function updateNotificationBadge(){
  const count=unreadCount();

  ['topNotifCount','sideNotifCount'].forEach(id=>{
    const el=document.getElementById(id);
    if(!el)return;

    if(count){
      el.textContent=count>99?'99+':count;
      el.classList.remove('hidden');
    }else{
      el.classList.add('hidden');
    }
  });
}

function generateOverdueNotifications(){
  const tasks=get('logs');
  const notes=get('notifications');

  tasks.forEach(task=>{
    if(!isOverdue(task))return;

    const exists=notes.some(n=>
      n.staffId===task.staffId &&
      n.type==='overdue' &&
      n.message.includes(task.id)
    );

    if(!exists){
      addNotification(
        task.staffId,
        'Task overdue',
        `"${task.title}" is overdue. Task ID: ${task.id}`,
        'overdue'
      );
    }
  });
}

/* =========================

========================= */

function login(){

  const username=document.getElementById('loginUsername').value.trim();
  const password=document.getElementById('loginPassword').value.trim();

  if(
    username.toLowerCase()==='admin' &&
    password==='ADMIN001'
  ){
    currentUser={
      role:'admin',
      staffId:'admin',
      name:'Admin'
    };

    startApp();
    return;
  }

  const staff=get('staff').find(s=>
    String(s.username||s.name).trim().toLowerCase()===username.toLowerCase() &&
    s.staffId===password
  );

  if(!staff){
    toast('Invalid username or password','error');
    return;
  }

  currentUser={
    role:'staff',
    staffId:staff.id,
    name:staff.name
  };

  startApp();
}

function logout(){
  addActivity('Logout',`${currentUser?.name||''} logged out`);
  currentUser=null;

  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginPage').classList.remove('hidden');

  document.getElementById('loginUsername').value='';
  document.getElementById('loginPassword').value='';
}

/* =========================
   APP
========================= */

function startApp(){

  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  addActivity('Login',`${currentUser.name} logged in`,currentUser.staffId);

  if(isAdmin()){
    document.getElementById('adminNav').classList.remove('hidden');
    document.getElementById('taskNavText').textContent='Tasks';
  }else{
    document.getElementById('adminNav').classList.add('hidden');
    document.getElementById('taskNavText').textContent='My Tasks';
  }

  const name=currentUser.name;
  document.getElementById('topUserName').textContent=name;
  document.getElementById('topUserRole').textContent=isAdmin()?'Admin':'Staff';

  const staff=currentStaff();

  if(staff){
    document.getElementById('topAvatar').innerHTML=getPhoto(staff.staffId)
      ?`<img src="${getPhoto(staff.staffId)}">`
      :initials(staff.name);
  }else{
    document.getElementById('topAvatar').textContent='A';
  }

  generateOverdueNotifications();
  updateNotificationBadge();
  showPage('dashboard');
}

  dashboard:'Dashboard',

  logs:'Work Logs',

  profile:'My Profile'
};

function showPage(page){

  if(
    ['staff','analytics','activity'].includes(page) &&
    !isAdmin()
  ){
    page='dashboard';
  }

  currentPage=page;

  document.querySelectorAll('.nav-item[data-page]').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.page===page);
  });

  document.getElementById('pageTitle').textContent=pageNames[page]||'Dashboard';

  const content=document.getElementById('content');

  const pages={
    dashboard:renderDashboard,
    tasks:renderTasks,
    logs:renderLogs,
    attendance:renderAttendance,
    leave:renderLeave,
    schedule:renderSchedule,
    announcements:renderAnnouncements,
    notifications:renderNotifications,
    staff:renderStaff,
    analytics:renderAnalytics,
    activity:renderActivity,
    profile:renderProfile
  };

  content.innerHTML=pages[page]?pages[page]():renderDashboard();

  if(window.innerWidth<=800){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
  }

  updateNotificationBadge();
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');

      </div>

                  }

                    `
                    :`

function filterTasks(){

  const search=(document.getElementById('taskSearch')?.value||'').toLowerCase();
  const status=document.getElementById('taskStatusFilter')?.value||'';
  const priority=document.getElementById('taskPriorityFilter')?.value||'';

  document.querySelectorAll('#taskTable tbody tr').forEach(row=>{

    const matchSearch=row.dataset.search.includes(search);

    let matchStatus=true;

    if(status==='Overdue'){
      matchStatus=row.dataset.overdue==='true';
    }else if(status){
      matchStatus=row.dataset.status===status;
    }

    const matchPriority=!priority || row.dataset.priority===priority;

    row.style.display=matchSearch&&matchStatus&&matchPriority?'':'none';
  });
}

function saveTask(id){

  const arr=get('logs');

  const data={
    title:document.getElementById('taskTitle').value.trim(),
    staffId:document.getElementById('taskStaff').value,
    assignedBy:'admin',
    workDate:document.getElementById('taskWorkDate').value,
    dueDate:document.getElementById('taskDueDate').value,
    dueTime:document.getElementById('taskDueTime').value,
    priority:document.getElementById('taskPriority').value,
    status:document.getElementById('taskStatus').value,
    description:document.getElementById('taskDescription').value.trim()
  };

  if(!data.title){
    toast('Please enter a task title','error');
    return;
  }

  if(id){
    const index=arr.findIndex(t=>t.id===id);

    if(index>-1){
      const old=arr[index];
      arr[index]={...old,...data};
      set('logs',arr);

      addActivity('Task Updated',data.title,data.staffId);
      toast('Task updated','success');
    }
  }else{
    const task={
      id:uid('task'),
      ...data
    };

    arr.unshift(task);
    set('logs',arr);

    addNotification(
      data.staffId,
      'New task assigned',
      `You have been assigned: ${data.title}`,
      'task'
    );

    addActivity('Task Assigned',data.title,data.staffId);
    toast('Task assigned','success');
  }

  closeModal();
  showPage('tasks');
}

function deleteTask(id){

  const task=get('logs').find(t=>t.id===id);

  if(!task)return;

  if(!confirm(`Delete "${task.title}"?`))return;

  set('logs',get('logs').filter(t=>t.id!==id));
  addActivity('Task Deleted',task.title,task.staffId);

  toast('Task deleted','success');
  showPage('tasks');
}

function openTaskStatusModal(id){

  const task=get('logs').find(t=>t.id===id);

  if(!task)return;

  document.getElementById('modalRoot').innerHTML=`

        </div>

          </div>

              ${['Pending','In Progress','Completed'].map(x=>`
                <option ${task.status===x?'selected':''}>${x}</option>

function saveTaskStatus(id){

  const arr=get('logs');
  const index=arr.findIndex(t=>t.id===id);

  if(index<0)return;

  const old=arr[index];
  const status=document.getElementById('newTaskStatus').value;

  arr[index].status=status;
  set('logs',arr);

  if(status==='Completed'){
    addNotification(
      'admin',
      'Task completed',
      `${currentUser.name} completed: ${old.title}`,
      'task'
    );
  }

  addActivity(
    'Task Status Updated',
    `${old.title} → ${status}`,
    currentUser.staffId
  );

  toast('Task status updated','success');
  closeModal();
  showPage('tasks');
}

              :emptyRow(isAdmin()?5:4,'No attendance records')
            }
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function clockIn(){

  const arr=get('attendance');
  let item=arr.find(a=>a.staffId===currentUser.staffId&&a.date===today());

  if(item?.clockIn){
    toast('Already clocked in','error');
    return;
  }

  if(!item){
    item={
      id:uid('att'),
      staffId:currentUser.staffId,
      date:today(),
      clockIn:nowTime(),
      clockOut:''
    };
    arr.unshift(item);
  }else{
    item.clockIn=nowTime();
  }

  set('attendance',arr);
  addActivity('Clock In',`Clocked in at ${item.clockIn}`,currentUser.staffId);
  toast('Clocked in successfully','success');

  showPage('attendance');
}

function clockOut(){

  const arr=get('attendance');
  const item=arr.find(a=>a.staffId===currentUser.staffId&&a.date===today());

  if(!item?.clockIn){
    toast('Please clock in first','error');
    return;
  }

  if(item.clockOut){
    toast('Already clocked out','error');
    return;
  }

  item.clockOut=nowTime();
  set('attendance',arr);

  addActivity('Clock Out',`Clocked out at ${item.clockOut}`,currentUser.staffId);
  toast('Clocked out successfully','success');

  showPage('attendance');
}

  item.reviewedAt=new Date().toISOString();

  set('leaves',arr);

  addNotification(
    item.staffId,
    `Leave ${status.toLowerCase()}`,
    `Your ${item.type} request has been ${status.toLowerCase()}.`,
    'leave'
  );

  addActivity('Leave Reviewed',`${item.type} → ${status}`,item.staffId);

  toast(`Leave ${status.toLowerCase()}`,'success');

}

  const code=document.getElementById('staffCode').value.trim();

  if(!code){

    return;
  }

  if(arr.some(s=>s.staffId===code&&s.id!==id)){
    toast('Staff code already exists','error');
    return;
  }

  const data={
    name:document.getElementById('staffName').value.trim(),
    username:document.getElementById('staffName').value.trim(),
    staffId:code,
    department:document.getElementById('staffDepartment').value.trim(),
    position:document.getElementById('staffPosition').value.trim(),
    status:document.getElementById('staffStatus').value,
    joiningDate:document.getElementById('staffJoining').value,
    email:document.getElementById('staffEmail').value.trim(),
    phone:document.getElementById('staffPhone').value.trim()
  };

  if(!data.name){
    toast('Name is required','error');
    return;
  }

  if(id){
    const i=arr.findIndex(s=>s.id===id);

    if(i>-1)arr[i]={...arr[i],...data};
    addActivity('Staff Updated',data.name,id);
  }else{
    const item={
      id:uid('staff'),
      ...data
    };

    arr.push(item);
    addActivity('Staff Added',data.name,item.id);
  }

  set('staff',arr);

  toast('Staff saved','success');
  closeModal();
  showPage('staff');
}

function uploadPhoto(event){

  const file=event.target.files[0];

  if(!file)return;

  if(file.size>2*1024*1024){
    toast('Photo must be below 2MB','error');
    return;
  }

  const reader=new FileReader();

  reader.onload=()=>{
    const s=currentStaff();

    savePhoto(s.staffId,reader.result);

    addActivity('Profile Photo Updated','Profile photo updated',s.id);

    toast('Profile photo updated','success');
    startApp();
    showPage('profile');
  };

  reader.readAsDataURL(file);
}

function downloadCSV(filename,rows){

  if(!rows.length){
    toast('No data to export','error');
    return;
  }

  const headers=Object.keys(rows[0]);

  const csv=[
    headers.join(','),
    ...rows.map(row=>
      headers.map(h=>{
        const value=String(row[h]??'').replaceAll('"','""');
        return `"${value}"`;
      }).join(',')
    )
  ].join('\n');

  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);

  const a=document.createElement('a');
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);
}
