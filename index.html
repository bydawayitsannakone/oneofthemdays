<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nona Costex Staff Portal</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Helvetica,Arial,sans-serif;
  background:#f4f4f1;
  color:#252723;
}

button,input,select,textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   LOGIN
========================= */

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:#ecece7;
}

.login-card{
  width:100%;
  max-width:420px;
  background:#fff;
  border:1px solid #deded7;
  border-radius:22px;
  padding:38px;
  box-shadow:0 15px 45px rgba(0,0,0,.06);
}

.login-logo{
  width:58px;
  height:58px;
  border-radius:16px;
  background:#34382f;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:21px;
  margin-bottom:22px;
}

.login-card h1{
  font-size:25px;
  margin-bottom:7px;
}

.login-card p{
  color:#777a72;
  font-size:14px;
  margin-bottom:28px;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:7px;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  border:1px solid #d9dad3;
  border-radius:10px;
  padding:12px 13px;
  outline:none;
  background:#fff;
  color:#252723;
}

.form-group textarea{
  min-height:90px;
  resize:vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
  border-color:#777c6e;
}

.login-btn{
  width:100%;
  padding:13px;
  border:0;
  border-radius:11px;
  background:#34382f;
  color:white;
  font-weight:600;
  margin-top:5px;
}

.demo-login{
  margin-top:18px;
  padding:12px;
  background:#f4f4f1;
  border-radius:10px;
  font-size:12px;
  color:#777;
  line-height:1.7;
}

/* =========================
   APP
========================= */

.app{
  min-height:100vh;
}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:240px;
  background:#30342c;
  color:#fff;
  padding:25px 15px;
  z-index:50;
  overflow-y:auto;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  padding:0 10px;
  margin-bottom:32px;
}

.brand-icon{
  width:40px;
  height:40px;
  border-radius:11px;
  background:#fff;
  color:#30342c;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
}

.brand-text strong{
  display:block;
  font-size:14px;
}

.brand-text span{
  display:block;
  font-size:10px;
  opacity:.6;
  margin-top:2px;
}

.nav-title{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:#999d94;
  padding:0 12px;
  margin:18px 0 8px;
}

.nav-item{
  width:100%;
  border:0;
  background:transparent;
  color:#d9dbd4;
  padding:11px 12px;
  border-radius:9px;
  text-align:left;
  font-size:13px;
  margin-bottom:3px;
}

.nav-item:hover,
.nav-item.active{
  background:#454a40;
  color:#fff;
}

.sidebar-bottom{
  margin-top:30px;
  border-top:1px solid #4b5048;
  padding-top:16px;
}

.user-mini{
  padding:10px 12px;
  margin-bottom:10px;
}

.user-mini strong{
  display:block;
  font-size:13px;
}

.user-mini span{
  font-size:11px;
  color:#aeb1a9;
}

.logout-btn{
  width:100%;
  padding:10px 12px;
  border:1px solid #555a51;
  background:transparent;
  color:#ddd;
  border-radius:9px;
  text-align:left;
  font-size:12px;
}

.main{
  margin-left:240px;
  min-height:100vh;
}

.topbar{
  height:72px;
  background:#fff;
  border-bottom:1px solid #e1e1dc;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  position:sticky;
  top:0;
  z-index:30;
}

.page-title{
  font-size:19px;
  font-weight:700;
}

.page-subtitle{
  font-size:12px;
  color:#898b84;
  margin-top:3px;
}

.mobile-menu{
  display:none;
  border:0;
  background:#f0f0eb;
  width:38px;
  height:38px;
  border-radius:9px;
}

.content{
  padding:28px 30px 45px;
  max-width:1500px;
}

/* =========================
   CARDS
========================= */

.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:25px;
}

.stat-card{
  background:#fff;
  border:1px solid #e2e2dc;
  border-radius:15px;
  padding:20px;
}

.stat-label{
  font-size:12px;
  color:#85877f;
  margin-bottom:10px;
}

.stat-value{
  font-size:27px;
  font-weight:700;
}

.stat-small{
  margin-top:6px;
  font-size:11px;
  color:#999;
}

.section-card{
  background:#fff;
  border:1px solid #e2e2dc;
  border-radius:15px;
  margin-bottom:20px;
  overflow:hidden;
}

.section-header{
  padding:18px 20px;
  border-bottom:1px solid #ecece7;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.section-header h3{
  font-size:15px;
}

.section-header p{
  font-size:11px;
  color:#999;
  margin-top:4px;
}

.section-body{
  padding:20px;
}

.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.grid-3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

/* =========================
   BUTTONS
========================= */

.btn{
  border:0;
  border-radius:9px;
  padding:9px 13px;
  font-size:12px;
  font-weight:600;
}

.btn-primary{
  background:#34382f;
  color:#fff;
}

.btn-secondary{
  background:#efefe9;
  color:#34382f;
}

.btn-danger{
  background:#f5e8e6;
  color:#9b4439;
}

.btn-success{
  background:#e6efe6;
  color:#456047;
}

.btn-small{
  padding:7px 10px;
  font-size:11px;
}

/* =========================
   TABLE
========================= */

.table-wrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th{
  text-align:left;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.5px;
  color:#8b8d86;
  padding:11px 12px;
  background:#f8f8f5;
  border-bottom:1px solid #e5e5df;
}

td{
  padding:13px 12px;
  font-size:12px;
  border-bottom:1px solid #eeeeea;
  vertical-align:middle;
}

tr:hover td{
  background:#fafaf7;
}

.actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

/* =========================
   BADGES
========================= */

.badge{
  display:inline-flex;
  align-items:center;
  border-radius:30px;
  padding:5px 9px;
  font-size:10px;
  font-weight:600;
}

.badge-completed{
  background:#e6efe6;
  color:#48634b;
}

.badge-progress{
  background:#eeece1;
  color:#776f45;
}

.badge-pending{
  background:#efefef;
  color:#707070;
}

.badge-overdue{
  background:#f4e3e1;
  color:#99473d;
}

.badge-active{
  background:#e6efe6;
  color:#48634b;
}

.badge-inactive{
  background:#efefef;
  color:#777;
}

.badge-approved{
  background:#e6efe6;
  color:#48634b;
}

.badge-rejected{
  background:#f4e3e1;
  color:#99473d;
}

.badge-pending-leave{
  background:#eeece1;
  color:#776f45;
}

/* =========================
   PROGRESS
========================= */

.progress-wrap{
  margin-top:9px;
}

.progress-track{
  height:8px;
  background:#e8e8e3;
  border-radius:20px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  background:#69705f;
  border-radius:20px;
}

.progress-info{
  display:flex;
  justify-content:space-between;
  font-size:10px;
  color:#888;
  margin-top:5px;
}

/* =========================
   FILTER
========================= */

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.filters input,
.filters select{
  border:1px solid #ddd;
  border-radius:8px;
  padding:9px 10px;
  font-size:11px;
  background:#fff;
  min-width:150px;
}

/* =========================
   PROFILE
========================= */

.profile-head{
  display:flex;
  gap:20px;
  align-items:center;
}

.avatar{
  width:78px;
  height:78px;
  border-radius:50%;
  background:#dfe1d9;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:25px;
  font-weight:700;
  color:#5b6054;
  flex-shrink:0;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-name{
  font-size:20px;
  font-weight:700;
}

.profile-role{
  font-size:12px;
  color:#888;
  margin-top:4px;
}

.info-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.info-item{
  background:#f7f7f3;
  padding:12px;
  border-radius:9px;
}

.info-item label{
  display:block;
  font-size:10px;
  color:#999;
  margin-bottom:4px;
}

.info-item span{
  font-size:12px;
}

/* =========================
   EMPTY
========================= */

.empty{
  padding:35px 15px;
  text-align:center;
  color:#999;
}

.empty-icon{
  font-size:28px;
  margin-bottom:10px;
}

.empty strong{
  display:block;
  color:#666;
  font-size:13px;
  margin-bottom:5px;
}

.empty span{
  font-size:11px;
}

/* =========================
   MODAL
========================= */

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(25,27,23,.45);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal{
  width:100%;
  max-width:620px;
  max-height:90vh;
  overflow-y:auto;
  background:#fff;
  border-radius:17px;
  box-shadow:0 25px 70px rgba(0,0,0,.2);
}

.modal-header{
  padding:18px 20px;
  border-bottom:1px solid #e7e7e1;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-header h3{
  font-size:16px;
}

.close-btn{
  border:0;
  background:#f1f1ec;
  width:32px;
  height:32px;
  border-radius:8px;
}

.modal-body{
  padding:20px;
}

.modal-footer{
  padding:15px 20px;
  border-top:1px solid #e7e7e1;
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

/* =========================
   ANALYTICS
========================= */

.analytics-number{
  font-size:28px;
  font-weight:700;
}

.chart{
  height:230px;
  display:flex;
  align-items:flex-end;
  gap:10px;
  padding:20px 10px 5px;
}

.bar-wrap{
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  gap:5px;
}

.bar{
  width:100%;
  max-width:42px;
  min-height:3px;
  background:#707666;
  border-radius:6px 6px 0 0;
}

.bar-label{
  font-size:9px;
  color:#999;
}

.bar-value{
  font-size:9px;
  color:#666;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  right:22px;
  bottom:22px;
  background:#30342c;
  color:#fff;
  padding:12px 16px;
  border-radius:10px;
  font-size:12px;
  z-index:200;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
  animation:slideIn .2s ease;
}

@keyframes slideIn{
  from{
    transform:translateY(15px);
    opacity:0;
  }
  to{
    transform:translateY(0);
    opacity:1;
  }
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
  }

  .mobile-menu{
    display:block;
  }

  .topbar{
    padding:0 18px;
  }

  .content{
    padding:20px 16px 35px;
  }

  .stats-grid{
    grid-template-columns:1fr 1fr;
  }

  .grid-2,
  .grid-3{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .info-list{
    grid-template-columns:1fr;
  }
}

@media(max-width:550px){

  .login-card{
    padding:27px;
  }

  .stats-grid{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .stat-card{
    padding:15px;
  }

  .stat-value{
    font-size:22px;
  }

  .section-header{
    align-items:flex-start;
    flex-direction:column;
  }

  .filters{
    width:100%;
  }

  .filters input,
  .filters select{
    width:100%;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

/* =========================================================
   STORAGE
========================================================= */

const KEYS = {
  logs:"nona_logs",
  leaves:"nona_leaves",
  attendance:"nona_attendance",
  staff:"nona_staff",
  schedules:"nona_schedules",
  announcements:"nona_announcements"
};

let currentUser = null;
let currentPage = "dashboard";

function getData(key){
  try{
    return JSON.parse(localStorage.getItem(key)) || [];
  }catch(e){
    return [];
  }
}

function saveData(key,data){
  localStorage.setItem(key,JSON.stringify(data));
}

function uid(prefix="id"){
  return prefix+"_"+Date.now()+"_"+Math.random().toString(36).substring(2,8);
}

/* =========================================================
   INITIAL DATA + MIGRATION
========================================================= */

function initData(){

  if(!localStorage.getItem(KEYS.staff)){

    saveData(KEYS.staff,[
      {
        id:"staff1",
        name:"Atikah",
        code:"NC001",
        department:"Digital",
        position:"Live Host Online & Offline",
        status:"Active",
        joining:"2026-09-02",
        email:"",
        phone:""
      },
      {
        id:"staff2",
        name:"Temporary Staff 1",
        code:"NC002",
        department:"Digital",
        position:"Temporary Staff",
        status:"Active",
        joining:"2026-09-01",
        email:"",
        phone:""
      },
      {
        id:"staff3",
        name:"Temporary Staff 2",
        code:"NC003",
        department:"Digital",
        position:"Temporary Staff",
        status:"Active",
        joining:"2026-09-01",
        email:"",
        phone:""
      }
    ]);

  }else{

    /* Make sure Atikah exists even if old V8 data is being used */

    let staff = getData(KEYS.staff);

    let atikah = staff.find(
      s => String(s.code||"").trim().toUpperCase()==="NC001"
    );

    if(!atikah){

      staff.push({
        id:"staff1",
        name:"Atikah",
        code:"NC001",
        department:"Digital",
        position:"Live Host Online & Offline",
        status:"Active",
        joining:"2026-09-02",
        email:"",
        phone:""
      });

      saveData(KEYS.staff,staff);
    }
  }


  if(!localStorage.getItem(KEYS.logs)){

    saveData(KEYS.logs,[

      {
        id:uid("log"),
        staffId:"staff1",
        title:"Budget quotation completed and presented to team",
        date:"2026-09-07",
        startTime:"",
        endTime:"",
        dueDate:"2026-09-07",
        dueTime:"18:00",
        priority:"High",
        status:"Completed",
        description:"Completed budget quotation, presented it to the team and conducted Flite product shooting."
      },

      {
        id:uid("log"),
        staffId:"staff1",
        title:"Product shooting and content brainstorming",
        date:"2026-09-08",
        startTime:"",
        endTime:"",
        dueDate:"2026-09-08",
        dueTime:"18:00",
        priority:"Medium",
        status:"Completed",
        description:"Continued product shooting and brainstormed social media content ideas."
      },

      {
        id:uid("log"),
        staffId:"staff1",
        title:"Live setup quotation and social media shooting",
        date:"2026-09-09",
        startTime:"",
        endTime:"",
        dueDate:"2026-09-09",
        dueTime:"18:00",
        priority:"High",
        status:"Completed",
        description:"Presented budget quotation for live setup and shot social media content."
      },

      {
        id:uid("log"),
        staffId:"staff1",
        title:"Content shooting and video editing",
        date:"2026-09-10",
        startTime:"",
        endTime:"",
        dueDate:"2026-09-10",
        dueTime:"18:00",
        priority:"Medium",
        status:"Completed",
        description:"Conducted content shooting and edited video content."
      }

    ]);
  }


  if(!localStorage.getItem(KEYS.leaves)){
    saveData(KEYS.leaves,[]);
  }


  if(!localStorage.getItem(KEYS.attendance)){
    saveData(KEYS.attendance,[]);
  }


  if(!localStorage.getItem(KEYS.schedules)){

    saveData(KEYS.schedules,[

      {
        id:uid("sch"),
        title:"Content Planning",
        date:"2026-09-15",
        time:"10:00",
        location:"Office"
      },

      {
        id:uid("sch"),
        title:"Product Shooting",
        date:"2026-09-16",
        time:"11:00",
        location:"Studio"
      },

      {
        id:uid("sch"),
        title:"Video Editing",
        date:"2026-09-17",
        time:"14:00",
        location:"Office"
      }

    ]);
  }


  if(!localStorage.getItem(KEYS.announcements)){

    saveData(KEYS.announcements,[

      {
        id:uid("ann"),
        title:"Welcome to Nona Costex Staff Portal",
        message:"Please use the portal to manage your daily work, attendance and schedule.",
        date:"2026-09-02"
      },

      {
        id:uid("ann"),
        title:"Digital Team Content Planning",
        message:"Remember to update your work progress and content planning regularly.",
        date:"2026-09-09"
      }

    ]);
  }
}

/* =========================================================
   LOGIN
========================================================= */

function renderLogin(){

  document.getElementById("app").innerHTML=`

    <div class="login-page">

      <div class="login-card">

        <div class="login-logo">NC</div>

        <h1>Nona Costex</h1>

        <p>Staff Portal</p>

        <form onsubmit="handleLogin(event)">

          <div class="form-group">

            <label>Username</label>

            <input
              id="loginUsername"
              type="text"
              placeholder="Enter username"
              autocomplete="username"
              required
            >

          </div>

          <div class="form-group">

            <label>Password / Staff Code</label>

            <input
              id="loginPassword"
              type="password"
              placeholder="Enter password or staff code"
              autocomplete="current-password"
              required
            >

          </div>

          <button class="login-btn" type="submit">
            Login
          </button>

        </form>

        <div class="demo-login">
          <strong>Demo Login</strong><br>
          Staff: Atikah / NC001<br>
          Admin: Admin / ADMIN001
        </div>

      </div>

    </div>
  `;
}


function handleLogin(e){

  e.preventDefault();

  const username =
    document.getElementById("loginUsername").value.trim();

  const password =
    document.getElementById("loginPassword").value.trim();

  login(username,password);
}


/* =========================================================
   FIXED LOGIN
========================================================= */

function login(username,password){

  username = String(username || "").trim();
  password = String(password || "").trim();

  /* =========================
     ADMIN
  ========================= */

  if(
    username.toLowerCase() === "admin" &&
    password.toUpperCase() === "ADMIN001"
  ){

    currentUser = {
      role:"admin",
      name:"Admin",
      code:"ADMIN001"
    };

    currentPage = "dashboard";

    renderApp();

    return;
  }


  /* =========================
     STAFF
  ========================= */

  let staffList = getData(KEYS.staff);

  let staff = staffList.find(s => {

    const name =
      String(s.name || "").trim().toLowerCase();

    const code =
      String(s.code || "").trim().toUpperCase();

    return(
      name === username.toLowerCase() &&
      code === password.toUpperCase()
    );

  });


  /* =========================
     FALLBACK ATIKAH
  ========================= */

  if(
    !staff &&
    username.toLowerCase() === "atikah" &&
    password.toUpperCase() === "NC001"
  ){

    staff = staffList.find(s =>
      String(s.code || "").trim().toUpperCase() === "NC001"
    );

    if(!staff){

      staff = {
        id:"staff1",
        name:"Atikah",
        code:"NC001",
        department:"Digital",
        position:"Live Host Online & Offline",
        status:"Active",
        joining:"2026-09-02",
        email:"",
        phone:""
      };

      staffList.push(staff);

      saveData(KEYS.staff,staffList);
    }
  }


  /* =========================
     SUCCESS
  ========================= */

  if(staff){

    currentUser = {
      role:"staff",
      id:staff.id,
      name:staff.name,
      code:staff.code
    };

    currentPage = "dashboard";

    renderApp();

    return;
  }


  showToast("Invalid username or password");
}

function buildMonthlyChart(month){

  const logs = getData(KEYS.logs)
    .filter(l=>String(l.date).startsWith(month));

  const days = {};

  logs.forEach(l=>{
    const day = Number(String(l.date).slice(8,10));
    days[day]=(days[day]||0)+1;
  });

  const max =
    Math.max(...Object.values(days),1);

  let html=`<div class="chart">`;

  for(let i=1;i<=31;i++){

    const value=days[i]||0;

    const height =
      value
      ? Math.max(8,(value/max)*170)
      : 3;

    html+=`

      <div class="bar-wrap">

        <span class="bar-value">
          ${value||""}
        </span>

        <div
          class="bar"
          style="height:${height}px;"
        ></div>

        <span class="bar-label">
          ${i}
        </span>

      </div>

    `;
  }

  html+=`</div>`;

  return html;
}


function monthOptions(){

  const now = new Date();

  let html="";

  for(let i=0;i<12;i++){

    const d = new Date(
      now.getFullYear(),
      now.getMonth()-i,
      1
    );

    const value =
      d.getFullYear()+"-"+
      String(d.getMonth()+1).padStart(2,"0");

    html+=`
      <option value="${value}">
        ${d.toLocaleString("en",{month:"long",year:"numeric"})}
      </option>
    `;
  }

  return html;
}

function filterLogs(){

    (document.getElementById("logSearch")?.value||"")

    document.getElementById("logStatusFilter")?.value||"";

  const priority =
    document.getElementById("logPriorityFilter")?.value||"";

  logs=logs.filter(l=>{

    const matchSearch =
      String(l.title||"").toLowerCase().includes(search) ||
      String(l.description||"").toLowerCase().includes(search);

    const matchStatus =
      !status || l.status===status;

    const matchPriority =
      !priority || l.priority===priority;

    return matchSearch && matchStatus && matchPriority;
  });

  const box=document.getElementById("logsTable");

  if(!box)return;

  if(!logs.length){

    box.innerHTML=emptyState("No matching work logs");

    return;

  const isAdmin=currentUser.role==="admin";

function saveLog(e,id){

  e.preventDefault();

  let logs=getData(KEYS.logs);

  const existing=id
    ? logs.find(l=>l.id===id)
    : null;

  const data={

    id:id || uid("log"),

    staffId:
      existing?.staffId ||
      currentUser.id,

    title:
      document.getElementById("logTitle").value.trim(),

    date:
      document.getElementById("logDate").value,

    startTime:
      document.getElementById("logStart").value,

    endTime:
      document.getElementById("logEnd").value,

    dueDate:
      document.getElementById("logDueDate").value,

    dueTime:
      document.getElementById("logDueTime").value,

    priority:
      document.getElementById("logPriority").value,

    status:
      document.getElementById("logStatus").value,

    description:
      document.getElementById("logDescription").value.trim()

  };

  if(id){

    logs=logs.map(l=>l.id===id ? data : l);

  }else{

    logs.push(data);

  }

  saveData(KEYS.logs,logs);

  closeModal();

  showToast(id ? "Work log updated" : "Work log added");

  renderApp();
}


function deleteLog(id){

  if(!confirm("Delete this work log?"))return;

  let logs=getData(KEYS.logs);

  logs=logs.filter(l=>l.id!==id);

  saveData(KEYS.logs,logs);

  showToast("Work log deleted");

  renderApp();
}

function renderAttendanceWidget(){

  const todayDate=today();

  let data=getData(KEYS.attendance);

  let record=data.find(
    a=>
      a.staffId===currentUser.id &&
      a.date===todayDate
  );

  if(!record){

    return `

      <div style="text-align:center;padding:15px;">

        <div style="font-size:13px;color:#888;margin-bottom:15px;">
          You have not clocked in today.
        </div>

        <button
          class="btn btn-primary"
          onclick="clockIn()"
        >
          Clock In
        </button>

      </div>

    `;
  }


  return `

    <div style="display:flex;justify-content:space-between;align-items:center;gap:20px;">

      <div>

        <div style="font-size:12px;color:#999;">
          Clock In
        </div>

        <div style="font-size:24px;font-weight:700;margin-top:4px;">
          ${record.clockIn||"-"}
        </div>

      </div>


      <div>

        <div style="font-size:12px;color:#999;">
          Clock Out
        </div>

        <div style="font-size:24px;font-weight:700;margin-top:4px;">
          ${record.clockOut||"-"}
        </div>

      </div>


      ${
        record.clockOut
        ? badge("Completed","approved")
        : `
          <button
            class="btn btn-primary"
            onclick="clockOut()"
          >
            Clock Out
          </button>
        `
      }

    </div>

  `;
}


function clockIn(){

  const date=today();

  let data=getData(KEYS.attendance);

  let record=data.find(
    a=>
      a.staffId===currentUser.id &&
      a.date===date
  );

  if(record){

    showToast("Already clocked in");

    return;
  }

  const now=new Date();

  data.push({

    id:uid("att"),
    staffId:currentUser.id,
    date:date,
    clockIn:timeNow(),
    clockOut:""

  });

  saveData(KEYS.attendance,data);

  showToast("Clocked in successfully");

  renderApp();
}


function clockOut(){

  const date=today();

  let data=getData(KEYS.attendance);

  const record=data.find(
    a=>
      a.staffId===currentUser.id &&
      a.date===date
  );

  if(!record){

    showToast("Please clock in first");

    return;
  }

  if(record.clockOut){

    showToast("Already clocked out");

    return;
  }

  record.clockOut=timeNow();

  saveData(KEYS.attendance,data);

  showToast("Clocked out successfully");

  renderApp();
}

function filterStaff(){

    (document.getElementById("staffSearch")?.value||"")

  staff=staff.filter(s=>{

    const text=
      `${s.name} ${s.code} ${s.position} ${s.department}`
      .toLowerCase();

    return(
      text.includes(search) &&
      (!department || s.department===department)
    );

  });

  const box=document.getElementById("staffTable");

  if(box){
    box.innerHTML=staffTable(staff);
  }
}

    renderApp();

/* =========================================================
   STATS
========================================================= */

function getStats(staffId){

  const logs=getData(KEYS.logs)
    .filter(l=>l.staffId===staffId);

  const total=logs.length;

  const completed=
    logs.filter(l=>l.status==="Completed").length;

  const inProgress=
    logs.filter(l=>l.status==="In Progress").length;

  const pending=
    logs.filter(l=>l.status==="Pending").length;

  const overdue=
    logs.filter(isOverdue).length;

  const rate=
    total
    ? Math.round(completed/total*100)
    : 0;

  return{
    total,
    completed,
    inProgress,
    pending,
    overdue,
    rate
  };
}


function isOverdue(log){

  if(!log || log.status==="Completed"){
    return false;
  }

  if(!log.dueDate){
    return false;
  }

  const due =
    log.dueDate+
    "T"+
    (log.dueTime || "23:59");

  return new Date(due) < new Date();
}

function statusBadge(status,overdue=false){

  if(overdue){

    return badge("Overdue","overdue");

  }

  if(status==="Completed"){

    return badge("Completed","completed");

  }

  if(status==="In Progress"){

    return badge("In Progress","progress");

  }

  return badge("Pending","pending");
}


function leaveBadge(status){

  if(status==="Approved"){
    return badge("Approved","approved");
  }

  if(status==="Rejected"){
    return badge("Rejected","rejected");
  }

  return badge("Pending","pending-leave");
}


function priorityBadge(priority){

  if(priority==="High"){
    return badge("High","overdue");
  }

  if(priority==="Medium"){
    return badge("Medium","progress");
  }

  return badge("Low","pending");
}

function downloadCSV(rows,filename){

  const csv=rows.map(row=>
    row.map(value=>
      `"${String(value??"").replace(/"/g,'""')}"`
    ).join(",")
  ).join("\n");

  const blob=
    new Blob([csv],{type:"text/csv;charset=utf-8;"});

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;
  a.download=filename;

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

  showToast("CSV exported");
}


/* =========================================================
   GENERAL HELPERS
========================================================= */

function today(){

  const d=new Date();

  return d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0");

}


function timeNow(){

  const d=new Date();

  return String(d.getHours()).padStart(2,"0")+
    ":"+
    String(d.getMinutes()).padStart(2,"0");

}


function formatDate(date){

  if(!date)return "-";

  const d=new Date(date+"T00:00:00");

  if(isNaN(d.getTime()))return date;

  return d.toLocaleDateString("en-GB",{
    day:"2-digit",
    month:"short",
    year:"numeric"
  });

}


function escapeHtml(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return escapeHtml(value);

}


function toggleSidebar(){

  const sidebar=document.getElementById("sidebar");

  if(sidebar){
    sidebar.classList.toggle("open");
  }

}


function logout(){

  currentUser=null;

  renderLogin();

}


function showToast(message){

  const old=document.querySelector(".toast");

  if(old)old.remove();

  const toast=document.createElement("div");

  toast.className="toast";

  toast.textContent=message;

  document.body.appendChild(toast);

  setTimeout(()=>{

    toast.remove();

  },2500);

}
