<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nona Costex Staff Portal</title>

<style>
:root{
  --bg:#f5f5f1;
  --surface:#ffffff;
  --surface-2:#f0f1eb;
  --sidebar:#252923;
  --sidebar-soft:#30352d;
  --text:#252823;
  --muted:#777b73;
  --border:#e2e4dc;
  --accent:#737c61;
  --accent-dark:#596148;
  --success:#5d8068;
  --warning:#a9824d;
  --danger:#a35e5e;
  --info:#657d8f;
  --shadow:0 8px 25px rgba(30,35,28,.06);
  --radius:16px;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input,
select,
textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* LOGIN */

.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at top left,#e8eadf,transparent 35%),
    var(--bg);
}

.login-card{
  width:100%;
  max-width:430px;
  background:var(--surface);
  padding:38px;
  border-radius:22px;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
}

.logo-mark{
  width:48px;
  height:48px;
  border-radius:14px;
  background:var(--sidebar);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  margin-bottom:20px;
}

.login-card h1{
  margin:0 0 8px;
  font-size:27px;
}

.login-card p{
  color:var(--muted);
  margin:0 0 28px;
}

.form-group{
  margin-bottom:17px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:7px;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  border:1px solid var(--border);
  background:#fff;
  padding:12px 13px;
  border-radius:10px;
  outline:none;
  font-size:14px;
}

.form-group textarea{
  min-height:100px;
  resize:vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
  border-color:var(--accent);
}

.login-btn{
  width:100%;
  border:0;
  padding:13px;
  border-radius:11px;
  background:var(--sidebar);
  color:white;
  font-weight:600;
  margin-top:4px;
}

.login-demo{
  margin-top:18px;
  padding:13px;
  background:var(--surface-2);
  border-radius:11px;
  font-size:12px;
  color:var(--muted);
  line-height:1.6;
}

/* APP */

.app{
  min-height:100vh;
}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:245px;
  background:var(--sidebar);
  color:white;
  padding:22px 15px;
  z-index:100;
  overflow-y:auto;
}

.brand{
  padding:7px 12px 25px;
}

.brand-name{
  font-size:17px;
  font-weight:700;
}

.brand-sub{
  color:#aeb4aa;
  font-size:11px;
  margin-top:4px;
}

.nav-section{
  color:#8e958a;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
  margin:17px 12px 7px;
}

.nav-item{
  width:100%;
  border:0;
  background:transparent;
  color:#c7cbc3;
  padding:10px 12px;
  border-radius:9px;
  text-align:left;
  margin-bottom:3px;
  font-size:13px;
  display:flex;
  align-items:center;
  gap:10px;
}

.nav-item:hover{
  background:var(--sidebar-soft);
  color:white;
}

.nav-item.active{
  background:#3a4036;
  color:white;
}

.nav-icon{
  width:20px;
  text-align:center;
}

.nav-badge{
  margin-left:auto;
  background:#8b665e;
  color:white;
  min-width:19px;
  height:19px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
}

.logout-btn{
  margin-top:25px;
  color:#d7a5a5;
}

.main{
  margin-left:245px;
  min-height:100vh;
}

.topbar{
  height:72px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:80;
}

.topbar-title{
  font-size:18px;
  font-weight:700;
}

.topbar-right{
  display:flex;
  align-items:center;
  gap:14px;
}

.notification-btn{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  background:white;
  border-radius:10px;
  position:relative;
  font-size:16px;
}

.notification-count{
  position:absolute;
  top:-4px;
  right:-4px;
  background:var(--danger);
  color:white;
  width:17px;
  height:17px;
  border-radius:50%;
  font-size:9px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.user-mini{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:12px;
}

.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  background:var(--surface-2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:700;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.mobile-menu{
  display:none;
  border:0;
  background:none;
  font-size:22px;
}

.content{
  padding:28px;
  max-width:1500px;
  margin:auto;
}

.page-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  margin-bottom:22px;
}

.page-head h2{
  margin:0;
  font-size:24px;
}

.page-head p{
  margin:6px 0 0;
  color:var(--muted);
  font-size:13px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid var(--border);
  background:white;
  color:var(--text);
  padding:10px 14px;
  border-radius:9px;
  font-size:12px;
  font-weight:600;
}

.btn:hover{
  background:var(--surface-2);
}

.btn.primary{
  background:var(--sidebar);
  color:white;
  border-color:var(--sidebar);
}

.btn.danger{
  color:white;
  background:var(--danger);
  border-color:var(--danger);
}

.btn.success{
  color:white;
  background:var(--success);
  border-color:var(--success);
}

.btn.small{
  padding:7px 10px;
  font-size:11px;
}

/* CARDS */

.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:20px;
}

.stat-card{
  background:white;
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:19px;
  box-shadow:var(--shadow);
}

.stat-label{
  color:var(--muted);
  font-size:12px;
}

.stat-number{
  font-size:28px;
  font-weight:700;
  margin-top:7px;
}

.stat-note{
  font-size:11px;
  color:var(--muted);
  margin-top:5px;
}

/* DASHBOARD */

.dashboard-grid{
  display:grid;
  grid-template-columns:1.5fr 1fr;
  gap:18px;
}

.card{
  background:white;
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
}

.card-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:15px;
}

.card-head h3{
  margin:0;
  font-size:15px;
}

.card-head span{
  font-size:11px;
  color:var(--muted);
}

/* TABLE */

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

th{
  text-align:left;
  padding:11px 10px;
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.4px;
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}

td{
  padding:12px 10px;
  border-bottom:1px solid #eeeeea;
  vertical-align:middle;
}

tr:hover td{
  background:#fafbf8;
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:5px 8px;
  border-radius:20px;
  font-size:10px;
  font-weight:700;
}

.badge.completed,
.badge.approved{
  background:#e6eee8;
  color:var(--success);
}

.badge.progress{
  background:#eef0e6;
  color:var(--accent-dark);
}

.badge.pending{
  background:#f3eee5;
  color:var(--warning);
}

.badge.rejected,
.badge.overdue{
  background:#f4e7e7;
  color:var(--danger);
}

.badge.info{
  background:#e7edf1;
  color:var(--info);
}

/* PROGRESS */

.progress{
  height:8px;
  background:#e9ebe4;
  border-radius:10px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  background:var(--accent);
  border-radius:10px;
}

/* FILTERS */

.filter-row{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.filter-row input,
.filter-row select{
  border:1px solid var(--border);
  padding:10px 11px;
  border-radius:9px;
  background:white;
  font-size:12px;
  outline:none;
}

/* CALENDAR */

.calendar-layout{
  display:grid;
  grid-template-columns:minmax(0,1.7fr) minmax(280px,.8fr);
  gap:18px;
}

.calendar-card{
  background:white;
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}

.calendar-header{
  padding:18px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
}

.calendar-month{
  display:flex;
  align-items:center;
  gap:10px;
}

.calendar-month h3{
  margin:0;
  font-size:18px;
  min-width:170px;
  text-align:center;
}

.month-btn{
  width:34px;
  height:34px;
  border:1px solid var(--border);
  background:white;
  border-radius:9px;
  font-size:15px;
}

.weekdays{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  background:#fafbf8;
  border-bottom:1px solid var(--border);
}

.weekdays div{
  padding:10px 4px;
  text-align:center;
  font-size:10px;
  font-weight:700;
  color:var(--muted);
  text-transform:uppercase;
}

.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
}

.calendar-day{
  min-height:105px;
  border-right:1px solid #eeeeea;
  border-bottom:1px solid #eeeeea;
  padding:8px;
  cursor:pointer;
  position:relative;
  background:white;
}

.calendar-day:nth-child(7n){
  border-right:0;
}

.calendar-day:hover{
  background:#fafbf8;
}

.calendar-day.other-month{
  background:#fafaf8;
  color:#b5b8b1;
}

.calendar-day.today{
  box-shadow:inset 0 0 0 2px var(--accent);
}

.calendar-day.selected{
  background:#f0f2eb;
}

.day-number{
  font-size:11px;
  font-weight:700;
  margin-bottom:7px;
}

.schedule-dot{
  display:block;
  background:#eef0e7;
  color:#5f684e;
  border-radius:6px;
  padding:4px 5px;
  margin-bottom:4px;
  font-size:9px;
  line-height:1.3;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.schedule-dot.completed{
  background:#e7eee9;
  color:#5d8068;
}

.schedule-dot.cancelled{
  background:#f3e6e6;
  color:#a35e5e;
}

.schedule-more{
  color:var(--muted);
  font-size:9px;
  padding:2px;
}

.selected-day-card{
  background:white;
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
  min-height:300px;
}

.selected-date{
  font-size:20px;
  font-weight:700;
  margin-bottom:5px;
}

.selected-date-sub{
  color:var(--muted);
  font-size:12px;
  margin-bottom:18px;
}

.schedule-item{
  border:1px solid var(--border);
  border-radius:12px;
  padding:13px;
  margin-bottom:10px;
}

.schedule-time{
  font-size:11px;
  font-weight:700;
  color:var(--accent-dark);
  margin-bottom:5px;
}

.schedule-title{
  font-size:13px;
  font-weight:700;
}

.schedule-meta{
  color:var(--muted);
  font-size:10px;
  margin-top:5px;
  line-height:1.5;
}

.schedule-actions{
  display:flex;
  gap:5px;
  margin-top:10px;
}

/* MODAL */

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(25,28,23,.5);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:500;
}

.modal{
  width:100%;
  max-width:560px;
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:18px;
  padding:23px;
  box-shadow:0 25px 70px rgba(0,0,0,.2);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.modal-head h3{
  margin:0;
  font-size:18px;
}

.close-btn{
  border:0;
  background:var(--surface-2);
  width:32px;
  height:32px;
  border-radius:9px;
}

.modal-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.modal-grid .full{
  grid-column:1/-1;
}

.modal-footer{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:20px;
}

/* NOTIFICATIONS */

.notification-panel{
  position:fixed;
  right:25px;
  top:65px;
  width:340px;
  max-width:calc(100vw - 30px);
  background:white;
  border:1px solid var(--border);
  border-radius:15px;
  box-shadow:0 20px 50px rgba(0,0,0,.14);
  z-index:300;
  overflow:hidden;
}

.notification-head{
  padding:15px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.notification-list{
  max-height:390px;
  overflow:auto;
}

.notification-item{
  padding:13px 15px;
  border-bottom:1px solid #eeeeea;
  cursor:pointer;
}

.notification-item:hover{
  background:#fafbf8;
}

.notification-item.unread{
  background:#f4f6ef;
}

.notification-title{
  font-size:12px;
  font-weight:700;
}

.notification-message{
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
  line-height:1.4;
}

.notification-time{
  font-size:9px;
  color:#a0a39d;
  margin-top:6px;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:35px 15px;
  color:var(--muted);
}

.empty-icon{
  font-size:30px;
  margin-bottom:9px;
}

.empty-title{
  color:var(--text);
  font-weight:700;
  font-size:13px;
}

.empty-text{
  font-size:11px;
  margin-top:5px;
}

/* TOAST */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:var(--sidebar);
  color:white;
  padding:12px 16px;
  border-radius:10px;
  font-size:12px;
  z-index:1000;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
  animation:toastIn .2s ease;
}

@keyframes toastIn{
  from{
    transform:translateY(10px);
    opacity:0;
  }
  to{
    transform:translateY(0);
    opacity:1;
  }
}

/* PROFILE */

.profile-card{
  display:flex;
  align-items:center;
  gap:20px;
  background:white;
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:22px;
  box-shadow:var(--shadow);
  margin-bottom:18px;
}

.profile-photo{
  width:80px;
  height:80px;
  border-radius:20px;
  background:var(--surface-2);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:22px;
  font-weight:700;
}

.profile-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-info h2{
  margin:0;
  font-size:20px;
}

.profile-info p{
  margin:5px 0;
  color:var(--muted);
  font-size:12px;
}

/* ANNOUNCEMENT */

.announcement{
  border:1px solid var(--border);
  border-radius:11px;
  padding:13px;
  margin-bottom:10px;
}

.announcement-title{
  font-weight:700;
  font-size:12px;
}

.announcement-message{
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
  margin-top:4px;
}

.announcement-date{
  font-size:9px;
  color:#999d95;
  margin-top:7px;
}

/* ANALYTICS */

.chart{
  display:flex;
  align-items:flex-end;
  gap:10px;
  height:220px;
  padding:20px 10px 5px;
  border-bottom:1px solid var(--border);
}

.bar-wrap{
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  gap:5px;
}

.bar{
  width:100%;
  max-width:40px;
  background:var(--accent);
  border-radius:7px 7px 2px 2px;
  min-height:3px;
}

.bar-label{
  font-size:9px;
  color:var(--muted);
}

.bar-value{
  font-size:9px;
  font-weight:700;
}

/* MOBILE */

@media(max-width:1050px){
  .stats-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .dashboard-grid,
  .calendar-layout{
    grid-template-columns:1fr;
  }
}

@media(max-width:800px){
  .sidebar{
    transform:translateX(-100%);
    transition:.2s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
  }

  .mobile-menu{
    display:block;
  }

  .topbar{
    padding:0 16px;
  }

  .content{
    padding:18px 14px;
  }

  .page-head{
    flex-direction:column;
  }

  .calendar-day{
    min-height:80px;
    padding:5px;
  }

  .schedule-dot{
    font-size:8px;
  }

  .calendar-month h3{
    min-width:125px;
    font-size:15px;
  }

  .modal-grid{
    grid-template-columns:1fr;
  }

  .modal-grid .full{
    grid-column:auto;
  }

  .profile-card{
    align-items:flex-start;
  }
}

@media(max-width:520px){
  .stats-grid{
    grid-template-columns:1fr 1fr;
    gap:9px;
  }

  .stat-card{
    padding:14px;
  }

  .stat-number{
    font-size:23px;
  }

  .topbar-title{
    font-size:15px;
  }

  .user-mini .user-name{
    display:none;
  }

  .calendar-day{
    min-height:64px;
  }

  .day-number{
    font-size:10px;
  }

  .schedule-dot{
    padding:3px;
    margin-bottom:2px;
  }

  .notification-panel{
    right:10px;
    top:60px;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<script>
/* =========================================================
   NONA COSTEX STAFF PORTAL
   V11 - CALENDAR + SCHEDULE UPGRADE
========================================================= */

const STORAGE = {
  logs: "nona_logs",
  leaves: "nona_leaves",
  attendance: "nona_attendance",
  staff: "nona_staff",
  schedules: "nona_schedules",
  announcements: "nona_announcements",
  notifications: "nona_notifications",
  activity: "nona_activity"
};

let currentUser = null;
let currentPage = "dashboard";
let calendarDate = new Date();
let selectedDate = new Date();
let notificationOpen = false;
let toastTimer = null;

/* =========================================================
   HELPERS
========================================================= */

function uid(prefix="id"){
  return prefix + "_" + Date.now() + "_" + Math.random().toString(36).slice(2,8);
}

function getData(key, fallback=[]){
  try{
    const data = JSON.parse(localStorage.getItem(key));
    return data ?? fallback;
  }catch(e){
    return fallback;
  }
}

function setData(key, data){
  localStorage.setItem(key, JSON.stringify(data));
}

function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function formatDate(dateStr){
  if(!dateStr) return "-";
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString("en-GB",{
    day:"2-digit",
    month:"short",
    year:"numeric"
  });
}

function formatLongDate(dateStr){
  if(!dateStr) return "-";
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString("en-GB",{
    weekday:"long",
    day:"numeric",
    month:"long",
    year:"numeric"
  });
}

function formatDateTime(value){
  if(!value) return "-";
  const d = new Date(value);
  return d.toLocaleString("en-GB",{
    day:"2-digit",
    month:"short",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}

function formatTime(time){
  if(!time) return "";
  const [h,m] = time.split(":");
  const d = new Date();
  d.setHours(Number(h),Number(m),0,0);
  return d.toLocaleTimeString("en-US",{
    hour:"numeric",
    minute:"2-digit"
  });
}

function initials(name){
  return String(name || "?")
    .split(" ")
    .map(x=>x[0])
    .join("")
    .slice(0,2)
    .toUpperCase();
}

function getCurrentStaff(){
  const staff = getData(STORAGE.staff,[]);
  return staff.find(s=>s.id===currentUser?.id || s.code===currentUser?.code) || currentUser;
}

function isAdmin(){

}

function showToast(message){
  clearTimeout(toastTimer);

  const old = document.querySelector(".toast");
  if(old) old.remove();

  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = message;
  document.body.appendChild(el);

  toastTimer = setTimeout(()=>{
    el.remove();
  },2800);
}

    worklogs:"Work Logs",

function getStats(staffId=null){
  const logs = getData(STORAGE.logs,[]);

  const filtered = staffId
    ? logs.filter(l=>l.staffId===staffId || l.staffCode===staffId)
    : logs;

  const total = filtered.length;
  const completed = filtered.filter(l=>l.status==="Completed").length;
  const progress = filtered.filter(l=>l.status==="In Progress").length;
  const pending = filtered.filter(l=>l.status==="Pending").length;

  const now = new Date();

  const overdue = filtered.filter(l=>{
    if(l.status==="Completed") return false;
    if(!l.dueDate) return false;

    const due = new Date(
      l.dueDate+"T"+(l.dueTime || "23:59")
    );

    return due < now;
  }).length;

  const rate = total ? Math.round((completed/total)*100) : 0;

  return {
    total,
    completed,
    progress,
    pending,
    overdue,
    rate
  };
}

function renderCalendar(){
  const title = document.getElementById("calendarMonthTitle");
  const grid = document.getElementById("calendarGrid");

  if(!title || !grid) return;

  title.textContent = calendarDate.toLocaleDateString("en-US",{
    month:"long",
    year:"numeric"
  });

  const year = calendarDate.getFullYear();
  const month = calendarDate.getMonth();

  const firstDay = new Date(year,month,1).getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const prevDays = new Date(year,month,0).getDate();

  const schedules = getVisibleSchedules();

  let html="";

  for(let i=0;i<42;i++){

    const dayIndex = i-firstDay+1;

    let dateObj;
    let day;
    let otherMonth=false;

    if(dayIndex<=0){
      day = prevDays + dayIndex;
      dateObj = new Date(year,month-1,day);
      otherMonth=true;
    }else if(dayIndex>daysInMonth){
      day = dayIndex-daysInMonth;
      dateObj = new Date(year,month+1,day);
      otherMonth=true;
    }else{
      day = dayIndex;
      dateObj = new Date(year,month,day);
    }

    const dateStr =
      dateObj.getFullYear()+"-"+
      String(dateObj.getMonth()+1).padStart(2,"0")+"-"+
      String(dateObj.getDate()).padStart(2,"0");

    const daySchedules = schedules
      .filter(s=>s.date===dateStr)
      .sort((a,b)=>
        (a.startTime||"").localeCompare(b.startTime||"")
      );

    const isToday = dateStr===todayISO();
    const isSelected = dateStr===dateToISO(selectedDate);

    html += `
      <div
        class="calendar-day
          ${otherMonth?"other-month":""}
          ${isToday?"today":""}
          ${isSelected?"selected":""}"
        onclick="selectCalendarDate('${dateStr}')"
      >

        <div class="day-number">${day}</div>

        ${
          daySchedules.slice(0,3).map(s=>`
            <div class="schedule-dot ${s.status==="Completed"?"completed":s.status==="Cancelled"?"cancelled":""}">
              ${s.startTime ? formatTime(s.startTime)+" · ":""}${esc(s.title)}
            </div>
          `).join("")
        }

        ${
          daySchedules.length>3
          ? `<div class="schedule-more">+${daySchedules.length-3} more</div>`
          :""
        }

      </div>
    `;
  }

  grid.innerHTML = html;
}

function dateToISO(d){
  return d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0");
}

function selectCalendarDate(dateStr){
  selectedDate = new Date(dateStr+"T00:00:00");

  const dateObj = new Date(dateStr+"T00:00:00");

  if(
    dateObj.getMonth()!==calendarDate.getMonth() ||
    dateObj.getFullYear()!==calendarDate.getFullYear()
  ){
    calendarDate = new Date(dateObj);
  }

  renderCalendar();
  renderSelectedDay();
}

function changeMonth(amount){
  calendarDate.setMonth(calendarDate.getMonth()+amount);

  selectedDate = new Date(
    calendarDate.getFullYear(),
    calendarDate.getMonth(),
    1
  );

  renderCalendar();
  renderSelectedDay();
}

function goToday(){
  const now = new Date();
  calendarDate = new Date(now);
  selectedDate = new Date(now);

  renderCalendar();
  renderSelectedDay();
}

function renderSelectedDay(){
  const box = document.getElementById("selectedDayCard");
  if(!box) return;

  const dateStr = dateToISO(selectedDate);

  const schedules = getVisibleSchedules()
    .filter(s=>s.date===dateStr)
    .sort((a,b)=>
      (a.startTime||"").localeCompare(b.startTime||"")
    );

  box.innerHTML = `
    <div class="selected-date">
      ${selectedDate.toLocaleDateString("en-US",{
        day:"numeric",
        month:"long"
      })}
    </div>

    <div class="selected-date-sub">
      ${selectedDate.toLocaleDateString("en-US",{
        weekday:"long",
        year:"numeric"
      })}
    </div>

    <button
      class="btn primary"
      style="width:100%;margin-bottom:15px;"
      onclick="openScheduleModal(null,'${dateStr}')"
    >
      + Add Schedule
    </button>

    ${
      schedules.length
      ? schedules.map(scheduleDetailHTML).join("")
      : emptyHTML("📅","No schedule","No schedule has been added for this date.")
    }
  `;
}

function scheduleDetailHTML(s){
  return `
    <div class="schedule-item">

      <div class="schedule-time">
        ${s.startTime ? formatTime(s.startTime):"No time"}
        ${s.endTime ? " - "+formatTime(s.endTime):""}
      </div>

      <div class="schedule-title">
        ${esc(s.title)}

      <div class="schedule-meta">

function saveSchedule(e,id=""){
  e.preventDefault();

  const schedules = getData(STORAGE.schedules,[]);
  const staff = getData(STORAGE.staff,[]);

  const staffId = document.getElementById("scheduleStaff").value;
  const selectedStaff = staff.find(s=>s.id===staffId);

  const data = {
    title:document.getElementById("scheduleTitle").value.trim(),
    date:document.getElementById("scheduleDate").value,
    startTime:document.getElementById("scheduleStart").value,
    endTime:document.getElementById("scheduleEnd").value,
    location:document.getElementById("scheduleLocation").value.trim(),
    staffId:selectedStaff?.id || "",
    staffName:selectedStaff?.name || "",
    status:document.getElementById("scheduleStatus").value,
    notes:document.getElementById("scheduleNotes").value.trim()
  };

  if(!data.title || !data.date){
    showToast("Please fill in the required fields.");
    return;
  }

  if(data.startTime && data.endTime && data.endTime < data.startTime){
    showToast("End time cannot be earlier than start time.");
    return;
  }

  if(id){
    const index = schedules.findIndex(s=>s.id===id);

    if(index>=0){
      schedules[index] = {
        ...schedules[index],
        ...data,
        updatedAt:new Date().toISOString()
      };
    }

    addActivity(
      "Schedule Updated",
      `Updated schedule "${data.title}" on ${formatDate(data.date)}.`
    );

    showToast("Schedule updated.");
  }else{

    const item = {
      id:uid("sch"),
      ...data,
      createdAt:new Date().toISOString()
    };

    schedules.push(item);

    addActivity(
      "Schedule Added",
      `Added "${data.title}" on ${formatDate(data.date)}${data.staffName?" for "+data.staffName:""}.`
    );

    if(data.staffId){
      addNotification(
        data.staffId,
        "New schedule",
        `${data.title} has been scheduled for ${formatDate(data.date)}${data.startTime?" at "+formatTime(data.startTime):""}.`,
        "schedule"
      );
    }

    showToast("Schedule added.");
  }

  setData(STORAGE.schedules,schedules);

  closeModal();

  renderSchedulePage();
  renderNotificationPanel();
}

function deleteSchedule(id){
  if(!isAdmin()) return;

  const schedules = getData(STORAGE.schedules,[]);
  const item = schedules.find(s=>s.id===id);

  if(!item) return;

  if(!confirm(`Delete "${item.title}"?`)) return;

  setData(
    STORAGE.schedules,
    schedules.filter(s=>s.id!==id)
  );

  addActivity(
    "Schedule Deleted",
    `Deleted schedule "${item.title}" on ${formatDate(item.date)}.`
  );

  showToast("Schedule deleted.");

  renderSchedulePage();
}

function filterLogs(){

  document.querySelectorAll("#logsTable tr").forEach(row=>{
    const matchesSearch =
      row.dataset.search.includes(search);

    const matchesStatus =
      !status || row.dataset.status===status;

    const matchesPriority =
      !priority || row.dataset.priority===priority;

    row.style.display =
      matchesSearch && matchesStatus && matchesPriority
      ? ""
      : "none";
  });
}

function clockIn(){
  const attendance = getData(STORAGE.attendance,[]);
  const date = todayISO();

  const existing = attendance.find(
    a=>a.staffId===currentUser.id && a.date===date
  );

  if(existing){
    showToast("You have already clocked in.");
    return;
  }

  const now = new Date();

  attendance.push({
    id:uid("att"),
    staffId:currentUser.id,
    staffName:currentUser.name,
    date,
    clockIn:now.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}),
    clockOut:""
  });

  setData(STORAGE.attendance,attendance);

  addActivity("Clock In","Clocked in for today.");

  showToast("Clocked in successfully.");
  renderAttendance();
}

function clockOut(){
  const attendance = getData(STORAGE.attendance,[]);
  const date = todayISO();

  const existing = attendance.find(
    a=>a.staffId===currentUser.id && a.date===date
  );

  if(!existing){
    showToast("Please clock in first.");
    return;
  }

  if(existing.clockOut){
    showToast("You have already clocked out.");
    return;
  }

  const now = new Date();

  existing.clockOut =
    now.toLocaleTimeString("en-US",{
      hour:"numeric",
      minute:"2-digit"
    });

  setData(STORAGE.attendance,attendance);

  addActivity("Clock Out","Clocked out for today.");

  showToast("Clocked out successfully.");
  renderAttendance();
}

  const leaves = getData(STORAGE.leaves,[]);
  const leave = leaves.find(l=>l.id===id);

  if(!leave) return;

  leave.status = status;
  leave.updatedAt = new Date().toISOString();

  setData(STORAGE.leaves,leaves);

  addActivity(
    "Leave Updated",
    `${leave.staffName}'s leave was ${status.toLowerCase()}.`
  );

  addNotification(
    leave.staffId,
    `Leave ${status}`,
    `Your ${leave.type} request from ${formatDate(leave.startDate)} to ${formatDate(leave.endDate)} has been ${status.toLowerCase()}.`,
    "leave"
  );

  showToast(`Leave ${status.toLowerCase()}.`);
  renderLeave();
  renderNotificationPanel();
}

function filterStaff(){
  const search = (document.getElementById("staffSearch")?.value||"").toLowerCase();

  document.querySelectorAll("#staffTable tr").forEach(row=>{

    const matchesDept = !dept || row.dataset.dept===dept;

  });

function saveStaff(e,id=""){
  e.preventDefault();

  const staff = getData(STORAGE.staff,[]);

  const data = {
    name:document.getElementById("staffName").value.trim(),
    code:document.getElementById("staffCode").value.trim().toUpperCase(),
    email:document.getElementById("staffEmail").value.trim(),
    phone:document.getElementById("staffPhone").value.trim(),
    department:document.getElementById("staffDepartment").value.trim(),
    position:document.getElementById("staffPosition").value.trim(),
    status:document.getElementById("staffStatus").value,
    joinDate:document.getElementById("staffJoinDate").value,
    role:"staff"
  };

  if(id){
    const index = staff.findIndex(s=>s.id===id);

    if(index>=0){
      staff[index] = {
        ...staff[index],
        ...data
      };
    }

    showToast("Staff details updated.");

    addActivity(
      "Staff Updated",
      `Updated staff profile for ${data.name}.`
    );

  }else{

    if(staff.some(s=>String(s.code).toUpperCase()===data.code)){
      showToast("Staff code already exists.");
      return;
    }

    staff.push({
      id:uid("staff"),
      ...data
    });

    showToast("Staff added.");

    addActivity(
      "Staff Added",
      `Added staff member ${data.name}.`
    );
  }

  setData(STORAGE.staff,staff);

  closeModal();
  renderStaff();
}

function renderAnalytics(){
  const content = document.getElementById("content");

  const logs = getData(STORAGE.logs,[]);

  const now = new Date();

  const currentMonth =
    `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;

    window.analyticsMonth || currentMonth;

  const monthLogs = logs.filter(l=>
    String(l.workDate||"").startsWith(selectedMonth)
  );

  const completed = monthLogs.filter(l=>l.status==="Completed").length;
  const total = monthLogs.length;
  const rate = total ? Math.round(completed/total*100):0;

  const attendance = getData(STORAGE.attendance,[])
    .filter(a=>String(a.date||"").startsWith(selectedMonth));

  content.innerHTML = `

        <p>Overview of work progress and staff activity.</p>
      </div>

      <div class="actions">
        <input

          value="${selectedMonth}"

        >
      </div>
    </div>

    <div class="stats-grid">

      <div class="stat-card">
        <div class="stat-label">Monthly Tasks</div>
        <div class="stat-number">${total}</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Completed</div>
        <div class="stat-number">${completed}</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Completion Rate</div>
        <div class="stat-number">${rate}%</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Attendance Records</div>
        <div class="stat-number">${attendance.length}</div>
      </div>

    </div>

    <div class="dashboard-grid">

      <div class="card">
        <div class="card-head">
          <h3>Monthly Work Summary</h3>
        </div>

        ${monthlyChart(monthLogs)}
      </div>

      <div class="card">
        <div class="card-head">
          <h3>Staff Performance</h3>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Staff</th>
                <th>Tasks</th>
                <th>Completed</th>
                <th>Rate</th>
              </tr>
            </thead>

            <tbody>
              ${staffPerformanceRows(staff,logs,selectedMonth)}
            </tbody>
          </table>
        </div>
      </div>

    </div>

    <div class="card" style="margin-top:18px;">
      <div class="card-head">
        <h3>Export Data</h3>
      </div>

      <div class="actions">
        <button class="btn" onclick="exportCSV('logs')">
          Export Work Logs
        </button>

        <button class="btn" onclick="exportCSV('attendance')">
          Export Attendance
        </button>

        <button class="btn" onclick="exportCSV('leaves')">
          Export Leave Requests
        </button>

        <button class="btn" onclick="exportCSV('schedules')">
          Export Schedules
        </button>
      </div>
    </div>
  `;
}

function setAnalyticsMonth(value){
  window.analyticsMonth = value;
  renderAnalytics();
}

function monthlyChart(logs){
  const days = {};

  logs.forEach(l=>{
    const day = String(Number(l.workDate.slice(8,10)));
    days[day] = (days[day]||0)+1;
  });

  const values = Object.values(days);
  const max = Math.max(...values,1);

  const labels = Object.keys(days).sort((a,b)=>Number(a)-Number(b));

  if(!labels.length){
    return emptyHTML("▥","No data","No work logs for this month.");
  }

  return `
    <div class="chart">
      ${labels.map(day=>{
        const value = days[day];

        return `
          <div class="bar-wrap">
            <div class="bar-value">${value}</div>
            <div
              class="bar"
              style="height:${Math.max(5,(value/max)*170)}px"
            ></div>
            <div class="bar-label">${day}</div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function staffPerformanceRows(staff,logs,month){
  return staff.map(s=>{

    const own = logs.filter(l=>
      (l.staffId===s.id || l.staffCode===s.code) &&
      String(l.workDate||"").startsWith(month)
    );

    const completed = own.filter(l=>l.status==="Completed").length;
    const rate = own.length
      ? Math.round(completed/own.length*100)
      : 0;

    return `
      <tr>
        <td>${esc(s.name)}</td>
        <td>${own.length}</td>
        <td>${completed}</td>
        <td>
          <div style="min-width:80px;">
            <div style="font-size:10px;margin-bottom:4px;">${rate}%</div>
            <div class="progress">
              <div class="progress-bar" style="width:${rate}%"></div>
            </div>
          </div>
        </td>
      </tr>
    `;
  }).join("");
}

function unreadCount(){
  if(!currentUser) return 0;

  return getData(STORAGE.notifications,[])
    .filter(n=>
      n.staffId===currentUser.id &&
      !n.read
    ).length;
}

function addNotification(staffId,title,message,type="info"){
  if(!staffId) return;

  const notifications = getData(STORAGE.notifications,[]);

  notifications.unshift({
    id:uid("notif"),
    staffId,
    title,
    message,
    type,
    read:false,
    createdAt:new Date().toISOString()
  });

  setData(
    STORAGE.notifications,
    notifications.slice(0,500)
  );
}

function getUserNotifications(){
  if(!currentUser) return [];

  return getData(STORAGE.notifications,[])
    .filter(n=>n.staffId===currentUser.id)
    .sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
}

function renderNotificationPanel(){
  const root = document.getElementById("notificationPanel");
  if(!root) return;

  if(!notificationOpen){
    root.innerHTML="";
    return;
  }

  const notifications = getUserNotifications().slice(0,15);

  root.innerHTML = `
    <div class="notification-panel">

      <div class="notification-head">
        <strong style="font-size:13px;">Notifications</strong>

        <button
          class="btn small"
          onclick="markAllNotificationsRead()"
        >
          Mark all read
        </button>
      </div>

      <div class="notification-list">

        ${
          notifications.length
          ? notifications.map(notificationHTML).join("")
          : emptyHTML("🔔","No notifications","You're all caught up.")
        }

      </div>

      ${
        notifications.length
        ? `
          <div style="padding:10px;border-top:1px solid var(--border);">
            <button
              class="btn small"
              style="width:100%;"
              onclick="navigate('notifications');toggleNotificationPanel();"
            >
              View all notifications
            </button>
          </div>
        `
        :""
      }

  `;
}

function notificationHTML(n){
  return `
    <div
      class="notification-item ${n.read?"":"unread"}"
      onclick="markNotificationRead('${n.id}')"
    >
      <div class="notification-title">
        ${notificationIcon(n.type)}
        ${esc(n.title)}
      </div>

      <div class="notification-message">
        ${esc(n.message)}
      </div>

      <div class="notification-time">
        ${formatDateTime(n.createdAt)}
        ${!n.read?" · Unread":""}
      </div>
    </div>
  `;
}

function notificationIcon(type){
  const icons = {
    task:"✓",
    leave:"▣",
    announcement:"✦",
    schedule:"📅",
    info:"•"
  };

  return icons[type] || "•";
}

function toggleNotificationPanel(){
  notificationOpen = !notificationOpen;
  renderNotificationPanel();
}

function markNotificationRead(id){
  const notifications = getData(STORAGE.notifications,[]);
  const n = notifications.find(x=>x.id===id);

  if(n){
    n.read=true;
    setData(STORAGE.notifications,notifications);
  }

  renderNotificationPanel();
  refreshTopbar();
}

function markAllNotificationsRead(){
  const notifications = getData(STORAGE.notifications,[]);

  notifications.forEach(n=>{
    if(n.staffId===currentUser.id){
      n.read=true;
    }
  });

  setData(STORAGE.notifications,notifications);

  renderNotificationPanel();
  refreshTopbar();
}

function refreshTopbar(){
  const app = document.querySelector(".app");
  if(!app) return;

  const count = unreadCount();
  const button = document.querySelector(".notification-btn");

  if(button){
    button.innerHTML = `
      🔔
      ${count>0 ? `<span class="notification-count">${count>99?"99+":count}</span>`:""}
    `;
  }
}

        notifications.length
        ? notifications.map(notificationHTML).join("")
        : emptyHTML("🔔","No notifications","You're all caught up.")
      }

    </div>
  `;
}

/* =========================================================
   ACTIVITY
========================================================= */

function addActivity(action,detail){
  const activity = getData(STORAGE.activity,[]);

  activity.unshift({
    id:uid("act"),
    userId:currentUser?.id || "",
    userName:currentUser?.name || "Unknown",
    role:currentUser?.role || "staff",
    action,
    detail,
    createdAt:new Date().toISOString()
  });

  setData(
    STORAGE.activity,
    activity.slice(0,1000)
  );
}

function renderActivity(){
  const content = document.getElementById("content");

  const activity = getData(STORAGE.activity,[]);

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h2>Activity History</h2>
        <p>Monitor actions made inside the staff portal.</p>
      </div>
    </div>

    <div class="card">

      <div class="table-wrap">

        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>User</th>
              <th>Action</th>
              <th>Details</th>
            </tr>
          </thead>

          <tbody>

            ${
              activity.length
              ? activity.map(a=>`
                <tr>
                  <td>${formatDateTime(a.createdAt)}</td>
                  <td>${esc(a.userName)}</td>
                  <td><strong>${esc(a.action)}</strong></td>
                  <td>${esc(a.detail)}</td>
                </tr>
              `).join("")
              : `
                <tr>
                  <td colspan="4">
                    ${emptyHTML("↻","No activity","Activity will appear here.")}
                  </td>
                </tr>
              `
            }

          </tbody>
        </table>

      </div>

    </div>
  `;
}

/* =========================================================
   MODAL
========================================================= */

function closeModal(event){
  if(event && event.target && !event.target.classList.contains("modal-backdrop")){
    return;
  }

  const root = document.getElementById("modalRoot");
  if(root) root.innerHTML="";
}

/* =========================================================
   BADGES
========================================================= */

function statusBadge(status){
  const map = {
    Completed:"completed",
    Approved:"approved",
    "In Progress":"progress",
    Pending:"pending",
    Rejected:"rejected",
    Overdue:"overdue",
    Scheduled:"info",
    Cancelled:"rejected",
    Working:"progress"
  };

  return `
    <span class="badge ${map[status]||"info"}">
      ${esc(status||"-")}
    </span>
  `;
}

function priorityBadge(priority){
  if(priority==="High"){
    return `<span class="badge overdue">High</span>`;
  }

  if(priority==="Medium"){
    return `<span class="badge pending">Medium</span>`;
  }

  return `<span class="badge info">Low</span>`;
}

/* =========================================================
   EXPORT
========================================================= */

function exportCSV(type){

  let rows=[];
  let filename="export.csv";

  if(type==="logs"){
    rows=getData(STORAGE.logs,[]).map(l=>({
      Staff:l.staffName,
      Code:l.staffCode,
      Task:l.title,
      WorkDate:l.workDate,
      StartTime:l.startTime,
      EndTime:l.endTime,
      DueDate:l.dueDate,
      DueTime:l.dueTime,
      Priority:l.priority,
      Status:l.status,
      Description:l.description
    }));

    filename="nona-work-logs.csv";
  }

  if(type==="attendance"){
    rows=getData(STORAGE.attendance,[]).map(a=>({
      Staff:a.staffName,
      Date:a.date,
      ClockIn:a.clockIn,
      ClockOut:a.clockOut
    }));

    filename="nona-attendance.csv";
  }

  if(type==="leaves"){
    rows=getData(STORAGE.leaves,[]).map(l=>({
      Staff:l.staffName,
      Type:l.type,
      StartDate:l.startDate,
      EndDate:l.endDate,
      Reason:l.reason,
      Status:l.status
    }));

    filename="nona-leaves.csv";
  }

  if(type==="schedules"){
    rows=getData(STORAGE.schedules,[]).map(s=>({
      Title:s.title,
      Date:s.date,
      StartTime:s.startTime,
      EndTime:s.endTime,
      Location:s.location,
      Staff:s.staffName,
      Status:s.status,
      Notes:s.notes
    }));

    filename="nona-schedules.csv";
  }

  if(!rows.length){
    showToast("No data to export.");
    return;
  }

  const headers=Object.keys(rows[0]);

  const csv=[
    headers.join(","),
    ...rows.map(row=>
      headers.map(h=>
        `"${String(row[h]??"").replace(/"/g,'""')}"`
      ).join(",")
    )
  ].join("\n");

  const blob = new Blob([csv],{
    type:"text/csv;charset=utf-8;"
  });

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);

  showToast("CSV exported successfully.");
}

/* =========================================================
   PHOTO PROFILE
========================================================= */

function openProfilePhoto(){
  const input=document.createElement("input");
  input.type="file";
  input.accept="image/*";

  input.onchange=()=>{
    const file=input.files[0];

    if(!file) return;

    const reader=new FileReader();

    reader.onload=()=>{
      localStorage.setItem(
        "nona_photo_"+currentUser.code,
        reader.result
      );

      showToast("Profile photo updated.");
      renderApp();
    };

    reader.readAsDataURL(file);
  };

  input.click();
}

/* =========================================================
   AUTO OVERDUE NOTIFICATION
========================================================= */

function generateOverdueNotifications(){

  if(!currentUser) return;

  const logs = getData(STORAGE.logs,[]);
  const now = new Date();

  logs.forEach(l=>{

    if(l.status==="Completed") return;

    if(!l.dueDate) return;

    if(
      !isAdmin() &&
      l.staffId!==currentUser.id &&
      l.staffCode!==currentUser.code
    ){
      return;
    }

    const due = new Date(
      l.dueDate+"T"+(l.dueTime || "23:59")
    );

    if(due>=now) return;

    const notifications = getData(STORAGE.notifications,[]);

    const exists = notifications.some(n=>
      n.staffId===l.staffId &&
      n.type==="task" &&
      n.title==="Task overdue" &&
      n.message.includes(l.id)
    );

    if(exists) return;

    addNotification(
      l.staffId,
      "Task overdue",
      `"${l.title}" is overdue. Task ID: ${l.id}`,
      "task"
    );
  });
}

initData();
renderLogin();

window.openProfilePhoto = openProfilePhoto;

/*
  Attempt automatic overdue notifications after login.
  Existing localStorage data is preserved.
*/
setInterval(()=>{
  if(currentUser){
    generateOverdueNotifications();
    refreshTopbar();
  }
},60000);
